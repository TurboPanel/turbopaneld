# TurboPanel site phpapp
Listen 127.0.0.1:18081
<VirtualHost 127.0.0.1:18081>
  ServerName localhost
  ErrorLog "/var/log/turbopanel/apache/sites/phpapp-0123456789ab.error.log"
  RemoteIPHeader X-Forwarded-For
  RemoteIPInternalProxy 127.0.0.1
  <If "%{CONN_REMOTE_ADDR} == '127.0.0.1' && %{HTTP:X-Forwarded-Proto} == 'https'">
    SetEnv HTTPS on
  </If>
  ProxyFCGISetEnvIf "%{CONN_REMOTE_ADDR} == '127.0.0.1' && %{HTTP:X-Forwarded-Proto} == 'https'" SERVER_PORT 443
  ProxyFCGISetEnvIf "%{CONN_REMOTE_ADDR} == '127.0.0.1' && %{HTTP:X-Forwarded-Proto} == 'https'" REQUEST_SCHEME https
  ProxyFCGISetEnvIf "true" TP_SITE_KEY "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  ProxyFCGISetEnvIf "true" !PHP_VALUE
  ProxyFCGISetEnvIf "true" !PHP_ADMIN_VALUE
  ProxyFCGISetEnvIf "true" !PHPRC
  ProxyFCGISetEnvIf "true" !PHP_INI_SCAN_DIR
  <LocationMatch "/\.(?!well-known(?:/|$))">
    Require all denied
  </LocationMatch>
  DocumentRoot "/srv/users/u/sites/phpapp/current/public"
  <Directory "/srv/users/u/sites/phpapp/current/public">
    Options SymLinksIfOwnerMatch
    AllowOverride AuthConfig Indexes Limit Options=Indexes,MultiViews,SymLinksIfOwnerMatch,ExecCGI,Includes,IncludesNOEXEC
    AllowOverrideList RewriteEngine RewriteCond RewriteRule RewriteBase RewriteOptions Redirect RedirectMatch RedirectPermanent RedirectTemp ErrorDocument Header RequestHeader AddType RemoveType AddEncoding RemoveEncoding AddCharset RemoveCharset AddDefaultCharset AddLanguage RemoveLanguage DefaultLanguage MultiviewsMatch ForceType SetHandler RemoveHandler AddOutputFilter RemoveOutputFilter AddOutputFilterByType SetOutputFilter SetEnv UnsetEnv SetEnvIf SetEnvIfNoCase SetEnvIfExpr BrowserMatch BrowserMatchNoCase FileETag AcceptPathInfo QualifyRedirectURL
    Require all granted
  </Directory>
  DirectoryIndex index.php index.html
  ProxyFCGIBackendType GENERIC
  <FilesMatch \.php$>
    SetHandler "proxy:unix:/run/turbopanel/php/8.4/tp-env-phpapp.sock|fcgi://localhost/"
  </FilesMatch>
  SetEnv APP_ENV "production"
  SetEnv EMPTY ""
  SetEnv QUOTED "say \"hi\" \\ bye"
  SetEnv URL "https://x.example/a?b=c&d=%20"
</VirtualHost>
