docRoot $VH_ROOT/
index {
  indexFiles index.php, index.html
  autoIndex 0
}

extprocessor lsphp_x{
  type                      lsapi
  address                   uds://tmp/lshttpd/lsphp_x.sock
  maxConns                  10
  env                       PHP_LSAPI_CHILDREN=10
  env                       PATH=/usr/local/bin:/usr/bin:/bin
  initTimeout               60
  retryTimeout              0
  persistConn               1
  respBuffer                0
  autoStart                 2
  runOnStartUp              0
  path                      /opt/lsphp/bin/lsphp
  backlog                   100
  instances                 1
  extUser                   u
  extGroup                  g
  priority                  0
  memSoftLimit              2047M
  memHardLimit              2047M
  procSoftLimit             1400
  procHardLimit             1500
}

scripthandler {
  add                       lsapi:lsphp_x php
}

phpIniOverride {
  php_admin_value date.timezone America/New_York
  php_admin_value disable_functions exec,passthru
  php_admin_value error_reporting E_ALL & ~E_DEPRECATED
  php_admin_value memory_limit 256M
}

context / {
  allowBrowse 0
  location $DOC_ROOT/
}
