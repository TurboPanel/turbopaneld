docRoot $VH_ROOT/
index {
  indexFiles index.php, index.html
  autoIndex 0
}

extprocessor php_x{
  type                      lsapi
  address                   uds:///run/turbopanel-php-x-0a1b2c3d4e5f-lsd84/php.sock
  maxConns                  5
  initTimeout               60
  retryTimeout              0
  persistConn               1
  respBuffer                0
  autoStart                 0
}

scripthandler {
  add                       lsapi:php_x php
}

phpIniOverride {
  php_admin_value memory_limit 256M
  php_admin_value max_execution_time 30
}

rewrite {
  enable                    1
  rules                     <<<END_rules
RewriteRule (^|/)\.(?!well-known(/|$)) - [F,L]
RewriteRule \.(php[0-9]+|phtml|phar|phps|pht|phpt|inc|cgi)(/.*)?$ - [F,L,NC]
RewriteRule \.(php|php[0-9]+|phtml|phar|phps|pht|phpt|inc|cgi)(~|\.(bak|old|orig|save|swp|swo|tmp|dist|txt))$ - [F,L,NC]
END_rules
}

context / {
  allowBrowse 1
  location $DOC_ROOT/
}
