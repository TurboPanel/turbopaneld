docRoot $VH_ROOT/
index {
  indexFiles index.php, index.html
  autoIndex 0
}

extprocessor php_x{
  type                      lsapi
  address                   uds:///run/turbopanel-php-x-0a1b2c3d4e5f-lsd84/php.sock
  maxConns                  5
  initTimeout               60
  retryTimeout              0
  persistConn               1
  respBuffer                0
  autoStart                 0
}

scripthandler {
  add                       lsapi:php_x php
}

context / {
  allowBrowse 1
  location $DOC_ROOT/
}
