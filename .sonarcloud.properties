# Vestigial Automatic Analysis config. CI uses sonar-project.properties instead.
# Keep Automatic Analysis off for turbopanel_turbopaneld so verify.yml can scan
# with SONAR_TOKEN + Deno LCOV. While Automatic Analysis is enabled,
# sonar-project.properties is ignored and the CI scanner fails.
#
# Scope here is kept in sync with sonar-project.properties only as a safety net
# if Automatic Analysis is re-enabled by mistake.

sonar.organization=turbopanel

# Match the TurboPanel vendored Python pin (PYTHON_VERSION in src/orchestration/paths.ts).
sonar.python.version=3.14

# Deno LCOV from `deno task test:coverage` (coverage/lcov.info). The TypeScript-
# specific key is deprecated; javascript.lcov covers both JS and TS.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Keep in step with sonar-project.properties (co-located tests + helpers).
sonar.sources=src,orchestration,scripts,main.ts
sonar.tests=src
sonar.test.inclusions=\
  **/*.test.ts,\
  src/testing/**

sonar.exclusions=\
  dist/**,\
  publish/**,\
  state/**,\
  logs/**,\
  cloudflared/**,\
  node_modules/**,\
  coverage*/**,\
  src/build-info.ts,\
  orchestration/roles/geerlingguy.docker/**,\
  **/orchestration/roles/geerlingguy.docker/**,\
  orchestration/roles/geerlingguy/**,\
  **/orchestration/roles/geerlingguy/**,\
  workers/**

sonar.coverage.exclusions=\
  dist/**,\
  publish/**,\
  src/build-info.ts,\
  **/*.test.ts,\
  src/testing/**,\
  orchestration/roles/geerlingguy.docker/**,\
  **/orchestration/roles/geerlingguy.docker/**,\
  orchestration/roles/geerlingguy/**,\
  **/orchestration/roles/geerlingguy/**,\
  workers/**

# Deno uses Deno.test(); Sonar only recognizes Jest/Mocha/etc., so S2187
# ("Add some tests to this file") is a false positive on every *.test.ts.
# Kept after enabling LCOV import — coverage metrics do not replace S2187.
sonar.issue.ignore.multicriteria=denoS2187
sonar.issue.ignore.multicriteria.denoS2187.ruleKey=typescript:S2187
sonar.issue.ignore.multicriteria.denoS2187.resourceKey=**/*.test.ts
