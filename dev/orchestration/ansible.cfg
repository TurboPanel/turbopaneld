[defaults]
# Local orchestration runs against the daemon host; no remote SSH host keys.
host_key_checking = False
# Quiet the noisy "discovered interpreter" warnings; the venv python is correct.
interpreter_python = auto_silent
# local_tmp comes from ANSIBLE_LOCAL_TEMP at invocation time (see devOrchestrationAnsibleEnv()).
# Vendored collections: same search order as orchestration/ansible.cfg (see that file).
collections_path = ../../vendor/ansible/galaxy-collections:/opt/turbopanel/vendor/ansible/galaxy-collections:~/.ansible/collections:/usr/share/ansible/collections
retry_files_enabled = False
# Machine-readable JSONL on stdout for streaming consumers and structured daemon logs.
stdout_callback = ansible.posix.jsonl
callbacks_enabled = ansible.posix.jsonl
# Dev-owned overlay roles (relative to this cfg's checkout dir). The daemon's shared
# production roles are appended at invocation time via ANSIBLE_ROLES_PATH
# (dev overlay first, then the daemon home checkout's orchestration/roles — see
# the daemon's dev-orchestration.ts devOrchestrationAnsibleEnv()), which fully
# overrides this value. The daemon checkout is no longer at a fixed path, so its
# roles dir must never be hardcoded here.
roles_path = roles
