---
# Install the co-located dev-console sudoers fragment. The dev console drives the
# whole stack from the single dev user and shells out with `sudo -n` for the few
# root operations it still needs (running the Ansible converge, tailing journald,
# writing FHS config, restarting units, installing the pinned Deno). The retired
# ACL / multi-user model is gone, so there is no run-as-turbopanel rule and no
# setfacl/usermod grants here.
- name: Install dev console sudoers fragment
  when: turbopanel_dev_user | length > 0
  ansible.builtin.copy:
    dest: /etc/sudoers.d/turbopanel-dev-console
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /bin/bash, /usr/bin/bash, /usr/bin/env
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /bin/chmod, /usr/bin/chmod, /bin/chown, /usr/bin/chown
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/tee, /usr/bin/cp, /usr/bin/cat, /usr/bin/test
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/mkdir, /bin/mkdir
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/install, /bin/install
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl, /bin/systemctl
      {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/journalctl
