---
# Minimal co-located dev ownership backstop.
#
# The single dev user owns everything in dev — the daemon roles create the FHS
# trees (turbopanel-user, daemon-logs, runtime-sockets) owned by the resolved dev
# identity, and clone the home checkouts as the dev user. This role only re-asserts
# that ownership so a stray root-owned artifact (e.g. from a pre-migration converge)
# never blocks a git pull / pnpm install. There are NO setgid bits, NO group or
# default ACLs, and NO checkout normalizer — those belonged to the retired
# turbopanel(9999)/turbopaneli(9998) multi-user model.
- name: Ensure co-located dev ownership (FHS trees + home checkouts)
  when: turbopanel_dev_user | length > 0
  block:
    - name: Ensure FHS trees are owned by the dev user
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ turbopanel_dev_user }}"
        group: "{{ turbopanel_group }}"
        recurse: "{{ item.recurse | default(false) }}"
      loop:
        - { path: "{{ turbopanel_install_root }}", recurse: true }
        - { path: "{{ turbopanel_vendor_dir }}", recurse: true }
        - { path: "{{ turbopanel_config_dir }}" }
        - { path: "{{ turbopanel_state_dir }}" }
        - { path: "{{ turbopanel_log_dir }}" }
        - { path: "{{ runtime_socket_dir }}" }

    - name: Stat home source checkouts
      ansible.builtin.stat:
        path: "{{ item }}"
      loop: "{{ _dev_home_checkouts }}"
      register: _dev_checkout_stats

    # Only touch checkouts that already exist — the repo roles clone the rest as
    # the dev user, and pre-creating an empty dir would trip git clone.
    - name: Ensure existing home source checkouts are owned by the dev user
      ansible.builtin.file:
        path: "{{ item.item }}"
        state: directory
        owner: "{{ turbopanel_dev_user }}"
        group: "{{ turbopanel_group }}"
      loop: "{{ _dev_checkout_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when:
        - item.stat.exists | default(false)
        - item.stat.isdir | default(false)
