---
# Co-located dev instance converge — OWNED BY turbopanel-dev (the dev overlay).
#
# This is the dev-only entrypoint. It sets the shared dev-identity contract
# (turbopanel_dev_user/_uid/_gid/_root) so the daemon's *production* roles run in
# FHS + single-dev-user mode. Dev-only vars and the three dev-only roles live in
# this repo; they never mix into the daemon's production role tree. The daemon
# still executes the playbook (staged dev overlay + daemon shared roles resolved
# via ANSIBLE_ROLES_PATH — see the daemon's dev-orchestration.ts).
#
# In dev-user mode the daemon roles collapse every TurboPanel service identity
# (turbopanel/turbopaneli/turbopanelc, uid 9999/9998/9997) onto the single human
# dev user, and:
#   * source repos live under the dev user's home (turbopanel_dev_root):
#       <home>/daemon, <home>/instance, <home>/ui, <home>/website
#   * every mutable dir is the shared FHS location (dev-user-owned at runtime):
#       /etc/turbopanel, /var/lib/turbopanel, /var/log/turbopanel,
#       /opt/turbopanel/vendor, /run/turbopanel
# There is no /opt/turbopanel/platform tree and no ACL / multi-user / setgid
# reconciliation — the single dev user owns its home checkouts and the FHS trees.
#
# Run by the always-installed daemon when co-located and TURBOPANEL_DEV_INSTANCE=1.
# Every role is idempotent and never force-resets an existing dev working tree.
- name: TurboPanel co-located dev instance converge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    # Shared dev-identity contract. turbopanel_dev_user/_uid/_gid are supplied as
    # extra-vars by the daemon's dev converge runner (run-orchestration-action.ts).
    # When non-empty, the daemon role defaults collapse every service identity onto
    # this user. Declared empty here only for documentation — the extra-vars win.
    turbopanel_dev_user: ""
    turbopanel_dev_uid: ""
    turbopanel_dev_gid: ""
    # Dev source-repo root (the dev user's home). ansible_env.HOME is unreliable
    # under become (it resolves to root's HOME), so a pre_task below overrides this
    # with the dev user's real home resolved from getent. Passed on to every
    # daemon role, which derive <root>/{daemon,instance,ui,website} from it.
    turbopanel_dev_root: "{{ ansible_env.HOME }}"
    instance_repo_url: https://github.com/turbopanel/instance
    ui_repo_url: https://github.com/turbopanel/turbopanel-ui
    website_repo_url: https://github.com/turbopanel/turbopanel-website
    instance_branch: trunk
    ui_branch: trunk
    website_branch: trunk
    turbopanel_ui_artifact_url: ""
    turbopanel_instance_runtime: deno
    # Caddy/UI/mailer follow instance_start; the instance unit also checks runtime.
    instance_start: true
    # Unix socket is always available; expose TCP when Workers runtime needs wrangler Hyperdrive.
    postgres_expose_port: "{{ turbopanel_instance_runtime == 'workers' }}"
    rabbitmq_amqp_port: 5672
    rabbitmq_mgmt_port: 15672
    rabbitmq_expose_mgmt_port: true
    mailpit_web_port: 8025
    mailpit_smtp_port: 1025
    redis_socket_path: /run/turbopanel/redis.sock

  pre_tasks:
    - name: Refresh apt cache once per converge (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    # Resolve the dev user's home from passwd so the daemon roles clone the source
    # repos into the real home (ansible_env.HOME is root's HOME under become).
    - name: Resolve dev user account for source-checkout root
      ansible.builtin.getent:
        database: passwd
        key: "{{ turbopanel_dev_user }}"
      when: turbopanel_dev_user | length > 0

    - name: Set dev source-repo root from the dev user's home directory
      ansible.builtin.set_fact:
        turbopanel_dev_root: "{{ getent_passwd[turbopanel_dev_user][4] }}"
      when:
        - turbopanel_dev_user | length > 0
        - getent_passwd is defined
        - getent_passwd[turbopanel_dev_user] is defined

  roles:
    - role: turbopanel-user
    - role: runtime-sockets
    - role: daemon-logs
    - role: daemon-prereqs
    - role: docker
    - role: postgres
    - role: redis
    - role: rabbitmq
    - role: mailpit
    - role: instance-user
    # GTK/NSS/GBM stack for @react-native/debugger-shell (Debian only).
    - role: instance-dev-prereqs
    - role: node-runtime
    - role: deno-runtime
    - role: caddy
    # Dev-console sudoers + dev-user ownership of the FHS trees and home checkouts,
    # before the repo roles run git/pnpm in those checkouts.
    - role: dev-host-access
    - role: dev-permissions
    - role: instance-repo
    - role: ui-repo
    - role: website-repo
    - role: ui-build
    - role: instance-build
    # turbopanel_public_urls may be passed as an extra-var (from daemon .env via
    # devInstanceExtraArgs) to seed cert SANs before the instance .env exists.
    - role: instance-certs
    - role: instance-launch

  post_tasks:
    # If converge aborts after instance-user stops the stack (uid migration) or
    # any later failure, bring enabled units back up instead of leaving a partial stack.
    - name: Resolve dev stack unit list
      ansible.builtin.set_fact:
        _dev_stack_units:
          - turbopanel-postgres
          - turbopanel-mailpit
          - turbopanel-instance
          - turbopanel-dbstudio
          - turbopanel-caddy
          - turbopanel-ui
          - turbopanel-website
          - turbopanel-mailer

    - name: Ensure dev stack services are running after converge
      when: instance_start | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ _dev_stack_units }}"
      failed_when: false

    - name: Recursively ensure vendored runtime trees are owned by the dev user
      when: turbopanel_dev_user | length > 0
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ turbopanel_dev_user }}"
        group: "{{ turbopanel_dev_user }}"
        recurse: true
      loop:
        - "{{ turbopanel_install_root }}/vendor/node"
        - "{{ turbopanel_install_root }}/vendor/deno"
        - "{{ turbopanel_install_root }}/vendor/caddy"
      failed_when: false
