---
# The **site** Caddy: a second, unprivileged Caddy process that serves tenant
# sites on loopback high ports. It is not the edge Caddy (root, public :80/:443,
# owns the internal CA and every tenant leaf key) and not the control-plane
# Caddy (tpcaddy/9993, provisioned by instance-user).
#
# Why a separate process rather than serving sites from the edge: the edge runs
# as root and rewrites its site files with a best-effort reload whose failure is
# only logged — no validate, no staged swap, no rollback. That is fine for
# `reverse_proxy` one-liners; it is not acceptable for tenant document roots and
# PHP handlers. Running sites in their own unprivileged unit puts them through
# the same staged `.tpnew`/`.tpprev` transaction every other engine gets, and
# keeps the loopback listen port that containers reach via
# `host.docker.internal:<port>`.
#
# The binary itself is vendored by the sibling `caddy` role — one binary, two
# processes, no second download.
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"  # noqa: var-naming[no-role-prefix]

# Must match `web_service_user_map.caddy` in the web-service-user role and
# `siteEngineUnixUser` in src/deploy/site.ts.
site_caddy_service_user: tpcaddysite
site_caddy_service_group: tpcaddysite

# Admin API: a unix socket in the unit's RuntimeDirectory (/run/<dir>, 0700,
# owned by the service account), never loopback TCP. Any tenant process can
# dial loopback, and the admin API loads arbitrary config as an account that
# sits in every Caddy-served principal's group (audit P0-1). Only ExecReload
# (as the service account) dials it.
site_caddy_runtime_dir: turbopanel-site-caddy
site_caddy_admin_socket: "/run/{{ site_caddy_runtime_dir }}/admin.sock"
# Read-only Prometheus text from Caddy's `metrics` handler, the only thing on
# this loopback port (it used to be the admin listener). Mirrored by
# SITE_CADDY_ADMIN_ADDR in src/metrics/collector/ingress/caddy.ts, which
# scrapes /metrics here. 2019 and 2029 were the other Caddy admin ports, so keep
# it off those.
site_caddy_metrics_addr: "127.0.0.1:2039"

turbopanel_config_dir: "/etc/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_log_dir: "/var/log/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_state_dir: "/var/lib/turbopanel"  # noqa: var-naming[no-role-prefix]
