  author: turbopanel
  description: >-
    Remove PHP series no site uses any more: the php-fpm packages from sury,
    the vendored lsphp tree, and the series' config, log and runtime
    directories. The daemon decides which series are unused and passes only
    those; this role refuses a series that still has a site pool or a
    per-site runtime on this host.
