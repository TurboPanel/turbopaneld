---
galaxy_info:
  role_name: orchestrator
  author: turbopanel
  license: AGPL-3.0
  description: >
    Host prerequisites for the per-organization Orchestrator Raft group
    (config dirs, API/raft secrets, wait-ready, turbopanel-orchestrator-stack
    systemd unit). Does not write
    docker-compose.yml — the daemon owns that file under
    configDir/orchestrator after managed.ha.reconcile.
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - trixie

# No role dependency on `docker`: Ansible runs a role's dependencies even for
# `tasks_from`, so daemon-converge (which only runs the host-prep marker
# backfill from this role) would try to install Docker on every host. Playbooks
# that need Docker list `role: docker` before this role
# (orchestrator-setup.yml, instance-install.yml).
dependencies: []
