---
# Host-base packages required before Ansible can converge managed services.
# These are OS-level tools — not TurboPanel-managed vendor runtimes under
# vendor (uv, Deno, Node, Caddy, Redis, Python, Ansible venv, …).
#
# Minimal host-base boundary:
#   - curl/ca-certificates/tar/python3-minimal: release download + vendor zip extraction
#   - git/gnupg/unzip/xz-utils/zstd: orchestration/Ansible/Docker roles on managed hosts
#   - wireguard-tools: TurboFabric mesh (`server.fabric.reconcile`) on managed hosts
#   - openssl: managed-engine self-signed TLS material (`managed.apply`)
#   - pamtester: instance install PAM gate (production)
#   - acl: setfacl/getfacl for principal-access + runtime-entitlement traverse ACLs
#     (Priority: optional on Debian — minimal images omit it; ansible.posix.acl needs it)
#
# run.sh installs only the smaller curl/tar/python3-minimal set when missing;
# this role covers the remainder once the daemon can run Ansible.
- name: Install daemon host-base prerequisites
  ansible.builtin.apt:
    # Refresh stale package indexes so pool fetches don't 404 when the mirror
    # has rolled a package revision since the host's last apt update (e.g.
    # fresh dev bootstrap via daemon-systemd-setup.yml, which has no separate
    # cache-refresh pre-task like daemon-converge.yml).
    update_cache: true
    cache_valid_time: 3600
    name:
      - acl
      - ca-certificates
      - curl
      - git
      - gnupg
      - openssl
      - pamtester
      - python3-debian
      - tar
      - unzip
      - wireguard-tools
      - xz-utils
      - zstd
    state: present
