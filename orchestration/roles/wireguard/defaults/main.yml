---
wireguard_configure: true
wireguard_interface: ""
wireguard_address: ""
wireguard_private_key_file: ""
wireguard_listen_port: ""
wireguard_peers: []
wireguard_ip_forward: false
# Whether this run should reconcile the host-wide forwarding sysctls at all.
# The daemon sets this to true only when it has computed the definitive
# OR across every managed WireGuard interface on the host — a bootstrap
# tools-only run (no interface knowledge) must leave the current sysctl
# state untouched, so it defaults to false here.
wireguard_manage_forwarding: false
