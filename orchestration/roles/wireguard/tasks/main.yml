---
- name: Install wireguard-tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Ensure WireGuard config directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: wireguard_configure | bool

- name: Template WireGuard interface config
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart wg-quick interface
  when: wireguard_configure | bool

- name: Enable and start wg-quick interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
  when: wireguard_configure | bool

- name: Reconcile IPv4 forwarding across managed WireGuard interfaces
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "{{ '1' if (wireguard_ip_forward | bool) else '0' }}"
    sysctl_file: /etc/sysctl.d/99-turbopanel-wireguard.conf
    reload: true
  when: wireguard_manage_forwarding | bool

- name: Reconcile IPv6 forwarding across managed WireGuard interfaces
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "{{ '1' if (wireguard_ip_forward | bool) else '0' }}"
    sysctl_file: /etc/sysctl.d/99-turbopanel-wireguard.conf
    reload: true
  when: wireguard_manage_forwarding | bool
