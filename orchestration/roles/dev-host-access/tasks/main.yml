---
- name: Configure co-located dev host access
  when: turbopanel_dev_user | length > 0
  block:
    - name: Install dev console sudoers fragment
      ansible.builtin.copy:
        dest: /etc/sudoers.d/turbopanel-dev-console
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
        content: |
          {{ turbopanel_dev_user }} ALL=(turbopanel) NOPASSWD: ALL
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /bin/bash, /usr/bin/bash, /usr/bin/env
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/setfacl, /bin/chmod, /usr/bin/chmod
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/sbin/usermod
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/tee, /usr/bin/cp, /usr/bin/cat, /usr/bin/test
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/mkdir, /bin/mkdir
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: {{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}/deno
          {{ turbopanel_dev_user }} ALL=(root) NOPASSWD: /usr/bin/systemctl, /bin/systemctl

    - name: Apply dev user traversal ACL on install root
      ansible.posix.acl:
        path: "{{ turbopanel_install_root }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present

    - name: Apply default dev user traversal ACL on install root
      ansible.posix.acl:
        path: "{{ turbopanel_install_root }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
        default: true

    - name: Apply dev user ACL on platform dir
      ansible.posix.acl:
        path: "{{ turbopanel_platform_dir }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rwx
        state: present

    - name: Apply default dev user ACL on platform dir
      ansible.posix.acl:
        path: "{{ turbopanel_platform_dir }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rwx
        state: present
        default: true

    - name: Apply dev user traversal ACL on runtimes dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present

    - name: Apply default dev user traversal ACL on runtimes dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
        default: true

    - name: Apply dev user traversal ACL on deno runtime dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present

    - name: Apply default dev user traversal ACL on deno runtime dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
        default: true

    - name: Apply dev user traversal ACL on versioned deno dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present

    - name: Apply default dev user traversal ACL on versioned deno dir
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
        default: true

    - name: Apply dev user traversal ACL on deno current symlink
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno/current"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
      failed_when: false

    - name: Apply default dev user traversal ACL on deno current symlink
      ansible.posix.acl:
        path: "{{ turbopanel_runtimes_dir }}/deno/current"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rx
        state: present
        default: true
      failed_when: false

    - name: Apply dev user ACL on runtime socket dir
      ansible.posix.acl:
        path: /run/turbopanel
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rwx
        state: present
      failed_when: false
