mailpit_image: axllent/mailpit:latest
mailpit_container_name: turbopanel-dev-mailpit
mailpit_service_name: turbopanel-mailpit
mailpit_web_port: 8025
mailpit_smtp_port: 1025
turbopanel_docker_network: turbopanel  # noqa: var-naming[no-role-prefix]
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel  # noqa: var-naming[no-role-prefix]
# Shared dev-identity contract: config dir group resolves to the dev group in dev.
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_uid: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_gid: ""  # noqa: var-naming[no-role-prefix]
turbopanel_group: >-  # noqa: var-naming[no-role-prefix]
  {{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}
# Dev runs the container as the single dev uid:gid; managed installs omit --user.
mailpit_container_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else '' }}"
mailpit_container_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else '' }}"
mailpit_config_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
