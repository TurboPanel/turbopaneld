---
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Resolve Caddy release architecture
  ansible.builtin.set_fact:
    caddy_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check vendored Caddy binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/caddy/{{ caddy_version }}/caddy"
  register: _caddy_pinned

- name: Install Caddy into runtimes directory
  when: not _caddy_pinned.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    CADDY_VER="{{ caddy_version }}"
    CADDY_TAG="{{ caddy_release_tag }}"
    CADDY_ARCH="{{ caddy_arch }}"
    TMP="$(mktemp -d)"
    ASSET="caddy_${CADDY_VER}_linux_${CADDY_ARCH}.tar.gz"
    curl -fsSL -o "$TMP/$ASSET" \
      "https://github.com/caddyserver/caddy/releases/download/${CADDY_TAG}/${ASSET}"
    tar -xzf "$TMP/$ASSET" -C "$TMP" caddy
    install -d "{{ turbopanel_vendor_dir }}/caddy/${CADDY_VER}"
    install -m 0750 "$TMP/caddy" "{{ turbopanel_vendor_dir }}/caddy/${CADDY_VER}/caddy"
    rm -rf "$TMP"
  args:
    creates: "{{ turbopanel_vendor_dir }}/caddy/{{ caddy_version }}/caddy"

- name: Harden Caddy binary permissions
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/caddy/{{ caddy_version }}/caddy"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Point Caddy current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_vendor_dir }}/caddy/{{ caddy_version }}"
    dest: "{{ turbopanel_vendor_dir }}/caddy/current"
    state: link
    force: true
