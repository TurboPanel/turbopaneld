---
# Installs pinned ASF httpd (+ APR / APR-util) from a prebuilt, SHA-256
# checked tarball (built once in CI by .github/workflows/vendor-apache.yml)
# into `vendor/apache/<version>/` with a `current` symlink — never
# `apt install apache2`, never the distro apache2 unit, never a compile on the
# host. Only runtime libraries come from apt; the binary tree is
# TurboPanel-owned under the FHS vendor tree.
#
# Config/logs/state live under FHS so version upgrades do not lose site
# fragments written by `src/deploy/site.ts`. PHP is not built into
# httpd — the sibling `php-fpm` role vendors php-fpm; site configs use
# mod_proxy_fcgi (loaded in httpd.conf).
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Check vendored Apache httpd binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}/bin/httpd"
  register: _apache_pinned

# The prebuilt tree has its install prefix (rpath, apxs, envvars) baked in.
- name: Require the default vendor directory for the prebuilt Apache tree
  when: not _apache_pinned.stat.exists
  ansible.builtin.assert:
    that:
      - turbopanel_vendor_dir == apache_build_install_root ~ '/vendor'
    fail_msg: >-
      The prebuilt Apache tree is built for {{ apache_build_install_root }}/vendor but this
      host's vendor directory is {{ turbopanel_vendor_dir }}.

# A version bump must land with the digests of the CI-built tarballs: refuse
# rather than install an unverified runtime.
- name: Require a pinned SHA-256 for this Apache version and architecture
  when: not _apache_pinned.stat.exists
  ansible.builtin.assert:
    that:
      - apache_version in apache_sha256
      - apache_release_arch in apache_sha256[apache_version]
      - apache_sha256[apache_version][apache_release_arch] is match('^[0-9a-f]{64}$')
    fail_msg: >-
      No pinned SHA-256 for Apache {{ apache_version }} on
      {{ apache_release_arch }} — run the vendor-apache workflow, then pin its
      checksum in roles/apache/defaults/main.yml (apache_sha256).

- name: Install Apache runtime libraries (not apache2)
  ansible.builtin.apt:
    lock_timeout: 300
    name: "{{ apache_runtime_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: not _apache_pinned.stat.exists

# Everything that touches the scratch directory sits in a block so the
# directory is removed even when the download or the unpack fails.
- name: Download and unpack the prebuilt Apache tarball
  when: not _apache_pinned.stat.exists
  block:
    - name: Create Apache download scratch directory
      ansible.builtin.tempfile:
        state: directory
        prefix: apache-tar-
      register: _apache_tmp

    # get_url verifies the digest before the file is kept: a mismatch fails the
    # task and leaves nothing to extract.
    - name: Download prebuilt Apache tarball (SHA-256 verified)
      ansible.builtin.get_url:
        url: "{{ apache_release_base_url }}/apache-httpd-{{ apache_version }}-{{ apache_release_arch }}.tar.zst"
        dest: "{{ _apache_tmp.path }}/apache.tar.zst"
        checksum: "sha256:{{ apache_sha256[apache_version][apache_release_arch] }}"
        owner: root
        group: root
        mode: "0600"

    # Extract beside the target and rename, so an interrupted run never leaves
    # a half-unpacked tree that the bin/httpd check would mistake for an
    # install. A tarball without bin/httpd fails here, before the rename.
    - name: Install Apache httpd into runtimes directory
      ansible.builtin.shell: |
        set -euo pipefail
        DEST="{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}"
        install -d "$(dirname "$DEST")"
        rm -rf "${DEST}.partial"
        install -d "${DEST}.partial"
        tar --zstd -xf "{{ _apache_tmp.path }}/apache.tar.zst" --no-same-owner -C "${DEST}.partial"
        test -x "${DEST}.partial/bin/httpd"
        rm -rf "$DEST"
        mv "${DEST}.partial" "$DEST"
      args:
        creates: "{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}/bin/httpd"
  always:
    - name: Remove Apache download scratch directory
      when: _apache_tmp.path is defined
      ansible.builtin.file:
        path: "{{ _apache_tmp.path }}"
        state: absent

# The tree is root-owned and not writable by group or others (the old compile
# left it that way); the tarball also carries root ownership, this keeps it so
# whatever the extracting user's umask or ids were.
- name: Make the vendored Apache tree root-owned and not group/world writable
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}"
    state: directory
    recurse: true
    follow: false
    owner: root
    group: root
    mode: "go-w"

- name: Harden Apache httpd binary permissions
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}/bin/httpd"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

# Where `current` points before this run moves it: the config test below puts
# it back when the new build rejects the config.
- name: Read where the Apache current symlink points now
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/apache/current"
  register: _apache_current_before

- name: Point Apache current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_vendor_dir }}/apache/{{ apache_version }}"
    dest: "{{ turbopanel_vendor_dir }}/apache/current"
    state: link
    force: true
  register: _apache_link

- name: Ensure FHS Apache config directories
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/apache/{{ item }}"
    state: directory
    owner: root
    group: "{{ apache_service_group }}"
    mode: "0750"
  loop:
    - ""
    - sites

- name: Ensure Apache state directories
  ansible.builtin.file:
    path: "{{ turbopanel_state_dir }}/apache/{{ item }}"
    state: directory
    owner: "{{ apache_service_user }}"
    group: "{{ apache_service_group }}"
    mode: "0750"
  loop:
    - ""
    - empty

# systemd only creates LogsDirectory= when the unit starts, but the config test
# (`httpd -t`, run before the first start) already opens ErrorLog/CustomLog under
# it. Create it here with the same owner and mode the unit uses, so the first
# test on a fresh host finds it.
- name: Ensure the Apache log directory
  ansible.builtin.file:
    path: "/var/log/{{ apache_logs_directory }}"
    state: directory
    owner: "{{ apache_service_user }}"
    group: "{{ apache_service_group }}"
    mode: "0750"

# One error log per site (the vhost's own ErrorLog), kept apart from the
# server-wide one. Owned by the web server account that opens the files; the
# site owner never reaches this folder, so it cannot rename or link a log.
- name: Ensure the per-site Apache error log directory
  ansible.builtin.file:
    path: "/var/log/{{ apache_logs_directory }}/sites"
    state: directory
    owner: "{{ apache_service_user }}"
    group: "{{ apache_service_group }}"
    mode: "0750"

- name: Install TurboPanel Apache main config
  ansible.builtin.template:
    src: httpd.conf.j2
    dest: "{{ turbopanel_config_dir }}/apache/httpd.conf"
    owner: root
    group: "{{ apache_service_group }}"
    mode: "0640"
  register: _apache_conf

# Vhosts rendered before this release keep the broad `FileInfo` override and a
# listing default, so one site's `.htaccess` could still hand another site's PHP
# settings (`ProxyFCGISetEnvIf`, `SetEnv PHP_VALUE`). Without waiting for each
# site's own deploy, bring every vhost on disk to the closed list: the exact
# lines the daemon rendered before are replaced (anchored, idempotent) by the
# new classes plus the named list, the default `Options` loses `Indexes` (the
# listing module is loaded now), and the strip lines go in. A new vhost already
# has all of it and is left as it is. What the daemon renders is in
# src/deploy/site.ts; apache_override_* below are held equal to it by a test.
- name: Find site vhosts written before the closed override list
  ansible.builtin.find:
    paths: "{{ turbopanel_config_dir }}/apache/sites"
    patterns:
      - "*.conf"
      - "*.tpprev"
    file_type: file
    recurse: false
    follow: false
  register: _apache_old_vhosts

- name: Drop Indexes from the default Options of those vhosts
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\s+)Options Indexes (FollowSymLinks|SymLinksIfOwnerMatch)$'
    replace: '\1Options SymLinksIfOwnerMatch'
  loop: "{{ _apache_old_vhosts.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: _apache_vhosts_fixed

- name: Give those vhosts the closed override list instead of FileInfo
  ansible.builtin.replace:
    path: "{{ item.path }}"
    regexp: '^(\s+)AllowOverride (All|AuthConfig FileInfo Indexes Limit Options=Indexes,MultiViews,SymLinksIfOwnerMatch)$'
    replace: '\1AllowOverride {{ apache_override_classes }}\n\1AllowOverrideList {{ apache_override_list }}'
  loop: "{{ _apache_old_vhosts.files }}"
  loop_control:
    label: "{{ item.path }}"
  register: _apache_vhosts_overrides

- name: Strip PHP settings and the site key at the top of those vhosts
  ansible.builtin.lineinfile:
    path: "{{ item.0.path }}"
    regexp: '^  ProxyFCGISetEnvIf "true" !{{ item.1 }}$'
    line: '  ProxyFCGISetEnvIf "true" !{{ item.1 }}'
    insertafter: '^  ServerName localhost$'
  loop: "{{ _apache_old_vhosts.files | product(apache_vhost_strip_names) | list }}"
  loop_control:
    label: "{{ item.0.path }} {{ item.1 }}"
  register: _apache_vhosts_strips

# Nothing on disk may keep the broad override: a vhost in a shape this role does
# not know stops the run instead of staying open.
- name: Find vhosts that still carry FileInfo or All
  ansible.builtin.find:
    paths: "{{ turbopanel_config_dir }}/apache/sites"
    patterns:
      - "*.conf"
    file_type: file
    recurse: false
    follow: false
    contains: '^\s+AllowOverride .*(FileInfo|All)(\s|$)'
  register: _apache_vhosts_open

- name: Stop when a vhost still carries FileInfo or All
  ansible.builtin.fail:
    msg: >-
      These Apache vhosts still allow FileInfo or All and are in a shape this
      role does not rewrite: {{ _apache_vhosts_open.files | map(attribute='path') | join(', ') }}.
      Redeploy their sites.
  when: _apache_vhosts_open.matched | default(0) | int > 0

- name: Note whether any vhost on disk was tightened
  ansible.builtin.set_fact:
    _apache_vhosts_edited: >-
      {{ (_apache_vhosts_fixed.changed | default(false))
      or (_apache_vhosts_overrides.changed | default(false))
      or (_apache_vhosts_strips.changed | default(false)) }}

- name: Install turbopanel-apache systemd unit
  ansible.builtin.template:
    src: turbopanel-apache.service.j2
    dest: /etc/systemd/system/turbopanel-apache.service
    owner: root
    group: root
    mode: "0640"
  register: _apache_unit

- name: Reload systemd after Apache unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: _apache_unit.changed # noqa: no-handler

# A reload keeps the running master, and with it the binary and the account it
# runs as. A new build or a changed unit (for example the move from a root
# master to User=tpapache) only takes effect on a restart, and `httpd -k
# graceful` would load the new build's modules into the old master. So the
# restart is decided by what is running, not by whether this run moved the
# link: a run that follows a failed one still restarts. try-restart leaves a
# stopped unit stopped: the daemon starts Apache when the first site needs it.
- name: Check whether Apache is running
  ansible.builtin.command:
    cmd: systemctl is-active --quiet turbopanel-apache.service
  register: _apache_active
  changed_when: false
  failed_when: false

- name: Read the running Apache main pid
  ansible.builtin.command:
    cmd: systemctl show --property=MainPID --value turbopanel-apache.service
  register: _apache_main_pid
  changed_when: false
  failed_when: false
  when: _apache_active.rc == 0

- name: Resolve the binary the running Apache was started from
  ansible.builtin.command:
    cmd: readlink -f /proc/{{ _apache_main_pid.stdout | trim }}/exe
  register: _apache_running_bin
  changed_when: false
  failed_when: false
  when:
    - _apache_active.rc == 0
    - (_apache_main_pid.stdout | default('') | trim) is match('^[1-9][0-9]*$')

- name: Resolve the installed Apache binary
  ansible.builtin.command:
    cmd: readlink -f {{ turbopanel_vendor_dir }}/apache/current/bin/httpd
  register: _apache_installed_bin
  changed_when: false
  failed_when: false
  when: _apache_active.rc == 0

- name: Note whether the running Apache is not the installed build
  ansible.builtin.set_fact:
    _apache_needs_restart: >-
      {{ (_apache_unit.changed | default(false))
      or ((_apache_running_bin.stdout | default('') | trim)
      != (_apache_installed_bin.stdout | default('') | trim)) }}
  when: _apache_active.rc == 0

# Test first, then restart or reload, and put the previous build back if either
# fails. The config is tested as the account that runs the server (root never
# parses this config), against the build `current` names. It runs on every run
# while Apache is up, not only when this run changed something, so a failure is
# sticky: the next run tests again and restarts instead of reloading. The
# rescue ends in a failure, so nothing after it (the prune) runs.
- name: Test the config, then move Apache onto it
  when: _apache_active.rc == 0
  block:
    - name: Test the Apache config with the installed build
      ansible.builtin.command:
        cmd: >-
          runuser -u {{ apache_service_user }} --
          {{ turbopanel_vendor_dir }}/apache/current/bin/httpd -t
          -f {{ turbopanel_config_dir }}/apache/httpd.conf
      register: _apache_test
      changed_when: false
      failed_when: false

    - name: Stop when the Apache config test failed
      ansible.builtin.fail:
        msg: "The Apache config did not pass `httpd -t`: {{ _apache_test.stderr | default('') }}"
      when: (_apache_test.rc | default(0)) != 0

    - name: Restart Apache onto the new build
      ansible.builtin.command:
        cmd: systemctl try-restart turbopanel-apache.service
      register: _apache_restart
      changed_when: true
      when: _apache_needs_restart | bool

    - name: Reload Apache after its config or a vhost changed
      ansible.builtin.systemd:
        name: turbopanel-apache
        state: reloaded
      when:
        - not (_apache_needs_restart | bool)
        - (_apache_conf.changed or (_apache_vhosts_edited | bool))  # noqa: no-handler
  rescue:
    - name: Put the previous Apache build back after a failure
      ansible.builtin.file:
        src: "{{ _apache_current_before.stat.lnk_source }}"
        dest: "{{ turbopanel_vendor_dir }}/apache/current"
        state: link
        force: true
      when:
        - _apache_link.changed  # noqa: no-handler
        - (_apache_current_before.stat.lnk_source | default('')) | length > 0

    # `restart`, not `try-restart`: a restart that failed leaves the unit
    # failed, and try-restart would leave a failed unit down.
    - name: Start the previous Apache build again after a failed restart
      ansible.builtin.command:
        cmd: systemctl restart turbopanel-apache.service
      changed_when: true
      failed_when: false
      when: _apache_restart is defined and _apache_restart is failed

    - name: Stop after a failed Apache config test or restart
      ansible.builtin.fail:
        msg: >-
          Apache was not moved onto apache_version {{ apache_version }}; the
          previous build is back. {{ _apache_test.stderr | default('') }}
          {{ ansible_failed_result.msg | default('') }}

# `current` now resolves to the pin and the server runs it: a sibling version
# left by an earlier pin is dead weight.
- name: Find superseded Apache version directories
  ansible.builtin.find:
    paths: "{{ turbopanel_vendor_dir }}/apache"
    file_type: directory
    recurse: false
    excludes:
      - current
      - "{{ apache_version }}"
  register: _apache_stale_versions

- name: Remove superseded Apache version directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _apache_stale_versions.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# The pidfile lives in the unit's own RuntimeDirectory=; logs are the unit's
# LogsDirectory= (/var/log/turbopanel/apache). The old pidfile folder inside the
# tp-owned run tree goes.
- name: Remove the old Apache pidfile directory
  ansible.builtin.file:
    path: "{{ turbopanel_run_dir }}/apache"
    state: absent

- name: Stop and disable leftover distro apache2 unit when present
  ansible.builtin.systemd:
    name: apache2
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure turbopanel-apache is enabled
  ansible.builtin.systemd:
    name: turbopanel-apache
    enabled: true
    daemon_reload: true
