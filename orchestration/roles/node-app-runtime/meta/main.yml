galaxy_info:
  author: turbopanel
  description: >-
    Vendor pinned Node.js runtimes under vendor/node-app/<series>/current for
    tenant native applications (serviceKind: node), one tree per requested
    version series. Separate from the node-runtime role, which vendors the
    instance's own Node. Requires 64-bit Linux (aarch64 or x86_64).
