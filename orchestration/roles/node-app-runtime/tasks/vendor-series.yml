---
# One requested series (`node_app_series`), vendored to
# `<node_app_root>/<series>/<resolved>` with `<series>/current` pointing at it.

# The series reaches Ansible from an `environment.deploy` payload. It is already
# validated on the wire, but it is about to become a path segment and a URL, so
# it is re-validated here rather than trusted across the process boundary.
- name: Validate the requested tenant Node series
  ansible.builtin.assert:
    that:
      - node_app_series is match('^[0-9]{1,3}(\.[0-9]{1,3}){0,2}$')
    fail_msg: >-
      Invalid tenant Node series '{{ node_app_series }}'.
      Expected a version series such as '24', '24.17', or '24.17.0'.

- name: Resolve the series entitlement group
  ansible.builtin.set_fact:
    node_app_series_group: "tpnode{{ node_app_series | regex_replace('^([0-9]+).*$', '\\1') }}"

# Ahead of the install: the shell below writes into this directory, and the
# release tree it extracts inherits the group from it.
- name: Ensure the tenant Node series tree is reachable by the runtime group
  ansible.builtin.file:
    path: "{{ node_app_root }}/{{ node_app_series }}"
    state: directory
    owner: root
    group: "{{ node_app_series_group }}"
    mode: "0750"

# Resolve the newest upstream release in Ansible rather than in a `shell:`
# block. A previous inline `grep -o '"version":…'` plus a Jinja
# `regex_replace` in the same script made ansible-playbook fail to parse the
# task ("unbalanced jinja2 block or quotes", exit 4).
- name: Fetch the Node dist index
  ansible.builtin.uri:
    url: https://nodejs.org/dist/index.json
    return_content: true
  register: _node_app_dist_index
  check_mode: false

- name: Resolve newest Node release in the series
  vars:
    _node_app_dist_releases: "{{ _node_app_dist_index.json | default(_node_app_dist_index.content | from_json) }}"
    _node_app_versions: "{{ _node_app_dist_releases | map(attribute='version') | map('regex_replace', '^v', '') | list }}"
    _node_app_series_re: "{{ '^' ~ (node_app_series | replace('.', '\\.')) ~ '(\\..+)?$' }}"
  ansible.builtin.set_fact:
    node_app_resolved_version: "{{ _node_app_versions | select('match', _node_app_series_re) | list | first | default('') }}"

- name: Require an upstream release for the series
  ansible.builtin.assert:
    that:
      - node_app_resolved_version | length > 0
    fail_msg: "no Node release found for series {{ node_app_series }}"

# The installer lives in files/ so this task has no inline shell. Ansible 2.20
# rejects a `shell: |` block that mixes Jinja `{{ }}` with nested quotes
# (readlink) or backticks in comments — parse error, exit 4, no task runs.
- name: Install tenant Node series into the vendor tree
  ansible.builtin.command:
    argv:
      - /bin/bash
      - "{{ role_path }}/files/install-series.sh"
  environment:
    NODE_APP_SERIES: "{{ node_app_series }}"
    NODE_APP_ARCH: "{{ node_app_arch }}"
    NODE_APP_RESOLVED: "{{ node_app_resolved_version }}"
    NODE_APP_GROUP: "{{ node_app_series_group }}"
    NODE_APP_SERIES_DIR: "{{ node_app_root }}/{{ node_app_series }}"
  register: _node_app_install
  changed_when: "'turbopanel-' in _node_app_install.stdout"

# Builds run as the daemon (`tp` / the co-located dest user), not as the
# principal. Supplementary-group changes are not visible to an already-running
# process, so the build child enters this group with `sg` after this append.
- name: Allow the daemon account to execute this tenant Node series
  ansible.builtin.user:
    name: "{{ turbopanel_user }}"
    groups: "{{ node_app_series_group }}"
    append: true
