---
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Resolve Node release architecture
  ansible.builtin.set_fact:
    node_app_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}"

# The daemon may pass the same series twice (two apps, one pin) and may pass an
# empty list on a deploy whose apps were all skipped; normalize both here rather
# than in every task below.
- name: Normalize the requested tenant Node series
  ansible.builtin.set_fact:
    node_app_requested_versions: >-
      {{ (node_app_versions | default([node_app_default_version]))
         | map('string') | map('trim') | reject('equalto', '')
         | unique | list or [node_app_default_version] }}

# setfacl, for the traverse-only grants below. Present on most Debian images
# but only Priority: optional, so a minimal host can be missing it.
- name: Ensure ACL tooling is present
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600

# Creates one group per requested series and grants each traverse-only access
# to /opt/turbopanel and vendor/. Group names and gids live in the shared
# registry so this role and the daemon cannot disagree about them.
- name: Ensure per-series tenant Node entitlement groups
  ansible.builtin.include_role:
    name: runtime-entitlement
  vars:
    runtime_entitlement_runtime: node
    runtime_entitlement_series: "{{ node_app_requested_versions }}"


# Before vendoring: `vendor-series.yml` writes into this directory, so it has to
# exist and carry the right group first.
# The parent holds every series, so it cannot belong to any one series' group.
# It stays `tp:tp 0750` and each entitlement group gets traverse-only through an
# ACL — a principal reaches its own series without being able to list which
# other series exist.
- name: Ensure the tenant Node tree root
  ansible.builtin.file:
    path: "{{ node_app_root }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group | default('tp') }}"
    mode: "0750"

- name: Grant each Node entitlement group traversal of the tenant Node tree
  ansible.posix.acl:
    path: "{{ node_app_root }}"
    etype: group
    entity: "tpnode{{ item | regex_replace('^([0-9]+).*$', '\\1') }}"
    permissions: x
    state: present
  loop: "{{ node_app_requested_versions }}"

- name: Vendor each requested tenant Node series
  ansible.builtin.include_tasks: vendor-series.yml
  loop: "{{ node_app_requested_versions }}"
  loop_control:
    loop_var: node_app_series
