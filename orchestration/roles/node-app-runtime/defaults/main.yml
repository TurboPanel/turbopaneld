---
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"
# Node executed by *tenant* apps (`x-turbopanel.serviceKind: node`). Pinned
# separately from `node-runtime`'s `node_version`, which is the instance's own
# toolchain: bumping what tenants run must never move the panel's Node, and a
# panel upgrade must never silently restart every tenant app on a new runtime.
#
# A **series** ("24", "24.17", "24.17.0"), not necessarily a patch pin — the
# same shape `nativeAppServices[].nodeVersion` accepts on the wire. The role
# resolves the newest upstream release inside the series and points
# `<node_app_root>/<series>/current` at it, so a security release lands without
# a config change and without rewriting a single systemd unit.
node_app_default_version: "24"
# Series to vendor on this run. The daemon overrides this with the distinct
# versions the deploy's native apps declared; a manual run gets the default.
node_app_versions: ["{{ node_app_default_version }}"]
node_app_root: "{{ turbopanel_vendor_dir }}/node-app"

# Entitlement groups come from the shared registry
# (`orchestration/runtime-registry.json`) via the `runtime-entitlement` role,
# and are per **series** — `tpnode24`, not one `tpnodeapp` for the whole tree.
#
# A group means "may execute this runtime series". One group for every series
# would mean granting Node 24 also grants Node 22, which defeats the point of
# co-installing them. Tenant principals each have only their own
# `<username>-grp` and are deliberately not in `tp` (the panel's own group), and
# world bits are not an option on a tree reached through `/opt/turbopanel`.
#
# Membership is reconciled per principal by the daemon
# (`ensurePrincipalManagedGroups` in `src/deploy/ensure-principal.ts`), which
# both grants and **revokes** — this role only creates the groups.
# `/opt/turbopanel` and `vendor/` stay `tp:tp 0750` — they hold
# the panel's own runtimes. The runtime group is granted traverse-only there
# through a POSIX ACL rather than by loosening the mode, so a tenant principal
# can reach `node-app/` without being able to list either parent.
turbopanel_install_root: /opt/turbopanel  # noqa: var-naming[no-role-prefix]
