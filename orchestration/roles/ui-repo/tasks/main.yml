---
# Like instance-repo: clone only when missing so a live dev working tree is
# never force-reset. Static production builds are out of scope.
- name: Check UI checkout
  ansible.builtin.stat:
    path: "{{ turbopanel_ui_dir }}/.git"
  register: _ui_git

- name: Clone UI repository when missing
  when: not _ui_git.stat.exists
  ansible.builtin.git:
    repo: "{{ ui_repo_url }}"
    dest: "{{ turbopanel_ui_dir }}"
    version: "{{ ui_branch }}"
  become_user: "{{ turbopanel_user }}"
  register: _ui_clone

- name: Record checkout normalize needed after UI clone
  ansible.builtin.set_fact:
    force_checkout_normalize: true
  when: _ui_clone is defined and _ui_clone is changed

- name: Check UI dependencies
  ansible.builtin.stat:
    path: "{{ turbopanel_ui_dir }}/node_modules"
  register: _ui_modules

- name: Check UI expo bin link
  ansible.builtin.stat:
    path: "{{ turbopanel_ui_dir }}/node_modules/expo/bin/cli"
  register: _ui_expo_bin

- name: Probe UI babel preset resolution
  ansible.builtin.command:
    cmd: "{{ turbopanel_runtimes_dir }}/node/current/bin/node -e \"require('babel-preset-expo')\""
    chdir: "{{ turbopanel_ui_dir }}"
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
    PATH: "/usr/local/bin:{{ turbopanel_runtimes_dir }}/node/current/bin:/usr/bin:/bin"
  register: _ui_babel_probe
  changed_when: false
  failed_when: false

# Speed: skip install when node_modules, expo cli, and babel preset resolve. Re-run
# when any check fails (partial pnpm install can leave broken hoists).
# Co-located dev allows lockfile drift (package.json ahead of pnpm-lock.yaml);
# managed/static installs keep --frozen-lockfile for reproducibility.
- name: Install UI dependencies
  when: >-
    not _ui_modules.stat.exists
    or not _ui_expo_bin.stat.exists
    or (_ui_babel_probe.rc | default(1)) != 0
  ansible.builtin.command:
    cmd: >-
      pnpm install
      {{ '' if (turbopanel_dev_user | default('') | length > 0) else '--frozen-lockfile' }}
    chdir: "{{ turbopanel_ui_dir }}"
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
    PATH: "/usr/local/bin:{{ turbopanel_runtimes_dir }}/node/current/bin:/usr/bin:/bin"
  register: _ui_pnpm_install

- name: Record checkout normalize needed after UI pnpm install
  ansible.builtin.set_fact:
    force_checkout_normalize: true
  when: _ui_pnpm_install is defined and _ui_pnpm_install is changed
