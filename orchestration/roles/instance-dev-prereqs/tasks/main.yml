---
# React Native DevTools (@react-native/debugger-shell) is an Electron binary.
# Metro runs `react-native-devtools --version` at startup; missing .so files fail
# the dev UI install. Debian 13+ renamed several GTK libs to *t64.
- name: Gather OS family when facts were not collected
  ansible.builtin.setup:
    gather_subset:
      - min
  when: ansible_os_family is not defined

- name: Install React Native devtools runtime libraries (Debian)
  when: ansible_os_family == 'Debian'
  block:
    - name: Refresh apt cache for dev prereq resolution
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Probe t64 renames for dev prereq packages
      ansible.builtin.command:
        cmd: apt-cache show {{ item }}t64
      loop: "{{ instance_dev_prereq_specs }}"
      register: _instance_dev_prereq_t64_probe
      changed_when: false
      failed_when: false

    - name: Resolve dev prereq package names
      ansible.builtin.set_fact:
        instance_dev_prereq_packages: "{{ instance_dev_prereq_packages | default([]) + [_resolved] }}"
      vars:
        _probe: "{{ _instance_dev_prereq_t64_probe.results[idx] }}"
        _resolved: "{{ (item ~ 't64') if _probe.rc == 0 else item }}"
      loop: "{{ instance_dev_prereq_specs }}"
      loop_control:
        index_var: idx
        label: "{{ item }}"

    - name: Install React Native devtools runtime libraries
      ansible.builtin.apt:
        name: "{{ instance_dev_prereq_packages }}"
        state: present
