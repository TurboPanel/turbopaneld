---
# Web engines to remove: nginx, apache, openlitespeed. The daemon passes the
# engines no site on this host uses any more (`engine_prune` in the extra-vars
# JSON object). Empty means nothing to do.
engine_prune: []

turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"  # noqa: var-naming[no-role-prefix]
turbopanel_config_dir: "/etc/turbopanel"  # noqa: var-naming[no-role-prefix]
