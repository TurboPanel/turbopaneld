---
# Builds run as a throwaway user systemd creates for each one
# (DynamicUser=yes): no build account exists on the host, so none can be put
# in docker, tp or sudo. tp-host build-run sets every property of the build
# unit itself; this role only owns the tree it checks.

# Only tp needs to traverse the root (to reach work/). A build never does:
# inside its unit the root is a tmpfs with its own work tree bound in.
- name: Ensure the build sandbox root
  ansible.builtin.file:
    path: "{{ build_root }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0710"

- name: Ensure the build work directory
  ansible.builtin.file:
    path: "{{ build_root }}/work"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "1770"

# Build caches, one per site owner and project (caches/<owner>/<project>,
# made by tp-host build-run). Root-only: each cache is handed to its build's
# throwaway user only while that build runs, and no other build can see it.
- name: Ensure the build cache directory
  ansible.builtin.file:
    path: "{{ build_root }}/caches"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Retired with the shared build account: the per-project caches it owned
# (shared by every site owner's builds), its slice and the account itself. A
# cache is only a cache: the next build fills its own.
- name: Remove the retired shared build cache
  ansible.builtin.file:
    path: "{{ build_root }}/cache"
    state: absent

- name: Remove the retired build slice
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ build_retired_slice }}"
    state: absent
  notify: Reload systemd for the build slice

- name: Remove the retired shared build account
  ansible.builtin.user:
    name: "{{ build_retired_user }}"
    state: absent

- name: Remove the retired shared build group
  ansible.builtin.group:
    name: "{{ build_retired_user }}"
    state: absent
