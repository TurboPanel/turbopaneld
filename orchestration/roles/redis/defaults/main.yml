redis_version: "8.0.2"
# SHA-256 of redis-server_<redis_version>-1rl1~bookworm1_<arch>.deb (key = redis_deb_arch).
# Source: the SHA256 field for each file in packages.redis.io's signed apt index
# (deb/dists/bookworm/main/binary-<arch>/Packages), equal to the downloaded file.
redis_deb_sha256:
  amd64: "768cad8e3dd27d7a17f4cf5c6b0a94e11cb09c354ee3af8e1389a569f78d9777"
  arm64: "c243679bbaf3e78e7224a88d3bea36368ac48b90cdc94e85174792b8b2149678"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: >-  # noqa: var-naming[no-role-prefix]
  {{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor
redis_socket_dir: /run/turbopanel
redis_socket_name: redis.sock
redis_socket_path: "{{ redis_socket_dir }}/{{ redis_socket_name }}"
redis_service_name: turbopanel-redis
# Shared dev-identity contract: dev collapses the redis service account onto the
# single dev user; managed installs keep the dedicated tpcache(9997) account.
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_uid: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_gid: ""  # noqa: var-naming[no-role-prefix]
redis_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcache' }}"
redis_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else 9997 }}"
redis_primary_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcache' }}"
redis_primary_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else 9997 }}"
redis_instance_user: tpctrl
turbopanel_group: >-  # noqa: var-naming[no-role-prefix]
  {{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel  # noqa: var-naming[no-role-prefix]
