redis_version: "8.0.2"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"
redis_socket_dir: /run/turbopanel
redis_socket_name: redis.sock
redis_socket_path: "{{ redis_socket_dir }}/{{ redis_socket_name }}"
redis_service_name: turbopanel-redis
# Shared dev-identity contract: dev collapses the redis service account onto the
# single dev user; managed installs keep the dedicated turbopanelc(9997) account.
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
redis_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanelc' }}"
redis_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else 9997 }}"
redis_primary_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanelc' }}"
redis_primary_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else 9997 }}"
redis_instance_user: turbopaneli
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel
