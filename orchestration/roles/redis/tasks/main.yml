---
# Self-sufficient: does not depend on instance-user (Redis runs before instance on fresh hosts).
- name: Look up legacy Redis primary group
  ansible.builtin.command:
    argv: [getent, group, "{{ redis_legacy_group }}"]
  register: _redis_legacy_group
  changed_when: false
  failed_when: false

- name: Look up target Redis primary group
  ansible.builtin.command:
    argv: [getent, group, "{{ redis_primary_group }}"]
  register: _redis_target_group
  changed_when: false
  failed_when: false

- name: Rename legacy Redis primary group to turbopanelc
  ansible.builtin.command:
    argv: [groupmod, -n, "{{ redis_primary_group }}", "{{ redis_legacy_group }}"]
  when:
    - _redis_legacy_group.rc == 0
    - _redis_target_group.rc != 0

- name: Look up legacy Redis service user
  ansible.builtin.command:
    argv: [getent, passwd, "{{ redis_legacy_user }}"]
  register: _redis_legacy_user
  changed_when: false
  failed_when: false

- name: Look up target Redis service user
  ansible.builtin.command:
    argv: [getent, passwd, "{{ redis_user }}"]
  register: _redis_target_user
  changed_when: false
  failed_when: false

- name: Rename legacy Redis service user to turbopanelc
  ansible.builtin.command:
    argv: [usermod, -l, "{{ redis_user }}", "{{ redis_legacy_user }}"]
  when:
    - _redis_legacy_user.rc == 0
    - _redis_target_user.rc != 0

- name: Ensure turbopanel group exists
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    state: present
    system: true

- name: Ensure turbopanelc primary group for redis user
  ansible.builtin.group:
    name: "{{ redis_primary_group }}"
    gid: "{{ redis_primary_gid }}"
    state: present
    system: true

- name: Ensure Redis service user (primary group turbopanelc, supplementary turbopanel)
  ansible.builtin.user:
    name: "{{ redis_user }}"
    uid: "{{ redis_uid }}"
    group: "{{ redis_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Resolve Redis build architecture
  ansible.builtin.set_fact:
    redis_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check vendored Redis binary
  ansible.builtin.stat:
    path: "{{ turbopanel_runtimes_dir }}/redis/{{ redis_version }}/bin/redis-server"
  register: _redis_pinned

- name: Install Redis into runtimes directory
  when: not _redis_pinned.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    REDIS_VER="{{ redis_version }}"
    TMP="$(mktemp -d)"
    curl -fsSL -o "$TMP/redis-${REDIS_VER}.tar.gz" \
      "https://download.redis.io/releases/redis-${REDIS_VER}.tar.gz"
    tar -xzf "$TMP/redis-${REDIS_VER}.tar.gz" -C "$TMP"
    make -C "$TMP/redis-${REDIS_VER}"
    make -C "$TMP/redis-${REDIS_VER}" PREFIX="{{ turbopanel_runtimes_dir }}/redis/${REDIS_VER}" install
    rm -rf "$TMP"
  args:
    creates: "{{ turbopanel_runtimes_dir }}/redis/{{ redis_version }}/bin/redis-server"

- name: Point Redis current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_runtimes_dir }}/redis/{{ redis_version }}"
    dest: "{{ turbopanel_runtimes_dir }}/redis/current"
    state: link
    force: true

- name: Ensure redis config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/redis"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Write redis.conf
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ turbopanel_config_dir }}/redis/redis.conf"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Install Redis systemd unit
  ansible.builtin.template:
    src: turbopanel-redis.service.j2
    dest: "/etc/systemd/system/{{ redis_service_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Ensure Redis service desired state
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
