---
# Self-sufficient: does not depend on instance-user (Redis runs before instance on fresh hosts).
#
# Co-located dev collapses onto the single dev user, so the dedicated
# tpcache(9997) Redis account/group and the cross-user socket-group
# membership are only provisioned for managed installs (turbopanel_dev_user
# empty). In dev the single dev user owns and reads the socket directly.

- name: Ensure turbopanel group exists
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure tpcache primary group for cache user
  ansible.builtin.group:
    name: "{{ redis_primary_group }}"
    gid: "{{ redis_primary_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure cache service user (primary group tpcache, supplementary tp)
  ansible.builtin.user:
    name: "{{ redis_user }}"
    uid: "{{ redis_uid }}"
    group: "{{ redis_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Check whether instance user exists for cache socket access
  ansible.builtin.getent:
    database: passwd
    key: "{{ redis_instance_user }}"
  register: _redis_instance_user_getent
  failed_when: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure instance user can access cache socket group (tpcache)
  ansible.builtin.user:
    name: "{{ redis_instance_user }}"
    groups: "{{ redis_primary_group }}"
    append: true
  when:
    - turbopanel_dev_user | default('') | length == 0
    - _redis_instance_user_getent.ansible_facts.getent_passwd is defined
    - _redis_instance_user_getent.ansible_facts.getent_passwd[redis_instance_user] is defined

- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Resolve cache .deb architecture
  ansible.builtin.set_fact:
    redis_deb_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"

- name: Check vendored cache binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/redis/{{ redis_version }}/bin/redis-server"
  register: _redis_pinned

- name: Install cache into runtimes directory
  when: not _redis_pinned.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    REDIS_VER="{{ redis_version }}"
    DEB_ARCH="{{ redis_deb_arch }}"
    TMP="$(mktemp -d)"
    DEST="{{ turbopanel_vendor_dir }}/redis/${REDIS_VER}/bin"
    DEB_URL="https://packages.redis.io/deb/pool/bookworm/r/re/redis-server_${REDIS_VER}-1rl1~bookworm1_${DEB_ARCH}.deb"
    curl -fsSL -o "$TMP/redis-server.deb" "$DEB_URL"
    dpkg-deb -x "$TMP/redis-server.deb" "$TMP/extract"
    install -d "$DEST"
    install -m 0750 "$TMP/extract/usr/bin/redis-server" "$DEST/redis-server"
    rm -rf "$TMP"
  args:
    executable: /bin/bash
    creates: "{{ turbopanel_vendor_dir }}/redis/{{ redis_version }}/bin/redis-server"

- name: Harden cache binary permissions
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/redis/{{ redis_version }}/bin/redis-server"
    owner: "{{ redis_user }}"
    group: "{{ redis_primary_group }}"
    mode: "0750"

- name: Point cache current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_vendor_dir }}/redis/{{ redis_version }}"
    dest: "{{ turbopanel_vendor_dir }}/redis/current"
    state: link
    force: true

- name: Ensure cache config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/redis"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Write cache configuration
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ turbopanel_config_dir }}/redis/redis.conf"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Install cache systemd unit
  ansible.builtin.template:
    src: turbopanel-redis.service.j2
    dest: "/etc/systemd/system/{{ redis_service_name }}.service"
    owner: root
    group: root
    mode: "0640"

- name: Enable memory overcommit for cache (background save / replication)
  ansible.posix.sysctl:
    name: vm.overcommit_memory
    value: "1"
    state: present
    sysctl_set: true
    reload: true
    sysctl_file: /etc/sysctl.d/99-turbopanel-redis.conf

- name: Ensure cache service desired state
  ansible.builtin.systemd:
    name: "{{ redis_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
