---
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Resolve Node release architecture
  ansible.builtin.set_fact:
    node_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'x64' }}"

- name: Check vendored Node binary
  ansible.builtin.stat:
    path: "{{ turbopanel_runtimes_dir }}/node/{{ node_version }}/bin/node"
  register: _node_pinned

- name: Read installed Node version
  ansible.builtin.command:
    argv: [
      "{{ turbopanel_runtimes_dir }}/node/{{ node_version }}/bin/node",
      --version,
    ]
  register: _node_version
  changed_when: false
  failed_when: false
  when: _node_pinned.stat.exists

- name: Install Node into runtimes directory
  when: >-
    not _node_pinned.stat.exists
    or (_node_version.stdout | default('')) != ('v' + node_version)
  ansible.builtin.shell: |
    set -euo pipefail
    NODE_VER="v{{ node_version }}"
    NODE_ARCH="{{ node_arch }}"
    NODE_DIR="node-${NODE_VER}-linux-${NODE_ARCH}"
    NODE_TMP="{{ turbopanel_runtimes_dir }}/node/.install"
    NODE_DEST="{{ turbopanel_runtimes_dir }}/node/{{ node_version }}"
    rm -rf "$NODE_TMP" "$NODE_DEST"
    mkdir -p "$NODE_TMP"
    curl -fsSL -o "$NODE_TMP/${NODE_DIR}.tar.gz" \
      "https://nodejs.org/dist/${NODE_VER}/${NODE_DIR}.tar.gz"
    tar -xzf "$NODE_TMP/${NODE_DIR}.tar.gz" -C "$NODE_TMP"
    install -d "$NODE_DEST"
    cp -a "$NODE_TMP/${NODE_DIR}/bin" "$NODE_TMP/${NODE_DIR}/include" \
      "$NODE_TMP/${NODE_DIR}/lib" "$NODE_TMP/${NODE_DIR}/share" \
      "$NODE_DEST/"
    rm -rf "$NODE_TMP"
  args:
    creates: "{{ turbopanel_runtimes_dir }}/node/{{ node_version }}/bin/node"

- name: Point Node current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_runtimes_dir }}/node/{{ node_version }}"
    dest: "{{ turbopanel_runtimes_dir }}/node/current"
    state: link
    force: true

- name: Enable pnpm via corepack
  ansible.builtin.command:
    argv:
      - "{{ turbopanel_runtimes_dir }}/node/current/bin/corepack"
      - enable
      - pnpm
    creates: "{{ turbopanel_runtimes_dir }}/node/current/bin/pnpm"
  environment:
    PATH: "{{ turbopanel_runtime_path }}"
