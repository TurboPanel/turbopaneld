---
# Co-located dev collapses onto the single human dev user, which already exists —
# so the dedicated turbopanel(9999) account and its passwordless sudo are only
# created for managed/production installs (turbopanel_dev_user empty).
- name: Ensure turbopanel group
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    gid: "{{ turbopanel_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure turbopanel user
  ansible.builtin.user:
    name: "{{ turbopanel_user }}"
    uid: "{{ turbopanel_uid }}"
    group: "{{ turbopanel_group }}"
    home: "{{ turbopanel_install_root }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure install root directory
  ansible.builtin.file:
    path: "{{ turbopanel_install_root }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

# Runtimes live under the FHS vendor tree; the mutable FHS dirs (config,
# state, logs) are owned by the resolved identity — the dev user in co-located
# dev, the turbopanel service account on managed hosts. The retired co-located
# /platform tree is gone: source checkouts now live under the dev user's home
# and config lives under /etc/turbopanel.
- name: Ensure runtimes and FHS directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
  loop:
    - "{{ turbopanel_runtimes_dir }}"
    - "{{ turbopanel_runtimes_dir }}/uv"
    - "{{ turbopanel_runtimes_dir }}/uv/cache"
    - "{{ turbopanel_runtimes_dir }}/python"
    - "{{ turbopanel_runtimes_dir }}/ansible"
    - "{{ turbopanel_runtimes_dir }}/ansible/home"
    - /etc/turbopanel
    - /var/lib/turbopanel
    - /var/log/turbopanel

# The pre-playbook `turbopaneld bootstrap-orchestration` (invoked by run.sh as
# root on first binary install) may have populated uv/python/ansible state dirs
# as root. Fix ownership recursively here (right after user creation) so that
# when later roles (esp. daemon-launch) start the turbopaneld unit, the
# daemon process (running as turbopanel) can write its uv cache and managed
# pythons without permission errors.
- name: Ensure turbopanel owns the runtimes tree
  ansible.builtin.file:
    path: "{{ turbopanel_runtimes_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    recurse: true
    mode: "0750"

# Install-time bootstrap runs as root before turbopanel exists. Older builds
# defaulted ANSIBLE_HOME to /root/.ansible (galaxy_cache). New installs pin
# ANSIBLE_HOME under vendor/ansible/home; remove any leftover root home
# artifact so managed hosts stay clean. Runtime ansible runs as turbopanel.
- name: Remove install-time Ansible artifacts from root home
  ansible.builtin.file:
    path: /root/.ansible
    state: absent
  when: turbopanel_dev_user | default('') | length == 0

- name: Grant passwordless sudo for orchestration
  ansible.builtin.copy:
    dest: /etc/sudoers.d/turbopanel
    content: "{{ turbopanel_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
  when: turbopanel_dev_user | default('') | length == 0
