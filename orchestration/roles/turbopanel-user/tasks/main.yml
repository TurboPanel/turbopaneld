---
- name: Ensure turbopanel group
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    gid: "{{ turbopanel_gid }}"
    state: present
    system: true

- name: Ensure turbopanel user
  ansible.builtin.user:
    name: "{{ turbopanel_user }}"
    uid: "{{ turbopanel_uid }}"
    group: "{{ turbopanel_group }}"
    home: "{{ turbopanel_install_root }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Ensure install root directory
  ansible.builtin.file:
    path: "{{ turbopanel_install_root }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure platform and runtimes directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
  loop:
    - "{{ turbopanel_install_root }}/platform"
    - "{{ turbopanel_install_root }}/platform/config"
    - "{{ turbopanel_runtimes_dir }}"
    - "{{ turbopanel_runtimes_dir }}/uv"
    - "{{ turbopanel_runtimes_dir }}/uv/cache"
    - "{{ turbopanel_runtimes_dir }}/python"
    - "{{ turbopanel_runtimes_dir }}/ansible"

# The pre-playbook `turbopaneld bootstrap-orchestration` (invoked by run.sh as
# root on first binary install) may have populated uv/python/ansible state dirs
# as root. Fix ownership recursively here (right after user creation) so that
# when later roles (esp. daemon-launch) start the turbopaneld unit, the
# daemon process (running as turbopanel) can write its uv cache and managed
# pythons without permission errors.
- name: Ensure turbopanel owns the runtimes tree
  ansible.builtin.file:
    path: "{{ turbopanel_runtimes_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    recurse: true
    mode: "0750"

- name: Grant passwordless sudo for orchestration
  ansible.builtin.copy:
    dest: /etc/sudoers.d/turbopanel
    content: "{{ turbopanel_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
