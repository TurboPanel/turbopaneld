---
# Co-located dev collapses onto the single human dev user, which already exists —
# so the dedicated tp(9999) account and its passwordless sudo are only
# created for managed/production installs (turbopanel_dev_user empty).
- name: Ensure turbopanel group
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    gid: "{{ turbopanel_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure turbopanel user
  ansible.builtin.user:
    name: "{{ turbopanel_user }}"
    uid: "{{ turbopanel_uid }}"
    group: "{{ turbopanel_group }}"
    # Home is the state tree, not the (root-owned) install root: the few
    # things that key on $HOME (Deno's cache dir when unset, docker CLI
    # config) must land somewhere the daemon may write.
    home: "{{ turbopanel_daemon_state_dir | default('/var/lib/turbopanel') }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

# The install root is release content: root-owned, traversable by the daemon
# group, never writable by the daemon. A daemon that could write here could
# replace its own binary, the orchestration tree it hands to root, or a
# runtime it is launched from. Co-located dev keeps the dev user as owner —
# that account already holds full sudo and edits these trees on purpose.
#
# The mode names only owner and group: the "other" bits belong to the
# `other:x` ACL below (traverse without listing, so every site owner's Linux
# user reaches the vendored runtimes). A full octal mode here would wipe that
# entry on every install and upgrade.
- name: Ensure install root directory
  ansible.builtin.file:
    path: "{{ turbopanel_install_root }}"
    state: directory
    owner: "{{ turbopanel_install_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "u=rwx,g=rx"

# Vendored runtimes are immutable to the daemon too. The bootstrap that runs
# as root before this playbook (run.sh → `turbopaneld bootstrap-orchestration`)
# populates uv/python/ansible with root ownership, and that is what stays.
- name: Ensure runtimes directories are root-owned and group-traversable
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ turbopanel_install_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
  loop:
    - "{{ turbopanel_vendor_dir }}/uv"
    - "{{ turbopanel_vendor_dir }}/python"
    - "{{ turbopanel_vendor_dir }}/ansible"

# `vendor/` itself: owner and group bits only, like the install root, so the
# `other:x` ACL below survives every run.
- name: Ensure the vendor directory is root-owned and group-traversable
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}"
    state: directory
    owner: "{{ turbopanel_install_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "u=rwx,g=rx"

# Every site owner's Linux user may run every installed runtime: traverse
# without listing, the same contract the runtime-access role sets (an ACL
# rather than a 0751 mode, which ansible:S2612 flags).
- name: Let every account traverse the install root and vendor directory
  ansible.posix.acl:
    path: "{{ item }}"
    etype: other
    permissions: x
    state: present
  loop:
    - "{{ turbopanel_install_root }}"
    - "{{ turbopanel_vendor_dir }}"

# The mutable FHS dirs (config, state, logs, backups) belong to the resolved
# identity — the dev user in co-located dev, the service account on managed
# hosts.
# The config and state roots keep whatever owner they have here (P1-1: the
# daemon-seal role makes them root-owned last, just before the daemon restarts,
# so a still-running old daemon is not locked out meanwhile); the log directory
# is daemon-logs'. The backup root stays the daemon's (it creates a folder per
# managed engine in it and an operator may mount storage there).
- name: Ensure FHS state directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(omit) }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
    follow: false
  loop:
    - { path: /etc/turbopanel }
    - { path: /var/lib/turbopanel }
    - { path: /var/log/turbopanel }
    - { path: "{{ turbopanel_backup_dir }}", owner: "{{ turbopanel_user }}" }
  loop_control:
    label: "{{ item.path }}"

# The narrow vendor cache the daemon process writes at runtime — nothing it
# is launched from, nothing root later executes. Keep in step with
# DAEMON_WRITABLE_VENDOR_DIRS in src/permissions/daemon-permissions.ts (pinned by
# src/orchestration/sudoers-contract.test.ts): uv's download cache and the
# cloudflared connector the daemon vendors on demand for its own tunnels.
- name: Ensure the daemon-writable vendor cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
    follow: false
  loop: "{{ turbopanel_daemon_vendor_cache_dirs }}"

# The root helpers (tp-host, its conf, and the sudoers file that names it)
# live in their own task file so every path that replaces the daemon — the
# full install, the co-located refresh (daemon-colocated-refresh.yml) — ships
# the tp-host that matches the new orchestration tree from one source.
- name: Install the root helpers and scoped sudoers
  ansible.builtin.import_tasks: root-helpers.yml
