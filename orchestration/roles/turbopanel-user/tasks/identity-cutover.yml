        and _legacy_tp_user_getent.ansible_facts.getent_passwd.turbopanel is defined
        and not (
          _canonical_tp_user_getent.ansible_facts.getent_passwd is defined
          and _canonical_tp_user_getent.ansible_facts.getent_passwd.tp is defined
        )
      }}
  when: turbopanel_dev_user | default('') | length == 0

- name: Assert turbopanel user cutover is unambiguous
  ansible.builtin.assert:
    that:
      - not (
          _legacy_tp_user_getent.ansible_facts.getent_passwd is defined
          and _legacy_tp_user_getent.ansible_facts.getent_passwd.turbopanel is defined
          and _canonical_tp_user_getent.ansible_facts.getent_passwd is defined
          and _canonical_tp_user_getent.ansible_facts.getent_passwd.tp is defined
        )
      - not (
          _legacy_tp_user_needs_rename | default(false)
          and (
            _legacy_tp_user_getent.ansible_facts.getent_passwd.turbopanel[1] | int
            != turbopanel_uid | default(9999) | int
          )
        )
    fail_msg: >-
      Legacy user turbopanel and canonical user tp both exist, or turbopanel
      occupies a UID other than {{ turbopanel_uid | default(9999) }}. Stop
      turbopaneld, rename or remove the conflicting account (usermod -l tp
      turbopanel when UID matches), then re-run converge.
  when: turbopanel_dev_user | default('') | length == 0

- name: Rename legacy turbopanel user to tp
  ansible.builtin.command:
    argv: [usermod, -l, tp, turbopanel]
  register: _rename_tp_user
  changed_when: _rename_tp_user.rc == 0
  when:
