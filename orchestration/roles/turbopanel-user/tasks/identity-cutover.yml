---
# Production identity cutover: rename legacy turbopanel* accounts to tp* before
# fixed 999x uid/gid creation. Idempotent — safe to import from any role that
# provisions service identities. Skipped in co-located dev.

- name: Look up legacy turbopanel group
  ansible.builtin.getent:
    database: group
    key: turbopanel
  register: _legacy_tp_group_getent
  failed_when: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Look up canonical tp group
  ansible.builtin.getent:
    database: group
    key: tp
  register: _canonical_tp_group_getent
  failed_when: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Decide whether legacy turbopanel group must be renamed
  ansible.builtin.set_fact:
    _legacy_tp_group_needs_rename: >-
      {{
        _legacy_tp_group_getent.ansible_facts.getent_group is defined
        and _legacy_tp_group_getent.ansible_facts.getent_group.turbopanel is defined
        and not (
          _canonical_tp_group_getent.ansible_facts.getent_group is defined
          and _canonical_tp_group_getent.ansible_facts.getent_group.tp is defined
        )
      }}
  when: turbopanel_dev_user | default('') | length == 0

- name: Assert turbopanel group cutover is unambiguous
  ansible.builtin.assert:
    that:
      - not (
          _legacy_tp_group_getent.ansible_facts.getent_group is defined
          and _legacy_tp_group_getent.ansible_facts.getent_group.turbopanel is defined
          and _canonical_tp_group_getent.ansible_facts.getent_group is defined
          and _canonical_tp_group_getent.ansible_facts.getent_group.tp is defined
        )
      - not (
          _legacy_tp_group_needs_rename | default(false)
          and (
            _legacy_tp_group_getent.ansible_facts.getent_group.turbopanel[1] | int
            != turbopanel_gid | default(9999) | int
          )
        )
    # fail_msg is always templated (ansible-core 2.19+) — never interpolate
    # getent register paths that are absent on a clean host.
    fail_msg: >-
      Legacy group turbopanel and canonical group tp both exist, or turbopanel
      occupies a GID other than {{ turbopanel_gid | default(9999) }}. Stop
      TurboPanel services, rename or remove the conflicting group (groupmod -n
      tp turbopanel when GID matches), then re-run converge.
  when: turbopanel_dev_user | default('') | length == 0

- name: Stop daemon before tp identity cutover
  ansible.builtin.systemd:
    name: "{{ turbopanel_service_name | default('turbopaneld') }}"
    state: stopped
  failed_when: false
  when:
    - turbopanel_dev_user | default('') | length == 0
    - _legacy_tp_group_needs_rename | default(false) or _legacy_tp_user_needs_rename | default(false)

- name: Rename legacy turbopanel group to tp
  ansible.builtin.command:
    argv: [groupmod, -n, tp, turbopanel]
  register: _rename_tp_group
  changed_when: _rename_tp_group.rc == 0
  when:
    - turbopanel_dev_user | default('') | length == 0
    - _legacy_tp_group_needs_rename | default(false)

- name: Look up legacy turbopanel user
  ansible.builtin.getent:
    database: passwd
    key: turbopanel
  register: _legacy_tp_user_getent
  failed_when: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Look up canonical tp user
  ansible.builtin.getent:
    database: passwd
    key: tp
  register: _canonical_tp_user_getent
