      matches), then re-run converge.
  when: turbopanel_dev_user | default('') | length == 0

- name: Stop instance stack before tpctrl identity cutover
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - "{{ mailer_service_name | default('turbopanel-mailer') }}"
    - "{{ website_service_name | default('turbopanel-website') }}"
    - "{{ ui_service_name | default('turbopanel-ui') }}"
    - "{{ caddy_service_name | default('turbopanel-caddy') }}"
