---
# Shared dev-identity contract. When turbopanel_dev_user is set (co-located dev,
# passed as an extra-var by the dev converge), the turbopanel service identity
# collapses onto the single human dev user/uid/gid. When empty (managed /
# production) it resolves to the dedicated tp(9999) service account, so
# managed converge is bit-for-bit unchanged.
turbopanel_install_root: /opt/turbopanel
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
# Managed-engine backup root (`LayoutPaths.backupDir`, `TURBOPANEL_BACKUP_DIR`).
# Top-level rather than under /var/lib so an operator can mount separate
# storage at it without moving the rest of the state tree.
turbopanel_backup_dir: /backup
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
turbopanel_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else 9999 }}"
turbopanel_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else 9999 }}"
# Who owns release content under the install root: root on managed hosts, the
# dev user in co-located dev (source checkouts and vendored runtimes there are
# edited by that account on purpose).
turbopanel_install_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
# Production orchestration tree (run.sh installs it; the sudoers allowlist names
# its tp-orchestrate helper). Overridden by daemon-install.yml / run.sh vars.
turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
# Vendor subtrees the daemon process itself may write at runtime. Everything
# else under the install root is root-owned. Keep in step with
# DAEMON_WRITABLE_VENDOR_DIRS in src/permissions/daemon-permissions.ts.
turbopanel_daemon_vendor_cache_dirs:
  - "{{ turbopanel_vendor_dir }}/uv/cache"
  - "{{ turbopanel_vendor_dir }}/cloudflared"
