# {{ turbopanel_config_dir }}/ (FHS /etc/turbopanel; dev shares it with prod)
#   clickhouse/
#     config.xml / users.xml — config.d/users.d overlays bind-mounted into the
#                              official image (base image config preserved)
#     config.json            — connection metadata + password-file paths (no secret values)
#     .clickhouse_admin_pass — bootstrap/default admin password (mode 0600)
#     .clickhouse_app_pass   — least-privilege {{ clickhouse_app_user }} password (mode 0600)
#     wrapper-start.sh       — start the container and wait until GET /ping succeeds
#
# ClickHouse runs as a Docker container ({{ clickhouse_container_name }}) on the
# {{ turbopanel_docker_network }} network with data in the named volume
# {{ clickhouse_volume_name }}. HTTP is published loopback-only on
# 127.0.0.1:{{ clickhouse_http_port }}; native TCP 9000 stays internal to the
# container/network (bootstrap SQL runs via docker exec).
#
# Self-sufficient: does not depend on instance-user (ClickHouse can run before instance).
# Co-located dev collapses onto the single dev user; managed installs use the
# dedicated tpmetrics(9994) account.


- name: Ensure turbopanel group exists
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure tpmetrics primary group for analytics user
  ansible.builtin.group:
    name: "{{ clickhouse_primary_group }}"
    gid: "{{ clickhouse_container_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure analytics service user (primary group tpmetrics, supplementary tp)
  ansible.builtin.user:
    name: "{{ clickhouse_system_user }}"
    uid: "{{ clickhouse_container_uid }}"
    group: "{{ clickhouse_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure ClickHouse config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/clickhouse"
    state: directory
    owner: "{{ clickhouse_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure ClickHouse log directory exists
  ansible.builtin.file:
    path: "{{ clickhouse_log_dir }}"
    state: directory
    owner: "{{ clickhouse_container_uid }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Generate ClickHouse admin password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      admin='{{ turbopanel_config_dir }}/clickhouse/.clickhouse_admin_pass'
      if [ ! -s "$admin" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$admin"
        chmod 0600 "$admin"
        chown {{ clickhouse_config_owner }}:{{ turbopanel_group }} "$admin"
        echo created
      fi
    executable: /bin/bash
  register: clickhouse_admin_pass_gen
  changed_when: "'created' in clickhouse_admin_pass_gen.stdout"

- name: Generate ClickHouse app password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/clickhouse/.clickhouse_app_pass'
      if [ ! -s "$f" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$f"
        chmod 0600 "$f"
        chown {{ clickhouse_config_owner }}:{{ turbopanel_group }} "$f"
        echo created
      fi
    executable: /bin/bash
  register: clickhouse_app_pass_gen
  changed_when: "'created' in clickhouse_app_pass_gen.stdout"

- name: Read ClickHouse admin password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/clickhouse/.clickhouse_admin_pass"
  register: clickhouse_admin_pass_raw

- name: Read ClickHouse app password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/clickhouse/.clickhouse_app_pass"
  register: clickhouse_app_pass_raw

- name: Set ClickHouse password facts
  ansible.builtin.set_fact:
    _clickhouse_admin_password: "{{ clickhouse_admin_pass_raw.content | b64decode | trim }}"
    _clickhouse_app_password: "{{ clickhouse_app_pass_raw.content | b64decode | trim }}"
  no_log: true

- name: Write ClickHouse config.json (idempotent)
  ansible.builtin.template:
    src: clickhouse-config.json.j2
    dest: "{{ turbopanel_config_dir }}/clickhouse/config.json"
    owner: "{{ clickhouse_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

# The config.d/users.d overlays are bind-mounted read-only into the container,
# which runs as {{ clickhouse_container_uid }}:{{ clickhouse_container_gid }}
# (9994:9994 in production — neither root nor in the turbopanel group). Own the
# overlays by the container id/gid so that user can read them; mode 0640 keeps
# users.xml non-world-readable (it carries the admin password).
- name: Write ClickHouse config.d overlay (config.xml)
  ansible.builtin.template:
    src: config.xml.j2
    dest: "{{ turbopanel_config_dir }}/clickhouse/config.xml"
    owner: "{{ clickhouse_container_uid }}"
    group: "{{ clickhouse_container_gid }}"
    mode: "0640"
  register: clickhouse_config_written

- name: Write ClickHouse users.d overlay (users.xml)
  ansible.builtin.template:
    src: users.xml.j2
    dest: "{{ turbopanel_config_dir }}/clickhouse/users.xml"
    owner: "{{ clickhouse_container_uid }}"
    group: "{{ clickhouse_container_gid }}"
    mode: "0640"
  register: clickhouse_users_written
  no_log: true

- name: Ensure turbopanel Docker network exists
  ansible.builtin.command:
    argv: [
      docker,
      network,
      create,
      --driver,
      bridge,
      "{{ turbopanel_docker_network }}",
    ]
  register: clickhouse_network_create
  changed_when: false
  failed_when: false

- name: Ensure turbopanel-analytics Docker volume exists
  ansible.builtin.command:
    argv: [docker, volume, create, "{{ clickhouse_volume_name }}"]
  register: clickhouse_volume_create
  changed_when: false

- name: Inspect clickhouse container
  ansible.builtin.command:
    argv: [docker, inspect, "{{ clickhouse_container_name }}"]
  register: clickhouse_inspect_cmd
  changed_when: false
  failed_when: false

- name: Parse clickhouse container inspection
  ansible.builtin.set_fact:
    clickhouse_inspect: "{{ (clickhouse_inspect_cmd.stdout | from_json)[0] }}"
  when: clickhouse_inspect_cmd.rc == 0

- name: Set clickhouse container state facts
  ansible.builtin.set_fact:
    _clickhouse_container_exists: true
    _clickhouse_running: "{{ clickhouse_inspect.State.Running | default(false) }}"
    clickhouse_container_status: "{{ clickhouse_inspect.State.Status | default('') }}"
    clickhouse_volume_ok: >-
      {{
        clickhouse_inspect.Mounts | default([])
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', clickhouse_volume_name)
        | list | length > 0
      }}
    clickhouse_network_ok: "{{ turbopanel_docker_network in (clickhouse_inspect.NetworkSettings.Networks | default({})) }}"
    clickhouse_config_mount_ok: >-
      {{ clickhouse_inspect.Mounts | default([]) | selectattr('Destination', 'equalto', '/etc/clickhouse-server/config.d/turbopanel.xml') | list | length > 0 }}
    clickhouse_users_mount_ok: >-
      {{ clickhouse_inspect.Mounts | default([]) | selectattr('Destination', 'equalto', '/etc/clickhouse-server/users.d/turbopanel.xml') | list | length > 0 }}
    clickhouse_http_binding_ok: >-
      {{ (clickhouse_inspect.HostConfig.PortBindings['8123/tcp'] | default([]) | length > 0)
         and ((clickhouse_inspect.HostConfig.PortBindings['8123/tcp'] | first).HostIp | default('')) == '127.0.0.1'
         and ((clickhouse_inspect.HostConfig.PortBindings['8123/tcp'] | first).HostPort | default('')) == (clickhouse_http_port | string) }}
    clickhouse_image_ok: "{{ (clickhouse_inspect.Config.Image | default('')) == clickhouse_image }}"
    clickhouse_user_ok: >-
      {{ (clickhouse_inspect.Config.User | default('')) == (clickhouse_container_uid | string ~ ':' ~ clickhouse_container_gid | string) }}
    clickhouse_memory_ok: >-
      {{ (clickhouse_inspect.HostConfig.Memory | default(0) | int)
         == (clickhouse_container_memory_bytes | int) }}
    clickhouse_cpus_ok: >-
      {{ (clickhouse_inspect.HostConfig.NanoCpus | default(0) | int)
         == (clickhouse_container_nanocpus | int) }}
  when: clickhouse_inspect_cmd.rc == 0

- name: Set clickhouse container missing facts
  ansible.builtin.set_fact:
    _clickhouse_container_exists: false
    _clickhouse_running: false
  when: clickhouse_inspect_cmd.rc != 0

# Recreate (not just restart) when the running container has drifted from the
# role's contract: missing volume/network, missing config.d/users.d overlay
# mounts, a wrong/public 8123 host binding (must be exactly 127.0.0.1:<port>),
# a stale image or --user, missing --memory/--cpus caps, or an unhealthy status.
# `docker restart` cannot add missing bind mounts, port bindings, or resource
# limits, so those must force a rebuild.
- name: Remove clickhouse container with drifted configuration
  when:
    - _clickhouse_container_exists | bool
    - >-
        (not clickhouse_volume_ok | bool)
        or (not clickhouse_network_ok | bool)
        or (not clickhouse_config_mount_ok | bool)
        or (not clickhouse_users_mount_ok | bool)
        or (not clickhouse_http_binding_ok | bool)
        or (not clickhouse_image_ok | bool)
        or (not clickhouse_user_ok | bool)
        or (not clickhouse_memory_ok | bool)
        or (not clickhouse_cpus_ok | bool)
        or (clickhouse_container_status | trim in ['restarting', 'exited', 'dead'])
  block:
    - name: Remove drifted clickhouse container
      ansible.builtin.command:
        cmd: docker rm -f {{ clickhouse_container_name }}
      register: clickhouse_removed
      changed_when: clickhouse_removed.rc == 0

    - name: Refresh clickhouse container facts after removal
      ansible.builtin.set_fact:
        _clickhouse_container_exists: false
        _clickhouse_running: false

- name: Pre-own clickhouse Docker volume data directory
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ clickhouse_volume_name }}:/var/lib/clickhouse"
      - --user
      - root
      - alpine
      - chown
      - -R
      - "{{ clickhouse_container_uid }}:{{ clickhouse_container_gid }}"
      - /var/lib/clickhouse
  when: not _clickhouse_container_exists | bool
  changed_when: true

- name: Build docker run argument list
  ansible.builtin.set_fact:
    clickhouse_docker_run_args: "{{ clickhouse_docker_run_base + [clickhouse_image] }}"
  vars:
    clickhouse_docker_run_base:
      - "--name"
      - "{{ clickhouse_container_name }}"
      - "--restart"
      - "unless-stopped"
      - "-d"
      - "--user"
      - "{{ clickhouse_container_uid }}:{{ clickhouse_container_gid }}"
      - "--network"
      - "{{ turbopanel_docker_network }}"
      - "-v"
      - "{{ clickhouse_volume_name }}:/var/lib/clickhouse"
      - "-v"
      - "{{ clickhouse_log_dir }}:/var/log/clickhouse-server"
      - "-v"
      - "{{ turbopanel_config_dir }}/clickhouse/config.xml:/etc/clickhouse-server/config.d/turbopanel.xml:ro"
      - "-v"
      - "{{ turbopanel_config_dir }}/clickhouse/users.xml:/etc/clickhouse-server/users.d/turbopanel.xml:ro"
      - "--ulimit"
      - "nofile=262144:262144"
      - "--memory"
      - "{{ clickhouse_container_memory_bytes }}"
      - "--cpus"
      - "{{ clickhouse_container_cpus }}"
      - "-p"
      - "127.0.0.1:{{ clickhouse_http_port }}:8123"

# Pre-flight: prove the container id/gid (9994:9994 in production) can actually
# read both bind-mounted overlays before the real container start / readiness /
# bootstrap. A throwaway container using the same --user and the same read-only
# mounts fails loudly here instead of crash-looping ClickHouse for ~2 minutes
# until the /ping readiness wrapper gives up.
- name: Verify clickhouse container user can read mounted overlay files
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --user
      - "{{ clickhouse_container_uid }}:{{ clickhouse_container_gid }}"
      - --entrypoint
      - sh
      - -v
      - "{{ turbopanel_config_dir }}/clickhouse/config.xml:/etc/clickhouse-server/config.d/turbopanel.xml:ro"
      - -v
      - "{{ turbopanel_config_dir }}/clickhouse/users.xml:/etc/clickhouse-server/users.d/turbopanel.xml:ro"
      - "{{ clickhouse_image }}"
      - -c
      - >-
          cat /etc/clickhouse-server/config.d/turbopanel.xml >/dev/null
          && cat /etc/clickhouse-server/users.d/turbopanel.xml >/dev/null
  changed_when: false

- name: Create and start clickhouse container
  ansible.builtin.command:
    cmd: docker run {{ clickhouse_docker_run_args | join(' ') }}
  when: not _clickhouse_container_exists | bool
  changed_when: true
  no_log: true

- name: Restart clickhouse container when overlay config changed
  ansible.builtin.command:
    cmd: docker restart {{ clickhouse_container_name }}
  when:
    - _clickhouse_container_exists | bool
    - clickhouse_config_written is changed or clickhouse_users_written is changed
    - clickhouse_removed is not changed
  register: clickhouse_conf_restart
  changed_when: clickhouse_conf_restart.rc == 0

- name: Install ClickHouse wrapper start script
  ansible.builtin.template:
    src: clickhouse-wrapper-start.sh.j2
    dest: "{{ turbopanel_config_dir }}/clickhouse/wrapper-start.sh"
    owner: root
    group: root
    mode: "0750"

- name: Ensure clickhouse container is running and ready
  ansible.builtin.command:
    cmd: "{{ turbopanel_config_dir }}/clickhouse/wrapper-start.sh"
  changed_when: false

- name: Install ClickHouse systemd unit
  ansible.builtin.template:
    src: turbopanel-clickhouse.service.j2
    dest: "/etc/systemd/system/{{ clickhouse_service_name }}.service"
    owner: root
    group: root
    mode: "0640"

- name: Ensure ClickHouse service desired state
  ansible.builtin.systemd:
    name: "{{ clickhouse_service_name }}"
    daemon_reload: true
    enabled: true
    state: started

- name: Bootstrap ClickHouse database and app user (idempotent)
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -i {{ clickhouse_container_name }} clickhouse-client \
      --user default --password '{{ _clickhouse_admin_password }}' --multiquery <<EOSQL
    CREATE DATABASE IF NOT EXISTS {{ clickhouse_database }};
    CREATE USER IF NOT EXISTS {{ clickhouse_app_user }} IDENTIFIED WITH sha256_password BY '{{ _clickhouse_app_password }}';
    ALTER USER {{ clickhouse_app_user }} IDENTIFIED WITH sha256_password BY '{{ _clickhouse_app_password }}';
    GRANT SELECT, INSERT, CREATE TABLE, CREATE VIEW, ALTER, SHOW ON {{ clickhouse_database }}.* TO {{ clickhouse_app_user }};
    EOSQL
  no_log: true
  changed_when: false

# Disabling system *_log in config.d stops new writes but does not drop tables
# that already exist from a prior run — those keep flush/merge scheduler threads
# alive. Drop every remove="remove" log from config.xml.j2 (keep lists aligned;
# guarded by ansible.test.ts).
- name: Drop disabled ClickHouse system log tables (idempotent)
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    docker exec -i {{ clickhouse_container_name }} clickhouse-client \
      --user default --password '{{ _clickhouse_admin_password }}' --multiquery <<EOSQL
    DROP TABLE IF EXISTS system.query_log;
    DROP TABLE IF EXISTS system.trace_log;
    DROP TABLE IF EXISTS system.metric_log;
    DROP TABLE IF EXISTS system.asynchronous_metric_log;
    DROP TABLE IF EXISTS system.session_log;
    DROP TABLE IF EXISTS system.part_log;
    DROP TABLE IF EXISTS system.text_log;
    DROP TABLE IF EXISTS system.error_log;
    DROP TABLE IF EXISTS system.crash_log;
    DROP TABLE IF EXISTS system.query_thread_log;
    DROP TABLE IF EXISTS system.query_views_log;
    DROP TABLE IF EXISTS system.query_metric_log;
    DROP TABLE IF EXISTS system.processors_profile_log;
    DROP TABLE IF EXISTS system.latency_log;
    DROP TABLE IF EXISTS system.backup_log;
    DROP TABLE IF EXISTS system.asynchronous_insert_log;
    DROP TABLE IF EXISTS system.opentelemetry_span_log;
    DROP TABLE IF EXISTS system.blob_storage_log;
    DROP TABLE IF EXISTS system.filesystem_cache_log;
    DROP TABLE IF EXISTS system.filesystem_read_prefetches_log;
    DROP TABLE IF EXISTS system.s3queue_log;
    DROP TABLE IF EXISTS system.background_schedule_pool_log;
    DROP TABLE IF EXISTS system.zookeeper_log;
    DROP TABLE IF EXISTS system.zookeeper_connection_log;
    DROP TABLE IF EXISTS system.aggregated_zookeeper_log;
    EOSQL
  no_log: true
  changed_when: false
