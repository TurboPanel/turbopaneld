---
# Pinned ClickHouse stable (verified 26.5.5.8-stable). Used as the Docker image
# tag (clickhouse/clickhouse-server:<version>); paths.test reads this value.
clickhouse_version: "26.5.5.8"
clickhouse_http_port: 8123
clickhouse_log_dir: "{{ turbopanel_log_dir | default('/var/log/turbopanel') }}/clickhouse"
clickhouse_service_name: turbopanel-clickhouse
# Docker model (mirrors postgres/rabbitmq): official image, named volume, and the
# shared turbopanel bridge network.
clickhouse_image: "clickhouse/clickhouse-server:{{ clickhouse_version }}"
clickhouse_container_name: turbopanel-analytics
clickhouse_volume_name: turbopanel-analytics
turbopanel_docker_network: turbopanel
# Shared dev-identity contract: dev runs the container (and owns its secret files)
# as the single dev uid:gid; managed installs use the reserved 9994 container id
# (reuses the freed turbopanelh number).
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
clickhouse_container_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else '9994' }}"
clickhouse_container_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else '9994' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# Ownership split:
# - Host-read secret/config files (.clickhouse_admin_pass, .clickhouse_app_pass,
#   config.json) are owned by clickhouse_config_owner + turbopanel_group so the
#   dev user (dev) / root + the turbopanel group (prod) — including instance-launch
#   — can read them.
# - The container-read config.d/users.d overlays (config.xml, users.xml) are owned
#   by clickhouse_container_uid:clickhouse_container_gid instead, because the
#   container runs as that id (9994:9994 in prod) and is neither root nor in the
#   turbopanel group after the dedicated turbopanelh account was removed.
# Owner of the generated ClickHouse secret/config files: the dev user in dev, else root.
clickhouse_config_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel
clickhouse_database: turbopanel_metrics
clickhouse_app_user: turbopanel_app
# Low-footprint profile for a one-server metrics workload (co-located / small
# control-plane hosts). Tests in ansible.test.ts pin these ceilings so they
# cannot regress upward unnoticed.
# Mark cache: 64 MiB (was 512 MiB — too large for tiny MergeTree volumes).
clickhouse_mark_cache_size: 67108864
# Absolute server memory cap: 512 MiB (preferred over a RAM-ratio that grows
# with host size).
clickhouse_max_server_memory_usage: 536870912
# Docker runtime caps (inspect drift recreates containers missing these).
# Single source of truth: bytes only — docker run --memory and the drift check
# both use this value so they cannot diverge (ansible.test.ts asserts that).
# 768 MiB
clickhouse_container_memory_bytes: 805306368
clickhouse_container_cpus: "1.0"
clickhouse_container_nanocpus: 1000000000
