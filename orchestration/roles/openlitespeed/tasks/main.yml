---
# Vendors the official litespeedtech/openlitespeed GitHub release tarball —
# never a distro/apt package, never the vendor's own install.sh (which adds
# apt repos, downloads unsigned lsphp/admin_php binaries from
# litespeedtech.com, and provisions a web admin GUI we do not use). We keep
# only the plain HTTP server binary + control script + modules needed for
# site hosting; the bundled admin panel stays out.
#
# PHP is vendored separately as `lsphp` (LSAPI), and only when the daemon passes
# `turbopanel_lsphp_install: true` — OpenLiteSpeed runs PHP as a per-vhost
# external processor under suEXEC rather than through a shared php-fpm pool, so
# there is no pool identity to provision here; the vhost's `extUser`/`extGroup`
# come from the site principal (`src/deploy/site.ts`).
#
# `conf/` inside the versioned tree is replaced with a symlink to the FHS
# config dir so `src/deploy/site.ts` can own httpd_config.conf /
# per-site vhost configs the same way it owns nginx/apache site files,
# without that content living inside (and being lost across) vendor
# version upgrades.
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Check vendored OpenLiteSpeed binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/bin/openlitespeed"
  register: _openlitespeed_pinned

- name: Install OpenLiteSpeed into runtimes directory
  when: not _openlitespeed_pinned.stat.exists
  block:
    - name: Create temp dir for OpenLiteSpeed download
      ansible.builtin.tempfile:
        state: directory
        suffix: ols
      register: _openlitespeed_tmp

    - name: Download OpenLiteSpeed release tarball
      vars:
        openlitespeed_tarball: >-
          openlitespeed-{{ openlitespeed_version }}-{{ ansible_architecture }}-linux.tgz
      ansible.builtin.get_url:
        url: >-
          https://github.com/litespeedtech/openlitespeed/releases/download/{{ openlitespeed_release_tag }}/{{ openlitespeed_tarball }}
        dest: "{{ _openlitespeed_tmp.path }}/openlitespeed.tgz"
        mode: "0640"
        timeout: 120

    - name: Extract OpenLiteSpeed tarball
      ansible.builtin.unarchive:
        src: "{{ _openlitespeed_tmp.path }}/openlitespeed.tgz"
        dest: "{{ _openlitespeed_tmp.path }}"
        remote_src: true

    - name: Create versioned install directory
      ansible.builtin.file:
        path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}"
        state: directory
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0750"

    - name: Install pruned subset of the release tree
      ansible.builtin.copy:
        remote_src: true
        src: "{{ _openlitespeed_tmp.path }}/openlitespeed/{{ item }}"
        dest: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/"
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0750"
        directory_mode: "0750"
      loop:
        - bin
        - modules
        - share
        - VERSION
      loop_control:
        label: "{{ item }}"

    # The pruned copy above omits fcgi-bin, and `copy` to a file dest does not
    # create a missing parent directory (fails: destination directory does not exist).
    - name: Create fcgi-bin directory in the versioned tree
      ansible.builtin.file:
        path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/fcgi-bin"
        state: directory
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0750"

    - name: Install lsperld.fpl only (drop node/ruby fcgi helpers — unused, unvendored runtimes)
      ansible.builtin.copy:
        remote_src: true
        src: "{{ _openlitespeed_tmp.path }}/openlitespeed/fcgi-bin/lsperld.fpl"
        dest: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/fcgi-bin/lsperld.fpl"
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0750"

    - name: Remove temp download dir
      ansible.builtin.file:
        path: "{{ _openlitespeed_tmp.path }}"
        state: absent

# Outside the first-install block on purpose: a host upgraded over an older
# vendored tree skips the install above. OpenLiteSpeed writes these relative to
# its server root (they are not config-relocatable) and fails to serve without
# them. LSAPI sockets do not live here: `uds://tmp/…` resolves to the host /tmp,
# so the vhosts name an absolute path under the unit's RuntimeDirectory.
- name: Ensure writable server-root-relative runtime dirs
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/{{ item }}"
    state: directory
    owner: "{{ openlitespeed_service_user }}"
    group: "{{ openlitespeed_service_group }}"
    mode: "0750"
  loop:
    - cachedata
    - autoupdate
    - tmp
    - tmp/ocspcache

# Outside the first-install block on purpose: a host upgraded over an older
# vendored 1.9.1 tree skips the install above and would never get the link,
# leaving lswsctrl ("Cannot find .../bin/litespeed") crash-looping the service.
- name: Re-check vendored OpenLiteSpeed binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/bin/openlitespeed"
    follow: false
  register: _openlitespeed_bin

- name: Assert vendored OpenLiteSpeed binary is a regular file
  ansible.builtin.assert:
    that:
      - _openlitespeed_bin.stat.exists
      - _openlitespeed_bin.stat.isreg
    fail_msg: >-
      {{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/bin/openlitespeed
      is missing or not a regular file; refusing to link litespeed to it.

- name: Create litespeed exec name expected by lswsctrl
  ansible.builtin.file:
    src: "openlitespeed"
    dest: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/bin/litespeed"
    state: link
    follow: false
    force: true
    owner: root
    group: "{{ turbopanel_group }}"

- name: Harden OpenLiteSpeed binary permissions
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/bin/{{ item }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"
  loop:
    - openlitespeed
    - lswsctrl

# lsphp is vendored only when a site actually needs it — a static-only host
# never downloads a PHP interpreter. Layout mirrors every other vendored
# runtime: `vendor/lsphp/<series>/<version>/` + a `current` symlink, so a patch
# bump is a defaults edit and the generated vhosts never change.
- name: Vendor lsphp (LSAPI PHP) for OpenLiteSpeed vhosts
  when: turbopanel_lsphp_install | default(false) | bool
  ansible.builtin.include_tasks: lsphp-series.yml
  loop: >-
    {{
      openlitespeed_lsphp_versions
      | map('trim') | reject('equalto', '') | unique | list
    }}
  loop_control:
    loop_var: lsphp_series

- name: Ensure FHS config dirs for OpenLiteSpeed (sites + vhosts)
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/openlitespeed/{{ item }}"
    state: directory
    owner: root
    group: "{{ openlitespeed_service_group }}"
    mode: "0750"
  loop:
    - ""
    - sites
    - vhosts

# Root-owned with the engine's group, like every engine config tree since #191:
# the daemon writes it only through tp-host. An install or upgrade that chowns
# the whole config dir to the daemon account leaves this tree `tp:tp`, which
# tpols cannot read; ownership only (the daemon sets each file's mode).
- name: Keep the OpenLiteSpeed config tree root-owned
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/openlitespeed"
    state: directory
    owner: root
    group: "{{ openlitespeed_service_group }}"
    recurse: true

# Shipped with the role (the v1.9.1 release's conf/mime.properties), so a host
# whose vendored tree predates this task still gets it without a re-download.
- name: Install OpenLiteSpeed mime.properties
  ansible.builtin.copy:
    src: mime.properties
    dest: "{{ turbopanel_config_dir }}/openlitespeed/mime.properties"
    owner: root
    group: "{{ openlitespeed_service_group }}"
    mode: "0640"

- name: Ensure OpenLiteSpeed log directory
  ansible.builtin.file:
    path: "{{ turbopanel_log_dir }}/openlitespeed"
    state: directory
    owner: "{{ openlitespeed_service_user }}"
    group: "{{ openlitespeed_service_group }}"
    mode: "0750"

- name: Ensure OpenLiteSpeed persistent state directories (pidfile + swap)
  ansible.builtin.file:
    path: "{{ turbopanel_state_dir }}/openlitespeed/{{ item }}"
    state: directory
    owner: "{{ openlitespeed_service_user }}"
    group: "{{ openlitespeed_service_group }}"
    mode: "0750"
  loop:
    - ""
    - swap

# The unit's RuntimeDirectory creates this at start; a server that is already
# running when the unit first gains it is only reloaded, so create it now too.
- name: Ensure OpenLiteSpeed LSAPI socket directory
  ansible.builtin.file:
    path: /run/turbopanel-ols
    state: directory
    owner: "{{ openlitespeed_service_user }}"
    group: "{{ openlitespeed_service_group }}"
    mode: "0750"

- name: Install turbopanel-openlitespeed systemd unit
  ansible.builtin.template:
    src: turbopanel-openlitespeed.service.j2
    dest: /etc/systemd/system/turbopanel-openlitespeed.service
    owner: root
    group: root
    mode: "0640"
  register: _openlitespeed_unit

- name: Reload systemd after unit change
  ansible.builtin.systemd:
    daemon_reload: true
  when: _openlitespeed_unit.changed # noqa: no-handler

- name: Point versioned conf/ at the FHS config dir (decouple config from version upgrades)
  ansible.builtin.file:
    src: "{{ turbopanel_config_dir }}/openlitespeed"
    dest: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}/conf"
    state: link
    force: true

- name: Point OpenLiteSpeed current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_vendor_dir }}/openlitespeed/{{ openlitespeed_version }}"
    dest: "{{ turbopanel_vendor_dir }}/openlitespeed/current"
    state: link
    force: true
