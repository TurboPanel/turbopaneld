# Shared libraries the pinned packages declare in `Depends:`. `dpkg-deb -x`
# never resolves dependencies, and lsphp will not start without these (the
# extension .so files only add libcurl). Distro libraries, not PHP.
openlitespeed_lsphp_runtime_packages:
  bookworm: [libargon2-1, libbz2-1.0, libcurl4, libedit2, libenchant-2-2, libfreetype6,
             libgmp10, libjpeg62-turbo, libmagic1, libonig5, libpng16-16, libsodium23,
             libssl3, libwebp7, libxml2, libxpm4, libxslt1.1, libzip4, zlib1g]
  trixie: [libargon2-1, libbz2-1.0, libcurl4t64, libedit2, libenchant-2-2, libfreetype6,
           libgmp10, libjpeg62-turbo, libmagic1, libonig5, libpng16-16t64, libsodium23,
           libssl3t64, libwebp7, libxml2, libxpm4, libxslt1.1, libzip5, zlib1g]

# Extensions the pinned packages ship. The package postinst scripts would
# enable these under /usr/local/lsws/…; an extracted tree has no postinst, so
# the role writes them into the relocated php.ini instead.
openlitespeed_lsphp_ini_extensions:
  - zend_extension=opcache.so
  - extension=curl.so
  - extension=mysqli.so
  - extension=pdo_mysql.so

# Back-compat alias for callers that still pass a single series.
openlitespeed_lsphp_series: "{{ openlitespeed_lsphp_default_series }}"

# FHS mutable paths — decoupled from the vendored (read-mostly) tree via
# symlinks so `current` can be repointed at a new version without losing
# config/logs. Daemon TypeScript (src/deploy/site.ts) owns the
# actual file contents under turbopanel_config_dir/openlitespeed.
turbopanel_config_dir: "/etc/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_log_dir: "/var/log/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_state_dir: "/var/lib/turbopanel"  # noqa: var-naming[no-role-prefix]
