---
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"  # noqa: var-naming[no-role-prefix]
# Pinned to the litespeedtech/openlitespeed GitHub release tag/asset naming.
openlitespeed_version: "1.9.1"
openlitespeed_release_tag: "v1.9.1"
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"  # noqa: var-naming[no-role-prefix]

# Service identity (must match web-service-user's openlitespeed entry).
openlitespeed_service_user: tpols
openlitespeed_service_group: tpols

# LSAPI PHP (`lsphp`) for OpenLiteSpeed vhosts. Vendored the same way the base
# server is: extracted with `dpkg-deb -x` from litespeedtech's own Debian pool
# (same pattern as the nginx/redis roles) — never `apt install lsphp*`, which
# would add their apt repo, and never the vendor install.sh.
#
# OpenLiteSpeed does not use php-fpm: each vhost execs its own `lsphp` under
# suEXEC. The *series* must still stay in step with `php_fpm_series` and
# `PINNED_LSPHP_SERIES` in `../src/deploy/traditional-web.ts` — one PHP version
# per host across all three engines is a product rule, not a technical one.
# Only vendored when the daemon passes `turbopanel_lsphp_install: true`.
openlitespeed_lsphp_series: "8.4"
openlitespeed_lsphp_version: "8.4.13"
# Pool directory + package basename (litespeedtech drops the dot from the series).
openlitespeed_lsphp_pkg: "lsphp84"
openlitespeed_lsphp_deb_version: "8.4.13-1+bookworm"
openlitespeed_lsphp_repo_base: "https://rpms.litespeedtech.com/debian/pool/main/l"
# The interpreter plus the extensions a hosting PHP site is expected to have.
# All ship from the same source package pool at the same version pin.
openlitespeed_lsphp_packages:
  - lsphp84
  - lsphp84-common
  - lsphp84-mysql
  - lsphp84-opcache
  - lsphp84-curl

# FHS mutable paths — decoupled from the vendored (read-mostly) tree via
# symlinks so `current` can be repointed at a new version without losing
# config/logs. Daemon TypeScript (src/deploy/traditional-web.ts) owns the
# actual file contents under turbopanel_config_dir/openlitespeed.
turbopanel_config_dir: "/etc/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_log_dir: "/var/log/turbopanel"  # noqa: var-naming[no-role-prefix]
turbopanel_state_dir: "/var/lib/turbopanel"  # noqa: var-naming[no-role-prefix]
