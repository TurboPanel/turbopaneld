  "lsphp85_8.5.11-1+bookworm_amd64.deb": "21736cb4758ec7a1662b5b4429aa75c5993f3cdb8d4b32a56e720a44c85a149d"
  "lsphp85_8.5.11-1+bookworm_arm64.deb": "110ae62b742dafc6871468ce55cb24f71fb38ac8ac35f80227a3e2d1120904ea"
  "lsphp85_8.5.11-1+trixie_amd64.deb": "8ac52d849d75606101d8af76ad8ae38ada6b51c5826bc9cb485871b5ee81f936"
