---
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"  # noqa: var-naming[no-role-prefix]
# Pinned to the litespeedtech/openlitespeed GitHub release tag/asset naming.
openlitespeed_version: "1.9.1"
openlitespeed_release_tag: "v1.9.1"
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"  # noqa: var-naming[no-role-prefix]

# Service identity (must match web-service-user's openlitespeed entry).
openlitespeed_service_user: tpols
openlitespeed_service_group: tpols

# LSAPI PHP (`lsphp`) for OpenLiteSpeed vhosts. Vendored the same way the base
# server is: extracted with `dpkg-deb -x` from litespeedtech's own Debian pool
# (same pattern as the nginx/redis roles) — never `apt install lsphp*`, which
# would add their apt repo, and never the vendor install.sh.
#
# OpenLiteSpeed does not use php-fpm: each vhost execs its own `lsphp` under
# suEXEC. Several series can be vendored side by side — `vendor/lsphp/<series>/`
# already had the right shape — and the daemon passes the distinct series a
# deploy declared. Only vendored when `turbopanel_lsphp_install: true`.
#
# Per-series data lives in a map because a series needs more than a version
# string here: the role builds a `.deb` URL from the package basename and the
# version, and litespeedtech drops the dot from the series in both. The pool is
# per Debian suite (`pool/main/<suite>/`), and a bookworm build does not run on
# trixie (it links libzip.so.4), so the suite follows the host release.
openlitespeed_lsphp_default_series: "8.4"
openlitespeed_lsphp_versions: ["{{ openlitespeed_lsphp_default_series }}"]
openlitespeed_lsphp_repo_base: "https://rpms.litespeedtech.com/debian/pool/main"
openlitespeed_lsphp_suite: "{{ ansible_facts['distribution_release'] | default('') }}"
openlitespeed_lsphp_deb_revision: "1"
openlitespeed_lsphp_series_map:
  "8.3":
    version: "8.3.33"
    pkg: lsphp83
    packages: [lsphp83, lsphp83-common, lsphp83-mysql, lsphp83-opcache, lsphp83-curl]
    # Architecture-independent packages (`_all.deb`).
    arch_all: [lsphp83-common]
  "8.4":
    version: "8.4.25"
    pkg: lsphp84
    packages: [lsphp84, lsphp84-common, lsphp84-mysql, lsphp84-opcache, lsphp84-curl]
    arch_all: [lsphp84-common]

