---
turbopanel_install_root: /opt/turbopanel
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_vendor_dir }}/node/current/bin/node"
turbopanel_deno: "{{ turbopanel_vendor_dir }}/deno/current/deno"
turbopanel_runtime_path: "{{ turbopanel_vendor_dir }}/node/current/bin:{{ turbopanel_vendor_dir }}/deno/current:{{ turbopanel_vendor_dir }}/caddy/current:/usr/bin:/bin"
turbopanel_ui_dir: "{{ (turbopanel_dev_root ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
turbopanel_state_dir: /var/lib/turbopanel
# UI build runtime state (HOME / caches) lives under the FHS UI state location
# (matches the instance-launch role) so dev builds never write runtime state back
# into the checkout.
turbopanel_ui_runtime_dir: "{{ turbopanel_state_dir }}/ui/.local"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpctrl' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
# Production default is static; co-located converge passes -e turbopanel_ui_mode=dev.
turbopanel_ui_mode: static
# Static UI export dir: always the shared FHS location served by Caddy.
turbopanel_ui_dist_dir: /opt/turbopanel/share/ui
turbopanel_ui_artifact_url: ""
force_build: false

# Development export (a dev user is set, the UI comes from source): the export
# is built in development mode (`expo export --dev`) so development-only
# tooling such as the React Query devtools is in the bundle. It replaces the
# Expo dev server (2-4 GiB of RAM) on a small dev guest, so the build itself is
# bounded to fit a 4 GiB guest next to the rest of the stack:
#   - two bundler workers (each is a Node process of a few hundred MiB; the
#     default is one per CPU, which can exceed 4 GiB on a many-core host);
#   - a 1536 MiB old-space cap on the main Node process, enough for the web
#     bundle graph, low enough that a runaway build fails instead of swapping.
# Raise both on a larger guest. Production exports ignore these.
turbopanel_ui_export_dev: "{{ turbopanel_dev_user | default('') | length > 0 }}"
turbopanel_ui_export_max_workers: 2
turbopanel_ui_export_node_heap_mb: 1536
# Source paths (relative to the UI checkout) newer than the published export
# make it stale. A development export also watches the lockfile, the package
# manifest and the bundler config, which change what is in the bundle.
turbopanel_ui_export_sources: "src app.json babel.config.cjs tsconfig.json"
turbopanel_ui_export_dev_sources: "{{ turbopanel_ui_export_sources }} app.config.ts metro.config.js global.css package.json pnpm-lock.yaml assets public"
# Written beside the exported files (inside the published directory, so it is
# replaced with them) by a development export only; a production export never
# has it. Its text is the export mode, so a switch between the two is detected.
turbopanel_ui_export_marker: "{{ turbopanel_ui_dist_dir }}/.turbopanel-export-mode"
