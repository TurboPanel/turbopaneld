---
turbopanel_install_root: /opt/turbopanel
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_vendor_dir }}/node/current/bin/node"
turbopanel_deno: "{{ turbopanel_vendor_dir }}/deno/current/deno"
turbopanel_runtime_path: "{{ turbopanel_vendor_dir }}/node/current/bin:{{ turbopanel_vendor_dir }}/deno/current:{{ turbopanel_vendor_dir }}/caddy/current:/usr/bin:/bin"
turbopanel_ui_dir: "{{ (turbopanel_dev_root ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
turbopanel_state_dir: /var/lib/turbopanel
# UI build runtime state (HOME / caches) lives under the FHS UI state location
# (matches the instance-launch role) so dev builds never write runtime state back
# into the checkout.
turbopanel_ui_runtime_dir: "{{ turbopanel_state_dir }}/ui/.local"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopaneli' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
turbopanel_ui_mode: dev
# Static UI export dir: always the shared FHS location served by Caddy.
turbopanel_ui_dist_dir: /opt/turbopanel/share/ui
turbopanel_ui_artifact_url: ""
force_build: false
