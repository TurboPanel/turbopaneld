---
- name: Ensure UI build runtime state directory exists
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.file:
    path: "{{ turbopanel_ui_runtime_dir }}"
    state: directory
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"

# A development export is built from source only: a downloaded export is always
# a production build.
- name: Decide the UI export mode
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.set_fact:
    _ui_export_dev: "{{ (turbopanel_ui_export_dev | bool) and turbopanel_ui_artifact_url | length == 0 }}"

- name: Check UI static export
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.stat:
    path: "{{ turbopanel_ui_dist_dir }}/index.html"
  register: _ui_dist_index

- name: Check UI export mode marker
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.slurp:
    src: "{{ turbopanel_ui_export_marker }}"
  register: _ui_export_marker_file
  failed_when: false

- name: Check if UI sources are newer than static export
  when:
    - turbopanel_ui_mode == 'static'
    - not (force_build | bool)
    - _ui_dist_index.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    cd "{{ turbopanel_ui_dir }}"
    find {{ turbopanel_ui_export_dev_sources if _ui_export_dev | bool else turbopanel_ui_export_sources }} -newer "{{ turbopanel_ui_dist_dir }}/index.html" -print -quit 2>/dev/null || true
  register: _ui_stale_check
  changed_when: false

# No marker means a production export; only a development export writes one.
- name: Decide whether the UI export must be redone
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.set_fact:
    _ui_export_rebuild: >-
      {{
        (force_build | bool)
        or not _ui_dist_index.stat.exists
        or (_ui_stale_check.stdout | default('') | trim | length > 0)
        or ((_ui_export_marker_file.content | default('') | b64decode | trim
             if _ui_export_marker_file.content is defined else 'production')
            != ('development' if _ui_export_dev | bool else 'production'))
      }}

- name: Build UI static export locally
  when:
    - turbopanel_ui_mode == 'static'
    - turbopanel_ui_artifact_url | length == 0
    - _ui_export_rebuild | bool
  ansible.builtin.command:
    argv: "{{ _ui_export_argv }}"
    chdir: "{{ turbopanel_ui_dir }}"
  become_user: "{{ turbopanel_user }}"
  environment: "{{ _ui_export_environment }}"
  vars:
    _ui_export_argv: >-
      {{
        ['pnpm', 'exec', 'expo', 'export', '--platform', 'web', '--dev',
         '--max-workers', turbopanel_ui_export_max_workers | string]
        if _ui_export_dev | bool else ['pnpm', 'export']
      }}
    _ui_export_environment: >-
      {{
        {'HOME': turbopanel_ui_runtime_dir, 'PATH': turbopanel_runtime_path}
        | combine({'NODE_OPTIONS': '--max-old-space-size=' ~ turbopanel_ui_export_node_heap_mb}
                  if _ui_export_dev | bool else {})
      }}
  register: _ui_local_build

- name: Publish locally-built UI export to the FHS static dir
  when:
    - turbopanel_ui_mode == 'static'
    - _ui_local_build is defined
    - _ui_local_build is changed
  ansible.builtin.shell: |
    set -euo pipefail
    rm -rf "{{ turbopanel_ui_dist_dir }}"
    mkdir -p "{{ turbopanel_ui_dist_dir }}"
    cp -a "{{ turbopanel_ui_dir }}/dist/." "{{ turbopanel_ui_dist_dir }}/"
  register: _ui_local_publish
  changed_when: true

- name: Mark the published UI export as a development export
  when:
    - turbopanel_ui_mode == 'static'
    - _ui_local_publish is defined
    - _ui_local_publish is changed
    - _ui_export_dev | bool
  ansible.builtin.copy:
    content: "development\n"
    dest: "{{ turbopanel_ui_export_marker }}"
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Download UI static export from CDN
  when:
    - turbopanel_ui_mode == 'static'
    - turbopanel_ui_artifact_url | length > 0
    - _ui_export_rebuild | bool
  ansible.builtin.shell: |
    set -euo pipefail
    TMP="$(mktemp -d)"
    curl -fsSL -o "$TMP/ui.tar.gz" "{{ turbopanel_ui_artifact_url }}"
    rm -rf "{{ turbopanel_ui_dist_dir }}"
    mkdir -p "{{ turbopanel_ui_dist_dir }}"
    tar -xzf "$TMP/ui.tar.gz" --no-same-owner -C "{{ turbopanel_ui_dist_dir }}"
    rm -rf "$TMP"
  register: _ui_cdn_build

- name: Ensure UI dist directory ownership
  when: turbopanel_ui_mode == 'static'
  ansible.builtin.file:
    path: "{{ turbopanel_ui_dist_dir }}"
    state: directory
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"
    # The directory only, never its contents: the tree is group-tp writable, so
    # a root walk would chown whatever a tp member swapped in. The publish steps
    # above already leave the files readable (the cp -a keeps the build user's
    # owner, the CDN tar extracts as root) and the instance only reads them.
    follow: false
