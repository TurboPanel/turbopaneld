---
# Installs php-fpm + extensions from Ondřej Surý's Debian repo
# (packages.sury.org/php) — never Debian's own `php*` packages, and no longer a
# source build into the vendor tree. See defaults/main.yml for why php-fpm is
# the one component exempt from the vendoring rule.
#
# TurboPanel still owns the runtime: sury's `php8.4-fpm.service` is masked and
# `turbopanel-php-fpm@<series>` runs sury's binary against *our* php-fpm.conf and
# *our* pool directory, so every path the daemon writes to
# (`src/deploy/site.ts`) is unchanged from the source-build era.
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Assert a Debian suite sury publishes for
  ansible.builtin.assert:
    that:
      - ansible_distribution_release | default('') | length > 0
    fail_msg: >-
      Could not resolve the Debian suite for the sury repo. Set
      php_fpm_sury_suite explicitly.

- name: Install apt transport prerequisites for the sury repo
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      # The repo-key role reads the signing key with gpg.
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

# Key policy (php_fpm_key_policy: warn | enforce | bundled): fetched from sury
# over HTTPS, with the copy in files/sury-php.gpg as the fallback. See
# roles/repo-key. A key outside the fingerprint list is used with a loud WARN
# under `warn`, and stops the run under `enforce`.
# role_path must be resolved HERE: a vars value passed to include_role is
# evaluated lazily inside repo-key, where role_path is repo-key's own directory.
- name: Locate the sury signing key shipped with the role
  ansible.builtin.set_fact:
    _php_fpm_key_bundled: "{{ role_path }}/files/sury-php.gpg"

- name: Install the sury repository signing key
  ansible.builtin.include_role:
    name: repo-key
  vars:
    repo_key_name: sury-php
    repo_key_url: "{{ php_fpm_sury_key_url }}"
    repo_key_bundled: "{{ _php_fpm_key_bundled }}"
    repo_key_dest: "{{ php_fpm_sury_keyring_path }}"
    repo_key_fingerprints: "{{ php_fpm_sury_key_fingerprints }}"
    repo_key_policy: "{{ php_fpm_key_policy }}"

- name: Remove any legacy sury sources.list entry
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/sury-php.list
    state: absent

# deb822 format with an explicit Signed-By — apt-key and `[signed-by=]` one-liners
# are both deprecated.
- name: Configure sury PHP apt repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/sury-php.sources
    owner: root
    group: root
    # Apt only reads this as root. The list names a public repo and its
    # signing key file — no secret — but a site owner does not need to read it.
    mode: "0640"
    content: |
      Types: deb
      URIs: {{ php_fpm_sury_repo_url }}
      Suites: {{ php_fpm_sury_suite }}
      Components: main
      Signed-By: {{ php_fpm_sury_keyring_path }}
  register: _sury_repo

- name: Refresh apt cache after sury repo or key change
  ansible.builtin.apt:
    update_cache: true
  when: >- # noqa: no-handler
    _sury_repo.changed
    or (repo_key_changed | default(false)) | bool

# One template for every series: `%i` is the series. Installed once, before the
# loop, because `systemctl enable turbopanel-php-fpm@8.4` needs the template to
# already exist.
- name: Install turbopanel-php-fpm@ systemd unit template
  ansible.builtin.template:
    src: turbopanel-php-fpm@.service.j2
    dest: /etc/systemd/system/turbopanel-php-fpm@.service
    owner: root
    group: root
    mode: "0640"
  register: _php_fpm_unit

- name: Reload systemd after php-fpm unit template change
  ansible.builtin.systemd:
    daemon_reload: true
  when: _php_fpm_unit.changed # noqa: no-handler

# Parent of the per-series socket directories. Grouped to `tp` so every engine
# account can traverse to its own series' sockets.
- name: Ensure the PHP runtime directory root
  ansible.builtin.file:
    path: "{{ turbopanel_run_dir }}/php"
    state: directory
    owner: "{{ php_fpm_service_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

# Loaded before the series loop (series.yml reads `builtinExtensions`).
- name: Load the shared runtime registry
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../runtime-registry.json"
    name: runtime_registry

# Every installed PHP series may be run by every site owner's Linux user: the
# packaged binaries stay root:root 0755. This also drops the dpkg-statoverride
# entries and groups older releases used to restrict them per version.
- name: Remove what the old per-version PHP groups left behind
  ansible.builtin.include_role:
    name: runtime-access

- name: Install and configure each requested PHP series
  ansible.builtin.include_tasks: series.yml
  loop: "{{ php_fpm_versions | map('trim') | reject('equalto', '') | unique | list }}"
  loop_control:
    loop_var: php_fpm_series_item

# Left over from the single-series layout, where config lived directly under
# `php/` and the unit was not templated. Removed so a host converged before
# multi-version does not keep a second, unmanaged master around.
- name: Remove obsolete single-series php-fpm layout
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/turbopanel-php-fpm.service
    - "{{ turbopanel_config_dir }}/php/php-fpm.conf"
    - "{{ turbopanel_config_dir }}/php/php.ini"
    - "{{ turbopanel_config_dir }}/php/pools"
    - "{{ turbopanel_config_dir }}/php/conf.d"

# /usr/local/bin precedes /usr/bin in Debian's default PATH, so this shadows
# sury's `update-alternatives` link for `php` without removing it. Removing the
# link would break every other package that expects `php` to exist.
- name: Install the PHP shell dispatcher
  ansible.builtin.template:
    src: php-dispatcher.sh.j2
    dest: /usr/local/bin/php
    owner: root
    group: root
    # Owner and group bits only: the "other" bits belong to the ACL below, and
    # a full octal mode would wipe it on every run.
    mode: "u=rwx,g=rx"

# Every site owner's Linux user may run every installed PHP series, so every
# account may run the dispatcher too. An `other` ACL entry rather than a 0755
# mode, the same way the vendored runtime trees are opened (ansible:S2612).
- name: Let every account run the PHP shell dispatcher
  ansible.posix.acl:
    path: /usr/local/bin/php
    etype: other
    permissions: rx
    state: present

# Root-owned per-account series pins. `/etc/turbopanel` is already 0750, so a
# world bit here never reached a tenant. Root-writable only: a tenant must not
# be able to author or alter a pin (and the dispatcher only selects from the
# series installed here).
- name: Ensure the PHP pin directory
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/php/pins"
    state: directory
    owner: root
    group: root
    mode: "0750"
