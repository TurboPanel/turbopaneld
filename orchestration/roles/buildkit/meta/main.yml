galaxy_info:
  author: turbopanel
  description: >-
    Vendor pinned BuildKit (buildkitd/buildctl) and the Railpack CLI into the
    shared runtimes directory so environment.deploy can build an OCI image from
    a Git source without a Dockerfile. Requires 64-bit Linux (aarch64 or
    x86_64) and a working container runtime.
  license: AGPL-3.0
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - all

dependencies: []
