---
- name: Ensure daemon log directory exists
  ansible.builtin.file:
    path: "{{ daemon_log_dir }}"
    state: directory
    owner: "{{ daemon_log_owner }}"
    group: "{{ daemon_log_group }}"
    mode: "{{ daemon_log_dir_mode }}"

- name: Ensure daemon log files exist for systemd append
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: "{{ daemon_log_owner }}"
    group: "{{ daemon_log_group }}"
    mode: "0640"
  loop:
    - "{{ daemon_log_dir }}/daemon.log"
    - "{{ daemon_log_dir }}/daemon.err.log"
