---
# Per-service runtime state inside git checkouts (.local / .config are gitignored).
# The daemon (9999) keeps its own state under /opt/turbopanel via passwd HOME.
- name: Ensure checkout-local runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"
  loop: >-
    {{
      [
        turbopanel_instance_runtime_dir,
        turbopanel_instance_runtime_dir + '/share',
        turbopanel_instance_runtime_dir + '/state',
        turbopanel_ui_runtime_dir,
        turbopanel_ui_runtime_dir + '/share',
        turbopanel_ui_runtime_dir + '/state',
        turbopanel_instance_config_dir,
        turbopanel_ui_config_dir,
      ]
      + (
        [
          turbopanel_ui_dir + '/.expo',
          turbopanel_website_dir + '/.next',
          turbopanel_website_dir + '/.source',
          turbopanel_website_runtime_dir,
          turbopanel_website_runtime_dir + '/share',
          turbopanel_website_runtime_dir + '/state',
          turbopanel_website_config_dir,
        ]
        if (turbopanel_dev_user | default('') | length > 0)
        else []
      )
    }}

- name: Ensure Caddy runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ caddy_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"
  loop:
    - "{{ turbopanel_caddy_runtime_dir }}"
    - "{{ turbopanel_caddy_runtime_dir }}/share"
    - "{{ turbopanel_caddy_runtime_dir }}/state"
    - "{{ turbopanel_caddy_config_dir }}"

# Upgraded hosts may still have nested XDG state owned by tpctrl from before the
# tpcaddy unit user switch; migrate ownership without forcing file modes.
- name: Migrate existing Caddy XDG subtree ownership to caddy user
  ansible.builtin.file:
    path: "{{ item }}"
    owner: "{{ caddy_user }}"
    group: "{{ turbopanel_group }}"
    recurse: true
  loop:
    - "{{ turbopanel_caddy_runtime_dir }}"
    - "{{ turbopanel_caddy_config_dir }}"
