---
# Per-service runtime state inside git checkouts (.local / .config are gitignored).
# The daemon (9999) keeps its own state under /opt/turbopanel via passwd HOME.
- name: Ensure checkout-local runtime directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"
  loop:
    - "{{ turbopanel_instance_runtime_dir }}"
    - "{{ turbopanel_instance_runtime_dir }}/share"
    - "{{ turbopanel_instance_runtime_dir }}/state"
    - "{{ turbopanel_ui_runtime_dir }}"
    - "{{ turbopanel_ui_runtime_dir }}/share"
    - "{{ turbopanel_ui_runtime_dir }}/state"
    - "{{ turbopanel_instance_config_dir }}"
    - "{{ turbopanel_caddy_config_dir }}"
    - "{{ turbopanel_ui_config_dir }}"

- name: Migrate Caddy data from legacy platform runtime dir
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/caddy/share/caddy
      {{ turbopanel_instance_runtime_dir }}/share/caddy
  args:
    creates: "{{ turbopanel_instance_runtime_dir }}/share/caddy"
    removes: "{{ turbopanel_platform_runtime_dir }}/caddy/share/caddy"

- name: Migrate Caddy data from legacy platform share root
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/share/caddy
      {{ turbopanel_instance_runtime_dir }}/share/caddy
  args:
    creates: "{{ turbopanel_instance_runtime_dir }}/share/caddy"
    removes: "{{ turbopanel_platform_runtime_dir }}/share/caddy"

- name: Migrate pnpm share data from legacy platform UI runtime dir
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/ui/share/pnpm
      {{ turbopanel_ui_runtime_dir }}/share/pnpm
  args:
    creates: "{{ turbopanel_ui_runtime_dir }}/share/pnpm"
    removes: "{{ turbopanel_platform_runtime_dir }}/ui/share/pnpm"

- name: Migrate pnpm share data from legacy platform share root
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/share/pnpm
      {{ turbopanel_ui_runtime_dir }}/share/pnpm
  args:
    creates: "{{ turbopanel_ui_runtime_dir }}/share/pnpm"
    removes: "{{ turbopanel_platform_runtime_dir }}/share/pnpm"

- name: Migrate pnpm state from legacy platform UI runtime dir
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/ui/state/pnpm
      {{ turbopanel_ui_runtime_dir }}/state/pnpm
  args:
    creates: "{{ turbopanel_ui_runtime_dir }}/state/pnpm"
    removes: "{{ turbopanel_platform_runtime_dir }}/ui/state/pnpm"

- name: Migrate pnpm state from legacy platform state root
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/state/pnpm
      {{ turbopanel_ui_runtime_dir }}/state/pnpm
  args:
    creates: "{{ turbopanel_ui_runtime_dir }}/state/pnpm"
    removes: "{{ turbopanel_platform_runtime_dir }}/state/pnpm"

- name: Migrate Expo runtime from legacy platform UI runtime dir
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.command:
    cmd: >-
      mv {{ turbopanel_platform_runtime_dir }}/ui/.expo
      {{ turbopanel_ui_runtime_dir }}/.expo
  args:
    creates: "{{ turbopanel_ui_runtime_dir }}/.expo"
    removes: "{{ turbopanel_platform_runtime_dir }}/ui/.expo"

- name: Remove empty legacy platform runtime dirs
  ansible.builtin.command:
    cmd: rmdir {{ item }}
  loop:
    - "{{ turbopanel_platform_runtime_dir }}/ui/state"
    - "{{ turbopanel_platform_runtime_dir }}/ui/share"
    - "{{ turbopanel_platform_runtime_dir }}/ui"
    - "{{ turbopanel_platform_runtime_dir }}/caddy/state"
    - "{{ turbopanel_platform_runtime_dir }}/caddy/share"
    - "{{ turbopanel_platform_runtime_dir }}/caddy"
    - "{{ turbopanel_platform_runtime_dir }}/instance/state"
    - "{{ turbopanel_platform_runtime_dir }}/instance/share"
    - "{{ turbopanel_platform_runtime_dir }}/instance"
    - "{{ turbopanel_platform_runtime_dir }}/share"
    - "{{ turbopanel_platform_runtime_dir }}/state"
    - "{{ turbopanel_platform_runtime_dir }}"
  changed_when: false
  failed_when: false
