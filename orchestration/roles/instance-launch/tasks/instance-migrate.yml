---
# Fresh databases are bootstrapped only via versioned `pnpm migrate`
# (scripts/bootstrap-dev-db.sh → drizzle-kit migrate against migrations/).
# There is no drizzle-kit push / schema.ts push path for first boot.
- name: Resolve instance database URL for migrations (workers)
  when:
    - instance_start | default(true) | bool
    - turbopanel_pg_password is defined
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
  ansible.builtin.set_fact:
    _instance_migrate_database_url: >-
      postgresql://{{ postgres_user }}:{{ turbopanel_pg_password }}@localhost:{{ postgres_port }}/{{ postgres_db }}

- name: Resolve instance database URL for migrations (deno socket)
  when:
    - instance_start | default(true) | bool
    - turbopanel_pg_password is defined
    - (turbopanel_instance_runtime | default('deno')) != 'workers'
  ansible.builtin.set_fact:
    _instance_migrate_database_url: >-
      postgresql://{{ postgres_user }}:{{ turbopanel_pg_password }}@/{{ postgres_db }}?host={{ postgres_socket_dir }}

- name: Apply versioned instance database migrations
  when:
    - instance_start | default(true) | bool
    - turbopanel_pg_password is defined
  ansible.builtin.command:
    argv: ["{{ turbopanel_instance_dir }}/scripts/bootstrap-dev-db.sh"]
    chdir: "{{ turbopanel_instance_dir }}"
  become: true
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
    PATH: "{{ turbopanel_runtime_path }}"
    TURBOPANEL_DATABASE_URL: "{{ _instance_migrate_database_url }}"
    CI: "true"
  register: _instance_db_bootstrap
  changed_when: >-
    'empty database' in (_instance_db_bootstrap.stdout | default(''))
    or 'Applying migration' in (_instance_db_bootstrap.stdout | default(''))
