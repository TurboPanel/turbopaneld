---
# Fresh Postgres has no tables; incremental migrations/ assume a base schema.
# Push schema.ts on first boot, otherwise apply pending SQL migrations.
- name: Resolve instance database URL for migrations
  when:
    - instance_start | default(true) | bool
    - turbopanel_pg_password is defined
  ansible.builtin.set_fact:
    _instance_migrate_database_url: "{% if (turbopanel_instance_runtime | default('deno')) == 'workers' %}postgresql://{{ postgres_user }}:{{ turbopanel_pg_password }}@localhost:{{ postgres_port }}/{{ postgres_db }}{% else %}postgresql://{{ postgres_user }}:{{ turbopanel_pg_password }}@/{{ postgres_db }}?host={{ postgres_socket_dir }}{% endif %}"

- name: Bootstrap instance database schema
  when:
    - instance_start | default(true) | bool
    - turbopanel_pg_password is defined
  ansible.builtin.command:
    argv: ["{{ turbopanel_instance_dir }}/scripts/bootstrap-dev-db.sh"]
    chdir: "{{ turbopanel_instance_dir }}"
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
    PATH: "{{ turbopanel_runtime_path }}"
    TURBOPANEL_DATABASE_URL: "{{ _instance_migrate_database_url }}"
    CI: "true"
  register: _instance_db_bootstrap
  changed_when: >-
    'empty database' in (_instance_db_bootstrap.stdout | default(''))
    or 'Applying migration' in (_instance_db_bootstrap.stdout | default(''))
