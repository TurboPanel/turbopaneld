---
- name: Ensure shared platform runtime directories
  ansible.builtin.import_tasks: platform-runtime-dirs.yml

- name: Install instance systemd unit
  ansible.builtin.template:
    src: turbopanel-instance.service.j2
    dest: "/etc/systemd/system/{{ instance_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Install Caddy systemd unit
  ansible.builtin.template:
    src: turbopanel-caddy.service.j2
    dest: "/etc/systemd/system/{{ caddy_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel caddy

- name: Install UI (Expo) systemd unit
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.template:
    src: turbopanel-ui.service.j2
    dest: "/etc/systemd/system/{{ ui_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel ui

- name: Install mailer systemd unit
  ansible.builtin.template:
    src: turbopanel-mailer.service.j2
    dest: "/etc/systemd/system/{{ mailer_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel mailer

# Upgrades run `sudo -u turbopanel git` from the instance (see upgrade-sudoers.yml).
# The deploy key must stay mode 0600 — SSH rejects group-readable private keys.
- name: Check turbopanel GitHub deploy key
  ansible.builtin.stat:
    path: "{{ turbopanel_github_key }}"
  register: _github_key

- name: Allow instance user to traverse turbopanel .ssh directory
  when: _github_key.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_ssh_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Allow instance user to use turbopanel GitHub deploy key
  when: _github_key.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_github_key }}"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0600"

- name: Allow instance user to read turbopanel SSH known_hosts
  ansible.builtin.file:
    path: "{{ turbopanel_ssh_dir }}/known_hosts"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  failed_when: false

# The instance user runs `git` during upgrades but repos are owned by
# turbopanel:turbopanel — mark them safe (Git 2.35+).
- name: Mark platform repos as safe git directories for turbopanel user
  ansible.builtin.git_config:
    name: safe.directory
    scope: global
    value: "{{ item }}"
    add_mode: add
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
  loop:
    - "{{ turbopanel_instance_dir }}"
    - "{{ turbopanel_daemon_dir }}"
    - "{{ turbopanel_ui_dir }}"

- name: Mark platform repos as safe git directories for instance user
  ansible.builtin.git_config:
    name: safe.directory
    scope: global
    value: "{{ item }}"
    add_mode: add
  become_user: "{{ instance_user }}"
  environment:
    HOME: "{{ turbopanel_instance_dir }}"
  loop:
    - "{{ turbopanel_instance_dir }}"
    - "{{ turbopanel_daemon_dir }}"
    - "{{ turbopanel_ui_dir }}"

- name: Ensure instance service desired state
  ansible.builtin.systemd:
    name: "{{ instance_service_name }}"
    daemon_reload: true
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Ensure Caddy service desired state
  ansible.builtin.systemd:
    name: "{{ caddy_service_name }}"
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Ensure UI service desired state
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.systemd:
    name: "{{ ui_service_name }}"
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Stop and disable UI service when not in dev mode
  when: turbopanel_ui_mode != 'dev'
  ansible.builtin.systemd:
    name: "{{ ui_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure mailer service desired state
  ansible.builtin.systemd:
    name: "{{ mailer_service_name }}"
    daemon_reload: true
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Install instance upgrade sudoers
  ansible.builtin.import_tasks: upgrade-sudoers.yml

- name: Reconcile dev checkout ownership (9999 develops, 9998 runs)
  ansible.builtin.import_tasks: checkout-permissions.yml
