---
- name: Ensure shared platform runtime directories
  ansible.builtin.import_tasks: platform-runtime-dirs.yml

- name: Ensure instance file logs for developer console
  ansible.builtin.import_tasks: instance-logs.yml

- name: Ensure UI file logs for developer console
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.import_tasks: ui-logs.yml

- name: Ensure website file logs for developer console
  when: turbopanel_dev_user | default('') | length > 0
  ansible.builtin.import_tasks: website-logs.yml

- name: Read postgres password for systemd units
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _launch_pgpass
  failed_when: false

- name: Set postgres password for systemd units
  ansible.builtin.set_fact:
    turbopanel_pg_password: "{{ _launch_pgpass.content | b64decode | trim }}"
  when:
    - _launch_pgpass.content is defined
    - (_launch_pgpass.content | b64decode | trim | length) > 0

- name: Read RabbitMQ password for systemd units
  when: (turbopanel_instance_runtime | default('deno')) == 'deno'
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass"
  register: _launch_rabbitmq_pass
  failed_when: false

- name: Set RabbitMQ URL for systemd units
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'deno'
    - _launch_rabbitmq_pass.content is defined
    - (_launch_rabbitmq_pass.content | b64decode | trim | length) > 0
  ansible.builtin.set_fact:
    turbopanel_amqp_url: >-
      amqp://{{ rabbitmq_user }}:{{ _launch_rabbitmq_pass.content | b64decode | trim }}@127.0.0.1:{{ rabbitmq_amqp_port }}{{ rabbitmq_vhost }}

# Compiled-mode contract: the unit puts {{ turbopanel_duckdb_lib_dir }} on
# LD_LIBRARY_PATH so the self-extracted duckdb.node addon can dlopen its
# companion libduckdb.so. instance-build stages it; converging a compiled
# instance without it would install a service that crash-loops at startup,
# so fail the converge loudly instead.
- name: Check vendored libduckdb.so for compiled instance
  when: turbopanel_instance_run_mode == 'compiled'
  ansible.builtin.stat:
    path: "{{ turbopanel_duckdb_lib_dir }}/libduckdb.so"
  register: _launch_duckdb_lib

- name: Fail when compiled instance lacks vendored libduckdb.so
  when:
    - turbopanel_instance_run_mode == 'compiled'
    - not _launch_duckdb_lib.stat.exists
  ansible.builtin.fail:
    msg: >-
      Compiled run mode requires {{ turbopanel_duckdb_lib_dir }}/libduckdb.so
      (the instance unit's LD_LIBRARY_PATH). Run the instance-build role
      (instance-build-toggle playbook) so it stages the DuckDB native library.

- name: Install instance systemd unit
  ansible.builtin.template:
    src: turbopanel-instance.service.j2
    dest: "/etc/systemd/system/{{ instance_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

# `wrangler dev` does not run the Worker's `* * * * *` cron trigger, so on the
# Workers dev runtime a systemd timer hits wrangler's local trigger endpoint
# every minute; otherwise the offline sweep, TLS renewal and billing chores
# never run and every server stays "online" forever. Deno runs its own
# scheduler in-process and needs nothing here, so the units are removed.
- name: Install Workers dev cron trigger units
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ instance_cron_service_name }}.{{ item.kind }}"
    owner: root
    group: root
    mode: "0640"
  loop:
    - { src: turbopanel-instance-cron.service.j2, kind: service }
    - { src: turbopanel-instance-cron.timer.j2, kind: timer }
  loop_control:
    label: "{{ item.kind }}"
  notify:
    - Reload systemd for instance units

- name: Enable Workers dev cron timer
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - instance_start | bool
  ansible.builtin.systemd:
    name: "{{ instance_cron_service_name }}.timer"
    daemon_reload: true
    enabled: true
    state: started

- name: Stop Workers dev cron timer on a non-Workers runtime
  when: (turbopanel_instance_runtime | default('deno')) != 'workers'
  ansible.builtin.systemd:
    name: "{{ instance_cron_service_name }}.timer"
    enabled: false
    state: stopped
  failed_when: false

- name: Remove Workers dev cron trigger units on a non-Workers runtime
  when: (turbopanel_instance_runtime | default('deno')) != 'workers'
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ instance_cron_service_name }}.{{ item }}"
    state: absent
  loop: [service, timer]
  notify:
    - Reload systemd for instance units

- name: Ensure Drizzle Studio serve script is executable
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.file:
    path: "{{ turbopanel_instance_dir }}/scripts/drizzle-studio-serve.sh"
    owner: "{{ instance_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
  failed_when: false

- name: Install Drizzle Studio systemd unit
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.template:
    src: turbopanel-dbstudio.service.j2
    dest: "/etc/systemd/system/{{ dbstudio_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel dbstudio

- name: Ensure vendored Caddy binary is installed and group-executable
  ansible.builtin.include_role:
    name: caddy

- name: Install Caddy systemd unit
  ansible.builtin.template:
    src: turbopanel-caddy.service.j2
    dest: "/etc/systemd/system/{{ caddy_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel caddy

- name: Install UI (Expo) systemd unit
  when: turbopanel_ui_mode == 'dev'
  ansible.builtin.template:
    src: turbopanel-ui.service.j2
    dest: "/etc/systemd/system/{{ ui_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel ui

- name: Install website (Next.js) systemd unit
  when: turbopanel_dev_user | default('') | length > 0
  ansible.builtin.template:
    src: turbopanel-website.service.j2
    dest: "/etc/systemd/system/{{ website_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel website

- name: Install mailer systemd unit
  when: (turbopanel_instance_runtime | default('deno')) == 'deno'
  ansible.builtin.template:
    src: turbopanel-mailer.service.j2
    dest: "/etc/systemd/system/{{ mailer_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd for instance units
    - Restart turbopanel mailer

# Upgrades run `sudo -u tp git` from the instance (see upgrade-sudoers.yml).
# The deploy key must stay mode 0600 — SSH rejects group-readable private keys.
- name: Check turbopanel GitHub deploy key
  ansible.builtin.stat:
    path: "{{ turbopanel_github_key }}"
  register: _github_key

- name: Allow instance user to traverse turbopanel .ssh directory
  when: _github_key.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_ssh_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Allow instance user to use turbopanel GitHub deploy key
  when: _github_key.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_github_key }}"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0600"

- name: Allow instance user to read turbopanel SSH known_hosts
  ansible.builtin.file:
    path: "{{ turbopanel_ssh_dir }}/known_hosts"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  failed_when: false

# The instance user runs `git` during upgrades but repos are owned by
# tp:tp — mark them safe (Git 2.35+). Only co-located dev has
# editable source checkouts; the managed FHS tree has no repos to mark safe.
- name: Read existing safe.directory entries for turbopanel user
  when: turbopanel_dev_user | default('') | length > 0
  ansible.builtin.command:
    argv: [git, config, --global, --get-all, safe.directory]
  become: true
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
  register: _git_safe_tp_dirs
  changed_when: false
  failed_when: false

- name: Mark platform repos as safe git directories for turbopanel user
  ansible.builtin.command:
    argv: [git, config, --global, --add, safe.directory, "{{ item }}"]
  become: true
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
  loop:
    - "{{ turbopanel_instance_dir }}"
    - "{{ turbopanel_daemon_dir }}"
    - "{{ turbopanel_ui_dir }}"
    - "{{ turbopanel_website_dir }}"
  when:
    - turbopanel_dev_user | default('') | length > 0
    - item not in (_git_safe_tp_dirs.stdout_lines | default([]))
  changed_when: true

- name: Read existing safe.directory entries for instance user
  when: turbopanel_dev_user | default('') | length > 0
  ansible.builtin.command:
    argv: [git, config, --global, --get-all, safe.directory]
  become: true
  become_user: "{{ instance_user }}"
  environment:
    HOME: "{{ turbopanel_instance_dir }}"
  register: _git_safe_instance_dirs
  changed_when: false
  failed_when: false

- name: Mark platform repos as safe git directories for instance user
  ansible.builtin.command:
    argv: [git, config, --global, --add, safe.directory, "{{ item }}"]
  become: true
  become_user: "{{ instance_user }}"
  environment:
    HOME: "{{ turbopanel_instance_dir }}"
  loop:
    - "{{ turbopanel_instance_dir }}"
    - "{{ turbopanel_daemon_dir }}"
    - "{{ turbopanel_ui_dir }}"
    - "{{ turbopanel_website_dir }}"
  when:
    - turbopanel_dev_user | default('') | length > 0
    - item not in (_git_safe_instance_dirs.stdout_lines | default([]))
  changed_when: true

- name: Resolve instance unit desired state
  ansible.builtin.set_fact:
    instance_unit_enabled: "{{ instance_start | bool }}"

- name: Ensure instance config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/instance"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

# Versioned keyring is the only persisted secret source (first entry is current).
- name: Ensure instance signing secret keyring exists
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/instance/.instance_secrets'
      if [ ! -s "$f" ]; then
        val=$({{ turbopanel_node }} \
          {{ turbopanel_instance_dir }}/scripts/generate-secret.mjs)
        umask 077
        printf '1:%s\n' "$val" > "$f"
        echo created
      fi
    executable: /bin/bash
  register: _instance_secrets_gen
  changed_when: "'created' in _instance_secrets_gen.stdout"

# Opt-in rotation: prepend max(existing)+1 to the keyring.
- name: Rotate instance signing secret keyring
  when: turbopanel_instance_secret_rotate | default(false) | bool
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/instance/.instance_secrets'
      prev=""
      if [ -f "$f" ]; then
        prev=$(tr -d '\n\r' < "$f" || true)
        # shellcheck disable=SC2001
        prev=$(printf '%s' "$prev" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
      fi
      max=1
      if [ -n "$prev" ]; then
        max=$(printf '%s' "$prev" | awk -F, '{
          m=1
          for (i=1; i<=NF; i++) {
            split($i, a, ":")
            v=a[1]+0
            if (v > m) m=v
          }
          print m
        }')
      fi
      new_ver=$((max + 1))
      new_val=$({{ turbopanel_node }} \
        {{ turbopanel_instance_dir }}/scripts/generate-secret.mjs)
      dir=$(dirname "$f")
      umask 077
      tmp=$(mktemp -p "$dir" .instance_secrets.XXXXXX)
      if [ -n "$prev" ]; then
        printf '%s\n' "${new_ver}:${new_val},${prev}" > "$tmp"
      else
        printf '%s\n' "${new_ver}:${new_val}" > "$tmp"
      fi
      mv "$tmp" "$f"
      echo rotated
    executable: /bin/bash
  register: _instance_secrets_rotate
  changed_when: "'rotated' in _instance_secrets_rotate.stdout"

# root:turbopanel_group 0640 — console (dev user / group) and Ansible can read
# for Local-Console HMAC; secret value is also injected into runtime.dev-vars.
- name: Harden instance signing secret keyring ownership
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/instance/.instance_secrets"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  failed_when: false

- name: Read instance signing secret keyring
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/instance/.instance_secrets"
  register: _instance_secrets_raw
  failed_when: false

- name: Set instance signing secret keyring fact
  ansible.builtin.set_fact:
    turbopanel_instance_secrets: "{{ _instance_secrets_raw.content | b64decode | trim }}"
  when:
    - _instance_secrets_raw.content is defined
    - (_instance_secrets_raw.content | b64decode | trim | length) > 0
  no_log: true

- name: Resolve instance source revision
  ansible.builtin.command:
    argv:
      - git
      - -C
      - "{{ turbopanel_instance_dir }}"
      - rev-parse
      - HEAD
  register: _instance_git_revision
  changed_when: false
  failed_when: false

- name: Set instance source revision fact
  ansible.builtin.set_fact:
    turbopanel_instance_revision: "{{ _instance_git_revision.stdout | default('') | trim }}"

- name: Install Workers runtime env (protected config dir)
  ansible.builtin.template:
    src: instance-workers.env.j2
    dest: "{{ turbopanel_instance_runtime_env }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - turbopanel_pg_password is defined
    - turbopanel_instance_secrets is defined
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Install Deno runtime env stub (protected config dir)
  ansible.builtin.template:
    src: instance-deno.env.j2
    dest: "{{ turbopanel_instance_runtime_env }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'deno'
    - turbopanel_instance_secrets is defined
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Stat durable platform CA bundle
  ansible.builtin.stat:
    path: "{{ turbopanel_state_dir }}/tls/ca-bundle.pem"
  register: _instance_ca_bundle_stat
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'

- name: Read platform CA bundle for Workers daemon trust endpoint
  ansible.builtin.slurp:
    src: "{{ (turbopanel_state_dir ~ '/tls/ca-bundle.pem') if (_instance_ca_bundle_stat.stat.exists | default(false)) else (turbopanel_state_dir ~ '/tls/ca.crt') }}"
  register: _instance_ca_raw
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'

- name: Set Workers platform CA base64 fact
  ansible.builtin.set_fact:
    # slurp .content is already base64 of the file bytes; strip any whitespace so
    # the value stays a single .dev.vars line (atob() decodes it in the Worker).
    turbopanel_instance_ca_pem_b64: "{{ _instance_ca_raw.content | regex_replace('\\s+', '') }}"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - _instance_ca_raw.content is defined

- name: Stat Analytics Engine API token file
  ansible.builtin.stat:
    path: "{{ turbopanel_config_dir }}/instance/.analytics_engine_api_token"
  register: _analytics_engine_api_token_stat
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'

- name: Read Analytics Engine API token
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/instance/.analytics_engine_api_token"
  register: _analytics_engine_api_token_raw
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - _analytics_engine_api_token_stat.stat.exists | default(false)

- name: Set Analytics Engine API token fact
  ansible.builtin.set_fact:
    turbopanel_analytics_engine_api_token: "{{ _analytics_engine_api_token_raw.content | b64decode | trim }}"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - _analytics_engine_api_token_raw.content is defined
    - (_analytics_engine_api_token_raw.content | b64decode | trim) | length > 0

# Stripe for the Workers *dev* instance only. Two by-hand files under the
# protected instance config dir (0640 root:group, never generated, never
# committed): `.stripe_secret_key` (the sandbox `sk_test_…`) and
# `.stripe_webhook_signing_secret` (the Dashboard endpoint's or the CLI
# forwarder's `whsec_…`). They are read here so a re-converge keeps the two
# lines in runtime.dev-vars instead of wiping them. The Deno unit never loads
# either: self-hosted has no billing. Production takes the same two values
# from Wrangler secrets, not from files.
# Co-located dev only: the dev checkout may carry both values in
# `<dev root>/dev/local/stripe.env` (gitignored; the checkout is mounted into
# the VM, so it survives a VM rebuild). When present, it seeds the two protected
# files above so a fresh VM needs no re-entry. The files stay the source the
# rest of this role reads; the checkout is only the durable copy.
- name: Stat dev-checkout Stripe env file
  ansible.builtin.stat:
    path: "{{ turbopanel_dev_root }}/dev/local/stripe.env"
  register: _stripe_dev_checkout_env
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - turbopanel_dev_user | default('') | length > 0

- name: Read dev-checkout Stripe env file
  ansible.builtin.slurp:
    src: "{{ turbopanel_dev_root }}/dev/local/stripe.env"
  register: _stripe_dev_checkout_raw
  no_log: true
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - turbopanel_dev_user | default('') | length > 0
    - _stripe_dev_checkout_env.stat.exists | default(false)

- name: Seed protected Stripe files from the dev checkout
  ansible.builtin.copy:
    dest: "{{ turbopanel_config_dir }}/instance/{{ item.file }}"
    content: "{{ item.value }}\n"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  loop:
    - file: .stripe_secret_key
      value: >-
        {{ ((_stripe_dev_checkout_raw.content | default('') | b64decode).splitlines()
            | select('match', '^TURBOPANEL_STRIPE_SECRET_KEY=')
            | map('regex_replace', '^[^=]*=', '') | first | default('')) | trim }}
    - file: .stripe_webhook_signing_secret
      value: >-
        {{ ((_stripe_dev_checkout_raw.content | default('') | b64decode).splitlines()
            | select('match', '^TURBOPANEL_STRIPE_WEBHOOK_SIGNING_SECRET=')
            | map('regex_replace', '^[^=]*=', '') | first | default('')) | trim }}
  loop_control:
    label: "{{ item.file }}"
  # Secrets in the loop values: hidden unless a developer debugs this task
  # with `-e stripe_seed_no_log=false`.
  no_log: "{{ stripe_seed_no_log | default(true) }}"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - turbopanel_dev_user | default('') | length > 0
    - _stripe_dev_checkout_raw.content is defined
    - item.value | length > 0

- name: Stat Stripe dev secret files
  ansible.builtin.stat:
    path: "{{ turbopanel_config_dir }}/instance/{{ item }}"
  loop: [.stripe_secret_key, .stripe_webhook_signing_secret]
  register: _stripe_dev_secret_stats
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'

- name: Read Stripe dev secret files
  ansible.builtin.slurp:
    src: "{{ item.stat.path }}"
  loop: "{{ _stripe_dev_secret_stats.results | default([]) }}"
  loop_control:
    label: "{{ item.item | default('') }}"
  register: _stripe_dev_secret_raw
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - item.stat is defined
    - item.stat.exists

- name: Set Stripe dev secret facts
  ansible.builtin.set_fact:
    turbopanel_stripe_secret_key: >-
      {{ (_stripe_dev_secret_raw.results | default([])
          | selectattr('item.item', 'equalto', '.stripe_secret_key')
          | selectattr('content', 'defined') | map(attribute='content')
          | map('b64decode') | map('trim') | first) | default('') }}
    turbopanel_stripe_webhook_signing_secret: >-
      {{ (_stripe_dev_secret_raw.results | default([])
          | selectattr('item.item', 'equalto', '.stripe_webhook_signing_secret')
          | selectattr('content', 'defined') | map(attribute='content')
          | map('b64decode') | map('trim') | first) | default('') }}
  no_log: true
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'

- name: Install Workers runtime dev vars (protected config dir)
  ansible.builtin.template:
    src: instance-workers.dev-vars.j2
    dest: "{{ turbopanel_instance_runtime_dev_vars }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'workers'
    - turbopanel_instance_secrets is defined
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Install Deno runtime dev vars (protected config dir)
  ansible.builtin.template:
    src: instance-deno.dev-vars.j2
    dest: "{{ turbopanel_instance_runtime_dev_vars }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0640"
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'deno'
    - turbopanel_instance_secrets is defined
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance
    - Restart turbopanel mailer

- name: Apply instance database migrations
  ansible.builtin.import_tasks: instance-migrate.yml

- name: Ensure instance service desired state
  ansible.builtin.systemd:
    name: "{{ instance_service_name }}"
    daemon_reload: true
    enabled: "{{ instance_unit_enabled | bool }}"
    state: "{{ 'started' if (instance_unit_enabled | bool) else 'stopped' }}"

- name: Ensure Drizzle Studio service desired state
  when:
    - turbopanel_ui_mode == 'dev'
    - turbopanel_optional_dbstudio | default(false) | bool
  ansible.builtin.systemd:
    name: "{{ dbstudio_service_name }}"
    daemon_reload: true
    enabled: "{{ instance_unit_enabled | bool }}"
    state: "{{ 'started' if (instance_unit_enabled | bool) else 'stopped' }}"

- name: Stop and disable Drizzle Studio when optional off
  when:
    - turbopanel_ui_mode == 'dev'
    - not (turbopanel_optional_dbstudio | default(false) | bool)
  ansible.builtin.systemd:
    name: "{{ dbstudio_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable Drizzle Studio when not in dev UI mode
  when: turbopanel_ui_mode != 'dev'
  ansible.builtin.systemd:
    name: "{{ dbstudio_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure Caddy service desired state
  ansible.builtin.systemd:
    name: "{{ caddy_service_name }}"
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Ensure UI service desired state
  when:
    - turbopanel_ui_mode == 'dev'
    - turbopanel_optional_ui | default(true) | bool
  ansible.builtin.systemd:
    name: "{{ ui_service_name }}"
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Stop and disable UI when optional off
  when:
    - turbopanel_ui_mode == 'dev'
    - not (turbopanel_optional_ui | default(true) | bool)
  ansible.builtin.systemd:
    name: "{{ ui_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure website service desired state
  when:
    - turbopanel_dev_user | default('') | length > 0
    - turbopanel_optional_website | default(true) | bool
  ansible.builtin.systemd:
    name: "{{ website_service_name }}"
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Stop and disable website when optional off
  when:
    - turbopanel_dev_user | default('') | length > 0
    - not (turbopanel_optional_website | default(true) | bool)
  ansible.builtin.systemd:
    name: "{{ website_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable website when not co-located
  when: turbopanel_dev_user | default('') | length == 0
  ansible.builtin.systemd:
    name: "{{ website_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Stop and disable UI service when not in dev mode
  when: turbopanel_ui_mode != 'dev'
  ansible.builtin.systemd:
    name: "{{ ui_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

- name: Ensure mailer service desired state (Deno runtime)
  when: (turbopanel_instance_runtime | default('deno')) == 'deno'
  ansible.builtin.systemd:
    name: "{{ mailer_service_name }}"
    daemon_reload: true
    enabled: "{{ instance_start | bool }}"
    state: "{{ 'started' if (instance_start | bool) else 'stopped' }}"

- name: Stop and disable mailer when Workers runtime
  when: (turbopanel_instance_runtime | default('deno')) == 'workers'
  ansible.builtin.systemd:
    name: "{{ mailer_service_name }}"
    state: stopped
    enabled: false
  failed_when: false

# The queue container itself is stopped/removed on Workers runtime by the
# system-compose role (its rendered docker-compose.yml omits the `queue`
# service on that runtime, and `docker compose up -d --remove-orphans` tears
# down the now-orphaned container) — no per-runtime systemd action needed here.

- name: Install instance upgrade sudoers
  ansible.builtin.import_tasks: upgrade-sudoers.yml
