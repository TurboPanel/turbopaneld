---
# The database and queue passwords for the instance and Drizzle Studio units.
# They are written to root-only EnvironmentFiles (0600), never into a unit
# (units are readable through `systemctl cat` and `show`). Imported by
# units.yml, and run alone (tasks_from: secrets.yml) by the update flow's
# instance-secrets-refresh.yml BEFORE the migration, which reads the database
# URL from the file. The template module writes through a temporary file and
# renames it, so a file is never half-written; no_log keeps the values out of
# the task output. Nothing else is touched here.
- name: Read postgres password for systemd units
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _launch_pgpass
  failed_when: false
  no_log: true

- name: Set postgres password for systemd units
  ansible.builtin.set_fact:
    turbopanel_pg_password: "{{ _launch_pgpass.content | b64decode | trim }}"
  when:
    - _launch_pgpass.content is defined
    - (_launch_pgpass.content | b64decode | trim | length) > 0
  no_log: true

- name: Read RabbitMQ password for systemd units
  when: (turbopanel_instance_runtime | default('deno')) == 'deno'
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass"
  register: _launch_rabbitmq_pass
  failed_when: false
  no_log: true

- name: Set RabbitMQ URL for systemd units
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'deno'
    - _launch_rabbitmq_pass.content is defined
    - (_launch_rabbitmq_pass.content | b64decode | trim | length) > 0
  no_log: true
  ansible.builtin.set_fact:
    turbopanel_amqp_url: >-
      amqp://{{ rabbitmq_user }}:{{ _launch_rabbitmq_pass.content | b64decode | trim }}@127.0.0.1:{{ rabbitmq_amqp_port }}{{ rabbitmq_vhost }}

- name: Ensure instance config directory exists for the secrets files
  ansible.builtin.file:
    path: "{{ turbopanel_instance_runtime_secrets | dirname }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

# A file is written only when its values could be read; otherwise a stale file
# from an earlier install is removed instead of silently keeping old values.
- name: Install instance runtime secrets file (root-only)
  when:
    - (turbopanel_instance_runtime | default('deno')) == 'deno'
    - turbopanel_pg_password is defined or turbopanel_amqp_url is defined
  ansible.builtin.template:
    src: instance-runtime-secrets.env.j2
    dest: "{{ turbopanel_instance_runtime_secrets }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Remove the instance runtime secrets file when no password can be read
  when: >-
    (turbopanel_instance_runtime | default('deno')) != 'deno'
    or (turbopanel_pg_password is not defined and turbopanel_amqp_url is not defined)
  ansible.builtin.file:
    path: "{{ turbopanel_instance_runtime_secrets }}"
    state: absent
  notify:
    - Reload systemd for instance units
    - Restart turbopanel instance

- name: Install Drizzle Studio database file (root-only)
  when: turbopanel_pg_password is defined
  ansible.builtin.template:
    src: dbstudio-secrets.env.j2
    dest: "{{ turbopanel_dbstudio_secrets }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify:
    - Reload systemd for instance units
    - Restart turbopanel dbstudio

- name: Remove the Drizzle Studio database file when the password cannot be read
  when: turbopanel_pg_password is not defined
  ansible.builtin.file:
    path: "{{ turbopanel_dbstudio_secrets }}"
    state: absent
  notify:
    - Reload systemd for instance units
    - Restart turbopanel dbstudio
