  <meta http-equiv="refresh" content="5">
  <title>TurboPanel is updating</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;

      padding: 2rem;
      border: 1px solid #243028;
      border-top: 3px solid #3dd68c;
      border-radius: 12px;

    p { margin: 0.75rem 0 0; color: #b7c0c8; }
    strong { color: #3dd68c; font-weight: 650; }

  <main>
