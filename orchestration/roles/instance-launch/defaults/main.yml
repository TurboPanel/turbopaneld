---
# Co-located dev (turbopanel_dev_user set) keeps the checkout layout; managed
# installs use the FHS layout under /etc/turbopanel.
turbopanel_config_dir: "{{ '/opt/turbopanel/platform/config' if (turbopanel_dev_user | default('') | length > 0) else '/etc/turbopanel' }}"
# Secret-bearing runtime env lives under the config dir — never in the git checkout.
turbopanel_instance_runtime_env: "{{ turbopanel_config_dir }}/instance/runtime.env"
turbopanel_instance_runtime_dev_vars: "{{ turbopanel_config_dir }}/instance/runtime.dev-vars"
turbopanel_install_root: /opt/turbopanel
turbopanel_user: turbopanel
turbopanel_ssh_dir: "{{ turbopanel_install_root }}/.ssh"
turbopanel_github_key: "{{ turbopanel_ssh_dir }}/github_ed25519"
# Co-located dev keeps the historical /opt/turbopanel/runtimes + /platform checkout
# tree; managed installs use the FHS lib tree (lib/runtime, lib/<component>) and
# FHS state under /var/lib/turbopanel.
turbopanel_platform_dir: "{{ turbopanel_install_root }}/platform"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
turbopanel_state_dir: /var/lib/turbopanel
turbopanel_runtimes_dir: "{{ (turbopanel_install_root ~ '/runtimes') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/runtime') }}"
# Node: co-located dev uses the pinned /usr/local/bin/node; managed installs use
# the vendored Node under the FHS runtime tree.
turbopanel_node: "{{ '/usr/local/bin/node' if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_runtimes_dir ~ '/node/current/bin/node') }}"
turbopanel_daemon_dir: "{{ (turbopanel_platform_dir ~ '/daemon') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/daemon') }}"
turbopanel_instance_dir: "{{ (turbopanel_platform_dir ~ '/instance') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
turbopanel_ui_dir: "{{ (turbopanel_platform_dir ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
turbopanel_website_dir: "{{ (turbopanel_platform_dir ~ '/website') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/website') }}"
# Per-service runtime state (HOME / XDG dirs): co-located dev keeps checkout-local
# .local/.config; managed installs use FHS state under /var/lib/turbopanel/<svc>.
turbopanel_instance_runtime_dir: "{{ (turbopanel_instance_dir ~ '/.local') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/instance/.local') }}"
turbopanel_caddy_runtime_dir: "{{ (turbopanel_instance_dir ~ '/.local') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/caddy/.local') }}"
turbopanel_ui_runtime_dir: "{{ (turbopanel_ui_dir ~ '/.local') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/ui/.local') }}"
turbopanel_website_runtime_dir: "{{ (turbopanel_website_dir ~ '/.local') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/website/.local') }}"
turbopanel_instance_config_dir: "{{ (turbopanel_instance_dir ~ '/.config') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/instance/.config') }}"
turbopanel_caddy_config_dir: "{{ (turbopanel_instance_dir ~ '/.config') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/caddy/.config') }}"
turbopanel_ui_config_dir: "{{ (turbopanel_ui_dir ~ '/.config') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/ui/.config') }}"
turbopanel_website_config_dir: "{{ (turbopanel_website_dir ~ '/.config') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_state_dir ~ '/website/.config') }}"
# Managed installs keep persistent daemon state under /var/lib/turbopanel;
# co-located dev keeps it inside the checkout (resolved per dev_user below).
turbopanel_daemon_state_dir: "{{ (turbopanel_daemon_dir ~ '/state') if (turbopanel_dev_user | default('') | length > 0) else turbopanel_state_dir }}"
# Static UI export dir: co-located dev builds into the ui checkout; managed
# installs build/download into the shared FHS location (owner turbopaneli:turbopanel).
turbopanel_ui_dist_dir: "{{ (turbopanel_ui_dir ~ '/dist') if (turbopanel_dev_user | default('') | length > 0) else '/opt/turbopanel/share/ui' }}"
website_service_name: turbopanel-website
website_port: 19820
website_cors_origins: "http://localhost:{{ website_port }},http://127.0.0.1:{{ website_port }}"
instance_user: turbopaneli
turbopanel_group: turbopanel
instance_service_name: turbopanel-instance
caddy_service_name: turbopanel-caddy
ui_service_name: turbopanel-ui
caddy_port: 8443
caddy_http_port: 8880
expo_port: 8081
drizzle_studio_port: 4983
# "dev" proxies Caddy to the Expo dev server (turbopanel-ui.service);
# "static" serves the exported web build from {{ turbopanel_ui_dist_dir }}.
turbopanel_ui_mode: dev
# "source" runs deno run src/deno.ts; "compiled" exec's dist/turbopanel-instance.
turbopanel_instance_run_mode: source
turbopanel_instance_binary: "{{ turbopanel_instance_dir }}/dist/turbopanel-instance"
# "deno" runs turbopanel-instance via systemd; "workers" expects manual wrangler dev.
turbopanel_instance_runtime: deno
wrangler_dev_port: 18787
instance_start: true
postgres_socket_dir: /var/run/turbopanel/postgres
postgres_port: 5432
postgres_expose_port: false
postgres_user: turbopanel
postgres_db: turbopanel
# Managed installs log under /var/log/turbopanel/<svc>; co-located dev keeps
# checkout-local logs/ dirs for the developer console.
turbopanel_log_dir: /var/log/turbopanel
instance_log_dir: "{{ (turbopanel_instance_dir ~ '/logs') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_log_dir ~ '/instance') }}"
ui_log_dir: "{{ (turbopanel_ui_dir ~ '/logs') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_log_dir ~ '/ui') }}"
website_log_dir: "{{ (turbopanel_website_dir ~ '/logs') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_log_dir ~ '/website') }}"
rabbitmq_amqp_port: 5672
rabbitmq_vhost: /
rabbitmq_user: turbopanel
redis_socket_path: /run/turbopanel/redis.sock
mailer_service_name: turbopanel-mailer
mailpit_web_port: 8025
mailpit_smtp_port: 1025
dbstudio_service_name: turbopanel-dbstudio
turbopanel_dev_user: ""
# Co-located dev: Caddy serves /downloads/daemon from {{ turbopanel_daemon_dir }}/dist when UI_MODE=dev.
turbopanel_public_urls: ""
turbopanel_tls_extra_sans: ""
