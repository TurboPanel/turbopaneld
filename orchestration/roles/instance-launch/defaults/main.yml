---
turbopanel_install_root: /opt/turbopanel
turbopanel_user: turbopanel
turbopanel_ssh_dir: "{{ turbopanel_install_root }}/.ssh"
turbopanel_github_key: "{{ turbopanel_ssh_dir }}/github_ed25519"
turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/runtimes"
turbopanel_platform_dir: "{{ turbopanel_install_root }}/platform"
# Legacy shared paths — used only to migrate data into checkout-local dirs.
turbopanel_platform_runtime_dir: "{{ turbopanel_platform_dir }}/.local"
turbopanel_platform_config_dir: "{{ turbopanel_platform_dir }}/.config"
turbopanel_instance_runtime_dir: "{{ turbopanel_instance_dir }}/.local"
turbopanel_caddy_runtime_dir: "{{ turbopanel_instance_dir }}/.local"
turbopanel_ui_runtime_dir: "{{ turbopanel_ui_dir }}/.local"
turbopanel_instance_config_dir: "{{ turbopanel_instance_dir }}/.config"
turbopanel_caddy_config_dir: "{{ turbopanel_instance_dir }}/.config"
turbopanel_ui_config_dir: "{{ turbopanel_ui_dir }}/.config"
turbopanel_daemon_dir: "{{ turbopanel_platform_dir }}/daemon"
turbopanel_instance_dir: "{{ turbopanel_platform_dir }}/turbopanel"
turbopanel_ui_dir: "{{ turbopanel_platform_dir }}/ui"
instance_user: instance
turbopanel_group: turbopanel
instance_service_name: turbopanel-instance
caddy_service_name: turbopanel-caddy
ui_service_name: turbopanel-ui
caddy_port: 8443
expo_port: 8081
drizzle_studio_port: 4983
# "dev" proxies Caddy to the Expo dev server (turbopanel-ui.service);
# "static" serves the exported web build from {{ turbopanel_ui_dir }}/dist.
turbopanel_ui_mode: dev
instance_start: true
postgres_socket_dir: /var/run/turbopanel/postgres
postgres_port: 5432
postgres_expose_port: false
postgres_user: turbopanel
postgres_db: turbopanel
turbopanel_config_dir: /etc/turbopanel
