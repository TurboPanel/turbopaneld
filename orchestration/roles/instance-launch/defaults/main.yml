---
# Shared dev-identity contract + FHS paths. Co-located dev (turbopanel_dev_user
# set) collapses the instance stack onto the single dev user and keeps source
# checkouts under the dev user's home (turbopanel_dev_root). Every mutable path
# (config, state, logs, runtimes) is the FHS location shared with production.
# Managed installs keep the tpctrl(9998)/tp(9999) split and the lib/ source
# tree; leaving turbopanel_dev_user empty is bit-for-bit unchanged.
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpctrl' }}"
caddy_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcaddy' }}"
caddy_primary_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcaddy' }}"
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel
# Secret-bearing runtime env lives under the config dir — never in the git checkout.
turbopanel_instance_runtime_env: "{{ turbopanel_config_dir }}/instance/runtime.env"
turbopanel_instance_runtime_dev_vars: "{{ turbopanel_config_dir }}/instance/runtime.dev-vars"
# Opt-in via extra-var; ordinary converges must never rotate the instance secret keyring.
turbopanel_instance_secret_rotate: false
turbopanel_install_root: /opt/turbopanel
turbopanel_ssh_dir: "{{ turbopanel_install_root }}/.ssh"
turbopanel_github_key: "{{ turbopanel_ssh_dir }}/github_ed25519"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
turbopanel_state_dir: /var/lib/turbopanel
# Runtime socket/run directory — matches instance resolveRunDir / resolveInstanceSocket.
turbopanel_run_dir: /run/turbopanel
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_vendor_dir }}/node/current/bin/node"
turbopanel_deno: "{{ turbopanel_vendor_dir }}/deno/current/deno"
turbopanel_runtime_path: >-
  {{ turbopanel_vendor_dir }}/node/current/bin:{{
  turbopanel_vendor_dir }}/deno/current:{{
  turbopanel_vendor_dir }}/caddy/current:/usr/bin:/bin
# Source checkouts: co-located dev uses the dev user's home; managed installs use
# the FHS lib tree.
turbopanel_daemon_dir: "{{ (turbopanel_dev_root ~ '/turbopaneld') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/daemon') }}"
turbopanel_instance_dir: "{{ (turbopanel_dev_root ~ '/turbopanel') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
turbopanel_ui_dir: "{{ (turbopanel_dev_root ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
turbopanel_website_dir: "{{ (turbopanel_dev_root ~ '/website') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/website') }}"
# Per-service runtime state (HOME / XDG dirs): always FHS state under
# /var/lib/turbopanel/<svc> (dev shares it with prod).
turbopanel_instance_runtime_dir: "{{ turbopanel_state_dir }}/instance/.local"
turbopanel_caddy_runtime_dir: "{{ turbopanel_state_dir }}/caddy/.local"
turbopanel_ui_runtime_dir: "{{ turbopanel_state_dir }}/ui/.local"
turbopanel_website_runtime_dir: "{{ turbopanel_state_dir }}/website/.local"
turbopanel_instance_config_dir: "{{ turbopanel_state_dir }}/instance/.config"
turbopanel_caddy_config_dir: "{{ turbopanel_state_dir }}/caddy/.config"
turbopanel_ui_config_dir: "{{ turbopanel_state_dir }}/ui/.config"
turbopanel_website_config_dir: "{{ turbopanel_state_dir }}/website/.config"
# Persistent daemon state always lives under /var/lib/turbopanel.
turbopanel_daemon_state_dir: "{{ turbopanel_state_dir }}"
# Static UI export dir: always the shared FHS location served by Caddy.
turbopanel_ui_dist_dir: /opt/turbopanel/share/ui
website_service_name: turbopanel-website
website_port: 19820
website_cors_origins: "http://localhost:{{ website_port }},http://127.0.0.1:{{ website_port }}"
instance_service_name: turbopanel-instance
caddy_service_name: turbopanel-caddy
ui_service_name: turbopanel-ui
caddy_port: 8443
caddy_http_port: 8880
expo_port: 8081
drizzle_studio_port: 4983
# "dev" proxies Caddy to the Expo dev server (turbopanel-ui.service);
# "static" serves the exported web build from {{ turbopanel_ui_dist_dir }}.
# Production default is static; co-located converge passes -e turbopanel_ui_mode=dev.
turbopanel_ui_mode: static
# Co-located (turbopanel_dev_user set) loads the development Caddyfile from the
# turbopanel/dev overlay; managed/production uses the instance checkout Caddyfile.
turbopanel_caddyfile: >-
  {{ (turbopanel_dev_root ~ '/dev/orchestration/Caddyfile') if
  (turbopanel_dev_user | default('') | length > 0) else
  (turbopanel_instance_dir ~ '/Caddyfile') }}
# "source" runs deno run src/deno-dev.ts when the developer surface is on,
# otherwise src/deno.ts; "compiled" exec's dist/turbopanel-instance.
turbopanel_instance_run_mode: source
turbopanel_instance_binary: "{{ turbopanel_instance_dir }}/dist/turbopanel-instance"
# "deno" runs turbopanel-instance via systemd; "workers" expects manual wrangler dev.
turbopanel_instance_runtime: deno
wrangler_dev_port: 18787
instance_start: true
postgres_socket_dir: /var/run/turbopanel/postgres
postgres_port: 5432
postgres_expose_port: false
postgres_user: turbopanel
postgres_db: turbopanel
# Service logs always live under /var/log/turbopanel/<svc> (dev shares it with prod).
turbopanel_log_dir: /var/log/turbopanel
instance_log_dir: "{{ turbopanel_log_dir }}/instance"
ui_log_dir: "{{ turbopanel_log_dir }}/ui"
website_log_dir: "{{ turbopanel_log_dir }}/website"
rabbitmq_amqp_port: 5672
rabbitmq_vhost: /
rabbitmq_user: turbopanel
redis_socket_path: /run/turbopanel/redis.sock
clickhouse_http_port: 8123
clickhouse_database: turbopanel_metrics
clickhouse_app_user: turbopanel_app
# Server metrics on by default; set false to opt out.
turbopanel_server_metrics_retention_days: 90
mailer_service_name: turbopanel-mailer
mailpit_web_port: 8025
mailpit_smtp_port: 1025
dbstudio_service_name: turbopanel-dbstudio
# Co-located: the development Caddyfile serves /downloads/daemon from
# {{ turbopanel_daemon_dir }}/dist when UI_MODE=dev.
turbopanel_public_urls: ""
turbopanel_tls_extra_sans: ""
