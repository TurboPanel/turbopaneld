---
# Shared dev-identity contract + FHS paths. Co-located dev (turbopanel_dev_user
# set) collapses the instance stack onto the single dev user and keeps source
# checkouts under the dev user's home (turbopanel_dev_root). Every mutable path
# (config, state, logs, runtimes) is the FHS location shared with production.
# Managed installs keep the tpctrl(9998)/tp(9999) split and the lib/ source
# tree; leaving turbopanel_dev_user empty is bit-for-bit unchanged.
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpctrl' }}"
caddy_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcaddy' }}"
caddy_primary_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpcaddy' }}"
# Managed Caddy admin API. Unix socket so the process does not bind a second
# TCP port. The dev overlay Caddyfile keeps its own admin listener.
turbopanel_caddy_admin_socket: "{{ turbopanel_run_dir }}/caddy/admin.sock"
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel
# Secret-bearing runtime env lives under the config dir — never in the git checkout.
turbopanel_instance_runtime_env: "{{ turbopanel_config_dir }}/instance/runtime.env"
turbopanel_instance_runtime_dev_vars: "{{ turbopanel_config_dir }}/instance/runtime.dev-vars"
# Opt-in via extra-var; ordinary converges must never rotate the instance secret keyring.
turbopanel_instance_secret_rotate: false
# Opt-in off-host root-secret backup; empty (default) skips it entirely. Set
# to a path on the machine running this playbook — never on the target host —
# to pull a copy of the signing secret keyring there on every converge.
turbopanel_instance_secret_escrow_path: ""
turbopanel_install_root: /opt/turbopanel
turbopanel_ssh_dir: "{{ turbopanel_install_root }}/.ssh"
turbopanel_github_key: "{{ turbopanel_ssh_dir }}/github_ed25519"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
turbopanel_state_dir: /var/lib/turbopanel
# Runtime socket/run directory — matches instance resolveRunDir / resolveInstanceSocket.
turbopanel_run_dir: /run/turbopanel
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_vendor_dir }}/node/current/bin/node"
turbopanel_deno: "{{ turbopanel_vendor_dir }}/deno/current/deno"
turbopanel_runtime_path: >-
  {{ turbopanel_vendor_dir }}/node/current/bin:{{
  turbopanel_vendor_dir }}/deno/current:{{
  turbopanel_vendor_dir }}/caddy/current:/usr/bin:/bin
# Source checkouts: co-located dev uses the dev user's home; managed installs use
# the FHS lib tree.
turbopanel_daemon_dir: "{{ (turbopanel_dev_root ~ '/turbopaneld') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/daemon') }}"
# The instance "dir" is the source checkout in co-located dev. A managed
# install has no checkout: the release package unpacks flat into the install
# root (bin/turbopanel, lib/libduckdb.so), so the dir is the install root
# itself — units' WorkingDirectory, nothing more.
turbopanel_instance_dir: "{{ (turbopanel_dev_root ~ '/turbopanel') if (turbopanel_dev_user | default('') | length > 0) else turbopanel_install_root }}"
turbopanel_ui_dir: "{{ (turbopanel_dev_root ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
turbopanel_website_dir: "{{ (turbopanel_dev_root ~ '/website') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/website') }}"
# Per-service runtime state (HOME / XDG dirs): always FHS state under
# /var/lib/turbopanel/<svc> (dev shares it with prod).
turbopanel_instance_runtime_dir: "{{ turbopanel_state_dir }}/instance/.local"
turbopanel_caddy_runtime_dir: "{{ turbopanel_state_dir }}/caddy/.local"
turbopanel_ui_runtime_dir: "{{ turbopanel_state_dir }}/ui/.local"
turbopanel_website_runtime_dir: "{{ turbopanel_state_dir }}/website/.local"
turbopanel_instance_config_dir: "{{ turbopanel_state_dir }}/instance/.config"
turbopanel_caddy_config_dir: "{{ turbopanel_state_dir }}/caddy/.config"
turbopanel_ui_config_dir: "{{ turbopanel_state_dir }}/ui/.config"
turbopanel_website_config_dir: "{{ turbopanel_state_dir }}/website/.config"
# Persistent daemon state always lives under /var/lib/turbopanel.
turbopanel_daemon_state_dir: "{{ turbopanel_state_dir }}"
# DuckDB metrics store root — matches instance resolveMetricsDir.
turbopanel_metrics_dir: "{{ turbopanel_state_dir }}/metrics"
# Vendored libduckdb.so: `deno compile` self-extracts the duckdb.node addon but
# not this companion shared library, so the compiled instance loads it via
# LD_LIBRARY_PATH (source mode resolves both from node_modules). A managed
# install ships it in the release package at lib/libduckdb.so; co-located dev
# stages it from node_modules into the vendor tree (instance-build role).
turbopanel_duckdb_lib_dir: "{{ (turbopanel_vendor_dir ~ '/duckdb/lib') if (turbopanel_dev_user | default('') | length > 0) else turbopanel_lib_dir }}"
# Static UI export dir: always the shared FHS location served by Caddy.
turbopanel_ui_dist_dir: /opt/turbopanel/share/ui
website_service_name: turbopanel-website
website_port: 19820
website_cors_origins: "http://localhost:{{ website_port }},http://127.0.0.1:{{ website_port }}"
instance_service_name: turbopanel-instance
caddy_service_name: turbopanel-caddy
# Short-lived Let's Encrypt issuer. Installed, not enabled. The daemon
# starts and stops it while HTTP-01 is in progress.
instance_acme_service_name: turbopanel-instance-acme
# Workers dev only: minutely timer that hits wrangler's local scheduled-trigger
# endpoint, because `wrangler dev` never fires the Worker's cron on its own.
instance_cron_service_name: turbopanel-instance-cron
ui_service_name: turbopanel-ui
# Dev overlay only (CADDY_PORT in the unit). The managed Caddyfile binds
# literal :8443 and does not read this variable.
caddy_port: 8443
expo_port: 8081
drizzle_studio_port: 4983
# "dev" proxies Caddy to the Expo dev server (turbopanel-ui.service);
# "static" serves the exported web build from {{ turbopanel_ui_dist_dir }}.
# Production default is static; co-located converge passes -e turbopanel_ui_mode=dev.
turbopanel_ui_mode: static
# Deprecated single-hostname alias. The listener set no longer follows this
# switch: :8443 is the only TCP port, and turbopanel_hostnames decides
# per-name tls. When hostnames is empty, resolve-hostnames.yml synthesizes
# one entry from this alias plus turbopanel_public_hostname. The template
# also derives a display-only mode (upload if any uploaded name, lets_encrypt
# if any ACME name, otherwise self_signed) under the same variable name.
turbopanel_tls_mode: self_signed
# Per-hostname certificate sources. Each item is {host, source, cert_id}.
# Empty means "use the deprecated aliases above".
turbopanel_hostnames: []
# Compact JSON list for key=value extra-vars. resolve-hostnames.yml decodes
# it into turbopanel_hostnames. Empty leaves that list alone. tp-orchestrate
# accepts only key=value extra-vars, which stay strings.
turbopanel_hostnames_json: ""
# Absolute paths on the target host (upload). Copied into the role-owned
# certs/ tree so tpcaddy can read the key without mutating the operator's files.
turbopanel_tls_cert_path: ""
turbopanel_tls_key_path: ""
# Public DNS name for a deprecated single lets-encrypt hostname alias.
turbopanel_public_hostname: ""
# ACME account contact (lets_encrypt). Kept for extra-vars; the Caddyfile
# no longer emits `email` because this process does not issue certificates.
turbopanel_acme_email: ""
# Operator-declared "the endpoint presents a publicly trusted certificate".
# Forced true when turbopanel_tls_mode is lets_encrypt.
turbopanel_tls_public: false
# The Caddy site config. Co-located dev (turbopanel_dev_user set) loads the
# development Caddyfile from the turbopanel/dev overlay. A managed install
# renders templates/Caddyfile.j2 — :8443 only. Uploaded and Let's Encrypt
# names are extra :8443 sites (Let's Encrypt only when
# letsencrypt-<host>.{crt,key} exist). The file is rendered into the
# platform config dir on every converge (see "Render the Caddy site config"
# in tasks/main.yml).
turbopanel_caddyfile: >-
  {{ (turbopanel_dev_root ~ '/dev/orchestration/Caddyfile') if
  (turbopanel_dev_user | default('') | length > 0) else
  (turbopanel_config_dir ~ '/caddy/Caddyfile') }}
# "source" runs deno run src/deno-dev.ts when the developer surface is on,
# otherwise src/deno.ts; "compiled" exec's the single binary. Co-located dev
# defaults to source (its build toggle passes -e turbopanel_instance_run_mode
# explicitly); a managed install has no checkout and is always compiled — so
# every playbook that includes this role on a managed host (instance-install,
# instance-certs-apply from the daemon) resolves the same way without each
# having to say so.
turbopanel_instance_run_mode: "{{ 'source' if (turbopanel_dev_user | default('') | length > 0) else 'compiled' }}"
# Co-located dev runs the checkout's dist/ build (instance-build role, source
# or compiled); a managed install runs the release package's binary under the
# install root.
turbopanel_instance_binary: >-
  {{ (turbopanel_instance_dir ~ '/dist/turbopanel')
     if (turbopanel_dev_user | default('') | length > 0)
     else (turbopanel_install_root ~ '/bin/turbopanel') }}
# Email runs in-process inside the instance binary (Road to 0.1.x); there is
# no separate mailer package or unit on managed hosts.
# How the versioned migrations are applied: the instance binary's own
# `migrate` verb in compiled mode (the migrations ride inside the binary —
# the same advisory-locked drizzle migrator pnpm migrate runs), the
# checkout's bootstrap script in source mode.
turbopanel_instance_migrate_argv: >-
  {{ [turbopanel_instance_binary, 'migrate']
     if turbopanel_instance_run_mode == 'compiled'
     else [turbopanel_instance_dir ~ '/scripts/bootstrap-dev-db.sh'] }}
# How a fresh signing secret is minted: the instance binary's own
# `generate-secret` verb in compiled mode (no checkout needed), the Node
# script from the checkout in source mode. Same generator either way
# (turbopanel src/cli/generate-secret.ts wraps scripts/generate-secret.mjs).
# Where the server leaf (self-signed or uploaded) lives — what Caddy serves.
# Source mode keeps it beside the checkout; the compiled binary can only
# write its state tree, so compiled mode keeps it at <state>/tls/certs (the
# default the `generate-self-signed-cert` verb picks without
# TURBOPANEL_TLS_CERTS_DIR).
turbopanel_instance_certs_dir: >-
  {{ (turbopanel_state_dir ~ '/tls/certs')
     if turbopanel_instance_run_mode == 'compiled'
     else (turbopanel_instance_dir ~ '/certs') }}
turbopanel_instance_secret_cmd: >-
  {{ (turbopanel_instance_binary ~ ' generate-secret')
     if turbopanel_instance_run_mode == 'compiled'
     else (turbopanel_node ~ ' ' ~ turbopanel_instance_dir ~ '/scripts/generate-secret.mjs') }}
# "deno" runs turbopanel-instance via systemd; "workers" expects manual wrangler dev.
turbopanel_instance_runtime: deno
# Exact git SHA of the instance checkout (set at converge). Injected as
# TURBOPANEL_REVISION so GET /api/health can name Corresponding Source.
turbopanel_instance_revision: ""
wrangler_dev_port: 18787
instance_start: true
postgres_socket_dir: /var/run/turbopanel/postgres
postgres_port: 5432
postgres_expose_port: false
postgres_user: turbopanel
postgres_db: turbopanel
# Service logs always live under /var/log/turbopanel/<svc> (dev shares it with prod).
turbopanel_log_dir: /var/log/turbopanel
instance_log_dir: "{{ turbopanel_log_dir }}/instance"
ui_log_dir: "{{ turbopanel_log_dir }}/ui"
website_log_dir: "{{ turbopanel_log_dir }}/website"
rabbitmq_amqp_port: 5672
rabbitmq_vhost: /
rabbitmq_user: turbopanel
redis_socket_path: /run/turbopanel/redis.sock
# Server metrics on by default; set false to opt out.
turbopanel_server_metrics_retention_days: 90
# Retired separate mailer unit name — kept only so converge can stop/remove
# an older host's turbopanel-mailer.service after email moved in-process.
mailer_service_name: turbopanel-mailer
mailpit_web_port: 8025
mailpit_smtp_port: 1025
dbstudio_service_name: turbopanel-dbstudio
# Co-located: the development Caddyfile serves /downloads/daemon from
# {{ turbopanel_daemon_dir }}/dist when UI_MODE=dev.
# Derived from turbopanel_public_hostname in lets_encrypt so leaf SANs /
# TURBOPANEL_PUBLIC_URLS stay correct without a second source of truth.
# An explicit extra-var still wins (admin public-URL apply).
turbopanel_public_urls: "{{ ('https://' ~ turbopanel_public_hostname) if (turbopanel_tls_mode | default('self_signed') == 'lets_encrypt' and (turbopanel_public_hostname | default('') | length > 0)) else '' }}"
turbopanel_tls_extra_sans: ""
