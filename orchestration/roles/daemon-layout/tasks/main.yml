---
# Managed-node FHS layout. run.sh installs bin/turbopaneld, share/orchestration/,
# and optionally bin/turbopaneld.js (JS-fallback path only) before this playbook runs.

# The config and state roots are sealed (root-owned) later, by the daemon-seal
# role just before the daemon starts; until then a running daemon can still
# write into them. A link the daemon planted at the top of a root is removed
# first, so the tasks below (which never follow links) do not trip over it.
- name: Remove links planted at the top of the config and state roots
  ansible.builtin.include_role:
    name: daemon-seal
    tasks_from: sweep

- name: Ensure production FHS directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    follow: false
    owner: "{{ item.owner | default(turbopanel_user) }}"
    group: "{{ item.group | default(turbopanel_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - {
        path: "{{ turbopanel_install_root }}/bin",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_install_root }}/lib",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_install_root }}/share",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_orchestration_dir }}",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    # Only the tunnels folder below it is the daemon's (a leaf); this one is
    # root's, so the daemon cannot swap it.
    - {
        path: "{{ turbopanel_daemon_state_dir }}/cloudflared",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_run_dir | default('/run/turbopanel') }}",
        mode: "2770",
      }

# The folders the daemon writes directly (P1-1: the config and state roots
# are root-owned, so these leaves are what stays tp-owned). Created here,
# the leaf itself only: nothing below a leaf is ever touched by root.
- name: Ensure the daemon-writable config folders
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "{{ item.mode }}"
    follow: false
  loop: "{{ turbopanel_daemon_config_leaves }}"
  loop_control:
    label: "{{ item.name }}"

- name: Ensure the daemon-writable state folders
  ansible.builtin.file:
    path: "{{ turbopanel_daemon_state_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "{{ item.mode }}"
    follow: false
  loop: "{{ turbopanel_daemon_state_leaves }}"
  loop_control:
    label: "{{ item.name }}"

# The daemon keeps its hardware profile in <state>/metrics. On a daemon-only
# host nothing else creates that folder, so it is a leaf here. On a co-located
# host (turbopanel_after_instance_service) the instance-launch role owns it
# for the instance user (2770, shared with the daemon through the group), so
# this role leaves it alone rather than flip that owner.
- name: Ensure the daemon-writable metrics folder (daemon-only hosts)
  when: not (turbopanel_after_instance_service | default(false) | bool)
  ansible.builtin.file:
    path: "{{ turbopanel_daemon_state_dir }}/metrics"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
    follow: false

- name: Require native daemon binary
  ansible.builtin.stat:
    path: "{{ turbopanel_daemon_bin }}"
  register: _daemon_bin

- name: Require JS fallback
  when: turbopanel_daemon_exec_mode | default('native') == 'js'
  ansible.builtin.stat:
    path: "{{ turbopanel_daemon_js }}"
  register: _daemon_js

- name: Require orchestration tree
  ansible.builtin.stat:
    path: "{{ turbopanel_orchestration_dir }}/ansible.cfg"
  register: _orchestration_cfg

- name: Assert release layout is present (native)
  when: turbopanel_daemon_exec_mode | default('native') != 'js'
  ansible.builtin.assert:
    that:
      - _daemon_bin.stat.exists
      - _daemon_bin.stat.executable
      - _orchestration_cfg.stat.exists
    fail_msg: >-
      Missing production release layout under {{ turbopanel_install_root }}.
      Expected {{ turbopanel_daemon_bin }} and
      {{ turbopanel_orchestration_dir }}/ansible.cfg. run.sh must install the
      clean release package before this playbook runs.

- name: Assert release layout is present (JS fallback)
  when: turbopanel_daemon_exec_mode | default('native') == 'js'
  ansible.builtin.assert:
    that:
      - _daemon_bin.stat.exists
      - _daemon_js.stat.exists
      - _orchestration_cfg.stat.exists
    fail_msg: >-
      Missing production release layout under {{ turbopanel_install_root }}.
      Expected {{ turbopanel_daemon_bin }}, {{ turbopanel_daemon_js }}, and
      {{ turbopanel_orchestration_dir }}/ansible.cfg. run.sh must install the
      JS fallback bundle before this playbook runs.

# Release content root executes: the orchestration tree (tp-orchestrate runs
# its playbooks as root) and the binaries. Root-owned, group-readable, never
# daemon-writable. run.sh extracts the tree as root already; this pins it on
# every converge so nothing can hand it back to the daemon account.
- name: Ensure the orchestration tree and binaries are root-owned
  ansible.builtin.file:
    path: "{{ item }}"
    owner: root
    group: "{{ turbopanel_group }}"
    recurse: true
  loop:
    - "{{ turbopanel_orchestration_dir }}"
    - "{{ turbopanel_install_root }}/bin"

- name: Ensure orchestration helpers are executable by the daemon group only
  ansible.builtin.file:
    path: "{{ turbopanel_orchestration_dir }}/scripts/{{ item }}"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"
  loop:
    - ensure-single-daemon.sh
    - tp-orchestrate
