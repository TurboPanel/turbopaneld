---
# Managed-node FHS layout. run.sh installs bin/turbopaneld, share/orchestration/,
# and optionally bin/turbopaneld.js (JS-fallback path only) before this playbook runs.

- name: Ensure production FHS directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(turbopanel_user) }}"
    group: "{{ item.group | default(turbopanel_group) }}"
    mode: "{{ item.mode }}"
  loop:
    - {
        path: "{{ turbopanel_install_root }}/bin",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_install_root }}/lib",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - {
        path: "{{ turbopanel_install_root }}/share",
        mode: "0750",
        owner: "root",
        group: "{{ turbopanel_group }}",
      }
    - { path: "{{ turbopanel_orchestration_dir }}", mode: "0750" }
    - { path: "{{ turbopanel_config_dir }}", mode: "0750" }
    - { path: "{{ turbopanel_daemon_state_dir }}", mode: "0750" }
    - {
        path: "{{ turbopanel_daemon_state_dir }}/cloudflared/tunnels",
        mode: "0750",
      }
    - {
        path: "{{ turbopanel_run_dir | default('/run/turbopanel') }}",
        mode: "2770",
      }

- name: Require native daemon binary
  ansible.builtin.stat:
    path: "{{ turbopanel_daemon_bin }}"
  register: _daemon_bin

- name: Require JS fallback
  when: turbopanel_daemon_exec_mode | default('native') == 'js'
  ansible.builtin.stat:
    path: "{{ turbopanel_daemon_js }}"
  register: _daemon_js

- name: Require orchestration tree
  ansible.builtin.stat:
    path: "{{ turbopanel_orchestration_dir }}/ansible.cfg"
  register: _orchestration_cfg

- name: Assert release layout is present (native)
  when: turbopanel_daemon_exec_mode | default('native') != 'js'
  ansible.builtin.assert:
    that:
      - _daemon_bin.stat.exists
      - _daemon_bin.stat.executable
      - _orchestration_cfg.stat.exists
    fail_msg: >-
      Missing production release layout under {{ turbopanel_install_root }}.
      Expected {{ turbopanel_daemon_bin }} and
      {{ turbopanel_orchestration_dir }}/ansible.cfg. run.sh must install the
      clean release package before this playbook runs.

- name: Assert release layout is present (JS fallback)
  when: turbopanel_daemon_exec_mode | default('native') == 'js'
  ansible.builtin.assert:
    that:
      - _daemon_bin.stat.exists
      - _daemon_js.stat.exists
      - _orchestration_cfg.stat.exists
    fail_msg: >-
      Missing production release layout under {{ turbopanel_install_root }}.
      Expected {{ turbopanel_daemon_bin }}, {{ turbopanel_daemon_js }}, and
      {{ turbopanel_orchestration_dir }}/ansible.cfg. run.sh must install the
      JS fallback bundle before this playbook runs.

- name: Ensure ensure-single-daemon helper is executable
  ansible.builtin.file:
    path: "{{ turbopanel_orchestration_dir }}/scripts/ensure-single-daemon.sh"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"
