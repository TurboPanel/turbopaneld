---
# The only folders the daemon account writes directly under the config and
# state roots. Keep in step with DAEMON_CONFIG_LEAVES / DAEMON_STATE_LEAVES in
# src/paths/layout.ts (pinned by src/orchestration/daemon-layout-leaves.test.ts).
# Root tasks may act on a leaf itself, never on anything inside it.
turbopanel_daemon_config_leaves:
  - { name: docker, mode: "0750" }
  - { name: proxysql, mode: "0750" }
  - { name: orchestrator, mode: "0750" }
  - { name: node-apps, mode: "0750" }
  - { name: hosting, mode: "0750" }
turbopanel_daemon_state_leaves:
  - { name: update, mode: "0750" }
  - { name: system, mode: "0750" }
  - { name: deployments, mode: "0750" }
  - { name: ingress, mode: "0750" }
  - { name: sites, mode: "0750" }
  - { name: storage, mode: "0750" }
  - { name: managed, mode: "0750" }
  - { name: managed-intent, mode: "0700" }
  - { name: backup, mode: "0750" }
  - { name: spool, mode: "0700" }
  - { name: network, mode: "0700" }
  - { name: cloudflared/tunnels, mode: "0750" }
  - { name: tls, mode: "0750" }
  - { name: orchestrator, mode: "0750" }

# P1-1: the config and state roots are root-owned on managed hosts (the daemon
# writes only its own folders below them: DAEMON_*_LEAVES in src/paths/layout.ts).
# Co-located dev (turbopanel_dev_user set) keeps the dev user as owner. The
# co-located control-plane playbooks keep the state root shared with the
# instance (turbopanel_seal_state_root: false) until its hand-off is reworked.
# Same lines in the daemon-layout, daemon-config and turbopanel-user defaults
# (pinned by src/orchestration/platform-roots-sealed.test.ts).
turbopanel_seal_config_root: "{{ turbopanel_dev_user | default('') | length == 0 }}"
turbopanel_seal_state_root: "{{ turbopanel_dev_user | default('') | length == 0 }}"
turbopanel_config_root_owner: "{{ 'root' if turbopanel_seal_config_root | bool else (turbopanel_user | default('tp')) }}"
turbopanel_state_root_owner: "{{ 'root' if turbopanel_seal_state_root | bool else (turbopanel_user | default('tp')) }}"
