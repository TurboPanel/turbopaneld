galaxy_info:
  role_name: docker
  author: turbopanel
  license: AGPL-3.0
  description: >
    Install Docker CE via the geerlingguy.docker Galaxy role (official Docker
    apt repository, deb822 repo format), start the service, and add the
    turbopanel and co-located dev users to the docker group.
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - trixie
    - name: Raspbian
      versions:
        - trixie
