---
# Entry point for daemon-converge (`import_role: name: docker, tasks_from: converge-group`).
# Existing managed hosts were provisioned with the daemon in the docker group;
# this takes it out on the next converge. Co-located dev hosts keep it (no gate).

- name: Take the daemon user out of the docker group on a managed host
  ansible.builtin.include_tasks: remove-daemon-from-group.yml
  when: turbopanel_dev_user | default('') | length == 0
