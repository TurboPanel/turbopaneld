---
# Merge org-wide dockerd addressing and live-restore into
# /etc/docker/daemon.json.
#
# Included from tasks/main.yml whenever turbopanel_docker_manage_daemon_json
# is true. `live-restore: true` is always asserted; `default-address-pools` /
# `bip` are set from the vars when non-empty and REMOVED when empty (so
# clearing the org config strips what an earlier apply wrote and dockerd
# falls back to its built-in defaults).
#
# Merge, never overwrite: the existing file is read, the three owned keys
# above are set/removed (plus builder.entitlements network-host and
# security-insecure, forced false unless turbopanel_docker_deny_builder_entitlements
# is false), every other operator key is preserved verbatim. The
# write is a real content diff, so a host with nothing to change writes
# nothing and restarts nothing.
#
# `Restart docker` (handlers/main.yml) fires on a real diff — except on a
# host that also runs the co-located self-hosted instance
# (/etc/systemd/system/turbopanel-instance.service present): dockerd fronts
# that instance's own Postgres and RabbitMQ containers there, with no
# live-restore in effect yet on the very run that turns it on, so an
# automatic restart is a control-plane outage. That host's operator restarts
# dockerd by hand once live-restore is confirmed written.

- name: Check whether this host runs the co-located self-hosted instance
  ansible.builtin.stat:
    path: /etc/systemd/system/turbopanel-instance.service
  register: _docker_instance_unit_stat

- name: Set the co-located-instance-host fact
  ansible.builtin.set_fact:
    _docker_colocated_instance_host: "{{ _docker_instance_unit_stat.stat.exists }}"

- name: Check for an existing daemon.json
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
  register: _docker_daemon_json_stat

- name: Read the existing daemon.json
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: _docker_daemon_json_slurp
  when: _docker_daemon_json_stat.stat.exists and _docker_daemon_json_stat.stat.size > 0

- name: Decode the existing daemon.json (empty when missing)
  ansible.builtin.set_fact:
    _docker_daemon_json_current: >-
      {{
        (_docker_daemon_json_slurp.content | b64decode | from_json)
        if (_docker_daemon_json_slurp is not skipped and _docker_daemon_json_slurp.content is defined)
        else {}
      }}

- name: Assert the existing daemon.json is a JSON object
  ansible.builtin.assert:
    that: _docker_daemon_json_current is mapping
    fail_msg: >-
      /etc/docker/daemon.json exists but is not a JSON object; refusing to
      merge address pools into it. Fix the file by hand or set
      turbopanel_docker_manage_daemon_json: false.

# Builder backstop: BuildKit entitlements `network.host` and `security.insecure`
# are refused by the engine itself (`builder.entitlements` in daemon.json), so
# a build asking for them fails with "granting entitlement ... is not allowed
# by build daemon configuration" whatever the Docker gate does or does not see.
# Only those two entitlement keys are owned; the rest of `builder` (gc ...) and
# any other entitlement is kept. An engine too old to know the key ignores it.
- name: Build the builder section with the entitlements denied
  ansible.builtin.set_fact:
    _docker_builder_merged: >-
      {{
        (_docker_daemon_json_current.builder
          if (_docker_daemon_json_current.builder is defined
              and _docker_daemon_json_current.builder is mapping)
          else {})
        | combine({'entitlements':
            ((_docker_daemon_json_current.builder.entitlements
                if (_docker_daemon_json_current.builder is defined
                    and _docker_daemon_json_current.builder is mapping
                    and _docker_daemon_json_current.builder.entitlements is defined
                    and _docker_daemon_json_current.builder.entitlements is mapping)
                else {})
              | combine({'network-host': false, 'security-insecure': false}))})
      }}
  when: turbopanel_docker_deny_builder_entitlements | bool

# Drop the three owned keys first so an empty var removes a previously
# written value instead of leaving it behind; everything else passes through
# as-is. live-restore is always forced true — never conditionally combined
# — since it has no "clear" case the way the address-pool keys do.
# Converge on an already-provisioned host (tasks/converge-builder.yml) knows
# neither the org's address pools nor whether this host applied any, so it must
# not strip or rewrite them: only the builder section is merged there.
- name: Build the merged daemon.json (builder entitlements only)
  ansible.builtin.set_fact:
    _docker_daemon_json_merged: >-
      {{ _docker_daemon_json_current | combine({'builder': _docker_builder_merged}) }}
  when: turbopanel_docker_builder_only | bool

- name: Build the merged daemon.json (owned keys only; other keys preserved)
  ansible.builtin.set_fact:
    _docker_daemon_json_merged: >-
      {{
        _docker_daemon_json_current
        | dict2items
        | rejectattr('key', 'in', ['default-address-pools', 'bip', 'live-restore'])
        | list
        | items2dict
        | combine({'live-restore': true})
        | combine(
            ({'default-address-pools': turbopanel_docker_address_pools}
              if (turbopanel_docker_address_pools | length > 0) else {})
          )
        | combine(
            ({'bip': turbopanel_docker_default_bridge_cidr}
              if (turbopanel_docker_default_bridge_cidr | length > 0) else {})
          )
        | combine(
            ({'builder': _docker_builder_merged}
              if (turbopanel_docker_deny_builder_entitlements | bool) else {})
          )
      }}
  when: not (turbopanel_docker_builder_only | bool)

- name: Ensure /etc/docker exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Announce the daemon.json write
  ansible.builtin.debug:
    msg: >-
      Writing /etc/docker/daemon.json (live-restore: true
      {{ ', removing default-address-pools/bip — Docker built-in defaults apply'
          if (turbopanel_docker_address_pools | length == 0
              and turbopanel_docker_default_bridge_cidr | length == 0)
          else ', setting default-address-pools/bip' }}).
      {{ 'This host runs the co-located instance — dockerd will NOT be restarted automatically; restart it by hand once you have confirmed the new file.'
          if _docker_colocated_instance_host
          else 'dockerd RESTARTS. Existing containers keep their current addresses and existing networks keep their subnets — the pools only affect networks created afterwards.' }}
  when: >-
    (_docker_daemon_json_merged | to_nice_json)
    != (_docker_daemon_json_current | to_nice_json)

- name: Write /etc/docker/daemon.json
  ansible.builtin.copy:
    content: "{{ _docker_daemon_json_merged | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0640"
    backup: true
  register: _docker_daemon_json_write
  notify: Restart docker

# The handler never restarts dockerd on a co-located instance host, so a change
# there would otherwise never take effect. Leave a root-owned marker instead,
# and on this and every later converge restart dockerd once the RUNNING dockerd
# already has live-restore (containers, the instance's included, keep running
# across the restart). Until then every converge says a restart is pending.
- name: Mark a dockerd restart pending on a co-located instance host
  ansible.builtin.copy:
    dest: "{{ turbopanel_docker_restart_pending_file }}"
    content: "daemon.json changed; dockerd has not been restarted to apply it\n"
    owner: root
    group: root
    mode: "0640"
  when:
    - _docker_daemon_json_write is changed
    - _docker_colocated_instance_host | bool

- name: Look for a pending dockerd restart
  ansible.builtin.stat:
    path: "{{ turbopanel_docker_restart_pending_file }}"
  register: _docker_restart_pending

- name: Ask the running dockerd whether live-restore is in effect
  ansible.builtin.command:
    argv:
      - docker
      - info
      - --format
      - "{{ '{{.LiveRestoreEnabled}}' }}"
  register: _docker_live_restore_running
  changed_when: false
  failed_when: false
  when: _docker_restart_pending.stat.exists

- name: Restart dockerd now that live-restore keeps containers running
  ansible.builtin.systemd:
    name: docker
    state: restarted
  register: _docker_pending_restart
  when:
    - _docker_restart_pending.stat.exists
    - (_docker_live_restore_running.stdout | default('') | trim) == 'true'

- name: Clear the pending dockerd restart
  ansible.builtin.file:
    path: "{{ turbopanel_docker_restart_pending_file }}"
    state: absent
  when: _docker_pending_restart is changed

- name: Warn that dockerd still needs a restart
  ansible.builtin.debug:
    msg: >-
      dockerd restart pending ({{ turbopanel_docker_restart_pending_file }}):
      the running dockerd does not report live-restore, so it was not
      restarted automatically. Restart it by hand; the next converge clears
      the marker once live-restore is running.
  when:
    - _docker_restart_pending.stat.exists
    - _docker_pending_restart is not changed
