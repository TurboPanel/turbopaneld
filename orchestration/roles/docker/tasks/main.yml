---
# TurboPanel wrapper around geerlingguy.docker (Ansible Galaxy).
#
# Fast-path: if the docker binary exists and the service is active, skip
# everything. Otherwise delegate to the Galaxy role, which handles Debian
# Trixie/Raspbian repo setup (deb822), package install, service start, and
# docker group membership.

- name: Check Docker binary
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: _docker_bin

- name: Check Docker service state
  ansible.builtin.command: systemctl is-active docker
  register: _docker_svc
  changed_when: false
  failed_when: false

- name: Set _docker_ready fact
  ansible.builtin.set_fact:
    _docker_ready: "{{ _docker_bin.stat.exists and _docker_svc.stdout == 'active' }}"

- name: Docker already installed and running
  ansible.builtin.debug:
    msg: "Docker is already installed and running — skipping installation"
  when: _docker_ready | bool

- name: Install Docker
  when: not _docker_ready | bool
  block:
    - name: Assert supported CPU architecture
      ansible.builtin.assert:
        that:
          - ansible_architecture in _docker_arch_map
        fail_msg: >-
          Unsupported CPU architecture '{{ ansible_architecture }}'.
          TurboPanel supports: {{ _docker_arch_map.keys() | list | join(', ') }}.

    - name: Assert supported Linux distribution
      ansible.builtin.assert:
        that:
          - ansible_distribution in _docker_distro_map
        fail_msg: >-
          Unsupported distribution '{{ ansible_distribution }}'.
          TurboPanel supports: {{ _docker_distro_map.keys() | list | join(', ') }}.

    - name: Install Docker via geerlingguy.docker Galaxy role
      ansible.builtin.include_role:
        name: geerlingguy.docker
      vars:
        docker_users:
          - "{{ docker_user }}"
        docker_install_compose_plugin: true
