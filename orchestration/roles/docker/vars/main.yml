# Architecture values as reported by Ansible (ansible_architecture) mapped to
# the Docker apt repository arch label. Only amd64 and arm64 are supported.
# When a new arch is added, extend this map and add a matching tasks file.
_docker_arch_map:
  x86_64: amd64
  aarch64: arm64

# Distribution names as reported by Ansible (ansible_distribution) mapped to
# the path segment of Docker's apt repository
# (https://download.docker.com/linux/<segment>). When a new distro family is
# added, extend this map and _docker_fallback_suite.
_docker_distro_map:
  Debian: debian
  Ubuntu: ubuntu
  Raspbian: raspbian

# Docker's official apt repository (tasks/install.yml). The signing key is
# fetched over HTTPS at install time and refused unless it carries this
# fingerprint (Docker's published release key; public, not a secret).
_docker_repo_base: https://download.docker.com/linux
_docker_repo_key_fingerprint: 9DC858229FC7DD38854AE2D88D81803C0EBFCD88
_docker_repo_key_path: /etc/apt/keyrings/docker.asc
_docker_repo_sources_path: /etc/apt/sources.list.d/docker.sources

# Suite used when Docker has not published packages for this release's own
# codename yet (a brand-new Debian or Ubuntu release). The newest suite Docker
# is known to ship; its packages install on the newer release.
_docker_fallback_suite:
  Debian: bookworm
  Ubuntu: noble
  Raspbian: bookworm

# Packages installed from the repository: the engine, CLI, containerd, and the
# BuildKit and Compose plugins TurboPanel's builds and stacks rely on.
_docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
