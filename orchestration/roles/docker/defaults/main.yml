# OS user the daemon runs as. This user is added to the docker group so the
# daemon process can talk to the Docker socket without sudo.
docker_user: tp

# Future toggle: when true, the role will configure rootless Docker (not yet
# implemented). Playbooks may reference this variable now without breaking.
docker_rootless: false

# When true, docker_user is added to the docker group. Must be false when
# docker_rootless is true — rootless Docker does not use the docker group.
docker_add_turbopanel_user: true

# Co-located dev: human developer invoking ./console (passed as extra-var).
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]

# Org-wide dockerd addressing merged into /etc/docker/daemon.json
# (tasks/daemon-json.yml). All three are passed by the daemon as one JSON
# `-e` object (runDockerSetup) so the list stays a list. Both values empty
# and the clear flag off = strict no-op: daemon.json is not read, not
# written, and dockerd is not restarted.
#
# turbopanel_docker_address_pools → dockerd `default-address-pools`
#   [{ base: "10.200.0.0/16", size: 24 }, ...]
# turbopanel_docker_default_bridge_cidr → dockerd `bip` ("172.17.0.1/16")
# turbopanel_docker_clear_addressing → run the merge even though both values
#   are empty, so a previously written `default-address-pools` / `bip` is
#   REMOVED from daemon.json (Docker's built-in defaults take over). The
#   daemon sets it when an empty org config replaces one it applied earlier.
#   Whenever the merge runs, a key whose value is empty is removed, so the
#   file always mirrors the org config for those two keys.
turbopanel_docker_address_pools: []  # noqa: var-naming[no-role-prefix]
turbopanel_docker_default_bridge_cidr: ""  # noqa: var-naming[no-role-prefix]
turbopanel_docker_clear_addressing: false  # noqa: var-naming[no-role-prefix]

# Master switch for the daemon.json merge. Set false to leave the file alone
# entirely (an operator who manages daemon.json by other means).
turbopanel_docker_manage_daemon_json: true  # noqa: var-naming[no-role-prefix]

# Backstop for the Docker gate: the engine's own builder refuses the
# `network.host` and `security.insecure` build entitlements (daemon.json
# builder.entitlements). Forced false in the merge; set false to leave the
# operator's builder section alone. Changing daemon.json restarts dockerd
# (live-restore keeps containers up) except on a co-located instance host.
turbopanel_docker_deny_builder_entitlements: true  # noqa: var-naming[no-role-prefix]
# Marker for a daemon.json change dockerd has not been restarted for (a
# co-located instance host, where the handler never restarts it).
turbopanel_docker_restart_pending_file: /etc/docker/turbopanel-restart-pending  # noqa: var-naming[no-role-prefix]

# Dedicated cgroup parent written to daemon.json as `cgroup-parent` so the
# metrics collector reads every container's CPU, memory and OOM kills from one
# cgroup v2 slice. Must match CONTAINER_CGROUP_PARENT in
# src/metrics/collector/container-cgroup.ts. Empty = leave daemon.json alone
# (an operator-set value is preserved).
turbopanel_docker_cgroup_parent: turbopanel-containers.slice  # noqa: var-naming[no-role-prefix]

# Always-on egress block for containers and builds (audit P1-4): drops
# link-local / cloud-metadata destinations entering from docker0 and br-+ in
# DOCKER-USER (and INPUT for the host's own link-local addresses), IPv4 and
# IPv6, with a DNS exception for link-local resolvers. See
# files/turbopanel-docker-egress. Independent of the opt-in host firewall.
turbopanel_docker_egress_guard: true  # noqa: var-naming[no-role-prefix]
turbopanel_docker_egress_script: /opt/turbopanel/lib/docker-egress  # noqa: var-naming[no-role-prefix]

# Merge only the builder entitlement deny and leave every other daemon.json key
# (address pools, bip, live-restore) as found. Set by tasks/converge-builder.yml,
# which daemon-converge runs on hosts the docker role provisioned earlier.
turbopanel_docker_builder_only: false  # noqa: var-naming[no-role-prefix]

# --- Docker Engine install (tasks/install.yml) ---

# Docker's apt repository base. Point it at a local mirror (the path below it
# must match download.docker.com/linux/<distro>/) for restricted networks.
turbopanel_docker_repo_base: https://download.docker.com/linux  # noqa: var-naming[no-role-prefix]

# Offline install: a directory holding the Docker .deb files with a flat apt
# index (Packages file, as made by dpkg-scanpackages), e.g. shipped with the
# release. When set, nothing is fetched from download.docker.com: the directory
# becomes a trusted local repository (root-owned directory required). Empty =
# use the online repository.
turbopanel_docker_offline_dir: ""  # noqa: var-naming[no-role-prefix]

# docker-ce / docker-ce-cli version, an apt version glob. Default = the Docker
# stable release current when this role was last updated. Hosts are held at
# this version (apt-mark hold) because Debian's unattended-upgrades does not
# match Docker's repository: upgrades go through this role only, by changing
# this variable (or setting it to "" for the newest release) and running with
# turbopanel_docker_upgrade: true. Docker's live-restore keeps containers up
# across PATCH releases; a MINOR release (29.8 to 29.9) may not be safe, so
# treat those as maintenance events.
turbopanel_docker_version: "5:29.9.2-1~*"  # noqa: var-naming[no-role-prefix]
turbopanel_docker_upgrade: false  # noqa: var-naming[no-role-prefix]

# Remove distribution packages that conflict with Docker's (docker.io,
# containerd, runc, podman-docker, ...) before installing. Refused when the
# distribution engine already runs containers; remove them first or recreate
# them after the swap.
turbopanel_docker_remove_conflicting: true  # noqa: var-naming[no-role-prefix]

# Docker repository key policy: warn (default; a key outside the fingerprint
# list is used with a WARN), enforce (fail on a different key) or bundled
# (never fetch, use files/docker.asc). Key and fingerprint: files/docker.asc.json.
docker_key_policy: warn

# Extra accepted key fingerprints (40 hex characters), added to the built-in
# list (vars/main.yml) so a rotated Docker key is accepted without a release.
turbopanel_docker_extra_key_fingerprints: []  # noqa: var-naming[no-role-prefix]

# Optional packages the engine uses but only Recommends: (AppArmor profile for
# containers, parallel image decompression).
turbopanel_docker_extra_packages: [apparmor, pigz]  # noqa: var-naming[no-role-prefix]

# daemon.json defaults for log rotation and descriptor limits (tasks/daemon-json.yml).
# Operator-set values in an existing daemon.json win; empty log driver = leave
# logging alone. Only NEW containers pick up the log settings.
turbopanel_docker_log_driver: local  # noqa: var-naming[no-role-prefix]
turbopanel_docker_log_max_size: 20m  # noqa: var-naming[no-role-prefix]
turbopanel_docker_log_max_file: "5"  # noqa: var-naming[no-role-prefix]
turbopanel_docker_default_nofile: 65536  # noqa: var-naming[no-role-prefix]

# True only while install.yml writes daemon.json ahead of the very first
# dockerd start: there is nothing to restart yet.
_docker_fresh_install: false
