---
# The self-hosted instance runs as a dedicated, low-privilege user that is a
# member of the turbopanel group but owns no group of its own. This lets it
# read/write the shared /run/turbopanel socket dir (group turbopanel) without
# the sudo rights the daemon user holds.
instance_user: instance
instance_uid: 9998
turbopanel_group: turbopanel
turbopanel_install_root: /opt/turbopanel
turbopanel_instance_dir: "{{ turbopanel_install_root }}/platform/turbopanel"
