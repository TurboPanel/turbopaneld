---
# The self-hosted instance runs as a dedicated, low-privilege user with primary
# group turbopaneli and supplementary membership in turbopanel. This lets it
# read/write the shared /run/turbopanel socket dir (group turbopanel) without
# the sudo rights the daemon user holds.
instance_user: instance
instance_uid: 9998
instance_primary_group: turbopaneli
instance_primary_gid: 9998
turbopanel_user: turbopanel
turbopanel_group: turbopanel
turbopanel_install_root: /opt/turbopanel
turbopanel_instance_dir: "{{ turbopanel_install_root }}/platform/instance"
instance_service_name: turbopanel-instance
caddy_service_name: turbopanel-caddy
ui_service_name: turbopanel-ui
mailer_service_name: turbopanel-mailer
