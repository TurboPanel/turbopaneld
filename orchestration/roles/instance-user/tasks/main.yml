---
# Requires the turbopanel group to already exist (turbopanel-user role).
- name: Check whether instance user already exists
  ansible.builtin.getent:
    database: passwd
    key: "{{ instance_user }}"
  register: _instance_user_getent
  failed_when: false

- name: Detect existing instance user account
  ansible.builtin.set_fact:
    _instance_user_exists: >-
      {{
        _instance_user_getent.ansible_facts.getent_passwd is defined
        and _instance_user_getent.ansible_facts.getent_passwd[instance_user] is defined
      }}

- name: Detect instance user uid mismatch
  ansible.builtin.set_fact:
    _instance_user_uid_mismatch: >-
      {{
        _instance_user_exists | bool
        and (
          _instance_user_getent.ansible_facts.getent_passwd[instance_user][1] | int
          != instance_uid | int
        )
      }}

- name: Stop instance stack units before user account changes
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
  loop:
    - "{{ mailer_service_name }}"
    - "{{ website_service_name }}"
    - "{{ ui_service_name }}"
    - "{{ caddy_service_name }}"
    - "{{ instance_service_name }}"
  when: _instance_user_uid_mismatch | bool
  failed_when: false

- name: Wait for instance user processes to exit after stopping instance stack
  ansible.builtin.command:
    cmd: "pgrep -u {{ instance_user }}"
  register: _instance_user_pgrep
  until: _instance_user_pgrep.rc == 1
  retries: 15
  delay: 1
  changed_when: false
  failed_when: false
  when: _instance_user_uid_mismatch | bool

- name: Ensure turbopaneli primary group for instance user
  ansible.builtin.group:
    name: "{{ instance_primary_group }}"
    gid: "{{ instance_primary_gid }}"
    state: present
    system: true

- name: Ensure instance user (primary group turbopaneli, supplementary turbopanel)
  ansible.builtin.user:
    name: "{{ instance_user }}"
    uid: "{{ instance_uid }}"
    group: "{{ instance_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    home: "{{ turbopanel_instance_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Ensure instance checkout directory owned by turbopanel:turbopanel (group-writable)
  ansible.builtin.file:
    path: "{{ turbopanel_instance_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"
