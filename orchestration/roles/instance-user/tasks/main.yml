---
# Requires the turbopanel group to already exist (turbopanel-user role).
#
# Co-located dev collapses the instance stack onto the single human dev user,
# which already exists on the host — so none of the dedicated tpctrl(9998)
# account/group provisioning runs in dev (guarded on turbopanel_dev_user). The
# shared-checkout 2770 ownership model is retired: the home-dir checkout is owned
# solely by the single dev user (handled by the repo-clone roles).
- name: Ensure tpctrl primary group for instance user
  ansible.builtin.group:
    name: "{{ instance_primary_group }}"
    gid: "{{ instance_primary_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Check whether redis access group exists
  ansible.builtin.getent:
    database: group
    key: "{{ redis_primary_group }}"
  register: _instance_redis_group_getent
  failed_when: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Build supplementary group list for instance user
  ansible.builtin.set_fact:
    _instance_supplementary_groups: >-
      {{
        [turbopanel_group]
        + (
          [redis_primary_group]
          if (
            _instance_redis_group_getent.ansible_facts.getent_group is defined
            and _instance_redis_group_getent.ansible_facts.getent_group[redis_primary_group] is defined
          )
          else []
        )
      }}
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure instance user (primary group tpctrl, supplementary tp + tpcache)
  ansible.builtin.user:
    name: "{{ instance_user }}"
    uid: "{{ instance_uid }}"
    group: "{{ instance_primary_group }}"
    groups: "{{ _instance_supplementary_groups | unique | join(',') }}"
    append: true
    home: "{{ turbopanel_instance_dir }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure tpcaddy primary group for caddy user
  ansible.builtin.group:
    name: "{{ caddy_primary_group }}"
    gid: "{{ caddy_primary_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure caddy service user (primary group tpcaddy, supplementary tp)
  ansible.builtin.user:
    name: "{{ caddy_user }}"
    uid: "{{ caddy_uid }}"
    group: "{{ caddy_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0
