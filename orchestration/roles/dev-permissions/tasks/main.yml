---
- name: Configure co-located dev checkout permissions
  when: turbopanel_dev_user | length > 0
  block:
    - name: Read dev permissions identity stamp
      ansible.builtin.slurp:
        path: /etc/turbopanel/dev-permissions-identity.stamp
      register: _dev_identity_stamp_raw
      failed_when: false

    - name: Set dev identity stamp facts
      ansible.builtin.set_fact:
        _dev_identity_stamp_expected: "{{ turbopanel_dev_user }}:{{ turbopanel_dev_uid }}:{{ turbopanel_dev_gid }}"
        _dev_identity_stamp_current: >-
          {{ (_dev_identity_stamp_raw.content | b64decode | trim)
             if (_dev_identity_stamp_raw.content is defined) else '' }}

    - name: Set dev identity changed flag
      ansible.builtin.set_fact:
        _dev_identity_changed: "{{ _dev_identity_stamp_current != _dev_identity_stamp_expected }}"

    - name: Write dev permissions identity stamp
      ansible.builtin.copy:
        content: "{{ _dev_identity_stamp_expected }}"
        dest: /etc/turbopanel/dev-permissions-identity.stamp
        owner: root
        group: root
        mode: "0644"
      when: _dev_identity_changed | bool

    - name: Add dev user to turbopanel group (supplementary)
      ansible.builtin.user:
        name: "{{ turbopanel_dev_user }}"
        groups: "{{ turbopanel_group }}"
        append: true

    - name: Add dev user to docker group (co-located dev)
      ansible.builtin.user:
        name: "{{ turbopanel_dev_user }}"
        groups: docker
        append: true

    - name: Set setgid on platform checkouts
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        mode: "2770"
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"

    - name: Apply group access ACL on checkout roots
      ansible.posix.acl:
        path: "{{ item }}"
        entity: "{{ turbopanel_group }}"
        etype: group
        permissions: rwx
        state: present
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"

    - name: Apply default group ACL on checkout roots
      ansible.posix.acl:
        path: "{{ item }}"
        entity: "{{ turbopanel_group }}"
        etype: group
        permissions: rwx
        state: present
        default: true
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"

    - name: Apply dev user access ACL on checkout roots
      ansible.posix.acl:
        path: "{{ item }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rwx
        state: present
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"

    - name: Apply default dev user ACL on checkout roots
      ansible.posix.acl:
        path: "{{ item }}"
        entity: "{{ turbopanel_dev_user }}"
        etype: user
        permissions: rwx
        state: present
        default: true
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"

    - name: Stat checkout normalizer script
      ansible.builtin.stat:
        path: "{{ turbopanel_daemon_dir }}/scripts/normalize-dev-checkout.sh"
      register: checkout_normalizer_script

    - name: Reclaim dev-owned checkout files for turbopanel
      ansible.builtin.command:
        cmd: >-
          {{ turbopanel_daemon_dir }}/scripts/normalize-dev-checkout.sh {{ item }}
          {{ '--force' if (_dev_identity_changed | bool) else '--check-stamp' }}
      environment:
        TURBOPANEL_DEV_USER: "{{ turbopanel_dev_user }}"
        TURBOPANEL_DEV_UID: "{{ turbopanel_dev_uid }}"
        TURBOPANEL_DEV_GID: "{{ turbopanel_dev_gid }}"
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"
      changed_when: false
      when: checkout_normalizer_script.stat.exists | default(false)

    # Dev runs git from the IDE; checkouts are owned by turbopanel:turbopanel (Git 2.35+).
    - name: Read existing safe.directory entries for dev user
      ansible.builtin.command:
        argv: [git, config, --global, --get-all, safe.directory]
      become_user: "{{ turbopanel_dev_user }}"
      register: _git_safe_dev_dirs
      changed_when: false
      failed_when: false

    - name: Mark platform repos as safe git directories for dev user
      ansible.builtin.command:
        argv: [git, config, --global, --add, safe.directory, "{{ item }}"]
      become_user: "{{ turbopanel_dev_user }}"
      loop:
        - "{{ turbopanel_daemon_dir }}"
        - "{{ turbopanel_instance_dir }}"
        - "{{ turbopanel_ui_dir }}"
      when: item not in (_git_safe_dev_dirs.stdout_lines | default([]))

    - name: Stat instance dist directory
      ansible.builtin.stat:
        path: "{{ turbopanel_instance_dir }}/dist"
      register: instance_dist_stat

    - name: Remove dev-editable access ACL from instance dist
      when: instance_dist_stat.stat.isdir | default(false)
      ansible.posix.acl:
        path: "{{ turbopanel_instance_dir }}/dist"
        entity: "{{ turbopanel_group }}"
        etype: group
        state: absent
        recursive: true

    - name: Remove dev-editable default ACL from instance dist
      when: instance_dist_stat.stat.isdir | default(false)
      ansible.posix.acl:
        path: "{{ turbopanel_instance_dir }}/dist"
        entity: "{{ turbopanel_group }}"
        etype: group
        state: absent
        default: true
        recursive: true

    - name: Stat UI dist directory
      ansible.builtin.stat:
        path: "{{ turbopanel_ui_dir }}/dist"
      register: ui_dist_stat

    - name: Remove dev-editable access ACL from UI dist
      when: ui_dist_stat.stat.isdir | default(false)
      ansible.posix.acl:
        path: "{{ turbopanel_ui_dir }}/dist"
        entity: "{{ turbopanel_group }}"
        etype: group
        state: absent
        recursive: true

    - name: Remove dev-editable default ACL from UI dist
      when: ui_dist_stat.stat.isdir | default(false)
      ansible.posix.acl:
        path: "{{ turbopanel_ui_dir }}/dist"
        entity: "{{ turbopanel_group }}"
        etype: group
        state: absent
        default: true
        recursive: true
