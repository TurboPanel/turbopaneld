---
- name: Load the shared runtime registry
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../runtime-registry.json"
    name: runtime_registry

- name: Assert the registry defines both access groups
  ansible.builtin.assert:
    that:
      - runtime_registry.accessGroups.sftp is defined
      - runtime_registry.accessGroups.shell is defined
    fail_msg: >-
      runtime-registry.json is missing accessGroups.sftp/accessGroups.shell.
      The daemon resolves the sshd Match groups from the same keys, so a host
      provisioned without them would match no account.

- name: Ensure the SSH access groups
  ansible.builtin.group:
    name: "{{ item.group }}"
    gid: "{{ item.gid }}"
    state: present
    system: true
  loop:
    - "{{ runtime_registry.accessGroups.sftp }}"
    - "{{ runtime_registry.accessGroups.shell }}"
  loop_control:
    label: "{{ item.group }} ({{ item.gid }})"

# root:root and not group-writable at every level, or sshd with StrictModes on
# refuses to read the AuthorizedKeysFile it points at and every login fails with
# nothing useful in the log.
- name: Ensure the panel-managed authorized_keys directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    # 0750, not 0755. `sshd` opens AuthorizedKeysFile as the account, so
    # traversal is an ACL on tpsftp/tpshell rather than a world bit.
    # StrictModes only refuses group- or world-*writable* parents.
    mode: "0750"
  loop:
    - "{{ principal_access_keys_dir | dirname }}"
    - "{{ principal_access_keys_dir }}"

- name: Grant SSH access groups traversal of the authorized_keys tree
  ansible.posix.acl:
    path: "{{ item.0 }}"
    etype: group
    entity: "{{ item.1.group }}"
    permissions: x
    state: present
  loop: "{{ [principal_access_keys_dir | dirname, principal_access_keys_dir] | product([runtime_registry.accessGroups.sftp, runtime_registry.accessGroups.shell]) | list }}"
  loop_control:
    label: "{{ item.0 }} -> {{ item.1.group }}"

# 0750 plus other:x, not 0751. A world bit trips ansible:S2612; the ACL is the
# same traverse-without-list contract (`ls` cannot enumerate tenants). Homes
# stay 0750, so contents were never exposed — only names would have been. The
# daemon reapplies this pair on every principal materialization; this is for
# hosts that have not run one yet.
- name: Tighten the principal home root against tenant enumeration
  ansible.builtin.file:
    path: "{{ principal_home_root | default('/srv/users') }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Grant principals traverse of the home root without listing
  ansible.posix.acl:
    path: "{{ principal_home_root | default('/srv/users') }}"
    etype: other
    permissions: x
    state: present
