---
galaxy_info:
  role_name: repo_key
  author: turbopanel
  license: AGPL-3.0
  description: >
    Install the signing key of a third-party apt repository: fetched over
    HTTPS at install time with a copy shipped in the release package as the
    fallback, a list of expected fingerprints, and a warn-not-block policy.
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - bookworm
        - trixie
    - name: Ubuntu
      versions:
        - jammy
        - noble

dependencies: []
