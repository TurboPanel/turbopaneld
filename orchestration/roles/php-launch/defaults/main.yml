---
# tp-php-launch: the setuid launcher OpenLiteSpeed (tpols) runs as the
# extprocessor of an attached-lsphp site (`tp-php-launch lsapi <siteId>`).
# Installed root:tpphplaunch 4750; tpols is the group's only member, so no
# other account can execute it. Source: orchestration/scripts/tp-php-launch.c.
php_launch_group: tpphplaunch
# The free slot in the 9980-9999 service-identity band;
# src/orchestration/service-accounts.test.ts enforces that it stays unique.
php_launch_gid: 9981
php_launch_caller: tpols
php_launch_dest: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/lib/tp-php-launch"
# Created and written only by `tp-host php-site-register` (root:root 0755,
# outside the tp-owned /etc/turbopanel). The launcher hardcodes this path.
php_launch_registry_dir: /etc/turbopanel-php-sites
php_launch_arch_map:
  x86_64: amd64
  aarch64: arm64
# SHA-256 of the reproducible release build per architecture
# (scripts/build-tp-php-launch.sh fails the release bundle on a mismatch; run
# it with --print after a source change and update both pins in the same PR).
php_launch_sha256:
  amd64: "740e2b470cd418c29cf11638096f477ab5b6e175025a74a3e620eef682d3f6ed"
  arm64: "852cd1ab4afe5dbfeaa0066ddbe1766a1e8a66cb6ddec76e403efb680bcf0c88"
