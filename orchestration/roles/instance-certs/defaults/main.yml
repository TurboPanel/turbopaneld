---
turbopanel_install_root: /opt/turbopanel
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
# Runtimes always live under the FHS lib/runtime tree (dev shares it with prod).
turbopanel_runtimes_dir: "{{ turbopanel_lib_dir }}/runtime"
# Source checkout: co-located dev uses the dev user's home; managed installs use
# the FHS lib tree.
turbopanel_instance_dir: "{{ (turbopanel_dev_root ~ '/instance') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopaneli' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# Co-located dev generates certs as the dev user (git/Ansible identity); production
# uses turbopaneli. Both branches naturally resolve to the single dev user in dev.
instance_certs_owner: "{{ turbopanel_user if (turbopanel_dev_user | default('') | length > 0) else instance_user }}"
turbopanel_public_urls: ""
turbopanel_tls_extra_sans: ""
