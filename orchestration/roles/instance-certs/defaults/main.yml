---
turbopanel_install_root: /opt/turbopanel
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_vendor_dir }}/node/current/bin/node"
# Mirrors instance-launch: "compiled" runs the instance binary's own
# `generate-self-signed-cert` verb (no checkout needed); "source" runs the
# Node script from the checkout. Same script either way.
turbopanel_instance_run_mode: source
turbopanel_instance_binary: "{{ turbopanel_instance_dir }}/dist/turbopanel-instance"
# Where the server leaf (self-signed or uploaded) lives — what Caddy serves.
# Source mode keeps it beside the checkout; the compiled binary can only
# write its state tree, so compiled mode keeps it at <state>/tls/certs (the
# default the `generate-self-signed-cert` verb picks without
# TURBOPANEL_TLS_CERTS_DIR).
turbopanel_instance_certs_dir: >-
  {{ (turbopanel_state_dir ~ '/tls/certs')
     if turbopanel_instance_run_mode == 'compiled'
     else (turbopanel_instance_dir ~ '/certs') }}
turbopanel_instance_cert_argv: >-
  {{ [turbopanel_instance_binary, 'generate-self-signed-cert']
     if turbopanel_instance_run_mode == 'compiled'
     else [turbopanel_node, 'scripts/generate-self-signed-cert.mjs'] }}
turbopanel_deno: "{{ turbopanel_vendor_dir }}/deno/current/deno"
turbopanel_runtime_path: "{{ turbopanel_vendor_dir }}/node/current/bin:{{ turbopanel_vendor_dir }}/deno/current:{{ turbopanel_vendor_dir }}/caddy/current:/usr/bin:/bin"
# Source checkout: co-located dev uses the dev user's home; managed installs use
# the FHS lib tree.
turbopanel_instance_dir: "{{ (turbopanel_dev_root ~ '/turbopanel') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
instance_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpctrl' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
# Co-located dev generates certs as the dev user (git/Ansible identity); managed
# installs use tpctrl. Both branches naturally resolve to the single dev user in dev.
instance_certs_owner: "{{ turbopanel_user if (turbopanel_dev_user | default('') | length > 0) else instance_user }}"
# How the control-plane hostname is presented. self_signed (default) mints a
# Platform CA leaf on :8443; upload copies an operator pair into certs/;
# lets_encrypt lets Caddy issue on :443 (managed-install only).
turbopanel_tls_mode: self_signed
# Absolute paths on the target host (upload). Copied into the role-owned
# certs/ tree so tpcaddy can read the key without mutating the operator's files.
turbopanel_tls_cert_path: ""
turbopanel_tls_key_path: ""
# Public DNS name Caddy obtains a certificate for (lets_encrypt).
turbopanel_public_hostname: ""
# ACME account contact (lets_encrypt). Optional. The Caddy unit omits
# TURBOPANEL_ACME_EMAIL and TURBOPANEL_CADDY_ACME_EMAIL_DIRECTIVE when empty
# so Caddyfile.acme does not render `email `.
turbopanel_acme_email: ""
# Operator-declared "the endpoint presents a publicly trusted certificate".
# Forced true when turbopanel_tls_mode is lets_encrypt.
turbopanel_tls_public: false
# Derived from turbopanel_public_hostname in lets_encrypt so leaf SANs /
# TURBOPANEL_PUBLIC_URLS stay correct without a second source of truth.
# An explicit extra-var still wins (admin public-URL apply).
turbopanel_public_urls: "{{ ('https://' ~ turbopanel_public_hostname) if (turbopanel_tls_mode | default('self_signed') == 'lets_encrypt' and (turbopanel_public_hostname | default('') | length > 0)) else '' }}"
turbopanel_tls_extra_sans: ""
# Durable platform CA (not the replaceable instance checkout).
turbopanel_state_dir: /var/lib/turbopanel
turbopanel_instance_ca_dir: "{{ turbopanel_state_dir }}/tls"
