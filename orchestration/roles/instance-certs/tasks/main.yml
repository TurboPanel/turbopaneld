---
# Generates the platform CA + server leaf via the instance repo's node script.
# The script is self-idempotent: it regenerates the leaf only when interface
# addresses or SANs change, so running it on every converge is cheap.
# The CA is durable under turbopanel_instance_ca_dir; this role never passes
# TURBOPANEL_TLS_CA_ROTATE (leaf-only apply / converge).
# Let's Encrypt material is not written here. Named :8443 sites render only
# when letsencrypt-<host>.{crt,key} already exist (letsencrypt-files.yml).
- name: Resolve instance hostnames
  ansible.builtin.include_tasks: resolve-hostnames.yml

- name: Check the control-plane TLS folders before root touches them
  ansible.builtin.include_tasks: tls-folders-check.yml
  vars:
    _tls_folder_checks:
      - path: "{{ turbopanel_instance_ca_dir }}"
        owner: "{{ instance_certs_owner if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
        adopt_daemon_owned: true
      - path: "{{ turbopanel_instance_certs_dir }}"
        owner: "{{ instance_certs_owner }}"

- name: Ensure durable platform CA directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_instance_ca_dir }}"
    state: directory
    follow: false
    owner: "{{ instance_certs_owner if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure instance certs directory exists for cert generation
  ansible.builtin.file:
    path: "{{ turbopanel_instance_certs_dir }}"
    state: directory
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

# Names that hit the :8443 catch-all (no dedicated uploaded or ready Let's
# Encrypt site) must be on this leaf. platform-ca hosts travel in
# TURBOPANEL_PUBLIC_URLS. The machine FQDN is added here so a Let's
# Encrypt-only set still covers that unlisted install name. A public name
# outside this set is refused when the install command is built.
- name: Cover the machine name on the Platform CA catch-all leaf
  ansible.builtin.set_fact:
    turbopanel_tls_extra_sans: >-
      {{
        (
          (turbopanel_tls_extra_sans | default('', true)).split(',')
          + [ansible_fqdn | default('')]
        )
        | map('trim')
        | reject('equalto', '')
        | unique
        | join(',')
      }}

# The certs folder belongs to the instance account, and the generator (root on
# a managed install) writes self-signed.{crt,key} and the copies below read
# them. Each is either a real file the generator just wrote or the link this
# role makes to platform-ca.*; anything else (a link somewhere else) stops
# here before root reads or writes through it.
- name: Look at the deprecated leaf names without following links
  ansible.builtin.stat:
    path: "{{ turbopanel_instance_certs_dir }}/self-signed.{{ item }}"
    follow: false
    get_checksum: false
  loop: [crt, key]
  register: _self_signed_stat

- name: Stop when a deprecated leaf name points somewhere else
  ansible.builtin.assert:
    that:
      - >-
        not (item.stat.exists | default(false))
        or (item.stat.isreg | default(false))
        or (
          (item.stat.islnk | default(false))
          and (item.stat.lnk_target | default('')) == (turbopanel_instance_certs_dir ~ '/platform-ca.' ~ item.item)
        )
    fail_msg: >-
      {{ turbopanel_instance_certs_dir }}/self-signed.{{ item.item }} is not
      the file the certificate generator writes nor a link to
      platform-ca.{{ item.item }} beside it
      ({{ 'a link to ' ~ (item.stat.lnk_target | default('?')) if (item.stat.islnk | default(false)) else 'not a regular file' }}).
      It may have been swapped. Nothing was changed. Look at it
      (ls -la {{ turbopanel_instance_certs_dir }}), then restore the original
      file or ask for help, and run the update again. Do not delete the tls
      folder: it holds the Platform CA key.
    quiet: true
  loop: "{{ _self_signed_stat.results }}"
  loop_control:
    label: "self-signed.{{ item.item }}"

- name: Generate platform CA and server certificate
  ansible.builtin.command:
    argv: "{{ turbopanel_instance_cert_argv }}"
    chdir: "{{ turbopanel_instance_dir }}"
  # Co-located dev stores CA material as the dev user (git/Ansible identity); tpctrl
  # cannot chmod dev-user-owned keys when the script normalizes permissions.
  # A managed install keeps the CA directory root-owned (0750 root:tp, see the
  # task above and the hardening below), so there the generator runs as root
  # — the instance user could not create ca.key in it (install-rehearsal,
  # Road to 0.1.x); the hardening tasks then set the leaf's owner.
  become_user: "{{ instance_certs_owner if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
  environment:
    HOME: "{{ turbopanel_dev_home if (turbopanel_dev_user | default('') | length > 0) else turbopanel_instance_dir }}"
    PATH: "{{ turbopanel_runtime_path }}"
    TURBOPANEL_STATE_DIR: "{{ turbopanel_state_dir }}"
    TURBOPANEL_TLS_CERTS_DIR: "{{ turbopanel_instance_certs_dir }}"
    TURBOPANEL_TLS_CA: "{{ turbopanel_instance_ca_dir }}/ca.crt"
    TURBOPANEL_TLS_CA_KEY: "{{ turbopanel_instance_ca_dir }}/ca.key"
    TURBOPANEL_TLS_CA_BUNDLE: "{{ turbopanel_instance_ca_dir }}/ca-bundle.pem"
    TURBOPANEL_TLS_EXTRA_SANS: "{{ turbopanel_tls_extra_sans | default('', true) }}"
    TURBOPANEL_PUBLIC_URLS: "{{ turbopanel_public_urls | default('', true) }}"
  changed_when: false

# Caddy runs as `tpcaddy` and is the only reader of the server leaf key, so
# the key is tpcaddy's own (group tpcaddy, mode 0600), like the Let's Encrypt
# keys. The certificate stays group tp (0640). generate-self-signed-cert.mjs
# chmods both keys to 0640 on every run without changing the group; the
# tasks below set them back, and because neither key's group is tp the
# 0640 between the two never lets the daemon account read one.
- name: Publish the platform-ca leaf certificate
  ansible.builtin.copy:
    src: "{{ turbopanel_instance_certs_dir }}/self-signed.crt"
    dest: "{{ turbopanel_instance_certs_dir }}/platform-ca.crt"
    remote_src: true
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Publish the platform-ca leaf key
  ansible.builtin.copy:
    src: "{{ turbopanel_instance_certs_dir }}/self-signed.key"
    dest: "{{ turbopanel_instance_certs_dir }}/platform-ca.key"
    remote_src: true
    follow: false
    owner: "{{ caddy_user }}"
    group: "{{ caddy_primary_group }}"
    mode: "0600"

- name: Keep the deprecated self-signed certificate name
  ansible.builtin.file:
    src: "{{ turbopanel_instance_certs_dir }}/platform-ca.crt"
    dest: "{{ turbopanel_instance_certs_dir }}/self-signed.crt"
    state: link
    force: true

- name: Keep the deprecated self-signed key name
  ansible.builtin.file:
    src: "{{ turbopanel_instance_certs_dir }}/platform-ca.key"
    dest: "{{ turbopanel_instance_certs_dir }}/self-signed.key"
    state: link
    force: true

- name: Keep the server leaf key readable by control-plane Caddy only
  ansible.builtin.file:
    path: "{{ turbopanel_instance_certs_dir }}/platform-ca.key"
    state: file
    follow: false
    owner: "{{ caddy_user }}"
    group: "{{ caddy_primary_group }}"
    mode: "0600"

# Only the generator reads the Platform CA key, and on a managed install it
# runs as root, so the key is root:root 0600 there. Co-located development
# keeps it the developer's own (0640, the generator runs as that user).
- name: Keep the platform CA key readable by root only
  ansible.builtin.file:
    path: "{{ turbopanel_instance_ca_dir }}/ca.key"
    state: file
    follow: false
    owner: "{{ instance_certs_owner if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
    group: "{{ turbopanel_group if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
    mode: "{{ '0640' if (turbopanel_dev_user | default('') | length > 0) else '0600' }}"

- name: Stat operator TLS certificate for upload mode
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.stat:
    path: "{{ turbopanel_tls_cert_path }}"
  register: _tls_upload_cert

- name: Stat operator TLS private key for upload mode
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.stat:
    path: "{{ turbopanel_tls_key_path }}"
  register: _tls_upload_key

- name: Assert operator TLS certificate exists for upload mode
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.assert:
    that:
      - _tls_upload_cert.stat.exists
    fail_msg: >-
      turbopanel_tls_cert_path does not exist: {{ turbopanel_tls_cert_path }}

- name: Assert operator TLS private key exists for upload mode
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.assert:
    that:
      - _tls_upload_key.stat.exists
    fail_msg: >-
      turbopanel_tls_key_path does not exist: {{ turbopanel_tls_key_path }}

- name: Copy uploaded TLS certificate into instance certs
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.copy:
    src: "{{ turbopanel_tls_cert_path }}"
    dest: "{{ turbopanel_instance_certs_dir }}/uploaded.crt"
    remote_src: true
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Copy uploaded TLS private key into instance certs
  when: turbopanel_tls_mode | default('self_signed') == 'upload'
  ansible.builtin.copy:
    src: "{{ turbopanel_tls_key_path }}"
    dest: "{{ turbopanel_instance_certs_dir }}/uploaded.key"
    remote_src: true
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Harden per-hostname uploaded certificates
  when: item.cert_id | default('') | length > 0
  ansible.builtin.file:
    path: "{{ turbopanel_instance_certs_dir }}/uploaded-{{ item.cert_id }}.crt"
    state: file
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  loop: "{{ turbopanel_hostnames | default([]) | selectattr('source', 'equalto', 'uploaded') | list }}"
  loop_control:
    label: "{{ item.cert_id | default('') }}"

- name: Harden per-hostname uploaded keys
  when: item.cert_id | default('') | length > 0
  ansible.builtin.file:
    path: "{{ turbopanel_instance_certs_dir }}/uploaded-{{ item.cert_id }}.key"
    state: file
    follow: false
    owner: "{{ instance_certs_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  loop: "{{ turbopanel_hostnames | default([]) | selectattr('source', 'equalto', 'uploaded') | list }}"
  loop_control:
    label: "{{ item.cert_id | default('') }}"
