---
# The hosting Caddy (turbopanel-hosting-caddy.service, public :80/:443) runs
# as its own account, deliberately NOT in group tp: the daemon writes its
# config, and nothing that serves the internet gets the daemon's group. Keep
# the name in step with HOSTING_CADDY_USER in src/deploy/ensure-hosting-caddy.ts
# and tp-host, which pins the unit to it. The id is in the 9980-9999
# service-identity band (src/orchestration/service-accounts.test.ts), which
# fails on any duplicate. 9983 went to tpprincipal (sshd access group, PR
# #223) and 9994 to tpbuild (build-user, PR #221; retired, still reserved), so 9982
# is the free slot.
hosting_caddy_user: tpedge
hosting_caddy_uid: 9982

turbopanel_install_root: /opt/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"  # noqa: var-naming[no-role-prefix]
turbopanel_config_dir: /etc/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_state_dir: /var/lib/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_run_dir: /run/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
# The account that writes the hosting config and TLS files (the daemon).
hosting_caddy_config_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"
# The daemon's group (reads <install>/lib).
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}"  # noqa: var-naming[no-role-prefix]

# The ingress guard (turbopanel-ingress-guard.service): who on the host may open
# a connection to the shared Traefik's PROXY protocol entrypoints. The ports are
# TRAEFIK_HTTP_PORT / TRAEFIK_HTTPS_PORT in src/deploy/ingress.ts, and the
# version is INGRESS_GUARD_VERSION in src/deploy/ensure-hosting-caddy.ts (the
# daemon re-runs this playbook when the installed ruleset carries another one).
# src/deploy/ingress-guard.test.ts pins all three.
hosting_ingress_guard_version: v2
hosting_ingress_guard_ports: [7080, 7443]
hosting_ingress_guard_rules: "{{ turbopanel_install_root }}/lib/ingress-guard.nft"
