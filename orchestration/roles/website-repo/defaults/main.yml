---
turbopanel_install_root: /opt/turbopanel
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
# Co-located dev source checkout root (dev user's home); overridden by an
# extra-var (turbopanel_dev_root) from the dev converge.
turbopanel_dev_root: "{{ ansible_env.HOME }}"
turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_node: "{{ turbopanel_runtimes_dir }}/node/current/bin/node"
turbopanel_deno: "{{ turbopanel_runtimes_dir }}/deno/current/deno"
turbopanel_runtime_path: "{{ turbopanel_runtimes_dir }}/node/current/bin:{{ turbopanel_runtimes_dir }}/deno/current:{{ turbopanel_runtimes_dir }}/caddy/current:/usr/bin:/bin"
turbopanel_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# Source checkout: co-located dev uses the dev user's home; managed installs use lib.
turbopanel_website_dir: "{{ (turbopanel_dev_root ~ '/website') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/website') }}"
website_repo_url: https://github.com/turbopanel/website
website_branch: trunk
