# Dev-only Tabix: static browser client for the ClickHouse metrics DB.
# Not routed through Caddy — loopback port only. The browser talks to ClickHouse
# cross-origin over 127.0.0.1:{{ clickhouse_http_port }}, prefilled to the
# least-privilege {{ clickhouse_app_user }} (the default admin is
# <networks>-restricted to loopback and only reachable via docker exec).
#
# Runtime image is multi-arch nginx-unprivileged. Assets come from the upstream
# spoonest image via `docker create` + `docker cp` (no exec — that image is
# amd64-only and crashes with "exec format error" on arm64).

- name: Ensure tabix config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/tabix"
    state: directory
    owner: "{{ tabix_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure tabix HTML directory exists
  ansible.builtin.file:
    path: "{{ tabix_html_dir }}"
    state: directory
    owner: "{{ tabix_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure turbopanel Docker network exists
  ansible.builtin.command:
    argv: [
      docker,
      network,
      create,
      --driver,
      bridge,
      "{{ turbopanel_docker_network }}",
    ]
  register: _tabix_network_create
  changed_when: false
  failed_when: false

- name: Check ClickHouse app password file exists
  ansible.builtin.stat:
    path: "{{ turbopanel_config_dir }}/clickhouse/.clickhouse_app_pass"
  register: _tabix_ch_app_pass_stat

- name: Fail when ClickHouse app password is missing
  ansible.builtin.fail:
    msg: >-
      {{ turbopanel_config_dir }}/clickhouse/.clickhouse_app_pass is missing.
      The clickhouse role must run before tabix (it generates the app password).
  when: not _tabix_ch_app_pass_stat.stat.exists

- name: Read ClickHouse app password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/clickhouse/.clickhouse_app_pass"
  register: _tabix_ch_app_pass_raw
  no_log: true

- name: Set ClickHouse app password fact
  ansible.builtin.set_fact:
    _tabix_ch_app_password: "{{ _tabix_ch_app_pass_raw.content | b64decode | trim }}"
  no_log: true

- name: Check whether Tabix static assets are present
  ansible.builtin.stat:
    path: "{{ tabix_html_dir }}/index.html.orig"
  register: _tabix_assets_stat

- name: Pull Tabix assets image (amd64 metadata only; not executed)
  ansible.builtin.command:
    argv: [
      docker,
      pull,
      "--platform",
      "linux/amd64",
      "{{ tabix_assets_image }}",
    ]
  when: not _tabix_assets_stat.stat.exists
  register: _tabix_assets_pull
  changed_when: "'Downloaded newer image' in (_tabix_assets_pull.stdout | default('')) or 'Pull complete' in (_tabix_assets_pull.stdout | default(''))"

- name: Extract Tabix static assets from upstream image
  args:
    executable: /bin/bash
  ansible.builtin.shell: |
    set -euo pipefail
    cid=""
    tmp=""
    cleanup() {
      if [ -n "${cid}" ]; then docker rm -f "${cid}" >/dev/null 2>&1 || true; fi
      if [ -n "${tmp}" ]; then rm -rf "${tmp}"; fi
    }
    trap cleanup EXIT
    cid="$(docker create --platform linux/amd64 "{{ tabix_assets_image }}")"
    tmp="$(mktemp -d)"
    docker cp "${cid}:/var/www/html/." "${tmp}/"
    # Preserve a pristine index for idempotent connection-script injection.
    cp -a "${tmp}/index.html" "${tmp}/index.html.orig"
    rm -rf "{{ tabix_html_dir }}"
    mkdir -p "{{ tabix_html_dir }}"
    cp -a "${tmp}"/. "{{ tabix_html_dir }}/"
    chown -R "{{ tabix_config_owner }}:{{ turbopanel_group }}" "{{ tabix_html_dir }}"
    chmod -R u=rwX,g=rX,o= "{{ tabix_html_dir }}"
  when: not _tabix_assets_stat.stat.exists
  register: _tabix_assets_extracted
  changed_when: true

- name: Install Tabix index inject helper
  ansible.builtin.copy:
    src: inject-tabix-index.py
    dest: "{{ turbopanel_config_dir }}/tabix/inject-tabix-index.py"
    owner: "{{ tabix_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Inject ClickHouse connection defaults into Tabix index.html
  ansible.builtin.command:
    argv:
      - python3
      - "{{ turbopanel_config_dir }}/tabix/inject-tabix-index.py"
  environment:
    TABIX_INDEX_ORIG: "{{ tabix_html_dir }}/index.html.orig"
    TABIX_INDEX_DEST: "{{ tabix_html_dir }}/index.html"
    TABIX_CH_NAME: "{{ tabix_ch_name }}"
    TABIX_CH_HOST: "{{ tabix_ch_host }}"
    TABIX_CH_LOGIN: "{{ clickhouse_app_user }}"
    TABIX_CH_SECRET: "{{ _tabix_ch_app_password }}"
    TABIX_CH_PARAMS: "{{ tabix_ch_params }}"
  no_log: true
  register: _tabix_index_injected
  changed_when: true

- name: Restrict Tabix index.html permissions after inject
  ansible.builtin.file:
    path: "{{ tabix_html_dir }}/index.html"
    owner: "{{ tabix_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Inspect tabix container
  ansible.builtin.command:
    argv: [docker, inspect, "{{ tabix_container_name }}"]
  register: _tabix_inspect_cmd
  changed_when: false
  failed_when: false

- name: Parse tabix container inspection
  ansible.builtin.set_fact:
    _tabix_container: "{{ (_tabix_inspect_cmd.stdout | from_json)[0] }}"
  when: _tabix_inspect_cmd.rc == 0

- name: Set tabix container state facts
  ansible.builtin.set_fact:
    _tabix_container_exists: true
    _tabix_running: "{{ _tabix_container.State.Running | default(false) }}"
    _tabix_status: "{{ _tabix_container.State.Status | default('') }}"
    _tabix_network_ok: "{{ turbopanel_docker_network in (_tabix_container.NetworkSettings.Networks | default({})) }}"
    _tabix_web_ok: >-
      {{ (_tabix_container.HostConfig.PortBindings[(tabix_container_port | string ~ '/tcp')] | default([]) | length > 0)
         and ((_tabix_container.HostConfig.PortBindings[(tabix_container_port | string ~ '/tcp')] | first).HostIp | default('')) == '127.0.0.1'
         and ((_tabix_container.HostConfig.PortBindings[(tabix_container_port | string ~ '/tcp')] | first).HostPort | default('')) == (tabix_web_port | string) }}
    _tabix_html_mount_ok: >-
      {{ _tabix_container.Mounts | default([])
         | selectattr('Destination', 'equalto', '/usr/share/nginx/html')
         | list | length > 0 }}
    _tabix_image_ok: "{{ (_tabix_container.Config.Image | default('')) == tabix_image }}"
    _tabix_user_ok: >-
      {{ (_tabix_container.Config.User | default(''))
         == (tabix_container_uid | string ~ ':' ~ tabix_container_gid | string
             if (turbopanel_dev_user | default('') | length > 0) else '') }}
  when: _tabix_inspect_cmd.rc == 0

- name: Set tabix container missing facts
  ansible.builtin.set_fact:
    _tabix_container_exists: false
    _tabix_running: false
  when: _tabix_inspect_cmd.rc != 0

- name: Remove tabix container when unhealthy or drifted
  ansible.builtin.command:
    cmd: docker rm -f {{ tabix_container_name }}
  when:
    - _tabix_container_exists | bool
    - >-
        (not _tabix_network_ok | bool)
        or (not _tabix_web_ok | bool)
        or (not _tabix_html_mount_ok | bool)
        or (not _tabix_image_ok | bool)
        or (not _tabix_user_ok | bool)
        or (_tabix_status | trim in ['restarting', 'exited', 'dead'])
  register: _tabix_removed
  changed_when: _tabix_removed.rc == 0

- name: Refresh tabix container facts after removal
  ansible.builtin.set_fact:
    _tabix_container_exists: false
    _tabix_running: false
  when: _tabix_removed is changed

# Dev runs nginx-unprivileged as the single dev uid:gid (matching redis-insight/mailpit).
# Container listens on 8080; host publish stays 127.0.0.1:{{ tabix_web_port }}.
- name: Build tabix docker run argument list
  ansible.builtin.set_fact:
    _tabix_docker_run_args: "{{ _tabix_docker_run_base + (_tabix_docker_user if (turbopanel_dev_user | default('') | length > 0) else []) + [tabix_image] }}"
  vars:
    _tabix_docker_run_base:
      - docker
      - run
      - "--name"
      - "{{ tabix_container_name }}"
      - "--restart"
      - unless-stopped
      - "-d"
      - "--network"
      - "{{ turbopanel_docker_network }}"
      - "-p"
      - "127.0.0.1:{{ tabix_web_port }}:{{ tabix_container_port }}"
      - "-v"
      - "{{ tabix_html_dir }}:/usr/share/nginx/html:ro"
    _tabix_docker_user:
      - "--user"
      - "{{ tabix_container_uid }}:{{ tabix_container_gid }}"

- name: Create and start tabix container
  ansible.builtin.command:
    cmd: "{{ _tabix_docker_run_args | join(' ') }}"
  when: not _tabix_container_exists | bool

- name: Install tabix wrapper start script
  ansible.builtin.template:
    src: tabix-wrapper-start.sh.j2
    dest: "{{ turbopanel_config_dir }}/tabix/wrapper-start.sh"
    owner: root
    group: root
    mode: "0750"

- name: Ensure tabix container is running and ready
  ansible.builtin.command:
    cmd: "{{ turbopanel_config_dir }}/tabix/wrapper-start.sh"
  changed_when: false

- name: Install Tabix systemd unit
  ansible.builtin.template:
    src: turbopanel-tabix.service.j2
    dest: "/etc/systemd/system/{{ tabix_service_name }}.service"
    owner: root
    group: root
    mode: "0640"

- name: Ensure Tabix systemd unit desired state
  ansible.builtin.systemd:
    name: "{{ tabix_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
