galaxy_info:
  role_name: postgres
  author: turbopanel
  license: AGPL-3.0
  description: >
    Run PostgreSQL 18 in Docker with persistent data, a Unix socket bind-mount,
    and connection metadata under {{ turbopanel_config_dir }}/postgres/ (FHS
    /etc/turbopanel; co-located dev shares it with prod).
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - trixie

dependencies:
  - role: docker
