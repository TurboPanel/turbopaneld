postgres_image: postgres:18
postgres_container_name: turbopaneldb
postgres_service_name: turbopanel-postgres
# PG 18+ images store data under $PGDATA (/var/lib/postgresql/18/docker); mount the parent.
# Data lives in a named Docker volume (postgres_volume_name), not a host bind-mount.
postgres_volume_name: turbopaneldb
turbopanel_docker_network: turbopanel
postgres_socket_dir: /var/run/turbopanel/postgres
postgres_port: 5432
postgres_expose_port: false
postgres_user: turbopanel
postgres_db: turbopanel
# Shared dev-identity contract: dev runs the container (and owns its secret files)
# as the single dev uid:gid; managed installs use the reserved 9996 container id.
turbopanel_dev_user: ""
turbopanel_dev_uid: ""
turbopanel_dev_gid: ""
turbopanel_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'turbopanel' }}"
# UID/GID of the `postgres` user inside the official postgres image.
postgres_container_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else '9996' }}"
postgres_container_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else '9996' }}"
# Owner of the generated postgres secret/config files: the dev user in dev (so it
# owns its own secrets), else root.
postgres_config_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel
