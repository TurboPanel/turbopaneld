# /etc/turbopanel/
#   postgres/
#     config.json   — connection metadata (socket path, port, user, db)
#     .pgpass       — generated password, mode 0600, owner root
# /var/run/turbopanel/postgres — canonical Unix socket directory (postgres_socket_dir)

- name: Ensure postgres config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/postgres"
    state: directory
    owner: root
    group: turbopanel
    mode: "0750"

- name: Generate postgres password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/postgres/.pgpass'
      if [ ! -s "$f" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$f"
        chmod 0600 "$f"
        chown root:root "$f"
        echo created
      fi
    executable: /bin/bash
  register: _pgpass_gen
  changed_when: "'created' in _pgpass_gen.stdout"

- name: Read postgres password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _pgpass_raw

- name: Set postgres password fact
  ansible.builtin.set_fact:
    _postgres_password: "{{ _pgpass_raw.content | b64decode | trim }}"

- name: Write postgres config.json (idempotent)
  ansible.builtin.template:
    src: postgres-config.json.j2
    dest: "{{ turbopanel_config_dir }}/postgres/config.json"
    owner: root
    group: turbopanel
    mode: "0640"
    force: false

# Official postgres image runs as UID/GID 999; bind mounts must be writable there.
- name: Ensure postgres data directory exists
  ansible.builtin.file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ postgres_container_gid }}"
    mode: "0700"

- name: Ensure postgres socket directory exists
  ansible.builtin.file:
    path: "{{ postgres_socket_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: turbopanel
    mode: "2770"

- name: Check postgres container state
  ansible.builtin.command:
    cmd: docker inspect --format '{{ '{{' }}.State.Running{{ '}}' }}' {{ postgres_container_name }}
  register: _pg_running
  changed_when: false
  failed_when: false

- name: Set postgres container state facts
  ansible.builtin.set_fact:
    _postgres_container_exists: "{{ _pg_running.rc == 0 }}"
    _postgres_running: "{{ _pg_running.rc == 0 and _pg_running.stdout | trim == 'true' }}"

- name: Check postgres container uses PG 18+ volume layout
  ansible.builtin.command:
    cmd: >-
      docker inspect --format
      '{{ '{{' }}range .Mounts{{ '}}' }}{{ '{{' }}if eq .Destination "/var/lib/postgresql"{{ '}}' }}{{ '{{' }}.Destination{{ '}}' }}{{ '{{' }}end{{ '}}' }}{{ '{{' }}end{{ '}}' }}'
      {{ postgres_container_name }}
  register: _pg_mount
  changed_when: false
  failed_when: false
  when: _postgres_container_exists | bool

- name: Check postgres container health
  ansible.builtin.command:
    cmd: docker inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' {{ postgres_container_name }}
  register: _pg_status
  changed_when: false
  failed_when: false
  when: _postgres_container_exists | bool

- name: Check whether postgres container publishes TCP
  ansible.builtin.command:
    cmd: docker port {{ postgres_container_name }} 5432/tcp
  register: _pg_tcp_port
  changed_when: false
  failed_when: false
  when: _postgres_container_exists | bool

- name: Remove postgres container with broken configuration
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - (_pg_mount.stdout | default('') | trim != '/var/lib/postgresql') or (_pg_status.stdout | default('') | trim in ['restarting', 'exited', 'dead'])
  register: _pg_removed
  changed_when: _pg_removed.rc == 0

- name: Remove postgres container when TCP exposure does not match config
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - _pg_removed is not changed
    - (postgres_expose_port | bool and (_pg_tcp_port.rc | default(1) != 0)) or ((not postgres_expose_port | bool) and (_pg_tcp_port.rc | default(1) == 0))
  register: _pg_removed_tcp
  changed_when: _pg_removed_tcp.rc == 0

- name: Refresh postgres container facts after removal
  ansible.builtin.set_fact:
    _postgres_container_exists: false
    _postgres_running: false
  when: _pg_removed is changed or _pg_removed_tcp is changed

- name: Build docker run argument list
  ansible.builtin.set_fact:
    _docker_run_args: "{{ _docker_run_base + (_docker_run_port if postgres_expose_port | bool else []) + [postgres_image] }}"
  vars:
    _docker_run_base:
      - "--name"
      - "{{ postgres_container_name }}"
      - "--restart"
      - "unless-stopped"
      - "-d"
      - "-v"
      - "{{ postgres_data_dir }}:/var/lib/postgresql"
      - "-v"
      - "{{ postgres_socket_dir }}:/var/run/postgresql"
      - "-e"
      - "POSTGRES_USER={{ postgres_user }}"
      - "-e"
      - "POSTGRES_DB={{ postgres_db }}"
      - "-e"
      - "POSTGRES_PASSWORD={{ _postgres_password }}"
    _docker_run_port:
      - "-p"
      - "127.0.0.1:{{ postgres_port }}:5432"

- name: Start existing stopped postgres container
  ansible.builtin.command:
    cmd: docker start {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - not _postgres_running | bool

- name: Create and start postgres container
  ansible.builtin.command:
    cmd: docker run {{ _docker_run_args | join(' ') }}
  when: not _postgres_container_exists | bool
  no_log: true

- name: Wait for postgres to be ready
  ansible.builtin.command:
    cmd: docker exec {{ postgres_container_name }} pg_isready -U {{ postgres_user }}
  register: _pg_ready
  until: _pg_ready.rc == 0
  retries: 15
  delay: 2
  changed_when: false
