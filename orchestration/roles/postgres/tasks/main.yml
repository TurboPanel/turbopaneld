# {{ turbopanel_config_dir }}/ (FHS /etc/turbopanel; dev shares it with prod)
#   postgres/
#     config.json   — connection metadata (socket path, port, user, db)
#     .pgpass       — generated password, mode 0600, owned by postgres_config_owner
#                     (the dev user in co-located dev, else root)
# /var/run/turbopanel/postgres — canonical Unix socket directory (postgres_socket_dir)


- name: Ensure turbopanel group exists
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure tpdata primary group for database user
  ansible.builtin.group:
    name: "{{ postgres_primary_group }}"
    gid: "{{ postgres_container_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure database service user (primary group tpdata, supplementary tp)
  ansible.builtin.user:
    name: "{{ postgres_system_user }}"
    uid: "{{ postgres_container_uid }}"
    group: "{{ postgres_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure postgres config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/postgres"
    state: directory
    owner: "{{ postgres_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Generate postgres password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/postgres/.pgpass'
      if [ ! -s "$f" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$f"
        chmod 0600 "$f"
        chown {{ postgres_config_owner }}:{{ turbopanel_group }} "$f"
        echo created
      fi
    executable: /bin/bash
  register: postgres_pass_gen
  changed_when: "'created' in postgres_pass_gen.stdout"

- name: Read postgres password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: postgres_pass_raw

- name: Set postgres password fact
  ansible.builtin.set_fact:
    _postgres_password: "{{ postgres_pass_raw.content | b64decode | trim }}"

- name: Write postgres config.json (idempotent)
  ansible.builtin.template:
    src: postgres-config.json.j2
    dest: "{{ turbopanel_config_dir }}/postgres/config.json"
    owner: "{{ postgres_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
    force: false

- name: Ensure postgres socket directory exists
  ansible.builtin.file:
    path: "{{ postgres_socket_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: "{{ turbopanel_group }}"
    mode: "2770"

- name: Ensure turbopanel Docker network exists
  ansible.builtin.command:
    argv: [
      docker,
      network,
      create,
      --driver,
      bridge,
      "{{ turbopanel_docker_network }}",
    ]
  register: postgres_network_create
  changed_when: false
  failed_when: false

- name: Ensure turbopanel-database Docker volume exists
  ansible.builtin.command:
    argv: [docker, volume, create, "{{ postgres_volume_name }}"]
  register: postgres_volume_create
  changed_when: false

- name: Inspect postgres container
  ansible.builtin.command:
    argv: [docker, inspect, "{{ postgres_container_name }}"]
  register: postgres_inspect_cmd
  changed_when: false
  failed_when: false

- name: Parse postgres container inspection
  ansible.builtin.set_fact:
    postgres_inspect: "{{ (postgres_inspect_cmd.stdout | from_json)[0] }}"
  when: postgres_inspect_cmd.rc == 0

- name: Set postgres container state facts
  ansible.builtin.set_fact:
    _postgres_container_exists: true
    _postgres_running: "{{ postgres_inspect.State.Running | default(false) }}"
    postgres_container_status: "{{ postgres_inspect.State.Status | default('') }}"
    postgres_volume_ok: >-
      {{
        postgres_inspect.Mounts | default([])
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', postgres_volume_name)
        | list | length > 0
      }}
    postgres_network_ok: "{{ turbopanel_docker_network in (postgres_inspect.NetworkSettings.Networks | default({})) }}"
    postgres_tcp_exposed: "{{ postgres_inspect.HostConfig.PortBindings['5432/tcp'] is defined }}"
  when: postgres_inspect_cmd.rc == 0

- name: Set postgres container missing facts
  ansible.builtin.set_fact:
    _postgres_container_exists: false
    _postgres_running: false
  when: postgres_inspect_cmd.rc != 0

- name: Remove postgres container with broken configuration
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - >-
        (not postgres_volume_ok | bool)
        or (not postgres_network_ok | bool)
        or (postgres_container_status | trim in ['restarting', 'exited', 'dead'])
  register: postgres_removed
  changed_when: postgres_removed.rc == 0

- name: Remove postgres container when TCP exposure does not match config
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - postgres_removed is not changed
    - (postgres_expose_port | bool and (not postgres_tcp_exposed | bool)) or ((not postgres_expose_port | bool) and (postgres_tcp_exposed | bool))
  register: postgres_removed_tcp
  changed_when: postgres_removed_tcp.rc == 0

- name: Refresh postgres container facts after removal
  ansible.builtin.set_fact:
    _postgres_container_exists: false
    _postgres_running: false
  when: postgres_removed is changed or postgres_removed_tcp is changed

- name: Pre-own postgres Docker volume data directory
  ansible.builtin.command:
    cmd: docker run --rm -v {{ postgres_volume_name }}:/data --user root alpine chown -R {{ postgres_container_uid }}:{{ postgres_container_gid }} /data
  when: not _postgres_container_exists | bool
  changed_when: true

- name: Build docker run argument list
  ansible.builtin.set_fact:
    postgres_docker_run_args: "{{ postgres_docker_run_base + (postgres_docker_run_port if postgres_expose_port | bool else []) + [postgres_image] }}"
  vars:
    postgres_docker_run_base:
      - "--name"
      - "{{ postgres_container_name }}"
      - "--restart"
      - "unless-stopped"
      - "-d"
      - "--user"
      - "{{ postgres_container_uid }}:{{ postgres_container_gid }}"
      - "-v"
      - "{{ postgres_volume_name }}:/var/lib/postgresql"
      - "--network"
      - "{{ turbopanel_docker_network }}"
      - "-v"
      - "{{ postgres_socket_dir }}:/var/run/postgresql"
      - "-e"
      - "POSTGRES_USER={{ postgres_user }}"
      - "-e"
      - "POSTGRES_DB={{ postgres_db }}"
      - "-e"
      - "POSTGRES_PASSWORD={{ _postgres_password }}"
    postgres_docker_run_port:
      - "-p"
      - "127.0.0.1:{{ postgres_port }}:5432"

- name: Create and start postgres container
  ansible.builtin.command:
    cmd: docker run {{ postgres_docker_run_args | join(' ') }}
  when: not _postgres_container_exists | bool
  changed_when: true
  no_log: true

- name: Install postgres wrapper start script
  ansible.builtin.template:
    src: postgres-wrapper-start.sh.j2
    dest: "{{ turbopanel_config_dir }}/postgres/wrapper-start.sh"
    owner: root
    group: root
    mode: "0750"

- name: Ensure postgres container is running and ready
  ansible.builtin.command:
    cmd: "{{ turbopanel_config_dir }}/postgres/wrapper-start.sh"
  changed_when: false

- name: Install PostgreSQL systemd unit
  ansible.builtin.template:
    src: turbopanel-postgres.service.j2
    dest: "/etc/systemd/system/{{ postgres_service_name }}.service"
    owner: root
    group: root
    mode: "0640"

- name: Ensure PostgreSQL systemd unit desired state
  ansible.builtin.systemd:
    name: "{{ postgres_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
