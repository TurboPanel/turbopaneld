---
- name: Check vendored Deno binary
  ansible.builtin.stat:
    path: "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}/deno"
  register: _deno_pinned

- name: Ensure Deno version directory exists
  when: not _deno_pinned.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Resolve Deno release asset triple
  ansible.builtin.set_fact:
    deno_asset_triple: "{{ 'aarch64-unknown-linux-gnu' if ansible_architecture == 'aarch64' else 'x86_64-unknown-linux-gnu' }}"

# A version bump must land with its upstream digests: refuse rather than
# install an unverified runtime.
- name: Require a pinned SHA-256 for this Deno version and architecture
  ansible.builtin.assert:
    that:
      - deno_version in deno_sha256
      - ansible_architecture in deno_sha256[deno_version]
      - deno_sha256[deno_version][ansible_architecture] | length == 64
    fail_msg: >-
      deno_sha256 has no digest for Deno {{ deno_version }} on
      {{ ansible_architecture }} — add the upstream sha256 to
      roles/deno-runtime/defaults/main.yml (and TP_DENO_SHA256_* in
      scripts/run.sh) before bumping deno_version.

- name: Create Deno download scratch directory
  when: not _deno_pinned.stat.exists
  ansible.builtin.tempfile:
    state: directory
    prefix: deno-zip-
  register: _deno_tmp

# get_url verifies the digest before the file is kept: a mismatch fails the
# task and leaves nothing to extract.
- name: Download Deno release zip (SHA-256 verified)
  when: not _deno_pinned.stat.exists
  ansible.builtin.get_url:
    url: "https://dl.deno.land/release/v{{ deno_version }}/deno-{{ deno_asset_triple }}.zip"
    dest: "{{ _deno_tmp.path }}/deno-{{ deno_asset_triple }}.zip"
    checksum: "sha256:{{ deno_sha256[deno_version][ansible_architecture] }}"
    owner: root
    group: root
    mode: "0600"

# python3 stdlib — host-base only guarantees python3, not unzip.
- name: Install Deno into runtimes directory
  when: not _deno_pinned.stat.exists
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import shutil, sys, tempfile, zipfile
        from pathlib import Path

        archive, dest = Path(sys.argv[1]), Path(sys.argv[2])
        dest.parent.mkdir(parents=True, exist_ok=True)
        with tempfile.TemporaryDirectory(prefix="deno-zip-") as tmp:
            tmp_path = Path(tmp)
            with zipfile.ZipFile(archive) as zf:
                zf.extractall(tmp_path)
            candidates = list(tmp_path.rglob("deno"))
            if not candidates:
                raise SystemExit("deno binary not found in release zip")
            shutil.copy2(candidates[0], dest)
        dest.chmod(0o750)
      - "{{ _deno_tmp.path }}/deno-{{ deno_asset_triple }}.zip"
      - "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}/deno"
    creates: "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}/deno"

- name: Remove Deno download scratch directory
  when: _deno_tmp.path is defined
  ansible.builtin.file:
    path: "{{ _deno_tmp.path }}"
    state: absent

- name: Harden Deno binary permissions
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}/deno"
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Point Deno current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_vendor_dir }}/deno/{{ deno_version }}"
    dest: "{{ turbopanel_vendor_dir }}/deno/current"
    state: link
    force: true

# `current` now resolves to the pin, so any sibling version directory left by an
# earlier pin is dead weight. Prune it so a host cannot be re-pointed at a stale
# runtime by a hand-edited symlink.
- name: Find superseded Deno version directories
  ansible.builtin.find:
    paths: "{{ turbopanel_vendor_dir }}/deno"
    file_type: directory
    recurse: false
    excludes:
      - current
      - bin
      - "{{ deno_version }}"
  register: _deno_stale_versions

- name: Remove superseded Deno version directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _deno_stale_versions.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"

# Stable path for the JS-fallback systemd ExecStart:
#   {{ turbopanel_vendor_dir }}/deno/bin/deno -> ../current/deno
- name: Ensure Deno bin directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_vendor_dir }}/deno/bin"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Point Deno bin/deno convenience symlink at current
  ansible.builtin.file:
    src: ../current/deno
    dest: "{{ turbopanel_vendor_dir }}/deno/bin/deno"
    state: link
    force: true
