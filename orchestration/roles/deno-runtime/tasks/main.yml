---
- name: Check system Deno binary
  ansible.builtin.stat:
    path: /usr/local/bin/deno
  register: _deno_system

- name: Install Deno to /usr/local/bin/deno
  when: not _deno_system.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    DENO_TMP="{{ turbopanel_runtimes_dir }}/deno/.install"
    rm -rf "$DENO_TMP"
    mkdir -p "$DENO_TMP"
    curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$DENO_TMP" sh -s "v{{ deno_version }}" -- -y --no-modify-path
    install -m 0755 "$DENO_TMP/bin/deno" /usr/local/bin/deno
    rm -rf "$DENO_TMP"
  args:
    creates: /usr/local/bin/deno
