---
- name: Check vendored Deno binary
  ansible.builtin.stat:
    path: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}/deno"
  register: _deno_pinned

- name: Ensure Deno version directory exists
  when: not _deno_pinned.stat.exists
  ansible.builtin.file:
    path: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}"
    state: directory
    mode: "0755"

- name: Install Deno into runtimes directory
  when: not _deno_pinned.stat.exists
  ansible.builtin.shell: |
    set -euo pipefail
    DENO_TMP="{{ turbopanel_runtimes_dir }}/deno/.install"
    rm -rf "$DENO_TMP"
    mkdir -p "$DENO_TMP"
    # CI=1 (with no -y and non-TTY stdout) makes deno.land/install.sh skip its
    # shell-setup step, which would otherwise append `. "$DENO_INSTALL/env"` to
    # the invoking user's ~/.bashrc pointing at this temp dir we delete below,
    # breaking every subsequent login shell with a missing-file error.
    CI=1 curl -fsSL https://deno.land/install.sh | CI=1 DENO_INSTALL="$DENO_TMP" sh -s "v{{ deno_version }}"
    install -m 0755 "$DENO_TMP/bin/deno" "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}/deno"
    rm -rf "$DENO_TMP"
  args:
    creates: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}/deno"

- name: Point Deno current symlink at pinned version
  ansible.builtin.file:
    src: "{{ turbopanel_runtimes_dir }}/deno/{{ deno_version }}"
    dest: "{{ turbopanel_runtimes_dir }}/deno/current"
    state: link
    force: true
