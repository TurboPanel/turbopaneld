---
turbopanel_after_instance_service: false
turbopanel_install_root: /opt/turbopanel
turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/runtimes"
turbopanel_daemon_dir: "{{ turbopanel_install_root }}/platform/daemon"
turbopanel_daemon_deno_bin: /opt/turbopanel/runtimes/deno/current/deno
# Managed-host default log target. Co-located dev installs override this with
# the checkout-local logs/ dir (daemon-systemd-setup.yml). Kept in sync with the
# daemon-logs role default so the systemd unit template resolves either way.
daemon_log_dir: /var/log/turbopanel/daemon
