---
- name: Ensure single-daemon helper is executable
  ansible.builtin.file:
    path: "{{ turbopanel_orchestration_dir }}/scripts/ensure-single-daemon.sh"
    mode: "0755"

- name: Ensure runtime socket dir and clear stale daemon lock
  ansible.builtin.command:
    cmd: "{{ turbopanel_orchestration_dir }}/scripts/ensure-single-daemon.sh"
  changed_when: false
  failed_when: false

- name: Stop and disable legacy turbopanel-daemon.service
  when: turbopanel_service_name != turbopanel_legacy_service_name
  ansible.builtin.systemd:
    name: "{{ turbopanel_legacy_service_name }}"
    enabled: false
    state: stopped
  failed_when: false

- name: Remove legacy turbopanel-daemon.service unit file
  when: turbopanel_service_name != turbopanel_legacy_service_name
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ turbopanel_legacy_service_name }}.service"
    state: absent
  register: _legacy_unit_removed
  notify: Reload systemd

- name: Install daemon systemd unit
  ansible.builtin.template:
    src: turbopaneld.service.j2
    dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart turbopanel daemon

- name: Ensure daemon service desired state
  ansible.builtin.systemd:
    name: "{{ turbopanel_service_name }}"
    daemon_reload: true
    enabled: "{{ turbopanel_start | bool }}"
    state: >-
      {{
        'restarted'
        if (
          turbopanel_start | bool
          and (turbopanel_restart_daemon | default(false) | bool)
        )
        else (
          'started'
          if (turbopanel_start | bool)
          else 'stopped'
        )
      }}
  when: turbopanel_manage_service_state | default(true) | bool
