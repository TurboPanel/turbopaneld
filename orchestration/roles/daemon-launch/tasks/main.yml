---
- name: Check for existing TurboPanel screen session
  ansible.builtin.shell: |
    set -euo pipefail
    screen -ls | grep -q '\.{{ turbopanel_screen_name }}[[:space:]]' && echo yes || echo no
  register: _screen_session
  changed_when: false
  failed_when: false
  become_user: "{{ turbopanel_user }}"

- name: Start daemon via Tilt in screen session
  when: _screen_session.stdout != 'yes'
  ansible.builtin.shell: |
    set -euo pipefail
    cd '{{ turbopanel_daemon_dir }}'
    screen -dmS '{{ turbopanel_screen_name }}' tilt up --stream
  environment:
    TURBOPANEL_DENO: /usr/local/bin/deno
    TURBOPANEL_TLS_INSECURE: "{{ '1' if (turbopanel_tls_insecure | bool) else '' }}"
  become_user: "{{ turbopanel_user }}"

- name: Report existing screen session
  ansible.builtin.debug:
    msg: >-
      screen session '{{ turbopanel_screen_name }}' already running — leaving it
      untouched (idempotent re-run)
  when: _screen_session.stdout == 'yes'
