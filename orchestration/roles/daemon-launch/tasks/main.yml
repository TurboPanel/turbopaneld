---
- name: Stop legacy Tilt daemon launcher when present
  ansible.builtin.shell: |
    set -euo pipefail
    if command -v tilt >/dev/null 2>&1; then
      cd "{{ turbopanel_daemon_dir }}"
      tilt down >/dev/null 2>&1 || true
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ turbopanel_user }}"
  environment:
    HOME: "{{ turbopanel_install_root }}"
    PATH: "/usr/local/bin:{{ turbopanel_install_root }}/runtimes/deno/current:{{ ansible_env.PATH }}"
  changed_when: false
  failed_when: false

- name: Install daemon systemd unit
  ansible.builtin.template:
    src: turbopanel-daemon.service.j2
    dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart turbopanel daemon

- name: Ensure daemon service desired state
  ansible.builtin.systemd:
    name: "{{ turbopanel_service_name }}"
    daemon_reload: true
    enabled: "{{ turbopanel_start | bool }}"
    state: "{{ 'started' if (turbopanel_start | bool) else 'stopped' }}"
