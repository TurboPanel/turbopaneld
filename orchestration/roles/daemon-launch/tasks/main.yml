---
- name: Ensure single-daemon helper is executable
  ansible.builtin.file:
    path: "{{ turbopanel_daemon_dir }}/scripts/ensure-single-daemon.sh"
    mode: "0755"

- name: Stop legacy Tilt daemon launcher when present
  ansible.builtin.command:
    cmd: "{{ turbopanel_daemon_dir }}/scripts/ensure-single-daemon.sh"
  environment:
    TURBOPANEL_DAEMON_DIR: "{{ turbopanel_daemon_dir }}"
    TURBOPANEL_INSTALL_ROOT: "{{ turbopanel_install_root }}"
  changed_when: false
  failed_when: false

- name: Install daemon systemd unit
  ansible.builtin.template:
    src: turbopanel-daemon.service.j2
    dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart turbopanel daemon

- name: Ensure daemon service desired state
  ansible.builtin.systemd:
    name: "{{ turbopanel_service_name }}"
    daemon_reload: true
    enabled: "{{ turbopanel_start | bool }}"
    state: "{{ 'started' if (turbopanel_start | bool) else 'stopped' }}"
