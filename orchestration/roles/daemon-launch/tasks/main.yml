---
- name: Ensure single-daemon helper is executable
  # Must be executable by the daemon's own service account: systemd runs
  # ExecStartPre= as the unit's User=/Group= (turbopanel_user/turbopanel_group —
  # the co-located dev user in dev, the `turbopanel` service account in
  # production), not root. Owning this by root:root (as a prior pass at the
  # ansible:S2612 world-readable-mode fix did) leaves ExecStartPre unable to
  # exec it (systemd exit 203/EXEC) — production was masked by the
  # daemon-install.yml post_task that recursively re-chowns
  # turbopanel_orchestration_dir to turbopanel_user afterwards; co-located dev
  # has no such fixup, so it always fails there.
  ansible.builtin.file:
    path: "{{ turbopanel_orchestration_dir }}/scripts/ensure-single-daemon.sh"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure runtime socket dir and clear stale daemon lock
  ansible.builtin.command:
    cmd: "{{ turbopanel_orchestration_dir }}/scripts/ensure-single-daemon.sh"
  changed_when: false
  failed_when: false

- name: Install daemon systemd unit
  ansible.builtin.template:
    src: turbopaneld.service.j2
    dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
    owner: root
    group: root
    mode: "0640"
  notify:
    - Reload systemd
    - Restart turbopanel daemon

- name: Ensure daemon service desired state
  ansible.builtin.systemd:
    name: "{{ turbopanel_service_name }}"
    daemon_reload: true
    enabled: "{{ turbopanel_start | bool }}"
    state: >-
      {{
        'restarted'
        if (
          turbopanel_start | bool
          and (turbopanel_restart_daemon | default(false) | bool)
        )
        else (
          'started'
          if (turbopanel_start | bool)
          else 'stopped'
        )
      }}
  when: turbopanel_manage_service_state | default(true) | bool
