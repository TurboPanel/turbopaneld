# {{ turbopanel_config_dir }}/ (FHS /etc/turbopanel; dev shares it with prod)
#   rabbitmq/
#     config.json   — connection metadata only (host, port, user, vhost; no secrets)
#     .rabbitmq_pass — generated password, mode 0600, owned by rabbitmq_config_owner
#                      (the dev user in co-located dev, else root)


- name: Ensure turbopanel group exists
  ansible.builtin.group:
    name: "{{ turbopanel_group }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure tpqueue primary group for queue user
  ansible.builtin.group:
    name: "{{ rabbitmq_primary_group }}"
    gid: "{{ rabbitmq_container_gid }}"
    state: present
    system: true
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure queue service user (primary group tpqueue, supplementary tp)
  ansible.builtin.user:
    name: "{{ rabbitmq_system_user }}"
    uid: "{{ rabbitmq_container_uid }}"
    group: "{{ rabbitmq_primary_group }}"
    groups: "{{ turbopanel_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  when: turbopanel_dev_user | default('') | length == 0

- name: Ensure queue config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/rabbitmq"
    state: directory
    owner: "{{ rabbitmq_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Generate queue password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass'
      if [ ! -s "$f" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$f"
        chmod 0600 "$f"
        chown {{ rabbitmq_config_owner }}:{{ turbopanel_group }} "$f"
        echo created
      fi
    executable: /bin/bash
  register: rabbitmq_pass_gen
  changed_when: "'created' in rabbitmq_pass_gen.stdout"

- name: Read queue password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass"
  register: rabbitmq_pass_raw

- name: Set queue password fact
  ansible.builtin.set_fact:
    _rabbitmq_password: "{{ rabbitmq_pass_raw.content | b64decode | trim }}"

- name: Write queue config.json (idempotent)
  ansible.builtin.template:
    src: rabbitmq-config.json.j2
    dest: "{{ turbopanel_config_dir }}/rabbitmq/config.json"
    owner: "{{ rabbitmq_config_owner }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"

- name: Write queue broker config
  ansible.builtin.template:
    src: rabbitmq.conf.j2
    dest: "{{ turbopanel_config_dir }}/rabbitmq/rabbitmq.conf"
    owner: "{{ rabbitmq_config_owner }}"
    group: root
    mode: "0640"
  register: rabbitmq_conf_written

- name: Ensure turbopanel Docker network exists
  ansible.builtin.command:
    argv: [
      docker,
      network,
      create,
      --driver,
      bridge,
      "{{ turbopanel_docker_network }}",
    ]
  register: rabbitmq_network_create
  changed_when: false
  failed_when: false

- name: Ensure turbopanel-queue Docker volume exists
  ansible.builtin.command:
    argv: [docker, volume, create, "{{ rabbitmq_volume_name }}"]
  register: rabbitmq_volume_create
  changed_when: false

- name: Inspect queue container
  ansible.builtin.command:
    argv: [docker, inspect, "{{ rabbitmq_container_name }}"]
  register: rabbitmq_inspect_cmd
  changed_when: false
  failed_when: false

- name: Parse queue container inspection
  ansible.builtin.set_fact:
    rabbitmq_inspect: "{{ (rabbitmq_inspect_cmd.stdout | from_json)[0] }}"
  when: rabbitmq_inspect_cmd.rc == 0

- name: Set queue container state facts
  ansible.builtin.set_fact:
    _rabbitmq_container_exists: true
    _rabbitmq_running: "{{ rabbitmq_inspect.State.Running | default(false) }}"
    rabbitmq_container_status: "{{ rabbitmq_inspect.State.Status | default('') }}"
    rabbitmq_volume_ok: >-
      {{
        rabbitmq_inspect.Mounts | default([])
        | selectattr('Type', 'equalto', 'volume')
        | selectattr('Name', 'equalto', rabbitmq_volume_name)
        | list | length > 0
      }}
    rabbitmq_network_ok: "{{ turbopanel_docker_network in (rabbitmq_inspect.NetworkSettings.Networks | default({})) }}"
    rabbitmq_mgmt_exposed: "{{ rabbitmq_inspect.HostConfig.PortBindings['15672/tcp'] is defined }}"
    rabbitmq_conf_mounted: >-
      {{
        rabbitmq_inspect.Mounts | default([])
        | selectattr('Destination', 'equalto', '/etc/rabbitmq/rabbitmq.conf')
        | list | length > 0
      }}
  when: rabbitmq_inspect_cmd.rc == 0

- name: Set queue container missing facts
  ansible.builtin.set_fact:
    _rabbitmq_container_exists: false
    _rabbitmq_running: false
  when: rabbitmq_inspect_cmd.rc != 0

- name: Remove queue container when unhealthy
  ansible.builtin.command:
    cmd: docker rm -f {{ rabbitmq_container_name }}
  when:
    - _rabbitmq_container_exists | bool
    - >-
        (not rabbitmq_volume_ok | bool)
        or (not rabbitmq_network_ok | bool)
        or (not rabbitmq_conf_mounted | bool)
        or (rabbitmq_container_status | trim in ['restarting', 'exited', 'dead'])
  register: rabbitmq_removed
  changed_when: rabbitmq_removed.rc == 0

- name: Remove queue container when management port exposure does not match config
  ansible.builtin.command:
    cmd: docker rm -f {{ rabbitmq_container_name }}
  when:
    - _rabbitmq_container_exists | bool
    - rabbitmq_removed is not changed
    - >-
        (rabbitmq_expose_mgmt_port | bool and (not rabbitmq_mgmt_exposed | bool))
        or ((not rabbitmq_expose_mgmt_port | bool) and (rabbitmq_mgmt_exposed | bool))
  register: rabbitmq_removed_mgmt
  changed_when: rabbitmq_removed_mgmt.rc == 0

- name: Refresh queue container facts after removal
  ansible.builtin.set_fact:
    _rabbitmq_container_exists: false
    _rabbitmq_running: false
  when: rabbitmq_removed is changed or rabbitmq_removed_mgmt is changed

- name: Pre-own queue Docker volume data directory
  ansible.builtin.command:
    cmd: docker run --rm -v {{ rabbitmq_volume_name }}:/data --user root alpine chown -R {{ rabbitmq_container_uid }}:{{ rabbitmq_container_gid }} /data
  when: not _rabbitmq_container_exists | bool
  changed_when: true

- name: Build docker run argument list
  ansible.builtin.set_fact:
    rabbitmq_docker_run_args: "{{ rabbitmq_docker_run_base + (rabbitmq_docker_run_mgmt if rabbitmq_expose_mgmt_port | bool else []) + [rabbitmq_image] }}"
  vars:
    rabbitmq_docker_run_base:
      - "--name"
      - "{{ rabbitmq_container_name }}"
      - "--restart"
      - "unless-stopped"
      - "-d"
      - "--user"
      - "{{ rabbitmq_container_uid }}:{{ rabbitmq_container_gid }}"
      - "-v"
      - "{{ rabbitmq_volume_name }}:/var/lib/rabbitmq"
      - "-v"
      - "{{ turbopanel_config_dir }}/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro"
      - "--network"
      - "{{ turbopanel_docker_network }}"
      - "-e"
      - "RABBITMQ_DEFAULT_USER={{ rabbitmq_user }}"
      - "-e"
      - "RABBITMQ_DEFAULT_PASS={{ _rabbitmq_password }}"
      - "-e"
      - "RABBITMQ_DEFAULT_VHOST={{ rabbitmq_vhost }}"
      - "-p"
      - "127.0.0.1:{{ rabbitmq_amqp_port }}:5672"
    rabbitmq_docker_run_mgmt:
      - "-p"
      - "127.0.0.1:{{ rabbitmq_mgmt_port }}:15672"

- name: Create and start queue container
  ansible.builtin.command:
    cmd: docker run {{ rabbitmq_docker_run_args | join(' ') }}
  when: not _rabbitmq_container_exists | bool
  changed_when: true
  no_log: true

- name: Restart queue container when broker config changed
  ansible.builtin.command:
    cmd: docker restart {{ rabbitmq_container_name }}
  when:
    - _rabbitmq_container_exists | bool
    - rabbitmq_conf_written is changed
    - rabbitmq_removed is not changed
    - rabbitmq_removed_mgmt is not changed
  register: rabbitmq_conf_restart
  changed_when: rabbitmq_conf_restart.rc == 0

- name: Install queue wrapper start script
  ansible.builtin.template:
    src: rabbitmq-wrapper-start.sh.j2
    dest: "{{ turbopanel_config_dir }}/rabbitmq/wrapper-start.sh"
    owner: root
    group: root
    mode: "0750"

- name: Ensure queue container is running and ready
  ansible.builtin.command:
    cmd: "{{ turbopanel_config_dir }}/rabbitmq/wrapper-start.sh"
  changed_when: false

- name: Install queue systemd unit
  ansible.builtin.template:
    src: turbopanel-rabbitmq.service.j2
    dest: "/etc/systemd/system/{{ rabbitmq_service_name }}.service"
    owner: root
    group: root
    mode: "0640"

- name: Ensure queue systemd unit desired state
  ansible.builtin.systemd:
    name: "{{ rabbitmq_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
