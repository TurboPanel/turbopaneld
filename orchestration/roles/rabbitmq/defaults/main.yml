rabbitmq_image: rabbitmq:4-management
rabbitmq_container_name: turbopanel-queue
rabbitmq_amqp_port: 5672
rabbitmq_mgmt_port: 15672
rabbitmq_expose_amqp_port: false
rabbitmq_expose_mgmt_port: true
rabbitmq_volume_name: turbopanel-queue
turbopanel_docker_network: turbopanel  # noqa: var-naming[no-role-prefix]
rabbitmq_user: turbopanel
rabbitmq_vhost: /
# FHS config dir (dev shares it with prod).
turbopanel_config_dir: /etc/turbopanel  # noqa: var-naming[no-role-prefix]
rabbitmq_service_name: turbopanel-rabbitmq
# Shared dev-identity contract: dev runs the container (and owns its secret files)
# as the single dev uid:gid; managed installs use the dedicated tpqueue(9995) account.
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_uid: ""  # noqa: var-naming[no-role-prefix]
turbopanel_dev_gid: ""  # noqa: var-naming[no-role-prefix]
turbopanel_group: >-  # noqa: var-naming[no-role-prefix]
  {{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}
rabbitmq_system_user: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpqueue' }}"
rabbitmq_primary_group: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tpqueue' }}"
rabbitmq_container_uid: "{{ turbopanel_dev_uid if (turbopanel_dev_user | default('') | length > 0) else '9995' }}"
rabbitmq_container_gid: "{{ turbopanel_dev_gid if (turbopanel_dev_user | default('') | length > 0) else '9995' }}"
# Owner of the generated rabbitmq secret/config files: the dev user in dev (so it
# owns its own secrets), else root.
rabbitmq_config_owner: "{{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'root' }}"
