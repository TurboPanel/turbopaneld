---
galaxy_info:
  author: turbopanel
  description: >-
    Vendor the pinned Valkey server under vendor/valkey/<version>/bin for
    project caches (one native process per cache, run as a Hosting Account),
    with the upstream licence beside the binary. Sets vm.overcommit_memory=1 so
    the default snapshot fork does not fail under memory pressure. Requires
    64-bit Linux (aarch64 or x86_64).
  license: AGPL-3.0
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - all

dependencies: []
