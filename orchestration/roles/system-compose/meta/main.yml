---
galaxy_info:
  role_name: system_compose
  author: turbopanel
  license: AGPL-3.0
  description: >
    Run postgres/rabbitmq/clickhouse as a single Docker Compose project
    (turbopanel-system) instead of three independently `docker run`
    containers/units. Reads the secrets already generated by the (trimmed)
    postgres/rabbitmq/clickhouse roles and renders whichever service(s) have
    generated config, so it works whether all three, or only one, ran in
    this play.
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - trixie

dependencies:
  - role: docker
