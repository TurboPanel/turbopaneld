# Brings up postgres/rabbitmq as one Docker Compose project
# (turbopanel-system) under {{ system_compose_dir }}/docker-compose.yml.
#
# Must run AFTER the (trimmed) postgres/rabbitmq roles in the same
# play — they generate the secrets this role slurps directly, and this role
# reads their OTHER role defaults (image, volume/container names, uid/gid,
# ports, users, …) straight out of play scope rather than redeclaring them.
# A service is considered "active" purely by its secret file existing, so
# this role degrades gracefully when only a subset ran (see the
# standalone postgres-setup.yml / rabbitmq-setup.yml playbooks).
# `queue` is additionally deactivated on Workers runtime (Mailgun replaces
# it) — mirroring the `when: turbopanel_instance_runtime == 'deno'` gate
# already used to skip the rabbitmq role itself in instance-dev-install.yml.


- name: Ensure system compose config directory exists
  ansible.builtin.file:
    path: "{{ system_compose_dir }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Check for generated postgres password
  ansible.builtin.stat:
    path: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _system_compose_pg_pass_stat

- name: Check for generated queue password
  ansible.builtin.stat:
    path: "{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass"
  register: _system_compose_rabbitmq_pass_stat

- name: Check whether the Compose file already exists (first run vs. steady state)
  ansible.builtin.stat:
    path: "{{ system_compose_dir }}/docker-compose.yml"
  register: _system_compose_file_stat

- name: Set active-service facts
  ansible.builtin.set_fact:
    _system_compose_database_active: "{{ _system_compose_pg_pass_stat.stat.exists }}"
    _system_compose_queue_active: >-
      {{ _system_compose_rabbitmq_pass_stat.stat.exists
         and (turbopanel_instance_runtime | default('deno')) != 'workers' }}

- name: Set combined active-service facts
  ansible.builtin.set_fact:
    _system_compose_any_active: >-
      {{ _system_compose_database_active or _system_compose_queue_active }}
    _system_compose_active_container_names: >-
      {{
        ([postgres_container_name] if _system_compose_database_active else [])
        + ([rabbitmq_container_name] if _system_compose_queue_active else [])
      }}
    _system_compose_active_volume_names: >-
      {{
        ([postgres_volume_name] if _system_compose_database_active else [])
        + ([rabbitmq_volume_name] if _system_compose_queue_active else [])
      }}

- name: Read postgres password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _system_compose_pg_pass_raw
  when: _system_compose_database_active | bool

- name: Read queue password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/rabbitmq/.rabbitmq_pass"
  register: _system_compose_rabbitmq_pass_raw
  when: _system_compose_queue_active | bool

- name: Set service password facts
  ansible.builtin.set_fact:
    _system_compose_pg_password: "{{ _system_compose_pg_pass_raw.content | b64decode | trim if _system_compose_database_active else '' }}"
    _system_compose_rabbitmq_password: "{{ _system_compose_rabbitmq_pass_raw.content | b64decode | trim if _system_compose_queue_active else '' }}"
  no_log: true

- name: Bring up the consolidated system-services Compose project
  when: _system_compose_any_active | bool
  block:
    - name: Ensure turbopanel Docker network exists
      ansible.builtin.command:
        argv: [docker, network, create, --driver, bridge, "{{ turbopanel_docker_network }}"]
      register: _system_compose_network_create
      changed_when: false
      failed_when: false

    - name: Ensure Docker volumes exist for active services
      ansible.builtin.command:
        argv: [docker, volume, create, "{{ item }}"]
      loop: "{{ _system_compose_active_volume_names }}"
      register: _system_compose_volume_create
      changed_when: false

    - name: Remove pre-existing non-Compose containers before first Compose run
      ansible.builtin.command:
        argv: [docker, rm, -f, "{{ item }}"]
      loop: "{{ _system_compose_active_container_names }}"
      when: not _system_compose_file_stat.stat.exists
      register: _system_compose_migrate_removed
      changed_when: _system_compose_migrate_removed.rc == 0
      failed_when: false

    - name: Pre-own volume data directories before first Compose run
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - -v
          - "{{ item.volume }}:{{ item.mount }}"
          - --user
          - root
          - alpine
          - chown
          - -R
          - "{{ item.uid }}:{{ item.gid }}"
          - "{{ item.mount }}"
      loop:
        - volume: "{{ postgres_volume_name | default('') }}"
          mount: /var/lib/postgresql
          uid: "{{ postgres_container_uid | default('') }}"
          gid: "{{ postgres_container_gid | default('') }}"
          active: "{{ _system_compose_database_active }}"
        - volume: "{{ rabbitmq_volume_name | default('') }}"
          mount: /var/lib/rabbitmq
          uid: "{{ rabbitmq_container_uid | default('') }}"
          gid: "{{ rabbitmq_container_gid | default('') }}"
          active: "{{ _system_compose_queue_active }}"
      loop_control:
        label: "{{ item.mount }}"
      when:
        - not _system_compose_file_stat.stat.exists
        - item.active | bool
      changed_when: true

    # Whether the queue container was there before this converge brings the
    # stack up. Asked after the migration removal above, so a container that
    # step just removed counts as absent. The config-change restart further
    # down only applies to a container that pre-dates this converge.
    - name: Check whether the queue container already exists
      ansible.builtin.command:
        argv: [docker, ps, -a, -q, --filter, "name=^{{ rabbitmq_container_name }}$"]
      register: _system_compose_queue_existing
      changed_when: false
      failed_when: false
      when: _system_compose_queue_active | bool

    # Adding a digest to an image string makes Compose recreate the container,
    # so a stack already running on the bare tag keeps it; the digest applies on
    # first create or when the stored file already carries one.
    - name: Read the existing turbopanel-system docker-compose.yml
      ansible.builtin.slurp:
        src: "{{ system_compose_dir }}/docker-compose.yml"
      register: _system_compose_existing
      when: _system_compose_file_stat.stat.exists
      no_log: true

    - name: Choose image strings that do not restart a running stack
      ansible.builtin.set_fact:
        _system_compose_postgres_image: >-
          {{ postgres_image.split('@')[0]
             if (_system_compose_existing.content | default('') | b64decode).find('image: ' ~ postgres_image.split('@')[0] ~ '\n') >= 0
             else postgres_image }}
        _system_compose_rabbitmq_image: >-
          {{ rabbitmq_image.split('@')[0]
             if (_system_compose_existing.content | default('') | b64decode).find('image: ' ~ rabbitmq_image.split('@')[0] ~ '\n') >= 0
             else rabbitmq_image }}
      no_log: true

    - name: Write turbopanel-system docker-compose.yml
      ansible.builtin.template:
        src: docker-compose.yml.j2
        dest: "{{ system_compose_dir }}/docker-compose.yml"
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0640"
      no_log: true
      register: _system_compose_file_written

    - name: Install system-compose readiness wait script
      ansible.builtin.template:
        src: system-compose-wait.sh.j2
        dest: "{{ system_compose_dir }}/wait-ready.sh"
        owner: root
        group: root
        mode: "0750"

    - name: Install turbopanel-system-stack systemd unit
      ansible.builtin.template:
        src: turbopanel-system-stack.service.j2
        dest: "/etc/systemd/system/{{ system_compose_service_name }}.service"
        owner: root
        group: root
        mode: "0640"


    - name: Ensure turbopanel-system-stack systemd unit desired state
      ansible.builtin.systemd:
        name: "{{ system_compose_service_name }}"
        daemon_reload: true
        enabled: true
        state: started
    # The stack unit is `Type=oneshot` + `RemainAfterExit=yes`, so once it is
    # active `state: started` is a no-op and a re-rendered Compose file never
    # reaches Docker: the containers keep the old definition. That is how a
    # Deno-first dev host stayed without the exposed Postgres port after the
    # Workers switch rendered it, and the switch's migrate step then failed
    # on localhost:5432. `up -d` recreates only the services whose definition
    # changed and removes orphans (the queue when the runtime is Workers).
    # First run is excluded: the unit start above already brought it up.
    - name: Apply Compose changes to the running stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -p
          - "{{ system_compose_project_name }}"
          - -f
          - "{{ system_compose_dir }}/docker-compose.yml"
          - up
          - -d
          - --remove-orphans
      when:
        - _system_compose_file_stat.stat.exists
        - _system_compose_file_written is changed
      changed_when: true
    - name: Wait for the stack after a Compose change
      ansible.builtin.command:
        argv: ["{{ system_compose_dir }}/wait-ready.sh"]
      when:
        - _system_compose_file_stat.stat.exists
        - _system_compose_file_written is changed
      changed_when: false

    # docker compose up -d does not restart an already-running container just
    # because a bind-mounted config file's *content* changed (only container
    # recreation picks that up) — replicate the targeted restart-on-change the
    # trimmed rabbitmq role used to do via its own docker-run path.
    #
    # Only for a container that existed before this converge. One created
    # above already mounted the new file, so a restart would gain nothing, and
    # on a first boot it is harmful: it stops the broker while it seeds its
    # data directory, between creating the application user and granting it
    # the virtual host. The broker never seeds again, the user stays without
    # permissions, and every command answers "Command queue unavailable"
    # (fresh installs, 2026-11-09). The wait before the restart covers a
    # container that pre-dates this converge but is still starting.
    - name: Wait for the queue broker before a config-triggered restart
      ansible.builtin.command:
        argv: [docker, exec, "{{ rabbitmq_container_name }}", rabbitmq-diagnostics, -q, check_running]
      register: _system_compose_queue_prerestart
      until: _system_compose_queue_prerestart.rc == 0
      retries: 60
      delay: 2
      changed_when: false
      when:
        - _system_compose_queue_active | bool
        - rabbitmq_conf_written is defined
        - rabbitmq_conf_written is changed
        - _system_compose_queue_existing.stdout | default('') | trim | length > 0

    - name: Restart queue container when broker config changed
      ansible.builtin.command:
        argv: [docker, restart, "{{ rabbitmq_container_name }}"]
      when:
        - _system_compose_queue_active | bool
        - rabbitmq_conf_written is defined
        - rabbitmq_conf_written is changed
        - _system_compose_queue_existing.stdout | default('') | trim | length > 0
      changed_when: true

    # Every converge: wait until the broker has really started (first boot or
    # after the restart above), then make sure its application user exists
    # with the generated password and full access to its virtual host.
    - name: Ensure the queue application user can use the broker
      ansible.builtin.include_tasks: queue-access.yml
      when: _system_compose_queue_active | bool

    - name: Install Postgres backup script
      ansible.builtin.template:
        src: postgres-backup.sh.j2
        dest: "{{ system_compose_dir }}/postgres-backup.sh"
        owner: root
        group: root
        mode: "0750"
      when:
        - _system_compose_database_active | bool
        - postgres_backup_enabled | bool

    - name: Install Postgres backup systemd units
      ansible.builtin.template:
        src: "{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: "0640"
      loop:
        - turbopanel-postgres-backup.service
        - turbopanel-postgres-backup.timer
      when:
        - _system_compose_database_active | bool
        - postgres_backup_enabled | bool

    - name: Ensure Postgres backup timer desired state
      ansible.builtin.systemd:
        name: turbopanel-postgres-backup.timer
        daemon_reload: true
        enabled: true
        state: started
      when:
        - _system_compose_database_active | bool
        - postgres_backup_enabled | bool
