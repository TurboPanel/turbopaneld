---
- name: Check for staged license credentials
  ansible.builtin.stat:
    path: "{{ turbopanel_daemon_license_staging_dir }}/license.id"
  register: _staged_license_id

- name: Ensure daemon state directory
  ansible.builtin.file:
    path: "{{ turbopanel_daemon_state_dir | default('/opt/turbopanel/platform/daemon/state') }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Install staged license credentials into daemon state directory
  when: _staged_license_id.stat.exists
  block:
    - name: Copy staged license.id into daemon state directory
      ansible.builtin.copy:
        src: "{{ turbopanel_daemon_license_staging_dir }}/license.id"
        dest: "{{ turbopanel_daemon_state_dir | default('/opt/turbopanel/platform/daemon/state') }}/license.id"
        remote_src: true
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        mode: "0640"

    - name: Copy staged license.token into daemon state directory
      ansible.builtin.copy:
        src: "{{ turbopanel_daemon_license_staging_dir }}/license.token"
        dest: "{{ turbopanel_daemon_state_dir | default('/opt/turbopanel/platform/daemon/state') }}/license.token"
        remote_src: true
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        mode: "0640"

    - name: Remove staged license credentials
      ansible.builtin.file:
        path: "{{ turbopanel_daemon_license_staging_dir }}"
        state: absent

- name: Ensure platform CA directory
  when: turbopanel_instance_ca | length > 0
  ansible.builtin.file:
    path: "{{ turbopanel_instance_ca | dirname }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Restrict platform CA permissions
  when: turbopanel_instance_ca | length > 0
  ansible.builtin.file:
    path: "{{ turbopanel_instance_ca }}"
    state: file
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  notify: Restart turbopanel daemon

- name: Write daemon environment file
  ansible.builtin.template:
    src: dotenv.j2
    dest: "{{ turbopanel_daemon_dir }}/.env"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  notify: Restart turbopanel daemon

- name: Ensure Cloudflare tunnel token directory
  ansible.builtin.file:
    path: "{{ turbopanel_daemon_dir }}/cloudflared/tunnels"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Store Cloudflare tunnel token
  ansible.builtin.copy:
    dest: "{{ turbopanel_daemon_dir }}/cloudflared/tunnels/default.token"
    content: "{{ turbopanel_tunnel_token }}\n"
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0600"
  when: turbopanel_tunnel_token | length > 0
  no_log: true
