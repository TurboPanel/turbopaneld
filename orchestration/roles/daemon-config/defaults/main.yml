---
turbopanel_install_root: /opt/turbopanel
turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
turbopanel_config_dir: /etc/turbopanel
turbopanel_daemon_state_dir: /var/lib/turbopanel
turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
# Root-owned parent on purpose: tp owns the state dir, and this role copies
# out of the staging dir as root. run.sh passes the same path.
turbopanel_daemon_license_staging_dir: "/var/lib/turbopanel-license-staging"
turbopanel_daemon_tunnels_dir: "{{ turbopanel_daemon_state_dir }}/cloudflared/tunnels"
turbopanel_service_name: turbopaneld
turbopanel_update_channel: release
# Local overlay catalog (dev). Empty in production: daemons use the built-in
# rail (src/update/urls.ts) — GitHub Releases for canary/rc/release, and
# https://dl.trbp.nl only for the daemon's trunk channel.
turbopanel_dl_base: ""
turbopanel_manifest_url: ""
turbopanel_instance_manifest_url: ""
turbopanel_ui_manifest_url: ""

# P1-1: the config and state roots are root-owned on managed hosts (the daemon
# writes only its own folders below them: DAEMON_*_LEAVES in src/paths/layout.ts).
# Co-located dev (turbopanel_dev_user set) keeps the dev user as owner. The
# co-located control-plane playbooks keep the state root shared with the
# instance (turbopanel_seal_state_root: false) until its hand-off is reworked.
# Same lines in the daemon-layout, daemon-config and turbopanel-user defaults
# (pinned by src/orchestration/platform-roots-sealed.test.ts).
turbopanel_seal_config_root: "{{ turbopanel_dev_user | default('') | length == 0 }}"
turbopanel_seal_state_root: "{{ turbopanel_dev_user | default('') | length == 0 }}"
turbopanel_config_root_owner: "{{ 'root' if turbopanel_seal_config_root | bool else (turbopanel_user | default('tp')) }}"
turbopanel_state_root_owner: "{{ 'root' if turbopanel_seal_state_root | bool else (turbopanel_user | default('tp')) }}"
