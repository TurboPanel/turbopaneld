---
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in ['aarch64', 'x86_64']
    fail_msg: >-
      Unsupported CPU architecture '{{ ansible_architecture }}'.
      TurboPanel supports 64-bit Linux only: aarch64 (arm64), x86_64 (amd64).

- name: Resolve Deno release architecture
  ansible.builtin.set_fact:
    deno_app_arch: "{{ 'aarch64' if ansible_architecture == 'aarch64' else 'x86_64' }}"

# The daemon may pass the same series twice (two apps, one pin) and may pass an
# empty list; normalize both here rather than in every task below.
- name: Normalize the requested tenant Deno series
  ansible.builtin.set_fact:
    deno_app_requested_versions: >-
      {{ (deno_app_versions | default([deno_app_default_version]))
         | map('string') | map('trim') | reject('equalto', '')
         | unique | list or [deno_app_default_version] }}

# setfacl, for the traverse-only grants below; unzip, for the release archive.
- name: Ensure ACL tooling and unzip are present
  ansible.builtin.apt:
    name:
      - acl
      - unzip
    state: present
    update_cache: true
    cache_valid_time: 3600

# Creates one group per requested series and grants each traverse-only access
# to /opt/turbopanel and vendor/. Group names and gids live in the shared
# registry so this role and the daemon cannot disagree about them.
- name: Ensure per-series tenant Deno entitlement groups
  ansible.builtin.include_role:
    name: runtime-entitlement
  vars:
    runtime_entitlement_runtime: deno
    runtime_entitlement_series: "{{ deno_app_requested_versions | map('regex_replace', '^([0-9]+).*$', '\\1') | unique | list }}"

# Before vendoring: `vendor-series.yml` writes into this directory.
- name: Ensure the tenant Deno tree root
  ansible.builtin.file:
    path: "{{ deno_app_root }}"
    state: directory
    owner: root
    group: "{{ turbopanel_group | default('tp') }}"
    mode: "0750"

- name: Grant each Deno entitlement group traversal of the tenant Deno tree
  ansible.posix.acl:
    path: "{{ deno_app_root }}"
    etype: group
    entity: "tpdeno{{ item | regex_replace('^([0-9]+).*$', '\\1') }}"
    permissions: x
    state: present
  loop: "{{ deno_app_requested_versions }}"

- name: Vendor each requested tenant Deno series
  ansible.builtin.include_tasks: vendor-series.yml
  loop: "{{ deno_app_requested_versions }}"
  loop_control:
    loop_var: deno_app_series
