---
galaxy_info:
  author: turbopanel
  description: >-
    Vendor pinned Deno runtimes under vendor/deno-app/<series>/current for
    tenant native applications (runtime: deno), one tree per requested version
    series. The panel itself needs no host Deno here: this tree is only what
    site owners' apps and their builds execute. Requires 64-bit Linux (aarch64
    or x86_64).
  license: AGPL-3.0
  min_ansible_version: "2.14"
  platforms:
    - name: Debian
      versions:
        - all

dependencies: []
