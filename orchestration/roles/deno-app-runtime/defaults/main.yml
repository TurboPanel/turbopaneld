---
# Runtimes always live under the FHS vendor tree (dev shares it with prod).
turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"
# Deno executed by *tenant* apps (`x-turbopanel.runtime: deno`).
#
# A **series**: Deno publishes one major (2) and ships minors often, so the
# series is the major ("2"; "2.9" or "2.9.7" name the same series). The role
# installs the newest release of the series and points
# `<deno_app_root>/<series>/current` at it, so a release lands without a config
# change and without rewriting a single systemd unit.
deno_app_default_version: "2"
# Series to vendor on this run. The daemon overrides this with the distinct
# versions the deploy's Deno apps declared; a manual run gets the default.
deno_app_versions: ["{{ deno_app_default_version }}"]
deno_app_root: "{{ turbopanel_vendor_dir }}/deno-app"

# Where the official release metadata and zips come from. The newest stable
# release is `release-latest.txt`; `release/v<version>/` holds each archive and
# its `.sha256sum`. The Deno project's own release list is the fallback for a series that is
# no longer the newest (the day a new major ships).
deno_app_dist_url: https://dl.deno.land
deno_app_releases_api_url: https://api.github.com/repos/denoland/deno/releases?per_page=100

# `/opt/turbopanel`, `vendor/` and `deno-app/` stay 0750 with an `other:x` ACL
# (the runtime-access role): every site owner's Linux user may run every
# installed series, without being able to list those directories.
turbopanel_install_root: /opt/turbopanel  # noqa: var-naming[no-role-prefix]
