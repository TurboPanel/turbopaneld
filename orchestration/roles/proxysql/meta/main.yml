---
galaxy_info:
  role_name: proxysql
  author: turbopanel
  license: AGPL-3.0
  description: >
    Host prerequisites for the shared ProxySQL managed-ingress stack
    (config dirs, admin credentials, static base proxysql.cnf, wait-ready,
    turbopanel-proxysql-stack systemd unit). Does
    not write docker-compose.yml — the daemon owns that file under
    configDir/proxysql after managed.ingress.reconcile.
  min_ansible_version: "2.20"
  platforms:
    - name: Debian
      versions:
        - trixie

dependencies:
  - role: docker
