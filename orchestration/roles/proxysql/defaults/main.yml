---
# Image pin must not be loosened without reviewing CVE-2026-48773
# (pre-auth first-packet heap overflow) and CVE-2026-48772 (PROXY-protocol-v1
# client_addr ACL bypass). Both are fixed in ProxySQL 3.0.9.
proxysql_image: proxysql/proxysql:3.0.9
proxysql_config_dir: "{{ turbopanel_config_dir }}/proxysql"
proxysql_tls_dir: "{{ proxysql_config_dir }}/tls"
proxysql_data_dir: "{{ turbopanel_state_dir }}/proxysql"
proxysql_service_name: turbopanel-proxysql-stack
proxysql_admin_port: 6032
proxysql_pgsql_port: 15432
proxysql_mysql_port: 13306
# Runtime uid/gid for image — ProxySQL official image often runs as 999 or 2;
# use 999:999 for datadir pre-own (document if adjustable).
proxysql_container_uid: 999
proxysql_container_gid: 999
proxysql_admin_user: admin
# Host-wide ProxySQL → backend health-check principal (all engines on this host).
# Password lives only in monitor.cnf; never in Ansible facts after seed.
proxysql_monitor_user: tp_monitor
turbopanel_config_dir: /etc/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_state_dir: /var/lib/turbopanel  # noqa: var-naming[no-role-prefix]
turbopanel_dev_user: ""  # noqa: var-naming[no-role-prefix]
turbopanel_group: >-  # noqa: var-naming[no-role-prefix]
  {{ turbopanel_dev_user if (turbopanel_dev_user | default('') | length > 0) else 'tp' }}
