---
# Install the co-located self-hosted instance + UI + Caddy.
# UI/instance run modes come from role defaults or extra-vars (daemon .env).
#
# Single convergence playbook for co-located dev: gathers facts once and runs
# shared infrastructure roles without overlapping docker/redis/rabbitmq/postgres
# playbook invocations.
#
# Run by the always-installed daemon when co-located and TURBOPANEL_DEV_INSTANCE=1.
# Every role is idempotent and never force-resets an existing dev working tree.
- name: TurboPanel co-located dev instance converge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/runtimes"
    turbopanel_platform_dir: "{{ turbopanel_install_root }}/platform"
    turbopanel_daemon_dir: "{{ turbopanel_platform_dir }}/daemon"
    turbopanel_instance_dir: "{{ turbopanel_platform_dir }}/instance"
    turbopanel_ui_dir: "{{ turbopanel_platform_dir }}/ui"
    turbopanel_website_dir: "{{ turbopanel_platform_dir }}/website"
    turbopanel_group: turbopanel
    instance_user: instance
    instance_uid: 9998
    instance_repo_url: https://github.com/turbopanel/instance
    ui_repo_url: https://github.com/turbopanel/turbopanel-ui
    website_repo_url: https://github.com/turbopanel/turbopanel-website
    instance_branch: trunk
    ui_branch: trunk
    website_branch: trunk
    turbopanel_ui_artifact_url: ""
    turbopanel_instance_runtime: deno
    # Caddy/UI/mailer follow instance_start; the instance unit also checks runtime.
    instance_start: true
    # Unix socket is always available; expose TCP when Workers runtime needs wrangler Hyperdrive.
    postgres_expose_port: "{{ turbopanel_instance_runtime == 'workers' }}"
    rabbitmq_amqp_port: 5672
    rabbitmq_mgmt_port: 15672
    rabbitmq_expose_mgmt_port: true
    redis_socket_path: /run/turbopanel/redis.sock
    turbopanel_dev_user: ""
    turbopanel_dev_uid: ""
    turbopanel_dev_gid: ""
    force_checkout_normalize: false

  pre_tasks:
    - name: Refresh apt cache once per converge (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Install ACL tooling for co-located dev permissions
      ansible.builtin.apt:
        name: acl
        state: present
      when: turbopanel_dev_user | length > 0

  roles:
    - role: runtime-sockets
    - role: daemon-logs
    - role: daemon-prereqs
    - role: docker
    - role: postgres
    - role: redis
    - role: rabbitmq
    - role: instance-user
    # GTK/NSS/GBM stack for @react-native/debugger-shell (Debian only).
    - role: instance-dev-prereqs
    - role: node-runtime
    - role: deno-runtime
    - role: caddy
    # Before turbopanel runs git/pnpm in platform checkouts (often pre-seeded by dev).
    - role: dev-permissions
    - role: dev-host-access
    - role: instance-repo
    - role: ui-repo
    - role: website-repo
      when: turbopanel_instance_runtime == 'workers'
    - role: ui-build
    - role: instance-build
    - role: instance-certs
    - role: instance-launch

  post_tasks:
    # If converge aborts after instance-user stops the stack (uid migration) or
    # any later failure, bring enabled units back up instead of leaving a partial stack.
    - name: Resolve dev stack unit list
      ansible.builtin.set_fact:
        _dev_stack_units:
          - turbopanel-instance
          - turbopanel-caddy
          - turbopanel-ui
          - turbopanel-mailer

    - name: Include website unit in Workers dev stack
      when: turbopanel_instance_runtime == 'workers'
      ansible.builtin.set_fact:
        _dev_stack_units: "{{ _dev_stack_units + ['turbopanel-website'] }}"

    - name: Ensure dev stack services are running after converge
      when: instance_start | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop: "{{ _dev_stack_units }}"
      failed_when: false
