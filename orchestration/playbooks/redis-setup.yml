- name: TurboPanel cache setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    # Managed standalone Redis setup: use the FHS runtime location so the redis
    # role's turbopanel_managed_install default resolves to vendor.
    turbopanel_managed_install: true
    turbopanel_vendor_dir: "{{ turbopanel_install_root | default('/opt/turbopanel') }}/vendor"
  roles:
    - role: daemon-prereqs
    - role: redis
