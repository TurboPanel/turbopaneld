---
# Provision a TurboPanel managed server (FHS release layout, runtimes, config, launch).
#
# Invoked by the CDN installer after run.sh has placed bin/turbopaneld,
# optional bin/turbopaneld.js (JS fallback only), and share/orchestration/,
# and bootstrapped ansible-playbook
# under /opt/turbopanel/vendor/ansible/current/. Every role is idempotent.
- name: TurboPanel daemon install
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    # Site-engine config trees under turbopanel_config_dir that their roles
    # keep root:<engine group>; post_tasks never hands them to tp.
    turbopanel_engine_config_dirs: [apache, nginx, openlitespeed, php]
    turbopanel_install_root: /opt/turbopanel
    # Production/managed-node install (run.sh). Roles key turbopanel_vendor_dir
    # off this flag; co-located dev playbooks leave it unset (defaults false).
    turbopanel_managed_install: true
    turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
    turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
    turbopanel_config_dir: /etc/turbopanel
    turbopanel_daemon_state_dir: /var/lib/turbopanel
    turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
    turbopanel_daemon_bin: "{{ turbopanel_install_root }}/bin/turbopaneld"
    turbopanel_daemon_js: "{{ turbopanel_install_root }}/bin/turbopaneld.js"
    turbopanel_daemon_workdir: "{{ turbopanel_install_root }}"
    turbopanel_daemon_deno_bin: "{{ turbopanel_vendor_dir }}/deno/bin/deno"
    # native | js — set by run.sh after the native-binary executability probe.
    turbopanel_daemon_exec_mode: native
    turbopanel_user: tp
    turbopanel_group: tp
    turbopanel_uid: 9999
    turbopanel_gid: 9999
    turbopanel_service_name: turbopaneld
    turbopanel_tunnel_token: ""
    turbopanel_instance_ca: ""
    turbopanel_start: true

  pre_tasks:
    - name: Require instance URL
      ansible.builtin.assert:
        that:
          - turbopanel_instance_url is defined
          - turbopanel_instance_url | length > 0
        fail_msg: >-
          turbopanel_instance_url is required (pass --host to run.sh).

  # Docker is intentionally NOT installed here. A managed node may only ever run
  # native web services (apache/nginx/openlitespeed) and never need a container
  # runtime. The docker role is installed on demand once a node is assigned a
  # container workload.
  roles:
    - role: daemon-prereqs
    - role: turbopanel-user
    - role: daemon-layout
    # Unconditional: the JS-fallback ExecStart needs Deno, and so do any
    # co-located instance/mailer units on this host — gating on exec mode left
    # native-binary hosts pinned to a stale vendor/deno/current. The role stats
    # the pinned version first, so this is a no-op once converged.
    - role: deno-runtime
    - role: daemon-logs
    - role: principal-access
    - role: rapl-access
    - role: daemon-config
    - role: daemon-launch

  post_tasks:
    # Mutable state and config belong to the daemon. The vendor tree and the
    # orchestration tree deliberately do **not** appear here: they are release
    # content root executes (tp-orchestrate runs playbooks from it), and the
    # daemon must not be able to rewrite them — see roles/turbopanel-user and
    # roles/daemon-layout.
    - name: Ensure tp owns the state tree
      ansible.builtin.file:
        path: "{{ turbopanel_daemon_state_dir }}"
        state: directory
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        recurse: true

    # The config tree is re-owned entry by entry so the site-engine trees stay
    # root:<engine group> (roles apache/nginx/openlitespeed/php-fpm; the daemon
    # writes them through tp-host). A recursive tp:tp here left them owned by
    # the daemon account after every update, which the engines' service users
    # cannot read (OpenLiteSpeed lost mime.properties and its vhost configs).
    - name: Ensure tp owns the config directory
      ansible.builtin.file:
        path: "{{ turbopanel_config_dir }}"
        state: directory
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"

    - name: List the config directory entries
      ansible.builtin.find:
        paths: "{{ turbopanel_config_dir }}"
        file_type: any
        hidden: true
      register: _tp_config_entries

    - name: Ensure tp owns the config tree except root-owned engine trees
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: "{{ 'directory' if item.isdir else 'file' }}"
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        recurse: "{{ item.isdir }}"
      loop: >-
        {{
          _tp_config_entries.files
          | rejectattr('islnk')
          | rejectattr('path', 'in', turbopanel_engine_config_dirs
              | map('regex_replace', '^', turbopanel_config_dir ~ '/') | list)
          | list
        }}
      loop_control:
        label: "{{ item.path }}"

    # Galaxy install uses ANSIBLE_HOME=/tmp/turbopanel-ansible (see paths.ts).
    # Roles/collections are already in FHS paths; drop the disposable cache and
    # any accidental /root/.ansible from older ansible defaults.
    - name: Remove install-time Ansible scratch dirs
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/turbopanel-ansible
        - /root/.ansible
