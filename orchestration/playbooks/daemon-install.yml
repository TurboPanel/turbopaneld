---
# Provision a TurboPanel managed server (FHS release layout, runtimes, config, launch).
#
# Invoked by the CDN installer after run.sh has placed bin/turbopaneld,
# bin/turbopaneld.js, and share/orchestration/, and bootstrapped ansible-playbook
# under /opt/turbopanel/lib/runtime/ansible/current/. Every role is idempotent.
- name: TurboPanel daemon install
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    # Production/managed-node install (run.sh). Roles key turbopanel_runtimes_dir
    # off this flag; co-located dev playbooks leave it unset (defaults false).
    turbopanel_managed_install: true
    turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/lib/runtime"
    turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
    turbopanel_config_dir: /etc/turbopanel
    turbopanel_daemon_state_dir: /var/lib/turbopanel
    turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
    turbopanel_daemon_bin: "{{ turbopanel_install_root }}/bin/turbopaneld"
    turbopanel_daemon_js: "{{ turbopanel_install_root }}/bin/turbopaneld.js"
    turbopanel_daemon_workdir: "{{ turbopanel_install_root }}"
    turbopanel_daemon_deno_bin: "{{ turbopanel_runtimes_dir }}/deno/bin/deno"
    # native | js — set by run.sh after the native-binary executability probe.
    turbopanel_daemon_exec_mode: native
    turbopanel_user: turbopanel
    turbopanel_group: turbopanel
    turbopanel_uid: 9999
    turbopanel_gid: 9999
    turbopanel_service_name: turbopaneld
    turbopanel_tunnel_token: ""
    turbopanel_instance_ca: ""
    turbopanel_start: true

  pre_tasks:
    - name: Require instance URL
      ansible.builtin.assert:
        that:
          - turbopanel_instance_url is defined
          - turbopanel_instance_url | length > 0
        fail_msg: >-
          turbopanel_instance_url is required (pass --host to run.sh).

  # Docker is intentionally NOT installed here. A managed node may only ever run
  # native web services (apache/nginx/openlitespeed) and never need a container
  # runtime. The docker role is installed on demand once a node is assigned a
  # container workload.
  roles:
    - role: daemon-prereqs
    - role: turbopanel-user
    - role: daemon-layout
    # Deno is required for the JS-fallback ExecStart path and for any tooling
    # that shells out to deno on managed hosts.
    - role: deno-runtime
    - role: daemon-logs
    - role: daemon-config
    - role: daemon-launch

  post_tasks:
    - name: Ensure turbopanel owns runtime and state trees
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ turbopanel_user }}"
        group: "{{ turbopanel_group }}"
        recurse: true
      loop:
        - "{{ turbopanel_runtimes_dir }}"
        - "{{ turbopanel_daemon_state_dir }}"
        - "{{ turbopanel_config_dir }}"
        - "{{ turbopanel_orchestration_dir }}"
