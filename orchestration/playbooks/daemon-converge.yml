---
# Single convergence playbook for managed daemon-only hosts (no co-located
# instance). Gathers facts once and runs shared infrastructure roles without
# overlapping docker/redis/rabbitmq/postgres playbook invocations.
- name: TurboPanel daemon converge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    turbopanel_managed_install: true
    turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
    turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
    turbopanel_config_dir: /etc/turbopanel
    turbopanel_daemon_state_dir: /var/lib/turbopanel
    turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
    turbopanel_daemon_bin: "{{ turbopanel_install_root }}/bin/turbopaneld"
    turbopanel_daemon_js: "{{ turbopanel_install_root }}/bin/turbopaneld.js"
    turbopanel_daemon_workdir: "{{ turbopanel_install_root }}"
    turbopanel_daemon_deno_bin: "{{ turbopanel_vendor_dir }}/deno/bin/deno"
    turbopanel_dev_user: ""
    turbopanel_user: tp
    turbopanel_group: tp
    turbopanel_service_name: turbopaneld
    # Rendered into the unit and the backup wrapper below; the same values as
    # the daemon-launch role defaults (pinned equal by
    # src/orchestration/docker-gate-role.test.ts), which this play does not load.
    turbopanel_backup_run_bin: "{{ turbopanel_install_root }}/lib/tp-backup-run"
    turbopanel_docker_gate_run_dir: /run/turbopanel-gate
    turbopanel_docker_gate_build_dir: "{{ turbopanel_docker_gate_run_dir }}/build"
    turbopanel_docker_gate_service: turbopanel-docker-gate.service
    turbopanel_docker_gate_wait_seconds: 60
    # Managed daemon-only hosts have no co-located instance service to order after.
    turbopanel_after_instance_service: false

  pre_tasks:
    - name: Refresh apt cache once per converge (Debian)
      ansible.builtin.apt:
        lock_timeout: 300
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Probe native daemon binary executability
      ansible.builtin.command:
        cmd: "{{ turbopanel_daemon_bin }} --version"
      register: _native_probe
      failed_when: false
      changed_when: false

    - name: Select native or JS-fallback ExecStart
      ansible.builtin.set_fact:
        turbopanel_daemon_exec_mode: "{{ 'native' if _native_probe.rc == 0 else 'js' }}"

  # Docker is installed on demand (when a container workload is assigned), not as
  # part of routine daemon convergence — nodes that only run native web services
  # never pull a container runtime.
  roles:
    - role: runtime-sockets
    # Unconditional: the JS-fallback ExecStart needs Deno, and so do any
    # co-located instance/mailer units on this host — gating on exec mode left
    # native-binary hosts pinned to a stale vendor/deno/current. The role stats
    # the pinned version first, so this is a no-op once converged.
    - role: deno-runtime
    - role: daemon-logs
    - role: daemon-prereqs
    - role: principal-access
    - role: rapl-access
    - role: time-sync
    # Debian security updates on their own; never restarts the server.
    - role: os-security-updates
    # /var/lib/turbopanel-build for tp-host build-run's sandboxed builds.
    - role: build-user

  # Entering one task file of a role needs import_role: Ansible ignores
  # `tasks_from` on a `roles:` entry and runs the role's main.yml, which
  # installed Docker and ran the full hosting Caddy role on every boot.
  # import_role (static, not include_role) keeps the role handlers, keeps
  # these tasks visible to --list-tasks and --syntax-check, and runs them in
  # this order, after every role above.
  tasks:
    # Docker hosts provisioned before the builder entitlement deny (#204) never
    # re-run the docker role; re-apply just that daemon.json deny here.
    - name: Re-apply the Docker builder entitlement deny
      ansible.builtin.import_role:
        name: docker
        tasks_from: converge-builder
    # Existing Docker hosts get the enforcing gate on their next converge;
    # the role is a no-op where Docker is absent (docker-setup installs it
    # there, via the docker role).
    - name: Docker gate (no-op without Docker, enforce mode)
      ansible.builtin.import_role:
        name: docker-gate
    # The daemon reaches Docker only through the gate: take it out of the
    # docker group on hosts provisioned before that (managed hosts only).
    - name: Take the daemon out of the docker group
      ansible.builtin.import_role:
        name: docker
        tasks_from: converge-group
    # Repairs that a fresh install makes but an update never reached. Both are
    # idempotent and skip what is absent (no Caddy vendored yet, no uv locks).
    - name: Repair the Caddy runtime directory modes
      ansible.builtin.import_role:
        name: caddy
        tasks_from: repair-modes.yml
    - name: Repair the vendored lock file modes
      ansible.builtin.import_role:
        name: turbopanel-user
        tasks_from: vendor-locks.yml
    # An update never reaches the php-fpm role's install tasks, so the shared
    # masters' pidfile and sockets move to the root-owned run tree here, as
    # root, before the daemon takes any command. A no-op once moved.
    - name: Move the php-fpm run tree to the root-owned folder
      ansible.builtin.import_role:
        name: php-fpm
        tasks_from: converge-run-tree.yml
    - name: Give the cache unit its retry settings
      ansible.builtin.import_role:
        name: redis
        tasks_from: retry-dropin.yml

  # Already-provisioned managed daemons only ever receive this lightweight
  # converge (see src/orchestration/setup.ts), never a full reinstall. Refresh
  # the installed turbopaneld.service so unit changes — e.g. native-vs-JS
  # ExecStart selection rendered into
  # roles/daemon-launch/templates/turbopaneld.service.j2 — actually land on
  # existing hosts. We deliberately re-render + daemon-reload ONLY: this playbook
  # runs from inside the running daemon, so stopping or restarting it here would
  # kill the converge mid-run. The refreshed unit takes effect on the daemon's
  # next restart; its enabled/running state is preserved (no systemd state task,
  # so turbopanel_start being unset never stops it).
  post_tasks:
    - name: Check for an installed daemon systemd unit
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
      register: turbopanel_daemon_unit

    - name: Refresh installed daemon systemd unit
      ansible.builtin.template:
        src: "{{ turbopanel_orchestration_dir }}/roles/daemon-launch/templates/turbopaneld.service.j2"
        dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
        owner: root
        group: root
        mode: "0640"
      when: turbopanel_daemon_unit.stat.exists
      notify: Reload systemd for refreshed daemon unit

    # The scheduled-backup runner is a separate file the daemon-launch role
    # installs; an existing host never re-runs that role, so without this its
    # backups would keep reaching the engine directly instead of the gate.
    - name: Check for an installed scheduled-backup runner
      ansible.builtin.stat:
        path: "{{ turbopanel_backup_run_bin }}"
      register: turbopanel_backup_run_installed

    - name: Refresh the scheduled-backup runner wrapper
      ansible.builtin.template:
        src: "{{ turbopanel_orchestration_dir }}/roles/daemon-launch/templates/tp-backup-run.j2"
        dest: "{{ turbopanel_backup_run_bin }}"
        owner: root
        group: "{{ turbopanel_group }}"
        mode: "0750"
      when: turbopanel_backup_run_installed.stat.exists

  handlers:
    - name: Reload systemd for refreshed daemon unit
      ansible.builtin.systemd:
        daemon_reload: true
