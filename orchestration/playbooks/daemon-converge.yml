---
# Single convergence playbook for managed daemon-only hosts (no co-located
# instance). Gathers facts once and runs shared infrastructure roles without
# overlapping docker/redis/rabbitmq/postgres playbook invocations.
#
# ClickHouse is intentionally omitted here (same boundary as Postgres/Redis/
# RabbitMQ): daemon-only hosts do not run the co-located instance metrics
# store. ClickHouse is installed via the co-located dev converge manifest
# (dev-converge-manifest.json → instance-dev-install) or the standalone
# clickhouse-setup.yml playbook on control-plane hosts that need it.
- name: TurboPanel daemon converge
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    turbopanel_managed_install: true
    turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
    turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
    turbopanel_config_dir: /etc/turbopanel
    turbopanel_daemon_state_dir: /var/lib/turbopanel
    turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
    turbopanel_daemon_bin: "{{ turbopanel_install_root }}/bin/turbopaneld"
    turbopanel_daemon_js: "{{ turbopanel_install_root }}/bin/turbopaneld.js"
    turbopanel_daemon_workdir: "{{ turbopanel_install_root }}"
    turbopanel_daemon_deno_bin: "{{ turbopanel_vendor_dir }}/deno/bin/deno"
    turbopanel_dev_user: ""
    turbopanel_user: tp
    turbopanel_group: tp
    turbopanel_service_name: turbopaneld
    # Managed daemon-only hosts have no co-located instance service to order after.
    turbopanel_after_instance_service: false

  pre_tasks:
    - name: Refresh apt cache once per converge (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Probe native daemon binary executability
      ansible.builtin.command:
        cmd: "{{ turbopanel_daemon_bin }} --version"
      register: _native_probe
      failed_when: false
      changed_when: false

    - name: Select native or JS-fallback ExecStart
      ansible.builtin.set_fact:
        turbopanel_daemon_exec_mode: "{{ 'native' if _native_probe.rc == 0 else 'js' }}"

  # Docker is installed on demand (when a container workload is assigned), not as
  # part of routine daemon convergence — nodes that only run native web services
  # never pull a container runtime.
  roles:
    - role: runtime-sockets
    # Unconditional: the JS-fallback ExecStart needs Deno, and so do any
    # co-located instance/mailer units on this host — gating on exec mode left
    # native-binary hosts pinned to a stale vendor/deno/current. The role stats
    # the pinned version first, so this is a no-op once converged.
    - role: deno-runtime
    - role: daemon-logs
    - role: daemon-prereqs
    - role: principal-access
    - role: time-sync

  # Already-provisioned managed daemons only ever receive this lightweight
  # converge (see src/orchestration/setup.ts), never a full reinstall. Refresh
  # the installed turbopaneld.service so unit changes — e.g. native-vs-JS
  # ExecStart selection rendered into
  # roles/daemon-launch/templates/turbopaneld.service.j2 — actually land on
  # existing hosts. We deliberately re-render + daemon-reload ONLY: this playbook
  # runs from inside the running daemon, so stopping or restarting it here would
  # kill the converge mid-run. The refreshed unit takes effect on the daemon's
  # next restart; its enabled/running state is preserved (no systemd state task,
  # so turbopanel_start being unset never stops it).
  post_tasks:
    - name: Check for an installed daemon systemd unit
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
      register: turbopanel_daemon_unit

    - name: Refresh installed daemon systemd unit
      ansible.builtin.template:
        src: "{{ turbopanel_orchestration_dir }}/roles/daemon-launch/templates/turbopaneld.service.j2"
        dest: "/etc/systemd/system/{{ turbopanel_service_name }}.service"
        owner: root
        group: root
        mode: "0640"
      when: turbopanel_daemon_unit.stat.exists
      notify: Reload systemd for refreshed daemon unit

  handlers:
    - name: Reload systemd for refreshed daemon unit
      ansible.builtin.systemd:
        daemon_reload: true
