---
# TurboPanel self-hosted instance install (Road to 0.1.x,
# `self-hosted-installer`).
#
# Run by `turbopaneld run-installer --playbook instance-install.yml` from
# scripts/run.sh --instance, after run.sh has already downloaded and
# sha256-verified the daemon package (which carries this orchestration tree
# and the vendored Ansible), the instance package
# (turbopanel-instance-<version>-<arch>.tar.zst, unpacked flat into
# /opt/turbopanel: bin/turbopanel-instance, bin/turbopanel-mailer,
# lib/libduckdb.so — beside the daemon's own bin/turbopaneld) and the UI
# export (turbopanel-ui-<version>.tar.gz → /opt/turbopanel/share/ui). The
# Caddy site config is not shipped: instance-launch renders it from its
# Caddyfile.j2 into /etc/turbopanel/caddy/Caddyfile. Nothing here clones or
# builds: the instance runs compiled (turbopanel_instance_run_mode compiled),
# the UI is served static, and every install-time step that used to reach
# into a source checkout is a verb of the instance binary (migrate,
# generate-secret, generate-self-signed-cert).
#
# Role order mirrors turbopanel/dev's instance-dev-install.yml minus the
# dev-only roles (repos, builds, dev permissions, mailpit, redis-insight,
# stripe-listen, tier catalogue). The play ends by printing the install
# wizard URL; the wizard (turbopanel src/install/) takes it from there.
#
# The co-located daemon is provisioned here too (post_tasks): the same
# turbopaneld.service a managed node runs, dialling the instance Unix socket.
# It starts without a license and waits; the wizard writes the first
# organization's license (+ the pre-provisioned `server.id` of the "this
# server" seat) into the daemon state directory, and the daemon enrols on
# its next re-check — the seat goes Initializing → Online with no second
# installer run. Never enrol this host with the remote-node path instead:
# daemon-install.yml's post_task re-chowns the whole state tree to the daemon
# account, which the instance, Caddy and ProxySQL subtrees here cannot survive.
- name: TurboPanel self-hosted instance install
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    turbopanel_managed_install: true
    turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
    turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
    turbopanel_orchestration_dir: "{{ turbopanel_install_root }}/share/orchestration"
    turbopanel_config_dir: /etc/turbopanel
    turbopanel_state_dir: /var/lib/turbopanel
    turbopanel_dev_user: ""
    turbopanel_dev_uid: ""
    turbopanel_dev_gid: ""
    # The unpacked release packages (run.sh puts them here before this play):
    # the instance package lies flat under the install root, so the instance
    # "dir" is the install root itself (units' WorkingDirectory).
    turbopanel_instance_dir: "{{ turbopanel_install_root }}"
    turbopanel_instance_run_mode: compiled
    turbopanel_instance_binary: "{{ turbopanel_install_root }}/bin/turbopanel-instance"
    turbopanel_mailer_binary: "{{ turbopanel_install_root }}/bin/turbopanel-mailer"
    turbopanel_ui_mode: static
    turbopanel_ui_dist_dir: "{{ turbopanel_install_root }}/share/ui"
    turbopanel_ui_artifact_url: ""
    turbopanel_instance_runtime: deno
    instance_start: true
    postgres_expose_port: false
    rabbitmq_amqp_port: 5672
    rabbitmq_mgmt_port: 15672
    rabbitmq_expose_mgmt_port: false
    redis_socket_path: /run/turbopanel/redis.sock
    turbopanel_optional_dbstudio: false
    turbopanel_optional_ui: false
    turbopanel_optional_website: false
    turbopanel_optional_mailpit: false
    turbopanel_optional_redis_insight: false
    turbopanel_optional_stripe_listen: false
    # Which channel this instance resolves daemon updates on
    # (TURBOPANEL_UPDATE_CHANNEL in the runtime env). run.sh passes the
    # channel it installed from.
    turbopanel_update_channel: release
    # The compiled unit's LD_LIBRARY_PATH: the package ships libduckdb.so in
    # lib/ (instance-build stages it into the vendor tree in co-located dev).
    turbopanel_duckdb_lib_dir: "{{ turbopanel_lib_dir }}"
    # The co-located daemon: daemon-install.yml's contract minus the remote
    # URL. No turbopanel_instance_url → daemon-config leaves
    # TURBOPANEL_INSTANCE_URL out of daemon.env and the daemon dials
    # /run/turbopanel/instance.sock. run.sh passes the exec mode it probed
    # (native | js) and the binary paths; the binary and orchestration tree
    # are already under the install root — they carried this play.
    turbopanel_daemon_state_dir: "{{ turbopanel_state_dir }}"
    turbopanel_daemon_env_file: "{{ turbopanel_config_dir }}/daemon.env"
    turbopanel_daemon_bin: "{{ turbopanel_install_root }}/bin/turbopaneld"
    turbopanel_daemon_js: "{{ turbopanel_install_root }}/bin/turbopaneld.js"
    turbopanel_daemon_workdir: "{{ turbopanel_install_root }}"
    turbopanel_daemon_deno_bin: "{{ turbopanel_vendor_dir }}/deno/bin/deno"
    turbopanel_daemon_exec_mode: native
    turbopanel_service_name: turbopaneld
    turbopanel_instance_url: ""
    turbopanel_instance_ca: ""
    turbopanel_tunnel_token: ""
    turbopanel_after_instance_service: true
    turbopanel_start: "{{ instance_start }}"

  pre_tasks:
    - name: Refresh apt cache once per install (Debian)
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_os_family == 'Debian'

    - name: Require the unpacked instance package
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ turbopanel_instance_binary }}"
        - "{{ turbopanel_mailer_binary }}"
        - "{{ turbopanel_duckdb_lib_dir }}/libduckdb.so"
        - "{{ turbopanel_ui_dist_dir }}/index.html"
      register: _instance_package_files

    - name: Fail when the instance or UI package is missing
      ansible.builtin.assert:
        that: _instance_package_files.results | map(attribute='stat.exists') | list is all
        fail_msg: >-
          The instance package (bin/turbopanel-instance, bin/turbopanel-mailer,
          lib/libduckdb.so) and UI export must be unpacked under
          {{ turbopanel_install_root }} and {{ turbopanel_ui_dist_dir }}
          before this play runs — run.sh --instance does that.

  roles:
    - role: turbopanel-user
    - role: runtime-sockets
    - role: daemon-logs
    - role: daemon-prereqs
    - role: rapl-access
    - role: docker
    - role: postgres
    - role: redis
    - role: rabbitmq
    # Brings postgres/rabbitmq up as one Docker Compose project
    # (turbopanel-system).
    - role: system-compose
    # Host prep for shared managed-DB ingress and per-org managed HA; the
    # compose content stays daemon-owned.
    - role: proxysql
    - role: orchestrator
    - role: instance-user
    - role: caddy

  tasks:
    - name: Pin the instance package files
      # Release content, root-owned like the daemon's own bin/turbopaneld
      # (daemon-layout re-pins bin/ to root:tp on every converge). The
      # compiled instance writes only its state and run trees, so nothing
      # here needs to be owned by the service account; tpctrl and tpcaddy
      # read through group tp.
      ansible.builtin.file:
        path: "{{ item.path }}"
        owner: root
        group: "{{ turbopanel_group | default('tp') }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ turbopanel_instance_binary }}", mode: "0755" }
        - { path: "{{ turbopanel_mailer_binary }}", mode: "0755" }
        - { path: "{{ turbopanel_duckdb_lib_dir }}/libduckdb.so", mode: "0644" }
      loop_control:
        label: "{{ item.path }}"

    - name: Let the instance hand the co-located daemon its license
      # The wizard writes the co-located license credentials and server.id into the
      # daemon state directory so the daemon on this host can enrol with the
      # first organization's license. The instance runs as tpctrl (group tp);
      # the state directory is tp:tp — setgid + group-write lets those files
      # land, owned by tpctrl in group tp, where the daemon (tp) reads them.
      ansible.builtin.file:
        path: "{{ turbopanel_state_dir }}"
        state: directory
        owner: "{{ turbopanel_user | default('tp') }}"
        group: "{{ turbopanel_group | default('tp') }}"
        mode: "2770"

    - name: Own the static UI export
      ansible.builtin.file:
        path: "{{ turbopanel_ui_dist_dir }}"
        state: directory
        owner: "{{ instance_user | default('tpctrl') }}"
        group: "{{ turbopanel_group | default('tp') }}"
        mode: "2770"
        recurse: true

    - name: Platform CA, server leaf, units and the first migration
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop:
        - instance-certs
        - instance-launch

  post_tasks:
    - name: Ensure the instance stack is running
      when: instance_start | default(true) | bool
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - turbopanel-system-stack
        - turbopanel-instance
        - turbopanel-mailer
        - turbopanel-caddy

    - name: Vendor the Deno runtime for the JS-fallback daemon
      # Only the JS-fallback ExecStart needs it; the compiled instance and a
      # native daemon do not (deno-runtime is a no-op once converged).
      when: turbopanel_daemon_exec_mode == 'js'
      ansible.builtin.include_role:
        name: deno-runtime

    - name: Provision and start the co-located daemon
      # The roles daemon-install.yml runs on a managed node, minus its
      # recursive chown of the state tree. After the instance units exist on
      # purpose: turbopaneld.service orders after turbopanel-instance.service
      # (turbopanel_after_instance_service) and daemon-config's restart
      # handler needs the unit installed before post_tasks handlers flush.
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop:
        - daemon-layout
        - principal-access
        - daemon-config
        - daemon-launch

    - name: Keep the state directory shared with the instance
      # daemon-layout pins the daemon state directory 0750; the wizard's
      # license hand-off (06e6473, "Let the instance hand the co-located
      # daemon its license" above) needs setgid + group-write. Last word on
      # purpose.
      ansible.builtin.file:
        path: "{{ turbopanel_state_dir }}"
        state: directory
        owner: "{{ turbopanel_user | default('tp') }}"
        group: "{{ turbopanel_group | default('tp') }}"
        mode: "2770"

    - name: Print the install wizard address
      ansible.builtin.debug:
        msg: >-
          TurboPanel instance is up. Finish the install in the wizard:
          https://{{ ansible_default_ipv4.address | default('<this host>') }}:8443/install
          (self-signed certificate — the platform CA is at
          {{ turbopanel_state_dir }}/tls/ca.crt).
