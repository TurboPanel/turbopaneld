---
# Vendor nginx (never a distro apt package) + tpnginx identity for
# traditional-web deploy. Site vhosts are written by the daemon TypeScript
# apply path after this playbook under /etc/turbopanel/nginx/sites/.
- name: TurboPanel traditional-web prerequisites (nginx)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Provision nginx service identity
      ansible.builtin.include_role:
        name: web-service-user
      vars:
        web_service_key: nginx

    - name: Vendor nginx binary + FHS config/log/state dirs
      ansible.builtin.include_role:
        name: nginx
