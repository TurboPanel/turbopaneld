---
# Vendor the tenant Node runtimes for native `serviceKind: node` apps. The
# per-app systemd units themselves are generated by the daemon TypeScript apply
# path (src/deploy/native/), exactly as traditional-web vhost fragments are —
# only the runtime needs Ansible.
#
# The daemon passes the series this deploy actually needs as
# `-e {"node_app_versions": ["24", "22"]}` (one entry per distinct
# `nativeAppServices[].nodeVersion`, defaulted daemon-side). Each series is
# vendored under `vendor/node-app/<series>/current`, so two apps pinning
# different series resolve to genuinely different binaries. With no `-e` the
# role falls back to its own default series, which is what a manual run wants.
- name: TurboPanel native app runtime prerequisites (Node)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Vendor tenant Node under vendor/node-app/<series>
      ansible.builtin.include_role:
        name: node-app-runtime
