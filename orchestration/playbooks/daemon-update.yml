---
# Managed hosts install release packages via run.sh (bin/turbopaneld +
# bin/turbopaneld.js). This playbook previously compiled dist/turbopaneld via
# the daemon-build role; co-located checkout builds may still invoke that role
# directly. Retained as a no-op for callers of run-daemon-update.sh.
- name: TurboPanel daemon binary build (deprecated, no-op)
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Daemon binary build is not used on managed hosts
      ansible.builtin.debug:
        msg: >-
          Managed installs consume the clean release package (bin/turbopaneld
          and bin/turbopaneld.js). Co-located checkout builds use the
          daemon-build role to produce dist/turbopaneld only.
