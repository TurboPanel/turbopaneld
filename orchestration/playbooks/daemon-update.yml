---
# No longer applicable: the daemon always runs from source via the Deno runtime,
# so there is no compiled binary to build. This playbook previously compiled
# dist/turbopaneld via the daemon-build role; it now performs no work.
- name: TurboPanel daemon binary build (deprecated, no-op)
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  tasks:
    - name: Daemon binary build is deprecated
      ansible.builtin.debug:
        msg: >-
          The daemon now runs from source via the Deno runtime; there is no
          compiled binary to build. This playbook is retained as a no-op.
