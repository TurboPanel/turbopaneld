---
# Switch between dev and production build modes (UI export + compiled instance).
# Invoked by the dev console toggle or manually with extra-vars.
# instance-certs reads TURBOPANEL_PUBLIC_URLS from protected runtime env (source of truth
# after public-url apply); the cert script merges runtime env + role env when SANs change.
- name: TurboPanel instance build mode toggle
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    # Co-located dev (turbopanel_dev_user set via -e) keeps source checkouts under
    # the dev user's home (turbopanel_dev_root) and shares the FHS runtime/lib tree;
    # managed installs use the FHS lib tree. Identity (turbopanel_user/group,
    # instance_user) resolves via the shared dev-identity contract in the role
    # defaults, so the instance stack runs as the single dev user in dev.
    turbopanel_dev_user: ""
    turbopanel_dev_uid: ""
    turbopanel_dev_gid: ""
    turbopanel_dev_root: "{{ ansible_env.HOME }}"
    turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
    turbopanel_vendor_dir: "{{ turbopanel_install_root }}/vendor"
    turbopanel_daemon_dir: "{{ (turbopanel_dev_root ~ '/turbopaneld') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/daemon') }}"
    turbopanel_instance_dir: "{{ (turbopanel_dev_root ~ '/turbopanel') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
    turbopanel_ui_dir: "{{ (turbopanel_dev_root ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
    turbopanel_instance_runtime: deno
    instance_start: true
    force_build: false
    force_compile: false

  roles:
    - role: ui-build
    - role: instance-build
    - role: instance-user
    - role: instance-certs
    - role: instance-launch
