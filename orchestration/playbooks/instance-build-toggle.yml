---
# Switch between dev and production build modes (UI export + compiled instance).
# Invoked by the dev console toggle or manually with extra-vars.
# instance-certs reads TURBOPANEL_PUBLIC_URLS from protected runtime env (source of truth
# after public-url apply); the cert script merges runtime env + role env when SANs change.
- name: TurboPanel instance build mode toggle
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    # Co-located dev (turbopanel_dev_user set via -e) keeps the /platform checkout +
    # /opt/turbopanel/runtimes tree; managed installs use the FHS lib tree.
    turbopanel_dev_user: ""
    turbopanel_platform_dir: "{{ turbopanel_install_root }}/platform"
    turbopanel_lib_dir: "{{ turbopanel_install_root }}/lib"
    turbopanel_runtimes_dir: "{{ (turbopanel_install_root ~ '/runtimes') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/runtime') }}"
    turbopanel_daemon_dir: "{{ (turbopanel_platform_dir ~ '/daemon') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/daemon') }}"
    turbopanel_instance_dir: "{{ (turbopanel_platform_dir ~ '/instance') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/instance') }}"
    turbopanel_ui_dir: "{{ (turbopanel_platform_dir ~ '/ui') if (turbopanel_dev_user | default('') | length > 0) else (turbopanel_lib_dir ~ '/ui') }}"
    turbopanel_group: turbopanel
    turbopanel_user: turbopanel
    instance_user: turbopaneli
    turbopanel_instance_runtime: deno
    instance_start: true
    force_build: false
    force_compile: false

  roles:
    - role: ui-build
    - role: instance-build
    - role: instance-certs
    - role: instance-launch
