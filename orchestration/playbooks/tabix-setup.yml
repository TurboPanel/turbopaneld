---
# Dev-only Tabix browser GUI for ClickHouse metrics (loopback :8125).
# Requires the clickhouse role to have created `.clickhouse_app_pass` first.
- name: TurboPanel Tabix setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resolve dev user account for source-checkout root
      ansible.builtin.getent:
        database: passwd
        key: "{{ turbopanel_dev_user }}"
      when: turbopanel_dev_user | default('') | length > 0

    - name: Set dev source-repo root from the dev user's home directory
      ansible.builtin.set_fact:
        turbopanel_dev_root: "{{ getent_passwd[turbopanel_dev_user][4] }}"
      when:
        - turbopanel_dev_user | default('') | length > 0
        - getent_passwd is defined
        - getent_passwd[turbopanel_dev_user] is defined

  roles:
    - role: tabix
      when: turbopanel_dev_user | default('') | length > 0
