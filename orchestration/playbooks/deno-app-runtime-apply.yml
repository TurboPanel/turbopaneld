---
# Vendor the tenant Deno runtimes for native `runtime: deno` apps. The per-app
# systemd units themselves are generated by the daemon TypeScript apply path
# (src/deploy/native/), exactly as for Node apps — only the runtime needs
# Ansible.
#
# The daemon passes the series this deploy needs as
# `-e {"deno_app_versions": ["2"]}` (one entry per distinct
# `nativeAppServices[].denoVersion`, defaulted daemon-side). Each series is
# vendored under `vendor/deno-app/<series>/current`. With no `-e` the role falls
# back to its own default series, which is what a manual run wants.
- name: TurboPanel native app runtime prerequisites (Deno)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Vendor tenant Deno under vendor/deno-app/<series>
      ansible.builtin.include_role:
        name: deno-app-runtime
