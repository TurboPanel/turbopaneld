---
# Write the control plane's root-only password files before its migration.
#
# `tp-orchestrate migrate` reads the database URL from the instance's
# runtime.secrets.env, but only the unit refresh (instance-units-refresh.yml,
# which runs after the migration) used to write it, so a host updated in place
# had no file when it migrated. The daemon runs this play first:
#
#   tp-orchestrate playbook -i localhost, -c local \
#     -e turbopanel_install_root=/opt/turbopanel instance-secrets-refresh.yml
#
# Contract:
# - Only instance-launch tasks/secrets.yml runs: it reads the database and
#   queue password files and writes the root-only environment files. No unit,
#   Caddyfile, certificate or service state is touched.
# - It restarts nothing (instance_start is false); the update flow restarts the
#   instance once, under its health check and rollback.
# - It never fails the update by itself: an error is reported as a warning, and
#   a migration that then finds no file fails and rolls back as usual.
- name: TurboPanel control-plane secrets refresh
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    turbopanel_install_root: /opt/turbopanel
    instance_start: false

  tasks:
    - name: Require an installed control plane
      ansible.builtin.stat:
        path: "{{ turbopanel_install_root }}/bin/turbopanel"
      register: _secrets_instance_binary

    - name: Write the password files
      when: _secrets_instance_binary.stat.exists
      block:
        - name: Group that owns the instance config dir
          ansible.builtin.include_role:
            name: instance-user

        - name: Read the passwords and write the root-only files
          ansible.builtin.include_role:
            name: instance-launch
            tasks_from: secrets.yml
      rescue:
        - name: Report that the password files could not be written
          ansible.builtin.debug:
            msg: >-
              WARNING: control-plane password files not written:
              {{ ansible_failed_result.msg | default('unknown error') }}
