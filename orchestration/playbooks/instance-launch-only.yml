---
# Re-template and restart instance/Caddy/UI/mailer units after runtime or build toggles.
# instance-certs reads TURBOPANEL_PUBLIC_URLS from protected runtime env (written by the
# daemon); callers may pass turbopanel_public_urls as an extra-var when runtime.env is
# not yet populated.
- name: TurboPanel instance launch refresh
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  pre_tasks:
    - name: Resolve dev user account for source-checkout root
      ansible.builtin.getent:
        database: passwd
        key: "{{ turbopanel_dev_user }}"
      when: turbopanel_dev_user | default('') | length > 0

    - name: Set dev source-repo root from the dev user's home directory
      ansible.builtin.set_fact:
        turbopanel_dev_root: "{{ getent_passwd[turbopanel_dev_user][4] }}"
      when:
        - turbopanel_dev_user | default('') | length > 0
        - getent_passwd is defined
        - getent_passwd[turbopanel_dev_user] is defined

  roles:
    # Provision tpcaddy/tpctrl before Caddy runtime dirs and the unit template.
    - role: instance-user
    # Caddy requires ./certs/self-signed.{crt,key}; idempotent and cheap.
    - role: instance-certs
    - role: instance-launch
