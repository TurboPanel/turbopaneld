---
# Vendor OpenLiteSpeed (never a distro package) + tpols identity for
# site deploy. Per-site httpd_config.conf / vhost configs are
# written by the daemon TypeScript apply path after this playbook runs.
#
# The daemon passes turbopanel_lsphp_install=true when an OpenLiteSpeed site
# runs PHP in detached lsphp mode; the role then also vendors `lsphp` (LSAPI
# PHP) under vendor/lsphp/<series>/. A site in the fastcgi or fpm mode instead
# needs the packaged php-cgi / php-fpm (turbopanel_php_fpm_install, as in the
# nginx/apache apply playbooks). A static-only host downloads neither.
- name: TurboPanel site prerequisites (OpenLiteSpeed)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Provision OpenLiteSpeed service identity
      ansible.builtin.include_role:
        name: web-service-user
      vars:
        web_service_key: openlitespeed

    - name: Vendor OpenLiteSpeed binary + FHS config/log/state dirs
      ansible.builtin.include_role:
        name: openlitespeed

    - name: Provision php-fpm service identity
      when: turbopanel_php_fpm_install | default(false) | bool
      ansible.builtin.include_role:
        name: web-service-user
      vars:
        web_service_key: apache

    - name: Vendor php-fpm binary + FHS config/log/pools
      when: turbopanel_php_fpm_install | default(false) | bool
      ansible.builtin.include_role:
        name: php-fpm
