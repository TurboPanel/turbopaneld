---
# Vendor OpenLiteSpeed (never a distro package) + tpols identity for
# site deploy. Per-site httpd_config.conf / vhost configs are
# written by the daemon TypeScript apply path after this playbook runs.
#
# The daemon passes turbopanel_lsphp_install=true when any OpenLiteSpeed site
# carries hosting web.php hints; the role then also vendors `lsphp` (LSAPI PHP)
# under vendor/lsphp/<series>/. A static-only host never downloads it. Mirrors
# turbopanel_php_fpm_install in the nginx/apache apply playbooks.
- name: TurboPanel site prerequisites (OpenLiteSpeed)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Provision OpenLiteSpeed service identity
      ansible.builtin.include_role:
        name: web-service-user
      vars:
        web_service_key: openlitespeed

    - name: Vendor OpenLiteSpeed binary + FHS config/log/state dirs
      ansible.builtin.include_role:
        name: openlitespeed
