- name: TurboPanel queue setup
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    # Standalone managed broker setup (daemon-only hosts) — FHS config layout.
    turbopanel_config_dir: /etc/turbopanel
  roles:
    # The docker role installs the Docker gate, which runs on the vendored Deno.
    - role: deno-runtime
    - role: docker
    - role: rabbitmq
    - role: system-compose
