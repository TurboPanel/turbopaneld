---
# Install turbopanel-daemon.service for co-located dev or managed server daemons.
# Co-located hosts set turbopanel_after_instance_service so the daemon starts
# after the instance stack (turbopanel-instance.service).
#
# Self-sufficient for fresh co-located dev hosts: ensures prerequisites and the
# turbopanel user/group before installing the unit. All roles are idempotent.
- name: Install TurboPanel daemon systemd unit
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    turbopanel_install_root: /opt/turbopanel
    turbopanel_runtimes_dir: "{{ turbopanel_install_root }}/runtimes"
    turbopanel_daemon_dir: "{{ turbopanel_install_root }}/platform/daemon"
    turbopanel_user: turbopanel
    turbopanel_group: turbopanel
    turbopanel_uid: 9999
    turbopanel_gid: 9999
    turbopanel_service_name: turbopanel-daemon
    turbopanel_start: true
    turbopanel_after_instance_service: false
    turbopanel_daemon_run_mode: binary
    turbopanel_daemon_binary: "{{ turbopanel_daemon_dir }}/dist/turbopaneld"

  roles:
    - role: daemon-prereqs
    - role: turbopanel-user
    - role: deno-runtime
    - role: daemon-logs
    - role: daemon-launch
