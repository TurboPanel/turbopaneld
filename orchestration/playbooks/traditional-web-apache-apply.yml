---
# Vendor Apache httpd from ASF source + php-fpm from official PHP source
# (never distro apt packages) + tpapache identity for traditional-web deploy.
# Site vhosts and per-site php-fpm pools are written by the daemon TypeScript
# apply path under /etc/turbopanel/apache/sites/ and /etc/turbopanel/php/pools/.
- name: TurboPanel traditional-web prerequisites (apache + php-fpm)
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  tasks:
    - name: Provision apache service identity
      ansible.builtin.include_role:
        name: web-service-user
      vars:
        web_service_key: apache

    - name: Vendor Apache httpd binary + FHS config/log/state dirs
      ansible.builtin.include_role:
        name: apache

    # Daemon passes turbopanel_php_fpm_install=true when any Apache site
    # carries hosting web.php hints; static-only Apache skips the PHP build.
    - name: Vendor php-fpm binary + FHS config/log/pools
      when: turbopanel_php_fpm_install | default(false) | bool
      ansible.builtin.include_role:
        name: php-fpm
