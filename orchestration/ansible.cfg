[defaults]
# Local orchestration runs against the daemon host; no remote SSH host keys.
host_key_checking = False
# Quiet the noisy "discovered interpreter" warnings; the venv python is correct.
interpreter_python = auto_silent
# local_tmp / home come from ANSIBLE_LOCAL_TEMP + ANSIBLE_HOME at invocation
# time (see paths.ts ansibleEnv()). ANSIBLE_HOME is /tmp/turbopanel-ansible —
# never ~/.ansible — so root-run install leaves no home artifacts.
# Vendored collections: relative path from share/orchestration in production FHS;
# absolute FHS fallback covers co-located dev checkouts where the relative path does not apply.
collections_path = ../../vendor/ansible/galaxy-collections:/opt/turbopanel/vendor/ansible/galaxy-collections:/usr/share/ansible/collections
retry_files_enabled = False
# Machine-readable JSONL on stdout for streaming consumers and structured daemon logs.
stdout_callback = ansible.posix.jsonl
callbacks_enabled = ansible.posix.jsonl
# Roles live alongside playbooks at orchestration/roles/.
roles_path = roles
