[defaults]
# Local orchestration runs against the daemon host; no remote SSH host keys.
host_key_checking = False
# Quiet the noisy "discovered interpreter" warnings; the venv python is correct.
interpreter_python = auto_silent
# Keep generated artifacts inside the runtime directory.
local_tmp = runtime/cache/ansible-tmp
retry_files_enabled = False
stdout_callback = default
# Roles live alongside playbooks at orchestration/roles/.
roles_path = roles
# Galaxy collections installed during bootstrap (ansible.posix for dev-permissions ACLs).
# Under runtime/ to avoid clashing with the pip Ansible package's collections layout.
collections_path = runtime/galaxy-collections
