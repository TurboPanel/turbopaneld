---
- name: Ensure UI log directory exists
  ansible.builtin.file:
    path: "{{ ui_log_dir }}"
    state: directory
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0750"

- name: Ensure UI log files exist for systemd append
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: "{{ turbopanel_user }}"
    group: "{{ turbopanel_group }}"
    mode: "0640"
  loop:
    - "{{ ui_log_dir }}/ui.log"
    - "{{ ui_log_dir }}/ui.err.log"
