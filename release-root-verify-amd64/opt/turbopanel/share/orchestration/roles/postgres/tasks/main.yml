# /opt/turbopanel/platform/config/
#   postgres/
#     config.json   — connection metadata (socket path, port, user, db)
#     .pgpass       — generated password, mode 0600, owner root
# /var/run/turbopanel/postgres — canonical Unix socket directory (postgres_socket_dir)

- name: Ensure postgres config directory exists
  ansible.builtin.file:
    path: "{{ turbopanel_config_dir }}/postgres"
    state: directory
    owner: root
    group: turbopanel
    mode: "0750"

- name: Generate postgres password (idempotent)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      f='{{ turbopanel_config_dir }}/postgres/.pgpass'
      if [ ! -s "$f" ]; then
        openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32 > "$f"
        chmod 0600 "$f"
        chown root:root "$f"
        echo created
      fi
    executable: /bin/bash
  register: _pgpass_gen
  changed_when: "'created' in _pgpass_gen.stdout"

- name: Read postgres password
  ansible.builtin.slurp:
    src: "{{ turbopanel_config_dir }}/postgres/.pgpass"
  register: _pgpass_raw

- name: Set postgres password fact
  ansible.builtin.set_fact:
    _postgres_password: "{{ _pgpass_raw.content | b64decode | trim }}"

- name: Write postgres config.json (idempotent)
  ansible.builtin.template:
    src: postgres-config.json.j2
    dest: "{{ turbopanel_config_dir }}/postgres/config.json"
    owner: root
    group: turbopanel
    mode: "0640"
    force: false

- name: Ensure postgres socket directory exists
  ansible.builtin.file:
    path: "{{ postgres_socket_dir }}"
    state: directory
    owner: "{{ postgres_container_uid }}"
    group: turbopanel
    mode: "2770"

- name: Ensure turbopanel Docker network exists
  ansible.builtin.command:
    argv: [docker, network, create, --driver, bridge, "{{ turbopanel_docker_network }}"]
  register: _pg_network_create
  changed_when: false
  failed_when: false

- name: Ensure turbopaneldb Docker volume exists
  ansible.builtin.command:
    argv: [docker, volume, create, "{{ postgres_volume_name }}"]
  register: _pg_volume_create
  changed_when: false

- name: Inspect postgres container
  ansible.builtin.command:
    argv: [docker, inspect, "{{ postgres_container_name }}"]
  register: _pg_inspect_cmd
  changed_when: false
  failed_when: false

- name: Parse postgres container inspection
  ansible.builtin.set_fact:
    _pg_container: "{{ (_pg_inspect_cmd.stdout | from_json)[0] }}"
  when: _pg_inspect_cmd.rc == 0

- name: Set postgres container state facts
  ansible.builtin.set_fact:
    _postgres_container_exists: true
    _postgres_running: "{{ _pg_container.State.Running | default(false) }}"
    _pg_status: "{{ _pg_container.State.Status | default('') }}"
    _pg_mount_ok: >-
      {{ _pg_container.Mounts | default([]) | selectattr('Type', 'equalto', 'volume') | selectattr('Name', 'equalto', postgres_volume_name) | list | length > 0 }}
    _pg_network_ok: "{{ turbopanel_docker_network in (_pg_container.NetworkSettings.Networks | default({})) }}"
    _pg_tcp_exposed: "{{ _pg_container.HostConfig.PortBindings['5432/tcp'] is defined }}"
  when: _pg_inspect_cmd.rc == 0

- name: Set postgres container missing facts
  ansible.builtin.set_fact:
    _postgres_container_exists: false
    _postgres_running: false
  when: _pg_inspect_cmd.rc != 0

- name: Remove postgres container with broken configuration
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - (not _pg_mount_ok | bool) or (not _pg_network_ok | bool) or (_pg_status | trim in ['restarting', 'exited', 'dead'])
  register: _pg_removed
  changed_when: _pg_removed.rc == 0

- name: Remove postgres container when TCP exposure does not match config
  ansible.builtin.command:
    cmd: docker rm -f {{ postgres_container_name }}
  when:
    - _postgres_container_exists | bool
    - _pg_removed is not changed
    - (postgres_expose_port | bool and (not _pg_tcp_exposed | bool)) or ((not postgres_expose_port | bool) and (_pg_tcp_exposed | bool))
  register: _pg_removed_tcp
  changed_when: _pg_removed_tcp.rc == 0

- name: Refresh postgres container facts after removal
  ansible.builtin.set_fact:
    _postgres_container_exists: false
    _postgres_running: false
  when: _pg_removed is changed or _pg_removed_tcp is changed

- name: Pre-own postgres Docker volume data directory
  ansible.builtin.command:
    cmd: docker run --rm -v {{ postgres_volume_name }}:/data --user root alpine chown -R 9996:9996 /data
  when: not _postgres_container_exists | bool

- name: Build docker run argument list
  ansible.builtin.set_fact:
    _docker_run_args: "{{ _docker_run_base + (_docker_run_port if postgres_expose_port | bool else []) + [postgres_image] }}"
  vars:
    _docker_run_base:
      - "--name"
      - "{{ postgres_container_name }}"
      - "--restart"
      - "unless-stopped"
      - "-d"
      - "--user"
      - "{{ postgres_container_uid }}:{{ postgres_container_gid }}"
      - "-v"
      - "{{ postgres_volume_name }}:/var/lib/postgresql"
      - "--network"
      - "{{ turbopanel_docker_network }}"
      - "-v"
      - "{{ postgres_socket_dir }}:/var/run/postgresql"
      - "-e"
      - "POSTGRES_USER={{ postgres_user }}"
      - "-e"
      - "POSTGRES_DB={{ postgres_db }}"
      - "-e"
      - "POSTGRES_PASSWORD={{ _postgres_password }}"
    _docker_run_port:
      - "-p"
      - "127.0.0.1:{{ postgres_port }}:5432"

- name: Create and start postgres container
  ansible.builtin.command:
    cmd: docker run {{ _docker_run_args | join(' ') }}
  when: not _postgres_container_exists | bool
  no_log: true

- name: Install postgres wrapper start script
  ansible.builtin.template:
    src: postgres-wrapper-start.sh.j2
    dest: "{{ turbopanel_config_dir }}/postgres/wrapper-start.sh"
    owner: root
    group: root
    mode: "0755"

- name: Ensure postgres container is running and ready
  ansible.builtin.command:
    cmd: "{{ turbopanel_config_dir }}/postgres/wrapper-start.sh"
  changed_when: false

- name: Install PostgreSQL systemd unit
  ansible.builtin.template:
    src: turbopanel-postgres.service.j2
    dest: "/etc/systemd/system/{{ postgres_service_name }}.service"
    owner: root
    group: root
    mode: "0644"

- name: Ensure PostgreSQL systemd unit desired state
  ansible.builtin.systemd:
    name: "{{ postgres_service_name }}"
    daemon_reload: true
    enabled: true
    state: started
