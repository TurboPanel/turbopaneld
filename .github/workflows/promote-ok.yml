# promote-ok: the two automatic promotion PRs are mergeable only once what
# their merge publishes exists (Road to 0.2.x, green-only CI phase 2).
#
#   "Release Candidate x.y.z-rc.N" (trunk -> staging): the head commit's trunk
#       publish-daemon-trunk.yml run passed and its canary is on the rolling `canary` release.
#   "Release x.y.z" (staging -> live): the newest rc that has not shipped
#       (read from the tags) is published and staging is
#       exactly its content.
#
# The check looks once and ends in seconds; it never waits on a runner. It
# is not a job: the evaluate job writes a check run named `promote-ok` on the
# PR's head commit through the Checks API (TurboPanel/dev
# gh-promote-ok.yml, scripts/promote/promote-ok-report.sh), so it belongs to
# the GitHub Actions app the ruleset requires. Ready is success; while what a
# merge would publish is still being built it stays pending (in_progress),
# never red, and says what it waits for; it is red only when it can never
# pass. promote-ok-recheck.yml looks again when the trunk CI, the canary build
# or Publish Release Candidate finishes and updates the same check.
#
# No job here may be named promote-ok (a skipped job would pass the required
# check). Never add workflow_dispatch here; the manual dry run is in
# promote-ok-recheck.yml and writes no check.
#
# The Release PR runs this file from staging, so it gates Release PRs only
# after this file has reached staging (the next Release Candidate merge).

name: Promote OK

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [staging, live]

# Read-only by default; only the evaluate job writes, and only its check run.
permissions:
  contents: read

# One evaluation per PR head. It looks once and ends, so a superseded head's
# run finishes on its own in seconds (keeping its own verdict, never a
# cancelled mark on a real trunk or staging commit), and a second run of the
# same head (a reopened PR) replaces the first. The group holds the head
# commit, not just the PR, so a run for a head that was just superseded can
# never cancel the newest head's evaluation.
concurrency:
  group: promote-ok-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  evaluate:
    uses: TurboPanel/dev/.github/workflows/gh-promote-ok.yml@d9333c4d552b5b91779f2b70804f31455d0e47f7 # dev#118
    with:
      repo-kind: daemon
      ci-workflow: publish-daemon-trunk.yml
      dev-ref: d9333c4d552b5b91779f2b70804f31455d0e47f7 # dev#118
      base: ${{ github.event.pull_request.base.ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
    # gh-promote-ok.yml reads the canary release, tags and releases (contents),
    # the trunk CI run (actions) and, in a dry run, the PR (pull-requests), and
    # writes the promote-ok check run (checks).
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
