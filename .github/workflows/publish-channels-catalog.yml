name: Publish channels catalog

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify FTP secrets
        env:
          DL_FTP_HOST: ${{ secrets.DL_FTP_HOST }}
          DL_FTP_USERNAME: ${{ secrets.DL_FTP_USERNAME }}
          DL_FTP_PASSWORD: ${{ secrets.DL_FTP_PASSWORD }}
        run: |
          missing=0
          if [ -z "$DL_FTP_HOST" ]; then
            echo "::error::Missing required secret: DL_FTP_HOST"
            missing=1
          fi
          if [ -z "$DL_FTP_USERNAME" ]; then
            echo "::error::Missing required secret: DL_FTP_USERNAME"
            missing=1
          fi
          if [ -z "$DL_FTP_PASSWORD" ]; then
            echo "::error::Missing required secret: DL_FTP_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Stage channels.json for upload
        run: |
          test -f dist/channels.json
          mkdir -p /tmp/channels-catalog
          cp dist/channels.json /tmp/channels-catalog/channels.json

      - name: Upload channels.json to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DL_FTP_HOST }}
          username: ${{ secrets.DL_FTP_USERNAME }}
          password: ${{ secrets.DL_FTP_PASSWORD }}
          local-dir: /tmp/channels-catalog/
          server-dir: /
