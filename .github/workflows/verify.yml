name: Verify

# Tests + LCOV, then, on a pull request, the SonarCloud scan and its quality
# gate: a failed gate fails the verify job, so ci-ok is red. On a trunk build
# (this file called by publish-daemon-trunk.yml) the job uploads the LCOV and
# stops there; sonar-trunk.yml analyses the commit after the trunk build
# completes, so the scan never holds back publish or the canary. Automatic
# Analysis must stay off (Administration → Analysis Method).

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
      RELEASE_APP_ID:
        required: false
      RELEASE_APP_PRIVATE_KEY:
        required: false
  pull_request:
    branches:
      - trunk
      - staging
      - live

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: daemon-verify-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    env:
      # Job-level so Sonar `if:` / require-token steps can read the secret.
      # Empty only for fork PRs (secrets are not available to forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      # Fork PRs and Dependabot PRs cannot receive repository secrets (GitHub
      # withholds them from the dependabot[bot] actor even on same-repo
      # branches) — skip the require there so fmt/lint/tests still gate; the
      # scan below skips on the empty token. Same-repo PRs / workflow_call /
      # trunk must have SONAR_TOKEN (hard fail, same as TurboPanel/turbopanel).
      - name: Require SONAR_TOKEN for trusted verification
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — add the secret on TurboPanel/turbopaneld (or org)."
            exit 1
          fi

      # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
      # a transient GitHub 5xx on the download must not turn the run red.
      - name: Install Deno
        id: deno-try-1
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true
      - name: Wait before retrying the Deno download
        if: steps.deno-try-1.outcome == 'failure'
        run: sleep 15
      - name: Install Deno (retry 1 of 2)
        id: deno-try-2
        if: steps.deno-try-1.outcome == 'failure'
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true
      - name: Wait before retrying the Deno download again
        if: steps.deno-try-2.outcome == 'failure'
        run: sleep 45
      - name: Install Deno (retry 2 of 2)
        if: steps.deno-try-2.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Typecheck
        run: deno task check

      - name: Check production layout contract
        run: deno task check:layout

      - name: Check vocabulary (no daemon-as-agent phrasing)
        run: deno task check:vocabulary

      - name: Shellcheck the uninstall script and the root helpers
        run: shellcheck -s sh --severity=warning scripts/purge.sh orchestration/scripts/tp-host orchestration/scripts/tp-update-guard orchestration/scripts/tp-firewall-guard

      # ClickHouse/Tabix metrics infrastructure is retired (DuckDB + Parquet /
      # Analytics Engine replaced it). Sibling repo trees are scanned too when
      # the co-located workspace layout is present; a clean single-repo CI
      # checkout still verifies this repo's own trees.
      - name: Check metrics legacy (no ClickHouse/Tabix references)
        run: deno task check:metrics-legacy

      - name: Scan for secrets (every tracked file)
        run: sh scripts/scan-secrets.sh --all

      # The commits a PR adds, not just its final tree: a secret committed and
      # removed again inside the PR still sits in the history that gets merged.
      # PRs into staging/live carry trunk commits that were already scanned on
      # their own PRs, so only PRs into trunk are scanned by range.
      - name: Scan pull request commits for secrets
        if: github.event_name == 'pull_request' && github.base_ref == 'trunk'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: sh scripts/scan-secrets.sh --range "$BASE_SHA..$HEAD_SHA"

      - name: Secret scanner self-test
        run: sh scripts/scan-secrets.selftest.sh

      - name: Check third-party notices
        run: deno task notices:check

      # Dependency Advisory Gate (TurboPanel/dev): fails only on a HIGH or
      # CRITICAL advisory that already has a fixed version; everything else is
      # a warning annotation. Override for one verified not exploitable here:
      # an [[IgnoredVulns]] entry with a reason in osv-scanner.toml.
      - name: Dependency advisory gate (osv-scanner)
        uses: TurboPanel/dev/.github/actions/osv-scan@8512d65091c662383a4aa6ff2848e16230ccc5e1 # dev#55

      # The Ansible layer (20+ playbooks, 30+ first-party roles) had no CI
      # gate at all -- its only feedback was a converge failure on a real host.
      # orchestration/requirements.txt already pinned ansible-lint "for IDE/CI
      # linting"; this is the CI half. check-orchestration.sh also installs
      # ansible.posix from orchestration/requirements.yml (Galaxy collections
      # are not committed; CI has no /opt vendor tree). See the script for
      # what is and is not gated.
      # Install from the hash lock (githubactions:S8544 / S8541), not the
      # range-pinned constraints file.
      - name: Set up Python for Ansible
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Matches the vendored daemon pin (PYTHON_VERSION in
          # src/orchestration/assets.ts) and orchestration/requirements.txt.
          python-version: "3.14"

      - name: Install Ansible toolchain
        run: >-
          python -m pip install --disable-pip-version-check
          --require-hashes --only-binary :all:
          -r orchestration/requirements.lock.txt

      - name: Check orchestration (playbook syntax + ansible-lint min profile)
        run: deno task check:orchestration

      # assets.test.ts requires scripts/download-caddy.mjs and fails when it is
      # missing. A single-repo checkout does not include that file. Prefer the
      # same-named branch on TurboPanel/turbopanel so a paired PR is compared
      # with its own pin; otherwise use trunk. PRs into staging/live use trunk
      # (see contract-drift below).
      - name: Resolve instance checkout ref
        id: instance-ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          REF="$HEAD_REF"
          # Never staging/live: not as the head (a staging → trunk PR), not as
          # the base (the promotion PRs), not as the pushed branch.
          case "$REF" in
            staging | live) REF=trunk ;;
            *) ;;
          esac
          case "$BASE_REF" in
            staging | live) REF=trunk ;;
            *) ;;
          esac
          if gh api "repos/TurboPanel/turbopanel/branches/${REF}" --silent; then
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=trunk" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out instance Caddy downloader
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopanel
          ref: ${{ steps.instance-ref.outputs.ref }}
          fetch-depth: 1
          path: .ci-instance-caddy-pin
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: scripts/download-caddy.mjs

      - name: Test with coverage
        run: deno task test:coverage

      # `deno task test:coverage` already normalizes; re-running here is
      # idempotent and keeps the assertions (nothing absolute, at least one
      # SF:src/) as an explicit CI gate. One implementation, two callers --
      # a local report is now byte-identical to what SonarCloud imports.
      - name: Assert LCOV SF paths are repo-relative for SonarCloud
        run: >-
          deno run --allow-read --allow-write --allow-env
          scripts/normalize-lcov.ts coverage/lcov.info

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daemon-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Coverage import needs CI-based analysis (Automatic Analysis must stay
      # off for turbopanel_turbopaneld). Quality gate failure fails this job.
      - name: SonarQube Scan
        id: sonar
        # Pull requests only; the quality gate blocks pull requests only. A
        # trunk build is analysed by sonar-trunk.yml after it completes, from
        # the daemon-coverage-lcov artifact uploaded above, so the scan does
        # not hold back publish or the canary (decision 4, 2026-09-30).
        #
        # Also skipped when SONAR_TOKEN is empty (fork or Dependabot PR) and on
        # the automatic promotion PRs into staging/live, which carry only
        # commits already analysed on trunk (no new code to gate; Sonar would
        # count the whole diff since the last release as new code).
        if: >-
          env.SONAR_TOKEN != ''
          && github.event_name == 'pull_request'
          && github.base_ref != 'staging'
          && github.base_ref != 'live'
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      # The Sonar way gate fails only on ratings, so one new code smell passes
      # it; this fails the PR on any new issue (owner rule, 2026-09-30). Runs
      # only where the PR scan above ran, so it skips the promotion PRs too.
      - name: No new Sonar issues
        if: github.event_name == 'pull_request' && steps.sonar.outcome == 'success'
        uses: TurboPanel/dev/.github/actions/sonar-new-issues@2db1bbfa3cff89a52fac3ee4a53bd495dc1c79b1 # dev#47

  # The contract twins (commands, cell messages, version-wire, the field
  # snapshot) are compared against the turbopanel checkout of the same-named
  # branch (else trunk; never turbopanel's staging or live), so a daemon-only change that drifts fails here rather
  # than turning turbopanel red after it merges. Mirrors turbopanel's
  # metrics-legacy job.
  #
  # PRs into staging/live (the automatic promotion PRs) have `staging` or
  # `trunk` as their head, carrying commits that were checked against
  # turbopanel trunk. Pairing them with turbopanel's staging/live would
  # compare the new daemon with the older control plane (the daemon ships
  # first by design), so those PRs compare against turbopanel trunk too.
  contract-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: daemon-contract-drift-${{ github.event_name }}-${{ (github.head_ref == 'trunk' || github.head_ref == 'staging') && github.run_id || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' && github.head_ref != 'trunk' && github.head_ref != 'staging' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: turbopaneld
          persist-credentials: false

      - name: Resolve turbopanel checkout ref
        id: instance-ref
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          REF="$HEAD_REF"
          # Never staging/live: not as the head (a staging → trunk PR), not as
          # the base (the promotion PRs), not as the pushed branch.
          case "$REF" in
            staging | live) REF=trunk ;;
            *) ;;
          esac
          case "$BASE_REF" in
            staging | live) REF=trunk ;;
            *) ;;
          esac
          if gh api "repos/TurboPanel/turbopanel/branches/${REF}" --silent; then
            echo "ref=${REF}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=trunk" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out turbopanel (contract twins)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/turbopanel
          ref: ${{ steps.instance-ref.outputs.ref }}
          path: turbopanel
          fetch-depth: 1
          persist-credentials: false

      # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
      # a transient GitHub 5xx on the download must not turn the run red.
      - name: Install Deno
        id: deno-try-1
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: Wait before retrying the Deno download
        if: steps.deno-try-1.outcome == 'failure'
        run: sleep 15
      - name: Install Deno (retry 1 of 2)
        id: deno-try-2
        if: steps.deno-try-1.outcome == 'failure'
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"
      - name: Wait before retrying the Deno download again
        if: steps.deno-try-2.outcome == 'failure'
        run: sleep 45
      - name: Install Deno (retry 2 of 2)
        if: steps.deno-try-2.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: "2.9.7"

      - name: Check contract drift against turbopanel
        working-directory: turbopaneld
        env:
          TURBOPANEL_REQUIRE_SIBLING: "1"
        run: deno task check:contract-drift

  # The one context the trunk ruleset will require: green only when every
  # PR-time job above succeeded. Every need runs unconditionally, so a
  # `skipped` result is a failure here too.
  #
  # On a pull_request this runs even when the run was cancelled, so a
  # cancelled PR run reports a (red) ci-ok instead of leaving the required
  # check pending with no signal — and can never satisfy it. On a push (the
  # trunk build and tag builds that call this file) a cancelled run is just
  # cancelled: this job is skipped rather than turning a working commit red.
  # A real failure of a need still runs it, and still fails it.
  ci-ok:
    name: ci-ok
    needs: [verify, contract-drift]
    if: ${{ (github.event_name == 'pull_request' && always()) || !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every PR job to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          if echo "$RESULTS" | grep -Eq '"result": *"(failure|cancelled|skipped)"'; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
          echo "$RESULTS" | grep -Eq '"result": *"success"' || { echo "::error::no job results"; exit 1; }
