name: Verify

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: daemon-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Job-level so Sonar `if:` / require-token steps can read the secret.
      # Empty only for fork PRs (secrets are not available to forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      # Fork PRs cannot receive repository secrets — skip Sonar there.
      # workflow_call (trunk publish) and same-repo PRs must have SONAR_TOKEN.
      - name: Require SONAR_TOKEN for trusted verification
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is required for trusted verification (workflow_call / same-repo PRs). Fork PRs may omit it."
            exit 1
          fi

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.4).
          deno-version: "2.9.4"
          cache: true

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Typecheck
        run: deno task check

      - name: Check production layout contract
        run: deno task check:layout

      - name: Test with coverage
        run: deno task test:coverage

      - name: Assert LCOV paths are repo-relative
        # Deno 2.9.4 emits SF:src/... (repo-relative). SonarCloud resolves those
        # against the project root; absolute or file:// SF paths would miss.
        # If this fails after a Deno bump, add a strip-prefix normalization step.
        run: |
          set -eu
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::Missing coverage/lcov.info"
            exit 1
          fi
          bad="$(grep -E '^SF:(/|file:)' coverage/lcov.info || true)"
          if [ -n "$bad" ]; then
            echo "::error::LCOV SF paths must be repo-relative for SonarCloud"
            printf '%s\n' "$bad" | head -n 20
            exit 1
          fi
          if ! grep -q '^SF:src/' coverage/lcov.info; then
            echo "::error::Expected at least one SF:src/ entry in coverage/lcov.info"
            exit 1
          fi

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: daemon-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Coverage import needs CI-based analysis (Automatic Analysis must be off
      # for turbopanel_turbopaneld). Skip only for fork PRs (empty SONAR_TOKEN);
      # trusted runs fail earlier if the token is missing.
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
