name: Verify

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false
  pull_request:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    concurrency:
      group: daemon-verify-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    env:
      # Job-level so Sonar `if:` / require-token steps can read the secret.
      # Empty only for fork PRs (secrets are not available to forks).
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          # Full history for SonarCloud new-code / blame (shallow clones skew the gate).
          fetch-depth: 0

      # Fork PRs cannot receive repository secrets — skip Sonar there.
      # Same-repo PRs / workflow_call should have SONAR_TOKEN for CI-based
      # Sonar + LCOV import. Until the secret is wired on turbopanel/turbopaneld,
      # fail this step visibly but continue (fmt/lint/tests must still gate).
      # Instance/ui/website do not run Sonar in Actions — they use SonarCloud
      # Automatic Analysis via .sonarcloud.properties (no SONAR_TOKEN).
      - name: Require SONAR_TOKEN for trusted verification
        if: >-
          github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::SONAR_TOKEN is missing — SonarCloud CI scan will be skipped. Add the secret on turbopanel/turbopaneld (or org) to enforce quality gate + LCOV import. Fork PRs may omit it."
            exit 1
          fi

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.5).
          deno-version: "2.9.5"
          cache: true

      - name: Format check
        run: deno task fmt:check

      - name: Lint
        run: deno task lint

      - name: Typecheck
        run: deno task check

      - name: Check production layout contract
        run: deno task check:layout

      - name: Check vocabulary (no daemon-as-agent phrasing)
        run: deno task check:vocabulary

      - name: Test with coverage
        run: deno task test:coverage

      - name: Normalize LCOV SF paths for SonarCloud
        # Deno 2.9.5 on GitHub Actions emits absolute SF:/home/runner/work/...
        # paths; SonarCloud needs repo-relative SF:src/... Resolve against the
        # checkout root, then assert nothing absolute remains.
        run: |
          set -eu
          if [ ! -f coverage/lcov.info ]; then
            echo "::error::Missing coverage/lcov.info"
            exit 1
          fi
          workspace="${GITHUB_WORKSPACE:-$(pwd)}"
          workspace="${workspace%/}"
          export LCOV_WORKSPACE="$workspace"
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("coverage/lcov.info")
          text = path.read_text()
          workspace = os.environ["LCOV_WORKSPACE"].rstrip("/")
          for prefix in (f"file://{workspace}/", f"{workspace}/"):
              text = text.replace(f"SF:{prefix}", "SF:")
          path.write_text(text)
          PY
          bad="$(grep -E '^SF:(/|file:)' coverage/lcov.info || true)"
          if [ -n "$bad" ]; then
            echo "::error::LCOV SF paths must be repo-relative for SonarCloud after normalization"
            printf '%s\n' "$bad" | head -n 20
            exit 1
          fi
          if ! grep -q '^SF:src/' coverage/lcov.info; then
            echo "::error::Expected at least one SF:src/ entry in coverage/lcov.info"
            exit 1
          fi

      - name: Upload coverage LCOV
        uses: actions/upload-artifact@v7
        with:
          name: daemon-coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

      # Coverage import needs CI-based analysis (Automatic Analysis must be off
      # for turbopanel_turbopaneld). Skipped when SONAR_TOKEN is empty (forks, or
      # until the secret is configured — see soft-fail require step above).
      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
