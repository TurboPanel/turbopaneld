# Looks again at the promote-ok check (promote-ok.yml) of the open Release
# Candidate and Release PRs when what they wait for may now exist: after
# the daemon trunk build ("Publish Daemon Trunk Build" tests the commit and
# publishes its canary), and after Publish Release Candidate (a new rc). It
# writes the verdict to the PR's head commit's `promote-ok` check run, the
# check the ruleset requires. Logic: TurboPanel/dev
# gh-promote-ok-recheck.yml.
#
# workflow_dispatch:
#   pr = <number>   dry run: evaluate promote-ok for that PR, read-only (the
#                   result shows in this run, never as a check on the PR)
#   pr empty        look at the open promotion PRs now; `rerun` off (the
#                   default) only reports what it would write
#
# No job here is named promote-ok; the recheck job writes the promote-ok
# check run, the dry run writes nothing.

name: Promote OK Recheck

on:
  workflow_run:
    workflows: [Publish Daemon Trunk Build, Publish Release Candidate]
    types: [completed]
    branches: [trunk, staging]
  workflow_dispatch:
    inputs:
      pr:
        description: Dry run - evaluate promote-ok for this PR number, read-only (empty = re-check the open promotion PRs)
        required: false
        type: string
        default: ""
      rerun:
        description: With no PR number, write the verdicts (off = report only)
        required: false
        type: boolean
        default: false

# One recheck at a time per repo, none dropped: triggers that land close
# together queue in order (`queue: max`) instead of judging the same
# head twice at once, and a pending one is never replaced by a newer one
# (each may name a different commit to re-check).
concurrency:
  group: promote-ok-recheck
  cancel-in-progress: false
  queue: max

# Read-only by default; only the recheck job writes, and only promote-ok check runs.
permissions:
  contents: read

jobs:
  recheck:
    # A PR's own CI run or a skipped run changes nothing promote-ok looks at.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr == '')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event != 'pull_request'
          && github.event.workflow_run.conclusion != 'skipped')
    uses: TurboPanel/dev/.github/workflows/gh-promote-ok-recheck.yml@ea6e8f0dd5b5ca9280292e9ad2019fb565083644 # dev#118
    with:
      repo-kind: daemon
      ci-workflow: publish-daemon-trunk.yml
      dev-ref: ea6e8f0dd5b5ca9280292e9ad2019fb565083644 # dev#118
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.rerun }}
    # gh-promote-ok-recheck.yml finds the open PRs (pull-requests), judges
    # their heads like promote-ok.yml (contents, actions) and writes the
    # promote-ok check runs (checks).
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
    uses: TurboPanel/dev/.github/workflows/gh-promote-ok.yml@ea6e8f0dd5b5ca9280292e9ad2019fb565083644 # dev#118
    with:
      repo-kind: daemon
      ci-workflow: publish-daemon-trunk.yml
      dev-ref: ea6e8f0dd5b5ca9280292e9ad2019fb565083644 # dev#118
      pr-number: ${{ inputs.pr }}
    # A dry run writes no check, but the called workflow declares checks: write.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      checks: write
