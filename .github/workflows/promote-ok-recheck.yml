# Re-runs the red promote-ok check (promote-ok.yml) of the open Release
# Candidate and Release PRs when what they wait for may now exist: after
# the daemon trunk build ("Publish Daemon Trunk Build" tests the commit and publishes its canary), and after Publish Release Candidate (a new rc). The re-run
# reports on the PR's head commit under the same `promote-ok` name, so the
# ruleset sees the new result. Logic: TurboPanel/dev gh-promote-ok-recheck.yml.
#
# workflow_dispatch:
#   pr = <number>   dry run: evaluate promote-ok for that PR, read-only (the
#                   result shows in this run, never as a check on the PR)
#   pr empty        re-check the open promotion PRs now; `rerun` off (the
#                   default) only reports what it would re-run
#
# None of these jobs is named promote-ok, so nothing here can satisfy the
# required check.

name: Promote OK Recheck

on:
  workflow_run:
    workflows: [Publish Daemon Trunk Build, Publish Release Candidate]
    types: [completed]
    branches: [trunk, staging]
  workflow_dispatch:
    inputs:
      pr:
        description: Dry run - evaluate promote-ok for this PR number, read-only (empty = re-check the open promotion PRs)
        required: false
        type: string
        default: ""
      rerun:
        description: With no PR number, re-run the red checks (off = report only)
        required: false
        type: boolean
        default: false

# Read-only by default; only the recheck job may re-run runs.
permissions:
  contents: read

jobs:
  recheck:
    # A PR's own CI run or a skipped run changes nothing promote-ok looks at.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pr == '')
      || (github.event_name == 'workflow_run'
          && github.event.workflow_run.event != 'pull_request'
          && github.event.workflow_run.conclusion != 'skipped')
    uses: TurboPanel/dev/.github/workflows/gh-promote-ok-recheck.yml@2e0291995207bfd01fd911c1200d72fc3a17f4e0 # dev#41
    with:
      dev-ref: 2e0291995207bfd01fd911c1200d72fc3a17f4e0
      dry-run: ${{ github.event_name == 'workflow_dispatch' && !inputs.rerun }}
    # gh-promote-ok-recheck.yml finds the open PRs (pull-requests) and re-runs
    # their failed promote-ok run (actions: write).
    permissions:
      contents: read
      actions: write
      pull-requests: read

  dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.pr != ''
    uses: TurboPanel/dev/.github/workflows/gh-promote-ok.yml@387788e9e64344fc5de32f6b93abd178e956d6a1 # dev#42
    with:
      repo-kind: daemon
      ci-workflow: publish-daemon-trunk.yml
      dev-ref: 387788e9e64344fc5de32f6b93abd178e956d6a1 # dev#42
      pr-number: ${{ inputs.pr }}
    permissions:
      contents: read
      actions: read
      pull-requests: read
