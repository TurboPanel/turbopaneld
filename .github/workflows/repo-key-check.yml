# repo-key-check: weekly, compare the package-repository signing keys shipped
# with the daemon against what the vendors publish now, and file or update ONE
# issue when they differ. It changes no key and touches no server: hosts never
# block on a rotated key (they fetch the live key and fall back to the shipped
# copy), so this only tells the owner to refresh the copy in the next release.
# A download that fails is retried, and does not open an issue.
name: Repository Key Check

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: repo-key-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.8).
          deno-version: "2.9.8"

      - name: Compare with the vendors' keys
        id: compare
        run: |
          # Exit 0: same keys. 1: the keys differ (report written). 2: only
          # downloads failed, so retry before giving up.
          code=0
          for attempt in 1 2 3; do
            code=0
            deno task check:repo-keys "$RUNNER_TEMP/report.md" || code=$?
            [ "$code" -ne 2 ] && break
            echo "Download failed (attempt $attempt of 3)"
            sleep 30
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # Drift is reported through the issue below, not by failing the run.
          if [ "$code" -eq 2 ]; then
            echo "The vendors' key downloads kept failing; no issue filed." >&2
            exit 1
          fi

      - name: File or update the issue
        if: steps.compare.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Repository signing key changed"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
