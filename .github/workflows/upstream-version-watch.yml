# upstream-version-watch: weekly check of the upstream versions we pin by hand
# (PHP per OS from LiteSpeed lsphp and sury php-fpm, OpenLiteSpeed, nginx,
# Apache httpd/APR/APR-util). Keeps ONE issue titled "Upstream versions to
# review" in TurboPanel/turbopanel up to date (owner decision: issues are off
# here): edits it in place in any state, reopens it only when something needs
# action, creates it once, never closes it.
#
# GITHUB_TOKEN cannot write issues in another repository, so the issue step
# uses the UPSTREAM_WATCH_ISSUES_TOKEN secret: a fine-grained token for
# TurboPanel/turbopanel only, with Issues: read and write. Without it (or with
# issues off there) the report stays in the run summary only.
# The checks live in scripts/lib/upstream-versions.ts; nothing is bumped here.
name: Upstream Version Watch

on:
  schedule:
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-version-watch
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
      # a transient GitHub 5xx on the download must not turn the run red.
      - name: Install Deno
        id: deno-try-1
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true
      - name: Wait before retrying the Deno download
        if: steps.deno-try-1.outcome == 'failure'
        run: sleep 15
      - name: Install Deno (retry 1 of 2)
        id: deno-try-2
        if: steps.deno-try-1.outcome == 'failure'
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true
      - name: Wait before retrying the Deno download again
        if: steps.deno-try-2.outcome == 'failure'
        run: sleep 45
      - name: Install Deno (retry 2 of 2)
        if: steps.deno-try-2.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
          cache: true

      # Exits 1 after writing the report when an upstream could not be read,
      # so the run goes red while the issue still gets the partial report.
      - name: Check upstream versions
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          deno run
          --allow-read=orchestration
          --allow-write="$RUNNER_TEMP","$GITHUB_OUTPUT"
          --allow-net=rpms.litespeedtech.com,packages.sury.org,nginx.org,api.github.com,downloads.apache.org
          --allow-env=GH_TOKEN,GITHUB_OUTPUT,LOG_TOKENS,LOG_STREAM
          scripts/check-upstream-versions.ts "$RUNNER_TEMP/upstream-versions.md"

      - name: Update the tracking issue
        if: always() && steps.check.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ secrets.UPSTREAM_WATCH_ISSUES_TOKEN }}
          ISSUE_REPO: TurboPanel/turbopanel
          TITLE: Upstream versions to review
          ACTIONS: ${{ steps.check.outputs.actions }}
        run: |
          report="$RUNNER_TEMP/upstream-versions.md"
          if [ ! -s "$report" ]; then
            echo "::error::No report was written; the tracking issue is unchanged."
            exit 1
          fi
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          # Same fallback as the dependency sweep: without a token for the
          # issue repository, or with issues off there, the report stays in
          # the run summary only.
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice title=Upstream version watch::UPSTREAM_WATCH_ISSUES_TOKEN is not set; the report is in the run summary only."
            exit 0
          fi
          if [ "$(gh api "repos/$ISSUE_REPO" --jq .has_issues)" != "true" ]; then
            echo "::notice title=Upstream version watch::Issues are not available in $ISSUE_REPO; the report is in the run summary only."
            exit 0
          fi
          # One issue for good: found by exact title in any state, edited in
          # place, reopened only when something needs action, created once.
          found="$(gh issue list -R "$ISSUE_REPO" --state all --limit 100 \
            --search "\"$TITLE\" in:title" --json number,title,state \
            --jq "map(select(.title == env.TITLE)) | first | select(. != null) | \"\(.number) \(.state)\"")"
          if [ -z "$found" ]; then
            gh issue create -R "$ISSUE_REPO" --title "$TITLE" --body-file "$report"
            exit 0
          fi
          number="${found% *}"
          gh issue edit "$number" -R "$ISSUE_REPO" --body-file "$report"
          if [ "${found#* }" != "OPEN" ] && [ "${ACTIONS:-0}" != "0" ]; then
            gh issue reopen "$number" -R "$ISSUE_REPO"
          fi
