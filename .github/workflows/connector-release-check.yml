# connector-release-check: every six hours, look for a tunnel connector release
# newer than the version this daemon pins and file or update ONE issue with the
# new version and its checksums. It changes no pin and touches no server: a new
# connector reaches servers only with a daemon release the owner cuts.
name: Tunnel Connector Release Check

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: connector-release-check
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.8).
          deno-version: "2.9.8"

      - name: Compare with the pinned connector
        id: compare
        run: |
          result="$(deno run --allow-net=api.github.com --allow-read --allow-write scripts/check-connector-release.ts "$RUNNER_TEMP/report.md")"
          echo "result=$result" >> "$GITHUB_OUTPUT"

      - name: File or update the issue
        if: steps.compare.outputs.result == 'newer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Tunnel connector update available"
          number="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/report.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/report.md"
          fi
