# Publishes the release when the staging → live PR is merged (Road to 0.2.x,
# versioning flow) — the second automatic PR. Runs on the push the merge makes
# to `live` (a push runs the workflow file from the pushed commit, so the very
# first merge, which brings this file into live, already works).
#
#   1. resolve  the merged PR and the newest rc that has not shipped (from the
#               tags, never a version file) — that rc's bytes become the release
#   2. prepare / publish / finalize   the shared promote workflows
#               (TurboPanel/dev). prepare still waits on the `release`
#               environment approval: keep it until this path has run once end
#               to end, then drop it (`approval-environment: ""`).
#
# Nothing opens a "Start <next>" PR afterwards: once v<version> exists, the
# next canary is <version>'s next patch by itself (versions come from tags;
# minors and majors are started with start-next-version.yml).
#
# A push to live that is not a merged staging PR (a break-glass promotion, the
# finalize fast-forward) does nothing. workflow_dispatch re-runs the release
# for a given rc tag.

name: Publish Release

on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      rc-tag:
        description: The rc tag to release (vX.Y.Z-rc.N)
        required: true
        type: string

# Read-only by default; each job below asks for exactly what it writes.
permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Reads the merged PR (pull-requests) and the tags (contents).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      rc-tag: ${{ steps.r.outputs.rc-tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # The newest rc above the newest release — what staging holds.
      - name: Work out the rc to release from the tags
        id: rc
        uses: TurboPanel/dev/.github/actions/version@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
        with:
          mode: release-rc

      - name: Find the merged PR and the rc it releases
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_RC_TAG: ${{ inputs.rc-tag }}
          NEWEST_RC: ${{ steps.rc.outputs.rc-tag }}
          NEWEST_VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            rc_tag="$INPUT_RC_TAG"
            version="${rc_tag#v}"; version="${version%-rc.*}"
          else
            pr=""
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$REPO/commits/$PUSHED/pulls" --jq '[.[] | select(.base.ref == "live" and .head.ref == "staging" and .merged_at != null)][0].number // empty')"
              [ -n "$pr" ] && break
              sleep 10
            done
            if [ -z "$pr" ]; then
              echo "push to live is not a merged staging PR — nothing to release"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rc_tag="$NEWEST_RC"
            version="$NEWEST_VERSION"
            [ -n "$rc_tag" ] || { echo "::error::no rc newer than the latest release exists — publish an rc first (merge the trunk → staging PR)"; exit 1; }
            echo "PR #$pr merged; releasing $version from $rc_tag"
          fi
          if gh api "repos/$REPO/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version already exists — nothing to release"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "proceed=true"
            echo "rc-tag=$rc_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: daemon
      to: release
      source: ${{ needs.resolve.outputs.rc-tag }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # Same signer pin as promote.yml.
      signer-ref: 93c4f94510c9499e6bf04366a9500fe9f8e38aaa
      # Default: the `release` environment approval stays for the release hop.
    secrets: inherit

  publish:
    needs: prepare
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: release
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      to: release
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    secrets: inherit
