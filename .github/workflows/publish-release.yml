# Publishes the release when the staging → live PR is merged (Road to 0.2.x,
# versioning flow) — the second automatic PR. Runs on the push the merge makes
# to `live` (a push runs the workflow file from the pushed commit, so the very
# first merge, which brings this file into live, already works).
#
#   1. resolve  the merged PR and the newest rc that has not shipped (from the
#               tags) — that rc's bytes become the release
#   2. prepare / publish / finalize   the shared promote workflows
#               (TurboPanel/dev). prepare still waits on the `release`
#               environment approval: keep it until this path has run once end
#               to end, then drop it (`approval-environment: ""`).
#
#   3. start-next  once v<version> exists, the tags say the next canary is
#               <version>'s next patch; the committed version (deno.json,
#               sonar-project.properties) still says <version>, so every canary
#               is refused until it moves. This opens the "chore: start
#               <next>" PR that moves it (Release App token, a signed commit
#               made through the GitHub API), which merges itself once its
#               checks pass. Minors and majors are started with
#               start-next-version.yml.
#
# A push to live that is not a merged staging PR (a break-glass promotion, the
# finalize fast-forward) does nothing. workflow_dispatch re-runs the release
# for a given rc tag.

name: Publish Release

on:
  push:
    branches: [live]
  workflow_dispatch:
    inputs:
      rc-tag:
        description: The rc tag to release (vX.Y.Z-rc.N)
        required: true
        type: string

# Read-only by default; each job below asks for exactly what it writes.
permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    # Reads the merged PR (pull-requests) and the tags (contents).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proceed: ${{ steps.r.outputs.proceed }}
      rc-tag: ${{ steps.r.outputs.rc-tag }}
      version: ${{ steps.r.outputs.version }}
    steps:
      # The newest rc above the newest release — what staging holds.
      - name: Work out the rc to release from the tags
        id: rc
        uses: TurboPanel/dev/.github/actions/version@66284778b3db591fab29c96aee4f1b4bd0147282 # dev#67
        with:
          mode: release-rc

      - name: Find the merged PR and the rc it releases
        id: r
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PUSHED: ${{ github.sha }}
          INPUT_RC_TAG: ${{ inputs.rc-tag }}
          NEWEST_RC: ${{ steps.rc.outputs.rc-tag }}
          NEWEST_VERSION: ${{ steps.rc.outputs.version }}
        run: |
          set -eu
          if [ "$EVENT" = "workflow_dispatch" ]; then
            rc_tag="$INPUT_RC_TAG"
            version="${rc_tag#v}"; version="${version%-rc.*}"
          else
            pr=""
            for _ in 1 2 3 4 5 6; do
              pr="$(gh api "repos/$REPO/commits/$PUSHED/pulls" --jq '[.[] | select(.base.ref == "live" and .head.ref == "staging" and .merged_at != null)][0].number // empty')"
              [ -n "$pr" ] && break
              sleep 10
            done
            if [ -z "$pr" ]; then
              echo "push to live is not a merged staging PR — nothing to release"
              echo "proceed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            rc_tag="$NEWEST_RC"
            version="$NEWEST_VERSION"
            [ -n "$rc_tag" ] || { echo "::error::no rc newer than the latest release exists — publish an rc first (merge the trunk → staging PR)"; exit 1; }
            echo "PR #$pr merged; releasing $version from $rc_tag"
          fi
          if gh api "repos/$REPO/git/ref/tags/v$version" --silent 2>/dev/null; then
            echo "v$version already exists — nothing to release"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "proceed=true"
            echo "rc-tag=$rc_tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  prepare:
    needs: resolve
    if: needs.resolve.outputs.proceed == 'true'
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      repo-kind: daemon
      to: release
      source: ${{ needs.resolve.outputs.rc-tag }}
      dev-ref: d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
      # Same signer pin as promote.yml.
      signer-ref: 93c4f94510c9499e6bf04366a9500fe9f8e38aaa
      # Default: the `release` environment approval stays for the release hop.
    secrets: inherit

  publish:
    needs: prepare
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-release.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.prepare.outputs.version }}
      channel: release
      release-notes: ${{ needs.prepare.outputs.release-notes }}
      assets-artifact-name: ${{ needs.prepare.outputs.assets-artifact-name }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
      target-commit: ${{ needs.prepare.outputs.commit }}
    secrets: inherit

  finalize:
    needs: [prepare, publish]
    # gh-promote / gh-release / gh-promote-finalize create the tag and the
    # release and upload assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-promote-finalize.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      to: release
      version: ${{ needs.prepare.outputs.version }}
      commit: ${{ needs.prepare.outputs.commit }}
      branch: ${{ needs.prepare.outputs.branch }}
      manifest-filename: ${{ needs.prepare.outputs.manifest-filename }}
    secrets: inherit

  start-next:
    needs: [prepare, finalize]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reads the tags; the PR is opened with the Release App token.
    permissions:
      contents: read
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TurboPanel
          repositories: turbopaneld

      - name: Work out the next version from the tags
        id: next
        uses: TurboPanel/dev/.github/actions/version@66284778b3db591fab29c96aee4f1b4bd0147282 # dev#67
        with:
          mode: base

      - name: Check the newest release is the one just published
        env:
          RELEASED: ${{ needs.prepare.outputs.version }}
          NEWEST: ${{ steps.next.outputs.release }}
          NEXT: ${{ steps.next.outputs.base }}
        run: |
          set -eu
          if [ "$NEWEST" != "$RELEASED" ]; then
            echo "::error::the newest release tag is v${NEWEST}, not v${RELEASED} (just released): open the version PR by hand with node scripts/set-version.mjs <next version>"
            exit 1
          fi
          echo "v${RELEASED} released; trunk builds ${NEXT} next"

      - name: Open the version PR for the next patch
        id: pr
        uses: TurboPanel/dev/.github/actions/start-version-pr@66284778b3db591fab29c96aee4f1b4bd0147282 # dev#67
        with:
          version: ${{ steps.next.outputs.base }}
          github-token: ${{ steps.app.outputs.token }}
          reason: It was opened after v${{ needs.prepare.outputs.version }} was released.
          auto-merge: "true"

      - name: Say where the PR is
        env:
          PR_URL: ${{ steps.pr.outputs.pr-url }}
          NEXT: ${{ steps.next.outputs.base }}
        run: |
          if [ -n "$PR_URL" ]; then
            echo "chore: start ${NEXT}: $PR_URL (it merges itself once its checks pass; canaries build again after that)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "the committed version already says ${NEXT}" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
