# Start Next Version: the one button that starts a new minor or major across
# turbopaneld, turbopanel, ui and website (Road to 0.2.x, versioning Phase 3).
#
# Patches need no button: right after vX.Y.Z is released, publish-release.yml
# opens the "chore: start X.Y.(Z+1)" PR in that repo, which merges itself once
# its checks pass. A minor (next X.Y.0) or a
# major (next X.0.0; the first is 1.0.0) is the one deliberate act, and this is
# it:
#
#   1. each repo's target is the next minor/major after THAT repo's newest
#      release (repos release independently). A repo already building the
#      target or later is skipped, so running this twice is harmless.
#   2. an annotated tag start/v<target> is pushed at the repo's trunk head
#      (Release App token). That marker moves what the tags say the version
#      is. It matches no release-tag ruleset and no tag trigger.
#   3. each repo gets a "chore: start <target>" PR that moves its committed
#      version numbers (node scripts/set-version.mjs <target>, a signed commit
#      made through the GitHub API), which merges itself once its checks pass.
#      Until it merges, that repo's canary build is refused, so nothing is
#      rebuilt here. Running this again retries a PR that failed to open.
#
# From then on every release of that repo, a hotfix included, carries the new
# number: run this only when everything on trunk may ship as the new version.
# An rc already on staging still ships under its own number.
#
# Who can run it: workflow_dispatch is only offered to people with write access
# to this repository (Actions → Start Next Version → Run workflow). Tick
# dry-run first to see what each repo would get. The logic is TurboPanel/dev
# scripts/promote/start-version.sh.

name: Start Next Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: What to start (minor = next X.Y.0, major = next X.0.0)
        required: true
        type: choice
        options:
          - minor
          - major
        default: minor
      dry-run:
        description: Only show what each repo would get; push nothing
        required: false
        type: boolean
        default: false

# The GITHUB_TOKEN only checks out TurboPanel/dev; the tags and the version
# PRs in all four repos go through the Release App token.
permissions:
  contents: read

concurrency:
  group: start-next-version
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint a Release App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TurboPanel
          repositories: |
            turbopaneld
            turbopanel
            ui
            website

      - name: Check out the version scripts (TurboPanel/dev)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: TurboPanel/dev
          ref: c4ae5d95b3784421efcd136928bc706ffa239b6e # dev#68
          path: .promote
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: scripts/promote
          sparse-checkout-cone-mode: false

      - name: Start the next ${{ inputs.bump }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry-run }}
          START_MESSAGE: "Start the next ${{ inputs.bump }}: run by ${{ github.actor }} in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "### Start Next Version: $BUMP" >> "$GITHUB_STEP_SUMMARY"
          sh .promote/scripts/promote/start-version.sh "$BUMP" \
            TurboPanel/turbopaneld \
            TurboPanel/turbopanel \
            TurboPanel/ui \
            TurboPanel/website
