# Required GitHub repository configuration (Settings → Secrets and variables → Actions):
#
#   SONAR_TOKEN — SonarCloud token for CI-based scan + LCOV import:
#                 verify.yml on pull requests, sonar-trunk.yml on trunk
#                 (required for same-repo / trunk; fork PRs omit it). Keep
#                 Automatic Analysis off so Deno LCOV can be imported.
#
# Missing SONAR_TOKEN fails verify on trunk (publish `needs: verify`). The
# `canary` environment also carries TURBOPANEL_RELEASE_SIGNING_KEY, which signs
# the canary manifest. There is no CDN upload any more: the per-merge `trunk`
# drop on dl.trbp.nl was retired (owner decision 2026-10-05), so the old
# DL_S3_* variables and secrets are gone and nothing here needs them.
#
# Code quality gates live in .github/workflows/verify.yml and must pass before
# anything is compiled or published. Promotion of an already-published build into
# rc / release re-verifies artifact hashes only and deliberately runs no unit
# tests, because no new code enters the pipeline after publish.
#
# Every green trunk merge is compiled once and published as the GitHub canary
# (`canary` channel): the tarballs under versioned names
# (turbopaneld-<X.Y.Z>-canary.<N>-<arch>.tar.zst) on the rolling `canary`
# pre-release, published by TurboPanel/dev's gh-canary.yml — what a self-hosted
# canary install follows. The former CDN drop (`trunk` channel on dl.trbp.nl)
# is retired.
#
# The version comes from git tags, never from deno.json (TurboPanel/dev's
# Version From Tags action): X.Y.Z is the newest release's next patch, or a
# higher started / in-flight version, and N restarts at 1 for each X.Y.Z. The
# binary reports plain X.Y.Z (stamped into this checkout's deno.json before
# compiling); `-canary.<N>` lives only in the asset names and the signed
# manifest. deno.json's committed number is what a local build reports.
#
# workflow_dispatch re-runs the whole thing for trunk's head: "Start Next
# Version" uses it so a started minor gets its first canary without waiting
# for the next merge. A dispatch on any other branch does nothing.

name: Publish Daemon Trunk Build

on:
  push:
    branches:
      - trunk
  workflow_dispatch:

# Everything reads by default; only the canary job (the rolling `canary`
# GitHub release) gets write, below.
permissions:
  contents: read

# One trunk build at a time, oldest first, and none dropped. The default queue
# keeps a single pending run and cancels it when a newer push arrives, so on a
# busy day a merged commit could be tested (half-way), never published, and
# show a red X. `queue: max` keeps up to 100 pending runs in push order
# instead (it cannot be combined with cancel-in-progress: true). Serialising
# the whole run — verify, publish and canary — also keeps the job-level
# groups inside verify.yml and gh-canary.yml free of competing pending jobs.
# SonarCloud's trunk analysis runs after this workflow, in sonar-trunk.yml
# (its own queue keeps those in commit order).
concurrency:
  group: publish-daemon-trunk-run
  cancel-in-progress: false
  queue: max

jobs:
  # The whole verify.yml (tests, contract drift, ci-ok) for this exact
  # commit, in this run. `publish` needs it, and `canary` needs `publish`, so
  # nothing is published unless every one of them passed. Only trunk builds
  # canaries: a manual run on another branch skips everything.
  verify:
    if: github.ref == 'refs/heads/trunk'
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  publish:
    # Signs the canary manifest on every trunk merge: environment secret
    # TURBOPANEL_RELEASE_SIGNING_KEY from the `canary` environment.
    environment: canary
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Three attempts, 15 s then 45 s apart: setup-deno has no retry input and
      # a transient GitHub 5xx on the download must not turn the run red.
      - name: Install Deno
        id: deno-try-1
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
      - name: Wait before retrying the Deno download
        if: steps.deno-try-1.outcome == 'failure'
        run: sleep 15
      - name: Install Deno (retry 1 of 2)
        id: deno-try-2
        if: steps.deno-try-1.outcome == 'failure'
        continue-on-error: true
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"
      - name: Wait before retrying the Deno download again
        if: steps.deno-try-2.outcome == 'failure'
        run: sleep 45
      - name: Install Deno (retry 2 of 2)
        if: steps.deno-try-2.outcome == 'failure'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Work out this build's version from the tags
        id: version
        uses: TurboPanel/dev/.github/actions/version@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
        with:
          mode: canary

      - name: Stamp the version into deno.json
        # What the binary reports (src/version.ts reads deno.json at compile
        # time): the plain base X.Y.Z, never the -canary.N label. Transient,
        # this checkout only; the committed number is not the source of truth.
        env:
          BASE_VERSION: ${{ steps.version.outputs.base }}
          CANARY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          python3 - <<'PY'
          import json, os
          path = "deno.json"
          with open(path) as f:
              config = json.load(f)
          config["version"] = os.environ["BASE_VERSION"]
          with open(path, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY
          python3 -c 'import json, os, sys; v = json.load(open("deno.json"))["version"]; sys.exit(v != os.environ["BASE_VERSION"])'
          echo "building ${BASE_VERSION} (canary ${CANARY_VERSION})"

      - name: Compute build metadata
        run: |
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_ID=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Embed build identity
        # channel is deliberately not embedded here: it's a placement fact
        # (which channel a host is configured to follow via
        # TURBOPANEL_UPDATE_CHANNEL, resolveUpdateChannelConfig() in
        # src/update/config.ts), not a build fact. Baking it as "trunk" meant
        # flipping a release from pre-release to release would report the
        # wrong channel on every host running those bytes — every reader
        # (daemon-cli.ts, ping.ts, idle-presence.ts) now resolves it live
        # instead of reading it off BuildInfo.
        run: |
          cat > src/build-info.ts <<EOF
          export interface BuildInfo {
            commit: string;
            buildId: string;
            builtAt: string;
            sourceUrl: string;
          }

          export const BUILD_INFO: BuildInfo = {
            commit: "$GIT_COMMIT",
            buildId: "$BUILD_ID",
            builtAt: "$BUILT_AT",
            sourceUrl: "https://github.com/TurboPanel/turbopaneld/tree/$GIT_COMMIT",
          };

          export function getBuildInfo(): BuildInfo {
            return BUILD_INFO;
          }
          EOF

      - name: Compile native binary
        run: deno task compile

      - name: Compile linux-amd64 binary
        run: deno task compile:linux-amd64

      - name: Compile linux-arm64 binary
        run: deno task compile:linux-arm64

      - name: Bundle JS fallback
        run: deno task bundle:js

      - name: Stage orchestration share tree
        run: deno task bundle:orchestration

      - name: Package split release artifacts
        run: deno task package:release

      - name: Verify release packages and stage publish tree
        run: |
          set -eu
          # shellcheck source=scripts/lib/release-artifacts.sh
          . scripts/lib/release-artifacts.sh
          chmod +x scripts/verify-release-root.sh

          _publish_dir="publish/daemon"
          mkdir -p "$_publish_dir"

          _js_name="$(tp_js_release_filename)"
          _orch_name="$(tp_orchestration_release_filename)"

          for _arch in amd64 arm64; do
            _tarball="dist/turbopaneld-${_arch}.tar.zst"
            _verify_root="$(mktemp -d)"
            zstd -d -q -c "$_tarball" | tar -x -C "$_verify_root"
            bash scripts/verify-release-root.sh --binary-only "$_verify_root"
            cp "$_tarball" "$_publish_dir/"
            rm -rf "$_verify_root"
          done

          _js_tarball="dist/${_js_name}"
          _js_verify="$(mktemp -d)"
          zstd -d -q -c "$_js_tarball" | tar -x -C "$_js_verify"
          bash scripts/verify-release-root.sh --js-only "$_js_verify"
          cp "$_js_tarball" "$_publish_dir/${_js_name}"
          rm -rf "$_js_verify"

          _orch_tarball="dist/${_orch_name}"
          _orch_verify="$(mktemp -d)"
          zstd -d -q -c "$_orch_tarball" | tar -x -C "$_orch_verify"
          bash scripts/verify-release-root.sh --orchestration-only "$_orch_verify"
          cp "$_orch_tarball" "$_publish_dir/${_orch_name}"
          rm -rf "$_orch_verify"

          for _artifact in \
            turbopaneld-amd64.tar.zst \
            turbopaneld-arm64.tar.zst \
            "$_js_name" \
            "$_orch_name"; do
            if [ ! -s "$_publish_dir/$_artifact" ]; then
              echo "::error::missing or empty publish artifact: $_artifact"
              exit 1
            fi
          done

      - name: Stage the canary assets under versioned names
        id: canary
        # The compiled bytes, renamed the way a release names them so
        # the rolling canary release never has two builds fighting over one
        # filename. The version is the base the binary reports plus a
        # `-canary.<N>` pre-release suffix (N counts this base's canaries),
        # which semver orders below the release it leads to.
        env:
          CANARY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          # shellcheck source=scripts/lib/release-artifacts.sh
          . scripts/lib/release-artifacts.sh
          _version="$CANARY_VERSION"
          case "$_version" in
            *-canary.*) ;;
            *) echo "::error::no canary version worked out (got '${_version}')"; exit 1 ;;
          esac
          echo "version=${_version}" >> "$GITHUB_OUTPUT"
          mkdir -p canary-assets
          _src="publish/daemon"
          cp "${_src}/turbopaneld-amd64.tar.zst" "canary-assets/$(tp_daemon_release_filename amd64 "$_version")"
          cp "${_src}/turbopaneld-arm64.tar.zst" "canary-assets/$(tp_daemon_release_filename arm64 "$_version")"
          cp "${_src}/$(tp_js_release_filename)" "canary-assets/$(tp_js_release_filename "$_version")"
          cp "${_src}/$(tp_orchestration_release_filename)" "canary-assets/$(tp_orchestration_release_filename "$_version")"
          ls -l canary-assets

      - name: Generate the canary manifest
        env:
          CHANNEL: canary
          RELEASE_VERSION: ${{ steps.canary.outputs.version }}
          # The rolling release's download path: assets are added under
          # build-unique names, so this never 404s a manifest that names them.
          ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/canary
          RELEASE_SIGNING_KEY: ${{ secrets.TURBOPANEL_RELEASE_SIGNING_KEY }}
        run: |
          deno run --allow-env --allow-read --allow-write scripts/generate-channel-manifest.ts \
            canary-assets \
            canary-assets/manifest.json
          cat canary-assets/manifest.json

      - name: Upload canary assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopaneld-canary-assets
          path: canary-assets
          if-no-files-found: error
          retention-days: 3

    outputs:
      canary-version: ${{ steps.canary.outputs.version }}

  canary:
    needs: publish
    # gh-canary.yml creates/updates the rolling `canary` release and its assets.
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-canary.yml@d9127ee03a6a3b42e9435ebec3542db5fab09bc0 # dev#49
    with:
      version: ${{ needs.publish.outputs.canary-version }}
      commit: ${{ github.sha }}
      assets-artifact-name: turbopaneld-canary-assets
      manifest-filename: manifest.json
