# ⚠️  REQUIRED GITHUB REPOSITORY CONFIGURATION
# Before this workflow will succeed, configure Settings → Secrets and variables → Actions:
#
# Variables:
#   DL_S3_ENDPOINT — Bunny S3 endpoint URL (e.g. https://de-s3.storage.bunnycdn.com)
#   DL_S3_REGION   — Bunny storage region code for AWS CLI signing (e.g. de for
#                    https://de-s3.storage.bunnycdn.com); must match DL_S3_ENDPOINT
#
# Secrets:
#   DL_S3_BUCKET            — Bunny Storage Zone name (bucket name)
#   DL_S3_ACCESS_KEY_ID     — Bunny Storage Zone Access Key ID
#   DL_S3_SECRET_ACCESS_KEY — Bunny Storage Zone Password (Secret Access Key)
#   SONAR_TOKEN             — SonarCloud token for CI-based scan + LCOV import in
#                             verify.yml (required for same-repo / trunk; fork
#                             PRs omit it). Keep Automatic Analysis off.
#
# The workflow will fail with a clear error if any DL_S3_* variable or secret is
# missing. Missing SONAR_TOKEN fails verify on trunk (publish `needs: verify`).
# Keep SonarCloud Automatic Analysis off so Deno LCOV can be imported.
#
# Code quality gates live in .github/workflows/verify.yml and must pass before
# anything is compiled or published. Promotion of an already-published build into
# rc / release re-verifies artifact hashes only and deliberately runs no unit
# tests, because no new code enters the pipeline after publish.
#
# Every green trunk merge is published twice from the same compiled bytes:
#
#   - the CDN drop (`trunk` channel): unversioned tarballs under
#     channels/trunk/daemon/<buildId>/ on dl.trbp.nl — the hosted platform's
#     rail and the hand-operable override (Road to 0.1.x, `trunk-canary`);
#   - the GitHub canary (`canary` channel): the same tarballs under versioned
#     names (turbopaneld-<X.Y.Z>-canary.<buildId>-<arch>.tar.zst) on the
#     rolling `canary` pre-release, published by TurboPanel/dev's
#     gh-canary.yml — what a self-hosted canary install follows.

name: Publish daemon trunk build

on:
  push:
    branches:
      - trunk

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  publish:
    needs: verify
    runs-on: ubuntu-latest
    concurrency:
      group: publish-daemon-trunk
      cancel-in-progress: false
    steps:
      - name: Verify required secrets and variables
        env:
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
          DL_S3_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          DL_S3_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$DL_S3_ENDPOINT" ]; then
            echo "::error::Missing required variable: DL_S3_ENDPOINT"
            missing=1
          fi
          if [ -z "$DL_S3_REGION" ]; then
            echo "::error::Missing required variable: DL_S3_REGION"
            missing=1
          fi
          if [ -z "$DL_S3_BUCKET" ]; then
            echo "::error::Missing required secret: DL_S3_BUCKET"
            missing=1
          fi
          if [ -z "$DL_S3_ACCESS_KEY_ID" ]; then
            echo "::error::Missing required secret: DL_S3_ACCESS_KEY_ID"
            missing=1
          fi
          if [ -z "$DL_S3_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing required secret: DL_S3_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.7).
          deno-version: "2.9.7"

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Compute build metadata
        run: |
          echo "GIT_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_ID=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short=7 HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Embed build identity
        # channel is deliberately not embedded here: it's a placement fact
        # (which channel a host is configured to follow via
        # TURBOPANEL_UPDATE_CHANNEL, resolveUpdateChannelConfig() in
        # src/update/config.ts), not a build fact. Baking it as "trunk" meant
        # flipping a release from pre-release to release would report the
        # wrong channel on every host running those bytes — every reader
        # (daemon-cli.ts, ping.ts, idle-presence.ts) now resolves it live
        # instead of reading it off BuildInfo.
        run: |
          cat > src/build-info.ts <<EOF
          export interface BuildInfo {
            commit: string;
            buildId: string;
            builtAt: string;
            sourceUrl: string;
          }

          export const BUILD_INFO: BuildInfo = {
            commit: "$GIT_COMMIT",
            buildId: "$BUILD_ID",
            builtAt: "$BUILT_AT",
            sourceUrl: "https://github.com/TurboPanel/turbopaneld/tree/$GIT_COMMIT",
          };

          export function getBuildInfo(): BuildInfo {
            return BUILD_INFO;
          }
          EOF

      - name: Compile native binary
        run: deno task compile

      - name: Compile linux-amd64 binary
        run: deno task compile:linux-amd64

      - name: Compile linux-arm64 binary
        run: deno task compile:linux-arm64

      - name: Bundle JS fallback
        run: deno task bundle:js

      - name: Stage orchestration share tree
        run: deno task bundle:orchestration

      - name: Package split release artifacts
        run: deno task package:release

      - name: Verify release packages and stage publish tree
        run: |
          set -eu
          # shellcheck source=scripts/lib/release-artifacts.sh
          . scripts/lib/release-artifacts.sh
          chmod +x scripts/verify-release-root.sh

          _publish_dir="publish/channels/trunk/daemon"
          mkdir -p "$_publish_dir" publish/channels/trunk

          _js_name="$(tp_js_release_filename)"
          _orch_name="$(tp_orchestration_release_filename)"

          for _arch in amd64 arm64; do
            _tarball="dist/turbopaneld-${_arch}.tar.zst"
            _verify_root="$(mktemp -d)"
            zstd -d -q -c "$_tarball" | tar -x -C "$_verify_root"
            bash scripts/verify-release-root.sh --binary-only "$_verify_root"
            cp "$_tarball" "$_publish_dir/"
            rm -rf "$_verify_root"
          done

          _js_tarball="dist/${_js_name}"
          _js_verify="$(mktemp -d)"
          zstd -d -q -c "$_js_tarball" | tar -x -C "$_js_verify"
          bash scripts/verify-release-root.sh --js-only "$_js_verify"
          cp "$_js_tarball" "$_publish_dir/${_js_name}"
          rm -rf "$_js_verify"

          _orch_tarball="dist/${_orch_name}"
          _orch_verify="$(mktemp -d)"
          zstd -d -q -c "$_orch_tarball" | tar -x -C "$_orch_verify"
          bash scripts/verify-release-root.sh --orchestration-only "$_orch_verify"
          cp "$_orch_tarball" "$_publish_dir/${_orch_name}"
          rm -rf "$_orch_verify"

          for _artifact in \
            turbopaneld-amd64.tar.zst \
            turbopaneld-arm64.tar.zst \
            "$_js_name" \
            "$_orch_name"; do
            if [ ! -s "$_publish_dir/$_artifact" ]; then
              echo "::error::missing or empty publish artifact: $_artifact"
              exit 1
            fi
          done

      - name: Generate channel manifest
        env:
          # PKCS#8 PEM of the offline release signing key; the generator refuses
          # to write an unsigned manifest (src/update/signing.ts).
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          deno run --allow-env --allow-read --allow-write scripts/generate-channel-manifest.ts \
            publish/channels/trunk/daemon \
            publish/channels/trunk/manifest.json
          cat > publish/channels.json <<'EOF'
          {
            "schema": 1,
            "defaultChannel": "trunk",
            "channels": {
              "trunk": {
                "manifestUrl": "https://dl.trbp.nl/channels/trunk/manifest.json"
              }
            }
          }
          EOF

      - name: Upload trunk build to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
        run: |
          _prefix="channels/trunk/daemon/${BUILD_ID}"
          for _artifact in \
            turbopaneld-amd64.tar.zst \
            turbopaneld-arm64.tar.zst \
            turbopaneld.js.tar.zst \
            orchestration.tar.zst; do
            aws s3 cp "publish/channels/trunk/daemon/${_artifact}" \
              "s3://${DL_S3_BUCKET}/${_prefix}/${_artifact}" \
              --endpoint-url "${DL_S3_ENDPOINT}" \
              --cache-control "public, max-age=31536000, immutable"
          done
          aws s3 cp publish/channels/trunk/manifest.json \
            "s3://${DL_S3_BUCKET}/channels/trunk/manifest.json" \
            --endpoint-url "${DL_S3_ENDPOINT}" \
            --cache-control "public, max-age=30, must-revalidate" \
            --content-type "application/json"
          aws s3 cp publish/channels.json \
            "s3://${DL_S3_BUCKET}/channels.json" \
            --endpoint-url "${DL_S3_ENDPOINT}" \
            --cache-control "public, max-age=30, must-revalidate" \
            --content-type "application/json"

      - name: Verify uploaded artifacts match manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile

          with open("publish/channels/trunk/manifest.json") as f:
              manifest = json.load(f)

          bucket = os.environ["DL_S3_BUCKET"]
          endpoint = os.environ["DL_S3_ENDPOINT"]

          checks = [
              ("linux-amd64", manifest["binaryArtifacts"]["linux-amd64"]),
              ("linux-arm64", manifest["binaryArtifacts"]["linux-arm64"]),
              ("js", manifest["jsFallbackArtifact"]),
              ("orchestration", manifest["orchestrationArtifact"]),
          ]

          failed = False
          with tempfile.TemporaryDirectory() as tmp:
              for name, entry in checks:
                  url = entry["url"]
                  filename = url.rsplit("/", 1)[-1]
                  s3_key = url.split("://", 1)[1].split("/", 1)[1]
                  dest = os.path.join(tmp, filename)
                  subprocess.run(
                      [
                          "aws", "s3", "cp",
                          f"s3://{bucket}/{s3_key}",
                          dest,
                          "--endpoint-url", endpoint,
                      ],
                      check=True,
                  )
                  data = open(dest, "rb").read()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != entry["sha256"] or len(data) != entry["size"]:
                      print(
                          f"::error::{name} S3 mismatch: "
                          f"expected sha256={entry['sha256']} size={entry['size']} "
                          f"got sha256={digest} size={len(data)}",
                          file=sys.stderr,
                      )
                      failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified S3 artifacts for commit {manifest['commit']} "
              f"({manifest['buildId']})"
          )
          PY

      - name: Verify CDN serves manifest artifact hashes
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request

          with open("publish/channels/trunk/manifest.json") as f:
              manifest = json.load(f)

          checks = [
              ("linux-amd64", manifest["binaryArtifacts"]["linux-amd64"]),
              ("linux-arm64", manifest["binaryArtifacts"]["linux-arm64"]),
              ("js", manifest["jsFallbackArtifact"]),
              ("orchestration", manifest["orchestrationArtifact"]),
          ]

          failed = False
          for name, entry in checks:
              with urllib.request.urlopen(entry["url"]) as resp:
                  data = resp.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry["sha256"] or len(data) != entry["size"]:
                  print(
                      f"::error::{name} CDN mismatch: "
                      f"expected sha256={entry['sha256']} size={entry['size']} "
                      f"got sha256={digest} size={len(data)} "
                      f"url={entry['url']}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified CDN artifacts for commit {manifest['commit']} "
              f"({manifest['buildId']})"
          )
          PY

      - name: Stage the canary assets under versioned names
        id: canary
        # Same bytes as the CDN drop, renamed the way a release names them so
        # the rolling canary release never has two builds fighting over one
        # filename. The version is deno.json's number (what the binary
        # reports on the wire) plus a `-canary.<buildId>` pre-release suffix,
        # which semver orders below the release it leads to.
        run: |
          set -eu
          # shellcheck source=scripts/lib/release-artifacts.sh
          . scripts/lib/release-artifacts.sh
          _pkg_version="$(python3 -c 'import json; print(json.load(open("deno.json"))["version"])')"
          _version="${_pkg_version}-canary.${BUILD_ID}"
          echo "version=${_version}" >> "$GITHUB_OUTPUT"
          mkdir -p canary-assets
          _src="publish/channels/trunk/daemon"
          cp "${_src}/turbopaneld-amd64.tar.zst" "canary-assets/$(tp_daemon_release_filename amd64 "$_version")"
          cp "${_src}/turbopaneld-arm64.tar.zst" "canary-assets/$(tp_daemon_release_filename arm64 "$_version")"
          cp "${_src}/$(tp_js_release_filename)" "canary-assets/$(tp_js_release_filename "$_version")"
          cp "${_src}/$(tp_orchestration_release_filename)" "canary-assets/$(tp_orchestration_release_filename "$_version")"
          ls -l canary-assets

      - name: Generate the canary manifest
        env:
          CHANNEL: canary
          RELEASE_VERSION: ${{ steps.canary.outputs.version }}
          # The rolling release's download path: assets are added under
          # build-unique names, so this never 404s a manifest that names them.
          ARTIFACT_BASE_URL: https://github.com/${{ github.repository }}/releases/download/canary
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          deno run --allow-env --allow-read --allow-write scripts/generate-channel-manifest.ts \
            canary-assets \
            canary-assets/manifest.json
          cat canary-assets/manifest.json

      - name: Upload canary assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbopaneld-canary-assets
          path: canary-assets
          if-no-files-found: error
          retention-days: 3

    outputs:
      canary-version: ${{ steps.canary.outputs.version }}

  canary:
    needs: publish
    permissions:
      contents: write
    uses: TurboPanel/dev/.github/workflows/gh-canary.yml@trunk
    with:
      version: ${{ needs.publish.outputs.canary-version }}
      commit: ${{ github.sha }}
      assets-artifact-name: turbopaneld-canary-assets
      manifest-filename: manifest.json
