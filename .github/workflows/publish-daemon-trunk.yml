# ⚠️  REQUIRED GITHUB REPOSITORY SECRETS
# Before this workflow will succeed, create these three secrets in the
# repository Settings → Secrets and variables → Actions:
#
#   DL_FTP_HOST      — FTP server hostname for dl.trbp.nl
#   DL_FTP_USERNAME  — FTP username
#   DL_FTP_PASSWORD  — FTP password
#
# The workflow will fail with a clear error if any secret is missing.

name: Publish daemon trunk build

on:
  push:
    branches:
      - trunk

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets
        env:
          DL_FTP_HOST: ${{ secrets.DL_FTP_HOST }}
          DL_FTP_USERNAME: ${{ secrets.DL_FTP_USERNAME }}
          DL_FTP_PASSWORD: ${{ secrets.DL_FTP_PASSWORD }}
        run: |
          missing=0
          if [ -z "$DL_FTP_HOST" ]; then
            echo "::error::Missing required secret: DL_FTP_HOST"
            missing=1
          fi
          if [ -z "$DL_FTP_USERNAME" ]; then
            echo "::error::Missing required secret: DL_FTP_USERNAME"
            missing=1
          fi
          if [ -z "$DL_FTP_PASSWORD" ]; then
            echo "::error::Missing required secret: DL_FTP_PASSWORD"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Install zstd
        run: sudo apt-get install -y zstd

      - name: Compute build metadata
        run: |
          echo "BUILD_ID=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build cross-arch binaries
        run: deno task compile:all

      - name: Extract raw binaries into staging
        run: |
          mkdir -p "staging/daemon/trunk/$BUILD_ID"
          amd64_tmp=$(mktemp -d)
          arm64_tmp=$(mktemp -d)
          zstd -d -c dist/turbopaneld-linux-amd64.tar.zst | tar -x -C "$amd64_tmp"
          zstd -d -c dist/turbopaneld-linux-arm64.tar.zst | tar -x -C "$arm64_tmp"
          mv "$amd64_tmp/turbopaneld" "staging/daemon/trunk/$BUILD_ID/linux-amd64"
          mv "$arm64_tmp/turbopaneld" "staging/daemon/trunk/$BUILD_ID/linux-arm64"
          rm -rf "$amd64_tmp" "$arm64_tmp"

      - name: Compute checksums and sizes
        run: |
          echo "AMD64_SHA256=$(sha256sum "staging/daemon/trunk/$BUILD_ID/linux-amd64" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AMD64_SIZE=$(stat -c%s "staging/daemon/trunk/$BUILD_ID/linux-amd64")" >> "$GITHUB_ENV"
          echo "ARM64_SHA256=$(sha256sum "staging/daemon/trunk/$BUILD_ID/linux-arm64" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ARM64_SIZE=$(stat -c%s "staging/daemon/trunk/$BUILD_ID/linux-arm64")" >> "$GITHUB_ENV"

      - name: Generate channel.json
        run: |
          deno run --allow-env --allow-write scripts/generate-channel-manifest.ts \
            staging/daemon/trunk/channel.json

      - name: Upload linux-amd64 binary via FTP
        env:
          FTP_HOST: ${{ secrets.DL_FTP_HOST }}
          FTP_USER: ${{ secrets.DL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DL_FTP_PASSWORD }}
        run: |
          curl --ftp-create-dirs --upload-file "staging/daemon/trunk/$BUILD_ID/linux-amd64" \
            --user "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_HOST/daemon/trunk/$BUILD_ID/linux-amd64"

      - name: Upload linux-arm64 binary via FTP
        env:
          FTP_HOST: ${{ secrets.DL_FTP_HOST }}
          FTP_USER: ${{ secrets.DL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DL_FTP_PASSWORD }}
        run: |
          curl --ftp-create-dirs --upload-file "staging/daemon/trunk/$BUILD_ID/linux-arm64" \
            --user "$FTP_USER:$FTP_PASS" \
            "ftp://$FTP_HOST/daemon/trunk/$BUILD_ID/linux-arm64"

      - name: Upload channel.json to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.DL_FTP_HOST }}
          username: ${{ secrets.DL_FTP_USERNAME }}
          password: ${{ secrets.DL_FTP_PASSWORD }}
          local-dir: staging/daemon/trunk/
          server-dir: /daemon/trunk/
          exclude: |
            **/*
            !channel.json

      - name: Cleanup old trunk build directories
        continue-on-error: true
        env:
          FTP_HOST: ${{ secrets.DL_FTP_HOST }}
          FTP_USER: ${{ secrets.DL_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.DL_FTP_PASSWORD }}
        run: |
          build_dirs=$(
            curl --silent --list-only --user "$FTP_USER:$FTP_PASS" "ftp://$FTP_HOST/daemon/trunk/" \
              | sed 's#/##g' \
              | grep -E '^[0-9]{8}-[0-9]{6}-[a-f0-9]+$' \
              | sort -r \
              | tail -n +3
          )
          for dir in $build_dirs; do
            curl --user "$FTP_USER:$FTP_PASS" --quote "DELE /daemon/trunk/$dir/linux-amd64" "ftp://$FTP_HOST/"
            curl --user "$FTP_USER:$FTP_PASS" --quote "DELE /daemon/trunk/$dir/linux-arm64" "ftp://$FTP_HOST/"
            curl --user "$FTP_USER:$FTP_PASS" --quote "RMD /daemon/trunk/$dir" "ftp://$FTP_HOST/"
          done
