# ⚠️  REQUIRED GITHUB REPOSITORY CONFIGURATION
# Before this workflow will succeed, configure Settings → Secrets and variables → Actions:
#
# Variables:
#   DL_S3_ENDPOINT — Bunny S3 endpoint URL (e.g. https://de-s3.storage.bunnycdn.com)
#   DL_S3_REGION   — Bunny storage region code for AWS CLI signing (e.g. de for
#                    https://de-s3.storage.bunnycdn.com); must match DL_S3_ENDPOINT
#
# Secrets:
#   DL_S3_BUCKET            — Bunny Storage Zone name (bucket name)
#   DL_S3_ACCESS_KEY_ID     — Bunny Storage Zone Access Key ID
#   DL_S3_SECRET_ACCESS_KEY — Bunny Storage Zone Password (Secret Access Key)
#
# The workflow will fail with a clear error if any variable or secret is missing.

name: Publish daemon trunk build

on:
  push:
    branches:
      - trunk

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required secrets and variables
        env:
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
          DL_S3_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          DL_S3_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$DL_S3_ENDPOINT" ]; then
            echo "::error::Missing required variable: DL_S3_ENDPOINT"
            missing=1
          fi
          if [ -z "$DL_S3_REGION" ]; then
            echo "::error::Missing required variable: DL_S3_REGION"
            missing=1
          fi
          if [ -z "$DL_S3_BUCKET" ]; then
            echo "::error::Missing required secret: DL_S3_BUCKET"
            missing=1
          fi
          if [ -z "$DL_S3_ACCESS_KEY_ID" ]; then
            echo "::error::Missing required secret: DL_S3_ACCESS_KEY_ID"
            missing=1
          fi
          if [ -z "$DL_S3_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing required secret: DL_S3_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@v2

      - name: Install zstd
        run: sudo apt-get install -y zstd

      - name: Compute build metadata
        run: |
          echo "BUILD_ID=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build cross-arch binaries
        run: deno task compile:all

      - name: Stage zstd release artifacts for publish
        run: |
          mkdir -p "publish/daemon/trunk/$BUILD_ID"
          cp dist/turbopaneld-linux-amd64.tar.zst "publish/daemon/trunk/$BUILD_ID/linux-amd64.tar.zst"
          cp dist/turbopaneld-linux-arm64.tar.zst "publish/daemon/trunk/$BUILD_ID/linux-arm64.tar.zst"

      - name: Compute checksums and sizes
        run: |
          echo "AMD64_SHA256=$(sha256sum "publish/daemon/trunk/$BUILD_ID/linux-amd64.tar.zst" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "AMD64_SIZE=$(stat -c%s "publish/daemon/trunk/$BUILD_ID/linux-amd64.tar.zst")" >> "$GITHUB_ENV"
          echo "ARM64_SHA256=$(sha256sum "publish/daemon/trunk/$BUILD_ID/linux-arm64.tar.zst" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "ARM64_SIZE=$(stat -c%s "publish/daemon/trunk/$BUILD_ID/linux-arm64.tar.zst")" >> "$GITHUB_ENV"

      - name: Generate channel.json
        run: |
          deno run --allow-env --allow-write scripts/generate-channel-manifest.ts \
            publish/daemon/trunk/channel.json

      - name: Upload trunk build to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
        run: |
          aws s3 cp "publish/daemon/trunk/$BUILD_ID/linux-amd64.tar.zst" \
            "s3://${{ secrets.DL_S3_BUCKET }}/daemon/trunk/$BUILD_ID/linux-amd64.tar.zst" \
            --endpoint-url "${{ vars.DL_S3_ENDPOINT }}"
          aws s3 cp "publish/daemon/trunk/$BUILD_ID/linux-arm64.tar.zst" \
            "s3://${{ secrets.DL_S3_BUCKET }}/daemon/trunk/$BUILD_ID/linux-arm64.tar.zst" \
            --endpoint-url "${{ vars.DL_S3_ENDPOINT }}"
          aws s3 cp "publish/daemon/trunk/channel.json" \
            "s3://${{ secrets.DL_S3_BUCKET }}/daemon/trunk/channel.json" \
            --endpoint-url "${{ vars.DL_S3_ENDPOINT }}"

      - name: Cleanup old trunk build directories
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
        run: |
          build_dirs=$(
            aws s3 ls "s3://${{ secrets.DL_S3_BUCKET }}/daemon/trunk/" \
              --endpoint-url "${{ vars.DL_S3_ENDPOINT }}" \
              | awk '{print $2}' \
              | sed 's#/##g' \
              | grep -E '^[0-9]{8}-[0-9]{6}-[a-f0-9]+$' \
              | sort -r \
              | tail -n +3
          )
          for dir in $build_dirs; do
            aws s3 rm "s3://${{ secrets.DL_S3_BUCKET }}/daemon/trunk/$dir/" \
              --endpoint-url "${{ vars.DL_S3_ENDPOINT }}" \
              --recursive
          done
