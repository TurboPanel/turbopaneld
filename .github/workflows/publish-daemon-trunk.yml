# ⚠️  REQUIRED GITHUB REPOSITORY CONFIGURATION
# Before this workflow will succeed, configure Settings → Secrets and variables → Actions:
#
# Variables:
#   DL_S3_ENDPOINT — Bunny S3 endpoint URL (e.g. https://de-s3.storage.bunnycdn.com)
#   DL_S3_REGION   — Bunny storage region code for AWS CLI signing (e.g. de for
#                    https://de-s3.storage.bunnycdn.com); must match DL_S3_ENDPOINT
#
# Secrets:
#   DL_S3_BUCKET            — Bunny Storage Zone name (bucket name)
#   DL_S3_ACCESS_KEY_ID     — Bunny Storage Zone Access Key ID
#   DL_S3_SECRET_ACCESS_KEY — Bunny Storage Zone Password (Secret Access Key)
#
# The workflow will fail with a clear error if any variable or secret is missing.

name: Publish daemon trunk build

on:
  push:
    branches:
      - trunk

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-daemon-trunk
      cancel-in-progress: false
    steps:
      - name: Verify required secrets and variables
        env:
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
          DL_S3_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          DL_S3_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
        run: |
          missing=0
          if [ -z "$DL_S3_ENDPOINT" ]; then
            echo "::error::Missing required variable: DL_S3_ENDPOINT"
            missing=1
          fi
          if [ -z "$DL_S3_REGION" ]; then
            echo "::error::Missing required variable: DL_S3_REGION"
            missing=1
          fi
          if [ -z "$DL_S3_BUCKET" ]; then
            echo "::error::Missing required secret: DL_S3_BUCKET"
            missing=1
          fi
          if [ -z "$DL_S3_ACCESS_KEY_ID" ]; then
            echo "::error::Missing required secret: DL_S3_ACCESS_KEY_ID"
            missing=1
          fi
          if [ -z "$DL_S3_SECRET_ACCESS_KEY" ]; then
            echo "::error::Missing required secret: DL_S3_SECRET_ACCESS_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          # Keep in step with DENO_VERSION / deno_version / TP_DENO_VERSION (2.9.2).
          deno-version: "2.9.2"

      - name: Check production layout contract
        run: deno task check:layout

      - name: Verify path resolution (dev vs prod)
        run: deno test --allow-read --allow-write --allow-env src/orchestration/paths.test.ts

      - name: Install zstd
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd

      - name: Compute build metadata
        run: |
          echo "BUILD_ID=$(date -u '+%Y%m%d-%H%M%S')-$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "BUILT_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Embed build identity
        run: |
          cat > src/build-info.ts <<EOF
          export interface BuildInfo {
            commit: string;
            buildId: string;
            builtAt: string;
            channel: string;
          }

          export const BUILD_INFO: BuildInfo = {
            commit: "$SHORT_SHA",
            buildId: "$BUILD_ID",
            builtAt: "$BUILT_AT",
            channel: "trunk",
          };

          export function getBuildInfo(): BuildInfo {
            return BUILD_INFO;
          }
          EOF

      - name: Compile native binary
        run: deno task compile

      - name: Compile linux-amd64 binary
        run: deno task compile:linux-amd64

      - name: Compile linux-arm64 binary
        run: deno task compile:linux-arm64

      - name: Bundle JS fallback
        run: deno task bundle:js

      - name: Stage orchestration share tree
        run: deno task bundle:orchestration

      - name: Package split release artifacts
        run: deno task package:release

      - name: Verify release packages and stage publish tree
        run: |
          set -eu
          # shellcheck source=scripts/lib/release-artifacts.sh
          . scripts/lib/release-artifacts.sh
          chmod +x scripts/verify-release-root.sh

          _publish_dir="publish/channels/trunk/daemon"
          mkdir -p "$_publish_dir" publish/channels/trunk

          _js_name="$(tp_js_release_filename)"
          _orch_name="$(tp_orchestration_release_filename)"

          for _arch in amd64 arm64; do
            _tarball="dist/turbopaneld-${_arch}.tar.zst"
            _verify_root="$(mktemp -d)"
            zstd -d -q -c "$_tarball" | tar -x -C "$_verify_root"
            bash scripts/verify-release-root.sh --binary-only "$_verify_root"
            cp "$_tarball" "$_publish_dir/"
            rm -rf "$_verify_root"
          done

          _js_tarball="dist/${_js_name}"
          _js_verify="$(mktemp -d)"
          zstd -d -q -c "$_js_tarball" | tar -x -C "$_js_verify"
          bash scripts/verify-release-root.sh --js-only "$_js_verify"
          cp "$_js_tarball" "$_publish_dir/${_js_name}"
          rm -rf "$_js_verify"

          _orch_tarball="dist/${_orch_name}"
          _orch_verify="$(mktemp -d)"
          zstd -d -q -c "$_orch_tarball" | tar -x -C "$_orch_verify"
          bash scripts/verify-release-root.sh --orchestration-only "$_orch_verify"
          cp "$_orch_tarball" "$_publish_dir/${_orch_name}"
          rm -rf "$_orch_verify"

          for _artifact in \
            turbopaneld-amd64.tar.zst \
            turbopaneld-arm64.tar.zst \
            "$_js_name" \
            "$_orch_name"; do
            if [ ! -s "$_publish_dir/$_artifact" ]; then
              echo "::error::missing or empty publish artifact: $_artifact"
              exit 1
            fi
          done

      - name: Generate channel manifest
        run: |
          deno run --allow-env --allow-read --allow-write scripts/generate-channel-manifest.ts \
            publish/channels/trunk/daemon \
            publish/channels/trunk/manifest.json
          cat > publish/channels.json <<'EOF'
          {
            "schema": 1,
            "defaultChannel": "trunk",
            "channels": {
              "trunk": {
                "manifestUrl": "https://dl.trbp.nl/channels/trunk/manifest.json"
              }
            }
          }
          EOF

      - name: Upload trunk build to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
        run: |
          _prefix="channels/trunk/daemon/${BUILD_ID}"
          for _artifact in \
            turbopaneld-amd64.tar.zst \
            turbopaneld-arm64.tar.zst \
            turbopaneld.js.tar.zst \
            orchestration.tar.zst; do
            aws s3 cp "publish/channels/trunk/daemon/${_artifact}" \
              "s3://${DL_S3_BUCKET}/${_prefix}/${_artifact}" \
              --endpoint-url "${DL_S3_ENDPOINT}" \
              --cache-control "public, max-age=31536000, immutable"
          done
          aws s3 cp publish/channels/trunk/manifest.json \
            "s3://${DL_S3_BUCKET}/channels/trunk/manifest.json" \
            --endpoint-url "${DL_S3_ENDPOINT}" \
            --cache-control "public, max-age=30, must-revalidate" \
            --content-type "application/json"
          aws s3 cp publish/channels.json \
            "s3://${DL_S3_BUCKET}/channels.json" \
            --endpoint-url "${DL_S3_ENDPOINT}" \
            --cache-control "public, max-age=30, must-revalidate" \
            --content-type "application/json"

      - name: Verify uploaded artifacts match manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DL_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DL_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.DL_S3_REGION }}
          DL_S3_BUCKET: ${{ secrets.DL_S3_BUCKET }}
          DL_S3_ENDPOINT: ${{ vars.DL_S3_ENDPOINT }}
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import sys
          import tempfile

          with open("publish/channels/trunk/manifest.json") as f:
              manifest = json.load(f)

          bucket = os.environ["DL_S3_BUCKET"]
          endpoint = os.environ["DL_S3_ENDPOINT"]

          checks = [
              ("linux-amd64", manifest["binaryArtifacts"]["linux-amd64"]),
              ("linux-arm64", manifest["binaryArtifacts"]["linux-arm64"]),
              ("js", manifest["jsFallbackArtifact"]),
              ("orchestration", manifest["orchestrationArtifact"]),
          ]

          failed = False
          with tempfile.TemporaryDirectory() as tmp:
              for name, entry in checks:
                  url = entry["url"]
                  filename = url.rsplit("/", 1)[-1]
                  s3_key = url.split("://", 1)[1].split("/", 1)[1]
                  dest = os.path.join(tmp, filename)
                  subprocess.run(
                      [
                          "aws", "s3", "cp",
                          f"s3://{bucket}/{s3_key}",
                          dest,
                          "--endpoint-url", endpoint,
                      ],
                      check=True,
                  )
                  data = open(dest, "rb").read()
                  digest = hashlib.sha256(data).hexdigest()
                  if digest != entry["sha256"] or len(data) != entry["size"]:
                      print(
                          f"::error::{name} S3 mismatch: "
                          f"expected sha256={entry['sha256']} size={entry['size']} "
                          f"got sha256={digest} size={len(data)}",
                          file=sys.stderr,
                      )
                      failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified S3 artifacts for commit {manifest['commit']} "
              f"({manifest['buildId']})"
          )
          PY

      - name: Verify CDN serves manifest artifact hashes
        run: |
          python3 <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request

          with open("publish/channels/trunk/manifest.json") as f:
              manifest = json.load(f)

          checks = [
              ("linux-amd64", manifest["binaryArtifacts"]["linux-amd64"]),
              ("linux-arm64", manifest["binaryArtifacts"]["linux-arm64"]),
              ("js", manifest["jsFallbackArtifact"]),
              ("orchestration", manifest["orchestrationArtifact"]),
          ]

          failed = False
          for name, entry in checks:
              with urllib.request.urlopen(entry["url"]) as resp:
                  data = resp.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != entry["sha256"] or len(data) != entry["size"]:
                  print(
                      f"::error::{name} CDN mismatch: "
                      f"expected sha256={entry['sha256']} size={entry['size']} "
                      f"got sha256={digest} size={len(data)} "
                      f"url={entry['url']}",
                      file=sys.stderr,
                  )
                  failed = True

          if failed:
              sys.exit(1)
          print(
              f"Verified CDN artifacts for commit {manifest['commit']} "
              f"({manifest['buildId']})"
          )
          PY
